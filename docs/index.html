<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: poster-map palette (pale sea, pale land, navy ink). Phone: day strip under a sticky bar, timeline with pins. ≥900px: navy day rail left, day card right. */
:root {
  --sea: #cfe2f1;
  --sea-deep: #b9d4ea;
  --land: #eaf2e3;
  --bg: #e9f1f7;
  --surface: #ffffff;
  --sunk: #eef4f9;
  --ink: #16284f;
  --muted: #5b6b8a;
  --line: #d4e0ec;
  --navy: #1f3f8f;
  --navy-ink: #ffffff;
  --accent: #1f3f8f;
  --accent-soft: #dde7f7;
  --plan: #7a2d8e;
  --plan-soft: #f0e2f4;
  --warn: #a35a0a;
  --warn-soft: #fbeedb;
  --hot: #c23b2b;
  --hot-soft: #fae2de;
  --ok: #17805c;
  --ok-soft: #dcf2e8;
  --hand: #3b5bb8;
  --c-seoul: #2a5bc4;
  --c-sokcho: #8a2a8f;
  --c-gyeongju: #178a66;
  --c-busan: #ea7a1f;
  --c-seoul2: #2a5bc4;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-hand: "Caveat", "Bradley Hand", cursive;
  --f-body: "Nunito Sans", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgb(22 40 79 / .06), 0 6px 18px rgb(22 40 79 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
    --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
    --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
    --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
  --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
  --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
  --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
strong { font-weight: 700; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 10px; }


/* ---------- sticky bar ---------- */
.bar .wrap { position: relative; }
.now { position: absolute; right: 10px; top: 9px; font: 600 .7rem/1.6 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding-left: 10px; box-shadow: -8px 0 8px var(--bg); pointer-events: none; }
.tabs { padding-right: 124px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 4px; }
.tabs::-webkit-scrollbar, .strip::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 6px 12px; border-radius: 999px; font: 700 .95rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--navy); color: var(--navy-ink); }
.tab .n { font-size: .72rem; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); vertical-align: 2px; }
.tab[aria-selected="true"] .n { background: rgb(255 255 255 / .22); color: var(--navy-ink); }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 10px; scroll-snap-type: x proximity; }
.dpill { flex: none; scroll-snap-align: center; width: 56px; border: 0; background: var(--surface); border-radius: 10px; padding: 6px 0 5px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 1px 0 var(--line); }
.dpill .w { display: block; font: 600 .66rem var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.dpill .d { display: block; font: 800 1.35rem/1.05 var(--f-display); color: var(--cc); }
.dpill .m { display: block; font: 600 .62rem var(--f-display); color: var(--muted); letter-spacing: .05em; }
.dpill[aria-current="true"] { background: var(--cc); }
.dpill[aria-current="true"] .w, .dpill[aria-current="true"] .d, .dpill[aria-current="true"] .m { color: #fff; }
.dpill.move::before { content: attr(data-icon); position: absolute; top: 2px; right: 3px; font-size: .62rem; line-height: 1; }

/* ---------- layout ---------- */
.layout { display: block; padding-block: 16px 60px; }
.rail { display: none; }
main { min-width: 0; }
@media (min-width: 900px) {
  .strip { display: none; }
  .layout.days { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start; }
  .layout.days .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 72px); overflow-y: auto; background: var(--navy); color: #fff; border-radius: var(--r); padding: 10px 8px 14px; box-shadow: var(--shadow); }
  .rail .city { font: 700 .7rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: rgb(255 255 255 / .6); padding: 12px 12px 4px; }
  .rail button { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 9px; cursor: pointer; color: #fff; width: 100%; position: relative; }
  .rail button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--cc); border: 2px solid #fff; margin-top: 5px; box-shadow: 0 0 0 2px var(--navy); }
  .rail button::after { content: ""; position: absolute; left: 16px; top: 22px; bottom: -8px; width: 2px; background: rgb(255 255 255 / .18); }
  .rail button:last-child::after { display: none; }
  .rail button:hover { background: rgb(255 255 255 / .08); }
  .rail button[aria-current="true"] { background: #fff; color: var(--ink); }
  .rail button[aria-current="true"]::before { box-shadow: 0 0 0 2px #fff; }
  .rail .rd { font: 700 .78rem var(--f-display); letter-spacing: .06em; opacity: .75; display: block; }
  .rail .rt { font-size: .86rem; line-height: 1.25; display: block; }
}

/* ---------- day head ---------- */
.dayline { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font: 800 1.3rem/1.1 var(--f-display); text-transform: uppercase; color: var(--navy); min-width: 0; }
.dayline .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); }
.dayline .dn { flex: none; color: var(--cc); }
.dayline .dtt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qlist { display: grid; gap: 4px; margin-bottom: 10px; }
.qbtn { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
.qbtn .qe { font-size: 1rem; text-align: center; }
.qbtn .qs { font-size: .86rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qbtn[aria-expanded="true"] { background: var(--navy); }
.qbtn[aria-expanded="true"] .qs, .qbtn[aria-expanded="true"] .chev { color: #fff; }
.qbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.qpanel { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.qpanel .md h4 { margin-top: .6em; }

/* ---------- blocks ---------- */
.stack { display: grid; gap: 10px; }
.callout { border-radius: 12px; padding: 10px 14px; background: var(--sunk); font-size: .92rem; }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
.callout.decide { background: var(--hot-soft); }
.callout.transfer { background: var(--sea); }
.md p { margin: .45em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.2em; }
.md li { margin: .2em 0; }
.md li::marker { color: var(--muted); }
.md h3, .md h4 { font: 700 1.15rem/1.2 var(--f-display); margin: 1em 0 .3em; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
.md blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--sea-deep); color: var(--muted); font: 500 1.15rem/1.3 var(--f-hand); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.md em { color: var(--muted); }
.md p.c-warn, .md p.c-decide, .md p.c-ok, .md p.c-tip { padding: 8px 12px; border-radius: 10px; }
.md p.c-warn { background: var(--warn-soft); }
.md p.c-decide { background: var(--hot-soft); }
.md p.c-ok { background: var(--ok-soft); }
.md p.c-tip { background: var(--accent-soft); }
.wip { font: 700 .66rem var(--f-display); letter-spacing: .08em; padding: 1px 5px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.map { white-space: nowrap; }

.xlist { display: grid; gap: 6px; margin: .6em 0; }
.xitem { padding: 8px 0; border-bottom: 1px solid var(--line); }
.xitem .xt { font-weight: 700; }
.xitem .xd { font-size: .86rem; color: var(--muted); }
.xitem .chips { margin-top: 3px; }
.tbl { overflow-x: auto; margin: .6em 0; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr); gap: 0 14px; margin: .6em 0; font-size: .88rem; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv .k { font: 700 .74rem/1.7 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 640px) {
  .tbl.stackable table, .tbl.stackable tbody, .tbl.stackable tr, .tbl.stackable td { display: block; }
  .tbl.stackable thead { display: none; }
  .tbl.stackable tr { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; background: var(--surface); }
  .tbl.stackable td { border: 0; padding: 3px 0; }
  .tbl.stackable td:first-child { font-weight: 700; }
  .tbl.stackable td:not(:first-child)[data-l]::before { content: attr(data-l) "  "; font: 700 .66rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
}

details.fold { border-radius: 12px; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
details.fold > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; align-items: center; gap: 10px; font: 700 1.02rem var(--f-display); letter-spacing: .03em; text-transform: uppercase; color: var(--navy); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; font: 600 1.2rem var(--f-display); color: var(--muted); }
details.fold[open] > summary::after { content: "−"; }
details.fold > summary .hint { font: 600 .72rem var(--f-display); letter-spacing: .08em; color: var(--muted); }
details.fold > .md, details.fold > .inner { padding: 0 14px 12px; }

/* ---------- plan switch ---------- */
.plans { display: grid; gap: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px; font: 700 .9rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.seg button[aria-pressed="true"].b { background: var(--plan); }

/* ---------- timeline ---------- */
.tl { list-style: none; margin: 0 -10px; padding: 0; display: grid; position: relative; background: var(--surface); box-shadow: var(--shadow); padding-block: 4px; }
@media (min-width: 900px) { .tl { margin: 0; border-radius: var(--r); } }
.tl::before { content: ""; position: absolute; left: 59px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tl > li { position: relative; }
.tl > li.part { padding: 10px 8px 2px 70px; font: 700 .68rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tl > li.part::before { content: ""; position: absolute; left: 54px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 4px 6px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 8px; cursor: default; align-items: start; position: relative; }
.row::before { content: ""; position: absolute; left: 56px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cc); }
button.row { cursor: pointer; border-radius: 10px; }
.time { font: 700 .88rem/1.5 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-align: right; overflow-wrap: anywhere; }
.time.soft { color: var(--muted); font-size: .62rem; line-height: 1.2; padding-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
.txt { min-width: 0; font-size: .93rem; color: var(--ink); padding-left: 14px; }
.txt p { margin: 0; }
.chev { font: 600 1rem var(--f-display); color: var(--muted); transition: transform .15s; padding-top: 1px; }
li.open .chev { transform: rotate(90deg); }
.chips { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 4px; overflow: hidden; }
.chips.wrap { flex-wrap: wrap; }
.chip { font: 600 .68rem/1.5 var(--f-display); letter-spacing: .05em; padding: 0 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.alt { background: var(--accent-soft); color: var(--accent); }
.chip.pick { background: var(--ok-soft); color: var(--ok); text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.detail { cursor: pointer; margin: 0 8px 10px; padding: 12px 12px 14px 62px; display: grid; gap: 12px; background: var(--sunk); border-radius: 10px; }
@media (max-width: 560px) { .detail { padding-left: 10px; } }
.detail .md { font-size: .9rem; max-width: 72ch; }
.dtitle { font: 700 1.2rem/1.2 var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); }
li.gone .row { opacity: .45; }
li.gone .txt { text-decoration: line-through; text-decoration-color: var(--muted); }

li.plancard { padding: 10px 8px; }
.pcard { border-radius: 12px; background: var(--plan-soft); padding: 12px 14px; display: grid; gap: 8px; border-left: 4px solid var(--plan); }
.pcard .ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pcard .ph b { font: 800 1.2rem var(--f-display); color: var(--plan); text-transform: uppercase; letter-spacing: .03em; }
.pcard .md { font-size: .9rem; }
.pcard .tbl td, .pcard .kv > div { border-color: color-mix(in srgb, var(--plan) 25%, transparent); }

/* meal picker (Food.md) */
.mline { display: flex; align-items: baseline; gap: 6px; margin-top: 3px; font-size: .84rem; color: var(--muted); min-width: 0; }
.mline b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mline .mn { font: 600 .64rem/1.6 var(--f-display); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; padding: 0 6px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.mline.on b { color: var(--ok); }
.mline.on .mn { background: var(--ok-soft); color: var(--ok); }
.mp { cursor: default; display: grid; gap: 8px; min-width: 0; }
.mnote { margin: 0; font-size: .82rem; color: var(--muted); }
.mtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.mtabs::-webkit-scrollbar, .fcar::-webkit-scrollbar { display: none; }
.mtabs button { border: 0; border-radius: 999px; padding: 4px 10px; background: var(--surface); color: var(--muted); font: 700 .72rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
.mtabs button span { opacity: .6; margin-left: 2px; }
.mtabs button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.fcar { display: grid; grid-auto-flow: column; grid-auto-columns: min(80%, 270px); gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 2px; scrollbar-width: none; overscroll-behavior-x: contain; }
.fcard { scroll-snap-align: start; background: var(--surface); border-radius: 12px; padding: 10px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.fcard.sel { box-shadow: inset 0 0 0 2px var(--ok); }
.fh { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex-wrap: wrap; }
.fh b { font: 700 1rem/1.2 var(--f-display); letter-spacing: .02em; }
.fh small { color: var(--muted); font-size: .78rem; }
.fh em { font: 700 .6rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--plan); font-style: normal; }
.ft { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--accent); }
.ft.g { background: var(--ok); }
.ft.y { background: var(--warn); }
.fs { margin: 0; font-size: .84rem; }
.fcard details { font-size: .8rem; color: var(--muted); }
.fcard summary { cursor: pointer; font: 700 .66rem var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.fcard details p { margin: 4px 0 0; }
.fw { margin: 0; font-size: .76rem; color: var(--muted); }
.fb { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; align-items: center; }
.fnv { font: 700 .72rem var(--f-display); color: var(--accent); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.fpick { margin-left: auto; flex: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: .76rem; cursor: pointer; color: var(--ink); }
.fpick.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.mp + .fold { margin-top: 4px; }

/* alternatives */
.alts { display: grid; gap: 8px; }
.alts .ah { font: 700 .72rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

, soju 5 000 ₩, 18:00–03:00, ovisi o vremenu", "meta": ["⏱ 1–2 h", "🌦️", "🦵"]}, {"title": "Podrum Shinsegaea za desert, pa spavanje", "text": ", ako je ekipa gotova", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "23:00", "key": "23:00", "title": "Ace Four Club", "meta": ["⏱ 1–2 h", "☔", "🦵 lagano"], "body": "**에이스포클럽**, 2. kat, 105 Eulji-ro (Euljiro 3-ga, izlaz 1), u sačuvanom prostoru 60 godina stare čajane Ihwa Dabang: vinili, tamjan, retro namještaj. Highball od 11 000 ₩, viski 13–24 000 ₩. Svaki dan 17:00–01:00. Bez rezervacije, malen je, a vrata nisu označena. Kući taksijem, ~10 min.", "alts": [{"title": "Jin Ok-hwa dakhanmari (진옥화할매원조닭한마리)", "text": ": cijela piletina kuhana na stolu, ~30 000 ₩ za dvoje, do 01:00 (zadnja narudžba 23:30). **Kod Dongdaemuna, 5–10 min od apartmana**", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Pojangmacha na Jongnu 3-ga", "text": ", do 03:00, na putu kući", "meta": ["⏱ 1 h", "🌦️", "🦵"]}, {"title": "Noraebang", "text": ": privatna soba 15–25 000 ₩ na sat, ili coin noraebang (500 ₩ za 1–2 pjesme)", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Let kasni:** sve se pomiče. Gwangjang radi do ~22:30, rođendan postaje Gwangjang i Nogari (OB Bear zatvara u 23:00, onda Manseon Hof).\n- **Kiša:** Nogari se seli unutra (Manseon Hof) ili idemo ravno u Ace Four Club ili barove na Euljiru.\n- **Svi su mrtvi:** Gwangjang, dakhanmari kod Dongdaemuna, spavanje. Sve pješice od apartmana.\n- **Ekipa je svježa:** Ace Four Club, pa noraebang na putu kući.", "heading": "Pon 19.10. — Dolazak i Lucijin rođendan", "city": "seoul", "transfer": "", "flash": null, "rows": [{"time": "12:30", "key": "12:30", "text": "Slijetanje na ICN, **terminal 2**. E-Arrival Card je već ispunjen online. U dolaznoj dvorani kupujemo T-money (gotovina) i aktiviramo eSIM ili wifi.", "altHint": false, "slot": 0}, {"time": "~14:15", "key": "14:15", "text": "**AREX express** od T2 do Seoul Stationa, 51 min, ~11 500–13 000 ₩. U vagonima su police za kofere.", "altHint": false, "slot": 1}, {"time": "~15:30", "key": "15:30", "text": "AREX je na katu B7 Seoul Stationa, pa do ulice treba 20–30 min. Odatle **dva taksija** do apartmana, ~15–20 min.", "altHint": false, "slot": 2}, {"time": "17:30", "key": "17:30", "text": "**Gwangjang tržnica**", "altHint": false, "slot": 3, "d3only": true}, {"time": "19:00", "key": "19:00", "text": "**Rođendanska večer: batting cage i screen golf**", "altHint": false, "slot": 4, "d3only": true}, {"time": "21:00", "key": "21:00", "text": "**Nogari Alley, Euljiro**", "altHint": false, "slot": 5, "d3only": true}, {"time": "23:00", "key": "23:00", "text": "**Ace Four Club**", "altHint": false, "slot": 6, "d3only": true}, {"time": "16:00", "key": "16:00", "text": "**Check-in** u Chungsin-dongu, tuš i kratki odmor.", "altHint": false, "slot": null}, {"time": "✅ večer", "key": "✅ večer", "text": "**Odrađeno drukčije, u Hongdaeu:** 🔥 korejski roštilj → šetnja Hongdaeom → fluffy pancakes → 🏹 streličarstvo i pucanje → 🍸 kokteli.", "altHint": false, "slot": null}, {"time": "➡️", "key": "➡️", "text": "**Gwangjang, Nogari Alley i Ace Four Club** prebačeni na uto 20.10. navečer. **Pravi batting cage** prebačen u Hongdae (29.10.).", "altHint": false, "slot": null}], "plans": [], "leftPlans3": [], "decisions": ["d-pon-19-10-roendanska-vecer"]}, {"date": "20.10", "d3heading": "UTO 20.10. — JEDINI PUNI DAN U SEOULU I", "night": "Noćenje: Seoul I, Chungsin-dong (Jongno) · Dan 2 od 14", "intro": "", "stay": "", "slots": [{"timeLabel": "10:15", "key": "10:15", "title": "Jogyesa", "meta": ["⏱ 30 min", "☔", "🦵 lagano"], "body": "Iz stana izlazimo u 10:00. Metro Jonggak (L1), izlaz 2. Od Jongna 5-ga to su dvije stanice, ili taksi ~10 min. Besplatno. Najvažniji hram reda Jogye, odmah uz Insadong: lampioni iznad dvorišta, zlatni Buda unutra.\n\n🌼 **Festival krizantema** traje otprilike od početka listopada do sredine studenog. Dvorište je puno cvjetnih skulptura, a noću je osvijetljeno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "10:50", "key": "10:50", "title": "Bukchon Hanok Village", "meta": ["⏱ 30–45 min", "☀️", "🦵🦵 strme uličice, kaldrma"], "body": "Metro Anguk (L3), izlaz 2, ili od Jogyese ~15 min pješice. Besplatno.\n\n⚠️ **Od 1.3.2025. glavni stambeni dio (\"crvena zona\", Bukchon-ro 11-gil) zatvoren je za turiste od 17:00 do 10:00**, uz čuvare i kazne od 100 000 ₩. Zato dolazimo tek poslije 10:00, kad je već gušće.\n\nStambena četvrt hanok kuća čiji su stanovnici umorni od turista. Prošetamo tiho, pogledamo i ne zadržavamo se.", "alts": [{"title": "Preskočiti", "text": ": s Jogyese ravno na ručak, dobije se 45 min.", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "11:45", "key": "11:45", "title": "Tongin tržnica", "meta": ["⏱ 1–1,5 h", "☔ natkriveno", "🦵 lagano"], "body": "Iz Bukchona ~20 min pješice preko područja palače, ili taksi 5–10 min. Metro Gyeongbokgung (L3), izlaz 2, pa ~10 min.\n\nMala stara susjedska tržnica zapadno od palače Gyeongbokgung. **Kako radi:** na info-pultu se kupi niz **mjedenih novčića (yeopjeon), 10 000 ₩ za 20 komada**, i prazan pladanj, pa se ide od štanda do štanda i novčići mijenjaju za male porcije (omlet, palačinke, pirjana svinjetina, japchae). Jede se u blagovaonici tržnice.\n\n⚠️ **Utorkom 11:00–16:00, novčići se prodaju do 15:00.** Zatvoreno ponedjeljkom i treće nedjelje u mjesecu.\n\n**Ne propustiti gireum tteokbokki:** rižini kolačići prženi u tavi s čilijem i soja-umakom. Ti štandovi rade neovisno o blagovaonici i otvoreni su svaki dan.", "alts": [{"title": "Plan B: Hwangsaengga Kalguksu (황생가칼국수)", "text": ", 78 Bukchon-ro 5-gil, nasuprot MMCA, na rubu Bukchona (Anguk izlaz 1, ~8 min). Debeli ručno rezani rezanci u mliječnoj juhi od goveđih kostiju **11 000 ₩**, veliki domaći mandu 11 000 ₩, slažu ih iza stakla na ulazu. Svaki dan 11:00–21:30 bez pauze. **Red 20–40 min u vrijeme ručka.** Za slučaj da smo pregladni ili umorni za šetnju do Tongina", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Namdaemun tržnica", "text": ": kaos, ulična hrana i jeftine naočale", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Nacionalni muzej Koreje", "meta": ["⏱ 2–2,5 h", "☔", "🦵 lagano"], "body": "Metro Ichon (L4), izlaz 2, natkriveni prilaz. **Besplatno.** Otvoren svaki dan (utorkom 10:00–18:00, srijedom i subotom do 21:00), zatvoren samo za Novu godinu, Seollal i Chuseok.\n\n- **Zlatne krune kraljevstva Silla.** Vidjeti ih prije Gyeongjua daje tamošnjim humcima kontekst.\n- **\"Soba tihe kontemplacije\" (사유의 방)** na 2. katu: dva Bude u razmišljanju, nacionalno blago, u zamračenoj sobi. Besplatno, bez rezervacije.\n\nPrema Jamsilu krećemo najkasnije u **15:45** (35–40 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Seoul Sky", "meta": ["⏱ 1,5–2 h", "☀️ treba vidljivost", "🦵 lagano"], "body": "Metro Jamsil (L2, L8), izlaz 1–2, izravno u toranj. **31 000 ₩** odrasli (Fast Pass 62 000 ₩), nedjelja–četvrtak 10:30–22:00. Sa sigurnosnom kontrolom i dizalom treba računati 1,5–2 h, utorkom je red 15–25 min.\n\nZgrada od 555 m, vidikovac na katovima 117–123 (~500 m) i stakleni pod na Sky Decku, jedan od najviših vidikovaca na svijetu. ⚠️ **Zalazak 20.10. je oko 17:45–17:50**, zato **rezerviramo ulaz za 16:30–17:00**: dnevno svjetlo, zalazak i osvijetljeni grad u jednom posjetu.\n\n⚠️ Navečer staklo stvara odsjaje, a sumaglica može ubiti daleki pogled. Ako je prognoza loša, prebacujemo na nedjelju 1.11.", "alts": [{"title": "Prebaciti na nedjelju 1.11.", "text": ", rezervni termin postoji upravo za ovo.", "meta": []}, {"title": "Naksan ili Inwangsan u sumrak", "text": ": besplatni vidikovci na gradskom zidu, bez redova", "meta": ["⏱ 1–2 h", "☀️", "🦵🦵"]}, {"title": "Duga fontana Banpo", "text": ": besplatno, u 19:30, 20:00, 20:30 i 21:00 (20 min), sezona do 31.10. Ne radi po kiši i vjetru", "meta": ["⏱ 45 min", "☀️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Nogari Alley, pa barovi na Euljiru (Ace Four Club)", "meta": ["⏱ 2 h", "☔", "🦵 lagano"], "body": "Pješice od roštilja. Koktel 15–25 000 ₩. Barovi iza neoznačenih vrata u starim radioničkim zgradama. **Bez rezervacije.** Naver Map ih nalazi bolje od Googlea.\n\n- **Bar Sookhee (숙희)**: 2. kat, 14-1 Eulji-ro 12-gil (izlaz 10). Hanok stil, kokteli od sezonskog voća 20–25 000 ₩, **couvert 5–10 000 ₩ po osobi**. 18:00–02:00. Mirniji i skuplji.\n- **Jean Frigo (장프리고)**: Toegye-ro 62-gil 9-8, 1. kat (Gwanghui-dong, kod Dongdaemuna). Ulaz kroz vrata hladnjaka u voćarni, narudžba preko starih telefona. Kokteli 16–20 000 ₩, 18:00–01:30, ponedjeljkom zatvoreno.\n- **Ace Four Club**, ako nije bio u ponedjeljak.", "alts": [{"title": "Zid na Naksanu noću", "text": ": stari gradski zid, osvijetljen, 5 min od apartmana. Ima uspona i stepenica", "meta": ["⏱ 45 min", "☀️", "🦵🦵"]}, {"title": "Nogari Alley", "text": ", ako jučer nije uspio zbog kiše", "meta": ["⏱ 1–2 h", "☀️", "🦵"]}, {"title": "Noraebang", "text": "", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}], "info": [{"title": "⚡ PLAN NA DAN: A/B verzije (odluka na licu mjesta)", "md": "Zbog promjene 19.10. večer je danas **Gwangjang → Nogari → Ace Four** (opisi u Danu 1). Fiksno: **Seoul Sky u 16:30** i **Gwangjang do 20:00**.\n\n| Kad | 🅰️ | 🅱️ |\n|---|---|---|\n| **Jutro** 10:00–11:45 | 10:00 izlazak, 10:15 **Jogyesa** → 10:50 **Bukchon** | Doručak, ~11:00 samo **Jogyesa** |\n| **Ručak** ~11:45–13:00 | **Tongin tržnica** (taksi ~7 min iz Bukchona) | **Hwangsaengga kalguksu** kod Bukchona |\n| **Popodne** 13:00–15:45 | **Nacionalni muzej Koreje** (taksi ~25 min) | Odmor i **pakiranje**, pa **Namdaemun** ili **DDP** |\n| 15:45 | ⚠️ Prema Jamsilu, taksi ~35 min ili L4 → L2 ~40 min | isto |\n| **Zalazak** 16:30–18:15 | 🏙️ **Seoul Sky** (fiksno) | Magla: Seoul Sky na 1.11., umjesto njega Naksan u sumrak |\n| 18:15 | L2 Jamsil → Euljiro 4-ga (~30 min) ili taksi ~30 min | |\n| **Večera** ~19:00–20:45 | 🏮 **Gwangjang**: **mayak kimbap prvo (do 20:00)**, Sunhee-ne bindaetteok (do 21:00), Gohyang kalguksu (štand 70). Gotovina | **Jin Ok-hwa dakhanmari** kod Dongdaemuna (ako kasnimo) |\n| 20:45 | Pješice ~15 min do Euljira 3-ga | |\n| **Noć** 21:00–~00:30 | 🍺 **Nogari Alley** (OB Bear do 23:00, Manseon Hof do 24:00), pa 23:00 **Ace Four Club** (do 01:00) | **Pojangmacha šatori na Jongnu 3-ga** (do 03:00) + **noraebang** |\n\n⚠️ **Kofere spakirati prije večernjeg izlaska** (ili u 🅱️ popodnevu). **U krevet do ~01:00**: sutra u 08:00 taksiji za bus u Sokcho.\n❌ **Otpada danas:** Deoksugung (ne stane uz Gwangjang) i roštilj na Euljiru (bio je 19.10. u Hongdaeu). Opisi ispod ostaju kao zamjene.\n🥩 **Napomena:** all-you-can-eat KBBQ, **Myeongnyun Jinsa Galbi (명륜진사갈비)**, Jongno Gwancheol, ~18–25 000 ₩ po osobi, kao zamjena za večeru na Gwangjangu.\n**Prvo se reže:** Bukchon → skraćeni muzej. Seoul Sky ostaje.\n\n---\n\n⚠️ **Gyeongbokgung i Jongmyo utorkom su zatvoreni.** Fiksna točka dana je **Seoul Sky u 16:30.** Muzej (jug, Ichon) i toranj (istok, Jamsil) udaljeni su 35–40 min, pa muzej mora završiti do ~15:45.", "top": false}, {"title": "❌ 19:15 — Deoksugung i Doldam-gil (danas otpada zbog Gwangjanga)", "md": "*⏱ 45 min · 🌦️ · 🦵 lagano*\n\nIz Jamsila linija 2 izravno do City Halla (~35 min), izlaz 2. **1 000 ₩**, otvoreno do **21:00, zadnji ulaz u 20:00**. Jedina palača otvorena navečer i osvijetljena. Smjena straže ispred vrata Daehanmun je u 11:00 i 14:00, u ovom terminu je nema.\n\nNajmanja seulska palača: tradicionalne drvene dvorane uz nekoliko kamenih zgrada u zapadnom stilu s početka 20. stoljeća. Uz zid ide **Doldam-gil, \"cesta kamenog zida\"**, drvored koji je krajem listopada jedna od najljepših jesenskih šetnji u gradu. ⚠️ Zatvoreno ponedjeljkom.\n\n💡 **Ovaj večernji termin je zamjenjiv:** ako ekipa umjesto palače poželi pravi seulski izlazak, ovdje ide nešto iz te kategorije. Još nije odlučeno što.\n\n**↔ Zamjene (2):**\n\n- **Seulski izlazak**, još treba odabrati što.\n- **Dongdaemun noću**: veleprodaja mode 20:00–05:00 (od nedjelje navečer do petka ujutro), kolica i vreće na ulici poslije 23:00. Zanimljivo i bez kupovine · *⏱ 1,5 h · ☔ · 🦵*", "top": false}, {"title": "❌ 20:15 — Korejski BBQ na Euljiru 3-ga (otpada: roštilj je bio 19.10., večera je Gwangjang)", "md": "*⏱ 1–1,5 h · ☔ · 🦵 lagano*\n\nIz Deoksugunga linija 2 jedna stanica do Euljiro 1-ga pa pješice, ili taksi ~5 min do **Euljira 3-ga**. **Prvi korejski roštilj na putu**, a odatle se pješice ide u barove.\n\nOko Euljira 3-ga i Jongna 3-ga gusto je **samgyeopsal roštiljnica** sa stolovima na pločniku i plastičnim stolcima. Svinjska potrbušina (i vrat, moksal) peče se na ploči nasred stola, uz kimchi, češnjak, listove salate i ssamjang. **~15–22 000 ₩ mesa po osobi + soju ~5 000 ₩.** Rezervacija ne treba.\n\n**Kako birati:** lokal s redom domaćih i bez velikog engleskog menija u izlogu. Osoblje često samo reže i okreće meso. ⚠️ **WIP:** odabrati konkretan lokal na Naver mapi (삼겹살, 을지로3가) tjedan prije.\n\n**🅱️ BBQ slot:** ako večeras ne uspije (umor, kašnjenje, gužva), prvi roštilj se seli u **Sokcho, sri 21.10.**, umjesto ribe na žaru.\n\n**↔ Zamjene (3):**\n\n- **Myeongdong Kyoja (명동교자)**, glavni lokal, 29 Myeongdong 10-gil (Myeongdong, izlaz 8), ~10 min pješice od Deoksugunga. Kalguksu u pilećoj juhi s mljevenim mesom **11 000 ₩** (rezanci i juha dolijevaju se besplatno), 10 svinjskih mandua 12 000 ₩. Svaki dan 10:30–21:00 bez pauze, redovi 10–20 min. ⚠️ Zadnja narudžba prije 21:00 · *⏱ 45 min · ☔ · 🦵*\n- **Dongwonjip (동원집)**, gamjatang: crveni ljuti gulaš od svinjskih kralježaka i krumpira. 22 Toegye-ro 27-gil (Euljiro 3-ga izlaz 9). **10–11 000 ₩** zdjela, lonac 28–38 000 ₩. 10:00–22:00, **zadnja narudžba 21:00**, nedjeljom zatvoreno. Odmah uz barove · *⏱ 1 h · ☔ · 🦵*\n- **Ostale opcije u blizini** (bolje za ručak, rano zatvaraju):\n  - **Wooraeok (우래옥)**: od 1946., pjongjanški hladni rezanci 16 000 ₩, bulgogi 37–42 000 ₩. Utorkom 11:30–21:00, **zadnja narudžba 20:40**. Euljiro 4-ga, izlaz 4.\n  - **Eulji Myeonok (을지면옥)**: hladni rezanci 15 000 ₩, **zadnja narudžba 20:20**, nedjeljom zatvoreno.\n  - **Imun Seolnongtang (이문설농탕)**: najstariji restoran u Koreji (1904.), juha od goveđih kostiju, 08:00–21:00. ⚠️ Već je u planu 1.11.", "top": false}], "triggers": "- **Kiša:** izbaciti Bukchon i Deoksugung, produžiti muzej, dodati Gyeongdong i Starbucks 1960.\n- **Loša vidljivost:** Seoul Sky na 1.11. Navečer Gwangjang ili Dongdaemun noću.\n- **Koljeno tišti:** izbaciti Bukchon.\n- **Gladni prije Tongina:** Hwangsaengga kalguksu odmah uz Bukchon.\n- **Ekipa želi roštilj:** all-you-can-eat Myeongnyun Jinsa Galbi umjesto Gwangjanga.", "heading": "Uto 20.10. — Puni dan (A/B, odluka na licu mjesta)", "city": "seoul", "transfer": "", "flash": {"label": "Utorak, 20. 10. · Seoul — hramovi, muzej, Seoul Sky i Euljiro noću (A/B dan)", "text": "Dan ima dvije verzije za svaki dio, a biramo na licu mjesta prema umoru. Ujutro **🅰️ hram Jogyesa** s krizantemama i **Bukchon Hanok Village**, ili **🅱️ duže spavanje** i samo Jogyesa. Za ručak **🅰️ Tongin tržnica** s mjedenim novčićima ili **🅱️ rezanci kalguksu** kod Bukchona. Popodne **🅰️ Nacionalni muzej Koreje** sa zlatom kraljevstva Silla, ili **🅱️ odmor i pakiranje** pa Namdaemun ili DDP. Fiksna točka dana je **Seoul Sky** u 16:30, vidikovac na vrhu Lotte World Towera, za zalazak sunca i paljenje gradskih svjetala. Za večeru odlazimo na **Gwangjang tržnicu** (bindaetteok, kalguksu, mayak kimbap), a zatim pješice na **Nogari Alley**, gdje se pivo pije na plastičnim stolcima nasred ulice. Večer završavamo u **Ace Four Clubu**, retro baru u staroj čajani, ili u šatorima na Jongnu i noraebangu. Kofere pakiramo prije izlaska, jer sutra u 08:00 krećemo za Sokcho."}, "rows": [{"time": "Jutro 10:00–11:45", "key": "10:00", "text": "10:00 izlazak iz stana, 10:15 **Jogyesa** (krizanteme), 10:50 **Bukchon**", "altHint": false, "slot": 0}, {" 11., a umjesto njega Naksan u sumrak ili ranije Gwangjang", "altHint": false, "slot": null}, {"time": "Večera ~19:00–20:45", "key": "19:00", "text": "**Jin Ok-hwa dakhanmari** kod Dongdaemuna, cijela piletina na stolu (ako kasnimo poslije 20:00)", "altHint": false, "slot": null}, {"time": "Noć 21:00–~00:30", "key": "21:00", "text": "**Pojangmacha šatori na Jongnu 3-ga** (do 03:00), pa **noraebang**", "altHint": false, "slot": null}]}], "leftPlans3": [], "decisions": ["d-uto-20-10-seoul-sky-na-zalazak", "d-uto-20-10-cijeli-dan"]}, {"date": "21.10", "d3heading": "SRI 21.10. — TRANSFER U SOKCHO", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 3 od 14", "intro": "", "stay": "", "slots": [{"timeLabel": "~08:00", "key": "08:00", "title": "Transfer Seoul → Sokcho (direktni express bus)", "meta": ["⏱ 2h10–2h20 vožnje plus ~45 min do terminala", "☔", "🦵 lagano"], "body": "**Seoul Express Bus Terminal (Gangnam) → Sokcho Express terminal**, ~40 polazaka dnevno između 06:00 i 23:30. **17 200 ₩ (obični), 22 300 ₩ (deluxe), 28 900 ₩ (premium).** Karte kupujemo na **KOBUS-u** (kobus.co.kr). Kofere sami stavljamo u prtljažnik ispod busa, besplatno.\n\nOd apartmana do terminala **dva taksija, 25–35 min** zbog jutarnje gužve. S koferima ne idemo metroom. Bus oko 08:30–09:00.\n\n⚠️ **Željeznice do Sokcha nema**, linija Chuncheon–Sokcho otvara se 2029.\n\n⚠️ KOBUS strane kartice prima tek od kolovoza 2026. **Testirati rano.** Rezerva je šalter na terminalu, gotovina i putovnica.", "alts": [{"title": "Stanka u Chuncheonu na dakgalbiju (Woomi).", "text": "Chuncheon je grad u kojem je izmišljen **dakgalbi**: piletina, kupus, rižini kolačići i čili pasta prže se u velikoj tavi na stolu, a na kraju se u ostatku umaka prži riža. **ITX-Cheongchun iz Cheongnyangnija** (tri stanice od apartmana, L1) vozi ~1 h do **Namchuncheona**, 6 900–8 300 ₩ (npr. 09:11 → 10:06). **Myeongdong Woomi Dakgalbi (명동우미닭갈비)**, Onui-dong, ~850 m od stanice, 033-257-1919: dakgalbi 16 000 ₩, riža 3 000 ₩, makguksu 9 000 ₩. 10:00–20:50, zatvoreno 2. i 4. srijede u mjesecu (21.10. je treća srijeda, otvoreno). Prostran, koferi stanu unutra. Zatim ~1 km do Chuncheon Intercity terminala i **bus u 11:30 → Sokcho ~13:30** (16 700 ₩; busevi u 09:00, 10:00, 11:30, 13:30, 15:30). ⚠️ Stiže na **Sokcho Intercity terminal na sjeveru**, 3 km od hotela, pa treba dva taksija do hotela i jedan natrag na sjever (30–40 min, 20–25 000 ₩). Pitati vozača staje li i kod Express terminala. Ukupno ~2,5 h dulje od direktnog busa", "meta": ["⏱ +2,5 h", "☔", "🦵"]}, {"title": "Stanka u Hongcheonu, petodnevna tržnica.", "text": "21.10. je dan tržnice: palačinke od heljde, kalguksu, sundae, svinjetina na žaru. Dong Seoul → Hongcheon 1 h, Hongcheon → Sokcho 11:50 → 13:26. ⚠️ S četiri kofera kroz tržnicu je mučno i dalje vozi samo jedan dobar bus. Samo ako bismo putovali lagano", "meta": ["⏱ +2 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~11:15", "key": "11:15", "title": "Koferi u hotel", "meta": [], "body": "Sokcho Express terminal je **670 m od hotela** (~10 min pješice ili dva kratka taksija). Check-in je od **15:00**, ali korejski hoteli u pravilu besplatno čuvaju prtljagu i ranije. ☎️ **Potvrditi s Blue Terrom mailom.** Od hotela na sjever (luka, Abai, tržnica) taksi vozi ~10 min, 7–8 000 ₩.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Yeonggeumjeong i svjetionik", "meta": ["⏱ 45 min", "🌦️", "🦵🦵 stepenice"], "body": "Mali paviljon na stijenama u moru i vidikovac kod svjetionika u starom lučkom dijelu Yeongrang-donga. Pogled na more i luku, besplatno. Ubačeno kao prijedlog za termin prije check-ina.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:45", "key": "12:45", "title": "Ručak: Sadonjib (mulgomtang)", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**사돈집**, Yeongrang-dong 1-1. **Mulgomtang** je gulaš od ribe eelpout: meko, želatinasto bijelo meso u blagoj juhi s rotkvom i malo čilija, lokalni specijalitet ove obale, potpuno kuhan. Imaju i pirjani ljuti iverak (gajami-jorim).\n⚠️ **Radi 08:00–15:00, četvrtkom zatvoreno**, a zatvara i ranije ako nestane ulova. **Srijeda je jedina prava prilika.**", "alts": [{"title": "Sindasin (신다신)", "text": "u Abai Villageu: **gari-gukbap** (juha od goveđih prsa s rotkvom i klicama), ojingeo-sundae, abai-sundae. 08:30–20:00 bez pauze, u podne red 30–45 min", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Brodogradilište Chilsung", "meta": ["⏱ 30–45 min", "☔", "🦵 lagano"], "body": "**칠성조선소**, Jungang-ro 46beon-gil 45. Brodogradilište drvenih brodova iz 1952. (radilo je do 2017.), danas kafić i mali muzej na jezeru Cheongcho. Stare tračnice za porinuće još stoje. 11:00–19:00, piće 6–8 500 ₩.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:00", "key": "15:00", "title": "Abai Village i skela gaetbae", "meta": ["⏱ 1–1,5 h", "🌦️ skela radi i po kiši", "🦵 lagano"], "body": "Naselje koje su nakon rata osnovale sjevernokorejske izbjeglice, preko uskog kanala. Prelazi se **gaetbaeom**, ravnom splavi koju putnici sami vuku po čeličnom užetu (**500 ₩**, kartica ili gotovina, 3 min, radi 05:00–23:00). Šarmantno, ali malo: **1–1,5 h je dosta**, kao užina, ne ručak.\n\nŠto jesti: **ojingeo-sundae** (lignja punjena rezancima i povrćem, narezana i pržena) i **abai-sundae** (sjevernokorejska kobasica).\n- **Dancheon Sikdang (단천식당)**: 08:30–19:00, ojingeo-sundae ~15 000 ₩, juha od abai-sundaea 10 000 ₩. ⚠️ **Kombinirane plate sadrže sirovi začinjeni pollock (myeongtae-hoe)**, zato naručujemo pojedinačna jela.\n- **Sindasin**, vidi gore.", "alts": [{"title": "Sokcho City Museum", "text": ": rekonstrukcija kuća sjevernokorejskih izbjeglica na otvorenom, 2 000 ₩, 09:00–18:00, ponedjeljkom zatvoreno. Kišna opcija", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Naksansa", "text": ", obalni hram na stijeni nad morem · *⏱ 1,5 h · 🌦️ · 🦵🦵* · ⚠️ troši hram-budžet", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Središnja tržnica (Sokcho Tourist & Fishery Market), kratko", "meta": ["⏱ 30–45 min", "☔ natkriveno", "🦵 lagano"], "body": "Natkrivena tržnica u centru. **Kratki prolaz, samo grickamo**, veliki obrok od rakova je u četvrtak. Ostatak vremena do večere je slobodan (hotel, check-in, tuš).\n- **Sulbbang** (kruh na pari od makgeollija), štand 54, ~4 000 ₩ kriška. **Rasproda se do ~17:00**, zato prvo.\n- **Manseok Dakgangjeong (만석닭강정)**: slatko-hrskava pržena piletina u kutiji, 18–22 000 ₩, 10:00–20:00. Dobra je i hladna, pa kutija može u hotel. Alternative u istoj tržnici: Jung-ang Dakgangjeong (štand 23), Sokcho Dakgangjeong (štand 20).\n- Pogledati crvene rakove u bazenima za četvrtak.\n\n⚠️ **Radnim danom štandovi se gase oko 19:30.**", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:30", "key": "18:30", "title": "Večera: 88 Saengseon-gui", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "**88생선구이**, Jungang-dong 468-55, 5 min od skele. Do deset vrsta ribe (skuša, saury, iverak, lignja) osoblje peče na ugljenu ugrađenom u stol, ~20 000 ₩ po osobi. 08:30–20:15, pauza 15:00–16:30, **zadnja narudžba oko 20:15**. Bez rezervacije, u špici red. ⚠️ **Jako zadimljeno**, odjeća će mirisati.", "alts": [{"title": "🔥 Roštilj umjesto ribe", "text": "(više nije obavezan, roštilj je bio 19.10. u Hongdaeu): večeras umjesto ribe ide **samgyeopsal ili dwaeji galbi** (marinirana svinjska rebra) na roštilju u stolu, 15–20 000 ₩ po porciji. Lokal nije odabran: na Naveru 삼겹살 / 돼지갈비 blizu Jungang-donga ili hotela, ocjena 4,3+", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Dakgangjeong iz kutije i pivo u hotelu", "text": ", ako smo mrtvi od puta", "meta": ["⏱ —", "☔", "🦵"]}, {"title": "Sindasin", "text": ", gari-gukbap ako je ručak bio negdje drugdje", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "Šatori uz more u Yeongrang-dongu", "meta": ["⏱ 1–1,5 h", "🌦️", "🦵 lagano"], "body": "Niz šatorskih barova (pojangmacha) uz samu obalu, Yeongranghaean-gil. Domaći i lučki radnici, otvoreno do ~02:00. Poznati su **Maljane** i **Danggeun Macha**. Ima kuhanog: kuhani crveni rak, ljuta svinjetina, lignja na žaru, juha od školjki. ⚠️ **Kuhana jela naručujemo izričito i odbijamo sirove priloge.** **Kratko, jedno ili dva pića, u hotelu do 22:30**, sutra polazak u 06:30.", "alts": [{"title": "Rano spavanje", "text": ", pivo u hotelu na plaži", "meta": ["⏱ —", "☔", "🦵"]}], "altNotes": [], "after": "💡 **Freezer Club / Dalbit Yajang** (noćni food court u starom hladnjaku za ribu, ples iza vrata industrijskog zamrzivača) namjerno **nije večeras**: ide u **četvrtak navečer** poslije rakova, jer u petak nema ranog ustajanja."}], "info": [], "triggers": "- **Bus kasni ili nema karata:** Dong Seoul terminal (L2 Gangbyeon), izbjegavati spore linije preko Injea. Ili varijanta s Chuncheonom.\n- **Rano stižemo i svi su gladni:** Sadonjib odmah, Yeonggeumjeong poslije.\n- **Kiša:** Abai i skela rade, Sokcho City Museum, tržnica je natkrivena.\n- **Sutra je prognoza lošija od prekosutra:** zamijeniti dan 4 i dan 5, jer Ulsanbawi treba suho vrijeme.", "heading": "Sri 21.10. — Dolazak i obala", "city": "sokcho-i-seoraksan", "transfer": "**🚌 Sri 21.10. · Seoul → Sokcho**\n**express bus 2h10–2h20 · 17 200–28 900 ₩**\n\nŽeljeznice do Sokcha nema do 2029. **Plan je direktni express bus** sa Seoul Express Bus Terminala (Gangnam, KOBUS) do Sokcho **Express** terminala, 670 m od hotela. **Alternativa je stanka u Chuncheonu na dakgalbi** (ITX iz Cheongnyangnija pa bus, ukupno 2,5 h dulje), vidi Dio 3.", "flash": {"label": "Srijeda, 21. 10. · Seoul → Sokcho — iz grada prema moru", "text": "Ujutro hvatamo izravni autobus za **Sokcho**, vožnja traje približno 2 sata i 20 minuta, ovisno o prometu. Po dolasku ostavljamo kofere u hotelu uz plažu i krećemo istraživati grad. Prvo posjećujemo paviljon smješten na stijenama uz more, a zatim ručamo **mulgomtang**, blagi gulaš od ribe eelpout, lokalni specijalitet ove obale. Popodne je rezervirano za kafić uređen u prostoru starog brodogradilišta, a zatim odlazimo u **Abai Village**, četvrt poznatu po zajednici doseljenika iz Sjeverne Koreje i njihovoj gastronomskoj tradiciji. Ondje ćemo isprobati i neobičnu ručno pokretanu skelu *gaetbae*, koju putnici povlače užetom preko vode. Slijedi obilazak tržnice, gdje ćemo zastati na nekoliko zalogaja umjesto na velikom obroku. Navečer sjedamo u restoran s ribom koja se peče na stolu, a nakon večere možemo popiti nekoliko pića u jednostavnim šatorima uz more."}, "rows": [{"time": "~08:00", "key": "08:00", "text": "Dva taksija do Seoul Express Bus Terminala (Gangnam). Bus oko 08:30–09:00, vožnja 2h10–2h20, karte rezervirati na KOBUS-u.", "altHint": false, "slot": 0}, {"time": "~11:15", "key": "11:15", "text": "Od Sokcho Express terminala 10 min pješice do hotela. **Ostavljamo kofere**, check-in je tek u 15:00.", "altHint": false, "slot": 1}, {"time": "12:00", "key": "12:00", "text": "**Yeonggeumjeong i svjetionik**, paviljon na stijenama i vidikovac nad lukom.", "altHint": false, "slot": 2}, {"time": "12:45", "key": "12:45", "text": "Ručak u **Sadonjibu**: mulgomtang, blagi gulaš od ribe eelpout. Radi samo do 15:00, četvrtkom zatvoreno.", "altHint": false, "slot": 3}, {"time": "14:15", "key": "14:15", "text": "**Brodogradilište Chilsung**, kafić u brodogradilištu iz 1952.", "altHint": false, "slot": 4}, {"time": "15:00", "key": "15:00", "text": "**Abai Village**, ručno vučena skela i ojingeo-sundae kao užina.", "altHint": false, "slot": 5}, {"time": "16:30", "key": "16:30", "text": "**Središnja tržnica**, kratko (30–45 min): sulbbang i dakgangjeong u kutiji.", "altHint": false, "slot": 6}, {"time": "18:30", "key": "18:30", "text": "**88 Saengseon-gui**, miješana riba na žaru za stolom. (🅱️ BBQ slot više ne treba: roštilj je bio 19.10. u Hongdaeu.)", "altHint": false, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "**Šatori uz more u Yeongrang-dongu**, jedno ili dva pića. U hotel do 22:30, sutra ustajemo u 06:30.", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": ["d-sri-21-10-put-u-sokcho", "d-sri-21-10-prtljaga-prije-check-ina"]}, {"date": "22.10", "d3heading": "ČET 22.10. — ULSANBAWI", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 4 od 14 · Najteži dan putovanja", "intro": "", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "hrana", "meta": [], "body": "U **7-Elevenu u zgradi hotela** kupujemo doručak **i hranu za planinu**: trokutasti kimbap, sendviče, banane, vodu, tople napitke. U 06:30 ništa nije otvoreno, a jest će se na stazi. Tako poslije planine možemo ravno u bazen.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "06:30", "key": "06:30", "title": "Rani polazak", "meta": [], "body": "Bus **7 ili 7-1** s **postaje preko ceste od hotela**, vozi od ~05:36 svakih 20–35 min, zadnja stanica je **Sogongwon** (ulaz u park). Taksi iz centra 13–16 000 ₩. Poslije 08:30 cesta u park se zakrči.\n\n⚠️ **U zoru je na ulazu u park oko nule.** Slojevi: termo majica, flis ili lagana pernata jakna, vjetrovka.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:15", "key": "07:15", "title": "Karte za žičaru (prvo!)", "meta": [], "body": "⚠️ **Problem žičare Gwongeumseong:** karte se prodaju **samo na dan i samo na šalteru**, online rezervacije nema. Krajem listopada radnim danom red je **60–90 min**, vikendom više od 2 h, a karte se **često rasprodaju do ranog popodneva**. Po jakom vjetru staje, neiskorištene karte se vraćaju. Radi ~08:30–17:00/17:30, raspored se objavljuje dan ranije.\n\n**Pravilo:** **karte kupujemo odmah po dolasku**, idemo na Ulsanbawi i vozimo se u terminu s karte. **Ako je rasprodano ili puše, preskačemo**, vrh Ulsanbawija ionako daje veliki pogled.\n\n**16 000 ₩ povratno.** Gore su ruševine tvrđave iz 13. stoljeća i panorama granitnih grebena, Ulsanbawija, Sokcha i mora. Pet minuta vožnje zamjenjuje otprilike sat strmog penjanja, što je korisno i ako netko ne može hodati, jer ekipa ostaje zajedno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:30", "key": "07:30", "title": "Sinheungsa", "meta": ["⏱ 30 min", "🌦️", "🦵 lagano"], "body": "Radni budistički hram na ulazu u park, u blizini je ogroman brončani Buda (Tongil Daebul). **Ulaznica je ukinuta, besplatno.** Rano ujutro, u magli i bez ljudi, ima posebnu atmosferu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "08:00", "key": "08:00", "title": "Ulsanbawi", "meta": ["⏱ 3,5–5 h", "☀️", "🦵🦵🦵 čelične stepenice, spust"], "body": "Sogongwon, Sinheungsa, Gyejoam, pa zadnji kilometar po čeličnim stepenicama pričvršćenim za stijenu. **7,6–8,8 km povratno, ~620 m uspona, 3,5–5 h.** Stepenica ima 808 ili 888, ovisno o izvoru.\n\nPrve dvije trećine su blage zemljane i kamene staze dolinom, zadnji dio je strm. Bez penjanja rukama, izvedivo za rekreativca koji vježba tjedno. Ide cijela ekipa, polako.\n\n⚠️ **Štapovi za Luciju nisu opcija nego oprema.** Koljeno strada na silasku niz stepenice, ne na usponu, pa duge pauze.\n⚠️ **Ulaz u park zabranjen je od zalaska sunca do dva sata prije izlaska.** Po kiši je granit sklizak i Ulsanbawi tada ide u petak.\n\nRučak iz ruksaka na vrhu ili pri silasku.", "alts": [{"title": "Zamijeniti s petkom", "text": ", ako je petak vedriji.", "meta": []}, {"title": "Biseondae", "text": ", dolinom potoka Cheonbuldong: **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak i kamen), pogled na litice", "meta": ["⏱ 2,5 h", "🌦️", "🦵"]}, {"title": "Dolina Jujeongol", "text": "(strana Osaek): **ravne drvene staze**, 6,4 km, 2,5–3 h, **boja se drži najdulje**. Sat vožnje, s druge strane parka", "meta": ["⏱ 3 h", "🌦️", "🦵"]}, {"title": "Daecheongbong preko Osaeka", "text": ": 9,5 km, 1 320 m · *⏱ 5–6 h · ☀️ · 🦵🦵🦵🦵* · samo uz razdvajanje na pola dana", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Žičara (ako ima karata)", "meta": [], "body": "U terminu s karte. Ako je rasprodano ili puše, preskačemo bez žaljenja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~13:30", "key": "13:30", "title": "Montbeer: ručak ili pivo", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "**몽트비어 (MontBeer)**, Nohak-dong, Haksapyeong-gil 7-1. Lokalna craft pivovara na cesti iz parka, **veliki prozori gledaju ravno u Ulsanbawi**. Otvara u **13:30**. Uz pivo ima i pravu hranu: **pizza, kobasice, pržena piletina**, 10–40 000 ₩. Ovisno o tome kad završimo, **ručak** ili **samo jedno pivo** prije bazena.", "alts": [{"title": "Haksapyeong, selo mekog tofua:", "text": "niz restorana sundubua uz cestu iz parka prema gradu i Waterpiji, obrok od tofua ili morskih plodova **10–19 000 ₩**. Npr. **Gim Yeong-ae Halmeoni Sundubu** (07:00–14:00, utorkom zatvoreno)", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Sokcho Haenyeo Maeul (속초해녀마을 / 바람꽃해녀마을)", "text": ", Nohak-dong, na cesti iz parka: **lonac od plodova mora s abalonom**, sundubu s abalonom, **seopguk** (ljuti gulaš od divljih dagnji). Od 08:00, 10–30 000 ₩, **srijedom zatvoreno**. Najbolji pravi sjedeći obrok uz planinu", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Food court u Waterpiji:", "text": "burgeri, udon. Praktično, ništa posebno", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~14:30", "key": "14:30", "title": "Seorak Waterpia Spa Valley", "meta": ["⏱ 2–3 h", "☔", "🦵 odmor za noge"], "body": "**설악워터피아**, Hanwha Resort, Nohak-dong, ~10 min taksijem od ulaza u park, na istoj strani grada. **Spa Valley: 18 vanjskih termalnih bazena** s alkalnom mineralnom vodom. **Kupaći i kapa su obavezni**, sve dobi zajedno, bez golotinje. **~42 000 ₩ online, 74 500 ₩ na blagajni**, pa kupujemo online. 10:00–21:30. Najbolji tretman za noge poslije Ulsanbawija.\n\n⚠️ Riječ je o obiteljskom vodenom parku, Spa Valley je mirniji vanjski dio. **Waterpia je glavni izbor ekipe.** ⚠️ Samo ako danas propadne (zatvoreno, kasnimo, svi su gotovi), sutra je rezerva Delpino (vidi Dan 5).\n\n💆 Masaža, head spa i tretman lica nisu ovdje: Waterpia ima samo hidro-mlaznice u bazenu. Tretmani su u Seoulu, sub 31.10. (THE SEOL:HA).", "alts": [{"title": "Odmor u hotelu", "text": ", tuš i spavanje prije večere, ako su svi gotovi", "meta": ["⏱ 2–3 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "💸 Gozba od crvenih rakova", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "⚠️ **Korejski snow crab (daege) u listopadu je pod zabranom izlova (1.6.–30.11.).** Ono što se prodaje kao \"snow crab\" uvoz je iz Rusije po turističkim cijenama, a restorani u lukama Daepo i Dongmyeong (200–320 000 ₩ za četvero) uz to nude hrpu **sirovih priloga**. Zato **crveni rak (hongge)**: lokalan, u sezoni, kuhan na pari pred nama, plus pržena riža od rakova u oklopu.\n\nHongge je **manji od snow craba, tanjih nogu, slađeg i mekšeg mesa**, uz više posla s otvaranjem. To je \"svakodnevni\" rak ove obale.\n\n**Yes Su-san**, unutar središnje tržnice: sjedeći **setovi od crvenog raka ~26–36 000 ₩ po osobi**, kuhani snow crab ~76 000 ₩. **10:30–20:00, utorkom zatvoreno**, pa **dolazimo najkasnije oko 19:00.** Toplo, za stolom, 5 min hoda do Freezer Cluba. Ne treba zvati dan ranije.", "alts": [{"title": "Rakovi za van: Gessadagu (게싸다구) / Sokcho Bulgeun Daege Susan (속초붉은대게수산)", "text": ", susjedni štandovi na tržnici. Biraju se živi rakovi iz bazena, kuhaju se na pari 10–45 min i režu oklop. **Hongge ~10 000 ₩ po komadu**, ruski daege 44–60 000 ₩ po kilogramu, pržena riža u oklopu 2 000 ₩. Za četvero 4–6 rakova, ukupno **60–100 000 ₩**. Gessadagu 10:00–21:00. Uglavnom za van, jede se stojeći ili se nosi; neuredno je, dobro je imati umivaonik", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Freezer Club / Dalbit Yajang", "meta": ["⏱ 1–2 h", "☔", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke. Bivše skladište hladnjače za ribu pretvoreno u noćni food court: topli zalogaji, krumpir-palačinke, pivo pod limenim krovom. U sredini je **Freezer Club (냉동클럽)**: ulazi se kroz teška industrijska vrata zamrzivača, a unutra je nezagrijana plesna soba s retro svjetlima i glazbom. Besplatan ulaz, 18:00–24:00, **pretežno srijeda–nedjelja**. Radi li četvrtkom krajem listopada, provjeriti na licu mjesta ili na Naveru. Ovdje je jer **u petak nema ranog ustajanja**.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Žičara rasprodana ili vjetar:** preskačemo, vrh Ulsanbawija je dovoljan.\n- **Lucija stane na pola:** odmorište prije zadnjeg stepeništa, ostali gore i natrag. Sat razdvajanja, ne dan.\n- **Kiša ili magla:** Ulsanbawi u petak, danas Biseondae ili Cheonbuldong.\n- **Boja je na visini prošla:** Jujeongol.\n- **Brzo smo gotovi:** Montbeer za ručak, pa Waterpia. **Sporo:** samo pivo u Montbeeru ili ravno u bazen.\n- **Svi su mrtvi:** hotel, rakovi, spavanje. Freezer Club se seli na petak.", "heading": "Čet 22.10. — Planinski dan", "city": "sokcho-i-seoraksan", "transfer": "", "flash": {"label": "Četvrtak, 22. 10. · Sokcho — Seoraksan i planinski vrhovi", "text": "U 06:30 krećemo prema **Nacionalnom parku Seoraksan**, jednom od najljepših planinskih područja u Južnoj Koreji. Po dolasku prvo provjeravamo i kupujemo karte za žičaru, kako bismo osigurali tu opciju prije nego što se stvore gužve. Zatim posjećujemo hram **Sinheungsa**, smješten među planinama, koji u jutarnjoj magli ima posebno mirnu atmosferu. Glavni izazov dana je **Ulsanbawi** — impresivna granitna stijena do čijeg se vrha dolazi dugim nizom metalnih stepenica. Uspon je fizički zahtjevan, pa idemo polako, uz stanke i prema mogućnostima svakog člana ekipe. Nije nužno da svi dođu do samog vrha. Nakon planinarenja slijedi zasluženi odmor u **Montbeeru**, uz ručak ili barem pivo i pogled na planinske stijene. Poslijepodne odlazimo u **Waterpie**, kompleks termalnih bazena i vodenih atrakcija u kojem možemo opustiti umorne mišiće. Navečer se pripremamo za pravi gastronomski vrhunac Sokcha: 💸 **gozbu od crvenih rakova**. Dan završavamo plesom u neobičnom prostoru starog hladnjaka za ribu."}, "rows": [{"time": "večer prije", "key": "večer prije", "text": "U 7-Elevenu u hotelu kupujemo doručak **i hranu za planinu**: kimbap, sendviče, voće i piće.", "altHint": false, "slot": 0}, {"time": "06:30", "key": "06:30", "text": "Bus **7 / 7-1** s postaje preko ceste do Sogongwona, ili taksi za 13–16 000 ₩.", "altHint": false, "slot": 1}, {"time": "07:15", "key": "07:15", "text": "⚠️ **Prvo karte za žičaru.** Prodaju se samo na dan, na šalteru, i rasprodaju se.", "altHint": false, "slot": 2}, {"time": "07:30", "key": "07:30", "text": "**Sinheungsa**, hram na ulazu u park, besplatno.", "altHint": false, "slot": 3}, {"time": "08:00", "key": "08:00", "text": "**Ulsanbawi:** 7,6–8,8 km, **3,5–5 h**, čelične stepenice na vrhu. Štapovi za Luciju.", "altHint": false, "slot": 4}, {"time": "~13:00", "key": "13:00", "text": "**Žičara na Gwongeumseong** u terminu s karte. Ako je rasprodano ili puše, preskačemo.", "altHint": false, "slot": 5}, {"time": "~13:30", "key": "13:30", "text": "**Montbeer:** ručak (pizza, kobasice, piletina) ili samo pivo s pogledom na Ulsanbawi, ovisno o vremenu.", "altHint": false, "slot": 6}, {"time": "~14:30", "key": "14:30", "text": "♨️ **Seorak Waterpia, Spa Valley** (glavni izbor), 18 vanjskih termalnih bazena, treba kupaći.", "altHint": false, "slot": 7}, {"time": "19:00", "key": "19:00", "text": "💸 **Gozba od crvenih rakova** u Yes Su-sanu na središnjoj tržnici, sjedeći. (Originalna ideja bila je snow crab, ali u listopadu je pod zabranom izlova.)", "altHint": false, "slot": 8}, {"time": "21:00", "key": "21:00", "text": "**Freezer Club / Dalbit Yajang**, noćni food court u starom hladnjaku za ribu.", "altHint": false, "slot": 9}], "plans": [], "leftPlans3": [], "decisions": ["d-cet-22-10-popodne-poslije-planine"]}, {"date": "23.10", "d3heading": "PET 23.10. — BLAŽI DAN, GRAD I OBALA", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 5 od 14 · Dan oporavka nakon Ulsanbawija", "intro": "Logika dana: **jutro u parku na ravnom, popodne grad i obala na ravnom.** Bazen je bio u četvrtak (Waterpia). ⚠️ **Samo ako Waterpia u četvrtak propadne**, Delpino ulazi umjesto muzeja i jezera.", "stay": "", "slots": [{"timeLabel": "08:00", "key": "08:00", "title": "Jutro u parku: Biseondae (i Biryong)", "meta": ["⏱ 2,5–5 h", "🌦️", "🦵 Biseondae / 🦵🦵 Biryong"], "body": "Do parka isto kao u četvrtak: **bus 7 / 7-1** preko ceste od hotela ili taksi 13–16 000 ₩. Nema žurbe ni karata za žičaru. Odlučujemo ujutro, prema nogama.\n\n**Opcija 1: obje šetnje (~11 km, 4–5 h)**\n- **Biseondae (비선대):** Sogongwon, Sinheungsa, pa uz potok Cheonbuldong do Biseondaea. **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak, kamene ploče, nekoliko mostova). Na kraju su granitne ploče u potoku i okomite litice Jangguneoka. Najljepša lagana šetnja u parku, krajem listopada puna boje. ⚠️ Dalje od Biseondaea (prema Geumganggulu, 600+ stepenica) ne idemo.\n- **Biryong slapovi (비룡폭포):** polazište uz cestu **malo prije Sogongwona** (stanica busa 7/7-1 Seorak-dong). **4,8 km povratno, 2–2,5 h, ~180 m uspona**: drvene staze, **viseći mostovi**, slapovi Yukdam i na kraju Biryong (\"slap letećeg zmaja\") u kamenom amfiteatru. Umjereno, sa štapovima u redu.\n- ❌ **Vidikovac Towangseong** iznad Biryonga: još 0,8 km i **900+ strmih stepenica**. Nije za Lucijino koljeno, a dan poslije Ulsanbawija nije ni za koga.\n\n**Opcija 2: polagani doručak, pa samo Biseondae (~3,5 h ukupno)**\n- **08:00–09:00 doručak u hotelu ili kafiću.** Za ljubitelje tofua: **Gim Yeong-ae Halmeoni Sundubu (김영애할머니순두부)**, Haksapyeong, selo tofua na cesti prema parku. Tofu se zgrušava **morskom vodom**: mekan, topao sundubu u kamenoj zdjeli, uz kongbiji (gulaš od mljevene soje) i banchan. **07:00–14:00, utorkom zatvoreno.** 10–15 000 ₩ po osobi.\n- Taksijem 5 min do Sogongwona, pa **samo Biseondae**. Biryong je dodatak ako noge kažu da.\n\n**Opcija 3 (rezerva): dulje spavanje, samo Biryong.** Fotogeničniji od Biseondaea (slap, mostovi), kraći i bez gužve na glavnom ulazu, ali ima nešto silaska, pa je lošiji za koljeno.", "alts": [{"title": "Zamjena s četvrtkom:", "text": "ako je četvrtak bio kišan, danas je Ulsanbawi (vidi Dan 4), a muzej i jezero sele u četvrtak", "meta": ["⏱ 3,5–5 h", "☀️", "🦵🦵🦵"]}, {"title": "Dolina Jujeongol", "text": "(strana Osaek): **ravne drvene staze**, 6,4 km, 2,5–3 h, **boja se drži najdulje**. Sat taksijem s druge strane parka, pa pada dio popodneva", "meta": ["⏱ 3 h + 2 h vožnje", "🌦️", "🦵"]}, {"title": "Žičara Gwongeumseong", "text": ", ako je propala u četvrtak. Isti problem: **karte samo na dan, na šalteru**, redovi 60–90 min, pa doći na otvaranje (~08:30)", "meta": ["⏱ 1,5–2,5 h", "☀️", "🦵"]}, {"title": "Dalje uz Cheonbuldong:", "text": "nastavak iza Biseondaea dolinom do slapova, ~12 km. Po mokrom lijepo, ali puno kamena i stepenica", "meta": ["⏱ 3–5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Ručak na strani parka", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Baramkkot Haenyeo Maeul (바람꽃해녀마을 / 속초해녀마을)**, Nohak-dong, na cesti iz parka prema gradu. \"Selo ronilica\" je kuhinja u stilu haenyeo, žena koje rone po plodove mora. Naručujemo kuhano:\n- **seopguk (섭국):** ljuti, gusti gulaš od **divljih dagnji** s povrćem i jajem, specijalitet ove obale;\n- **lonac od plodova mora s abalonom** (za dijeljenje) ili **sundubu s abalonom**.\n\n08:00/08:30–20:00, **srijedom zatvoreno**, 10–30 000 ₩. Broj se uzima na kiosku. ⚠️ Sirovo (hoe) preskačemo.", "alts": [{"title": "Selo tofua Haksapyeong", "text": ", ako je doručak bio negdje drugdje: niz restorana sundubua na istoj cesti, 10–19 000 ₩", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Montbeer (몽트비어)", "text": ", Haksapyeong-gil 7-1, ako se u četvrtak nije stiglo: pizza, kobasice, piletina, craft pivo s pogledom na Ulsanbawi, od 13:30", "meta": ["⏱ 1–1,5 h", "☔", "🦵"]}, {"title": "Sadonjib (사돈집)", "text": ", Yeongrang-dong, u gradu: **mulgomtang**, ako se nije stiglo u srijedu. **08:00–15:00, četvrtkom zatvoreno**, zatvara ranije kad nestane, pa doći do 13:30", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:00", "key": "14:00", "title": "Nacionalni planinarski muzej (국립산악박물관)", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "Misiryeong-ro, Nohak-dong, na istoj strani grada kao park i ručak, 5–10 min taksijem. **Besplatno**, 09:00–18:00, ponedjeljkom zatvoreno.\n\nKorejska i himalajska planinarska povijest: oprema s osvajanja Everesta, šatori, kisik. Najzanimljivija je **soba koja simulira veliku visinu**: smanjena razina kisika, osjeti se kako bi bilo na 3–4 000 m. Ima i **stijena za penjanje** te 4D/VR planinarenje. Lagano i zabavno dan poslije Ulsanbawija.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Jezero Cheongcho i krizanteme", "meta": ["⏱ 45 min–1 h", "🌦️", "🦵 lagano"], "body": "**청초호** je laguna usred grada, između centra i Abaija; jučerašnja skela gaetbae je na njezinu ulazu. Ravna šetnica oko vode, pogled na ribarske brodove i Seoraksan iza grada.\n- **Izložba krizantema** u parku Expo uz jezero: besplatna, do početka studenog, **navečer osvijetljena**, pa može i kao večernja šetnja.\n- **Expo toranj (엑스포타워):** vidikovac nad jezerom i morem.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Plaža Sokcho i staza Oeongchi uz more", "meta": ["⏱ 1–1,5 h", "☀️", "🦵 lagano"], "body": "- **Plaža Sokcho (속초해수욕장):** duga gradska plaža, 10 min taksijem od jezera. Na njoj je **Sokcho Eye**, panoramski kotač uz more (~12 000 ₩), lijep u sumrak.\n- **Oeongchi Bada Hyanggi-ro (외옹치 바다향기로):** **drvena staza od ~1,7 km** od južnog kraja plaže uz stijene do malog ribarskog sela Oeongchi. Ravno, uz valove, s nekoliko kratkih stepenica. Do 2018. taj dio obale bio je zatvorena vojna zona.\n\n💡 **Na istočnoj obali sunce zalazi iza Seoraksana**, ne u more. Oko 17:45 more i stijene dobivaju zlatno svjetlo, a planine iza grada postaju silueta.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Craftroot (ili Montbeer)", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Craftroot (크래프트루트)**, craft taproom u staroj zgradi od cigle, lokalno pivo, opušteno. Ako Montbeer nije bio u četvrtak, idemo tamo, ali on je na strani parka pa ga je lakše uklopiti uz ručak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:30", "key": "19:30", "title": "Večer: Dalbit Yajang i Freezer Club", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke, 5 min od središnje tržnice. Bivša hladnjača za ribu pretvorena u **noćni food court**: štandovi s ražnjićima, prženim zalogajima, palačinkama i pivom pod limenim krovom. Iza teških vrata zamrzivača je **Freezer Club (냉동클럽)**, nezagrijana plesna soba s retro svjetlima. Besplatan ulaz, **18:00–24:00, srijeda–nedjelja**, pa je **petak siguran dan**.\n\n**Ako je Freezer Club bio u četvrtak**, biramo između donjih opcija.\n\n⏰ **U hotel do ~22:00**, u subotu rani polazak (vidi Dan 6).\n\n**Plan B: 🍗 piknik s dakgangjeongom.** Sokcho **dakgangjeong (닭강정)** su komadi pržene piletine u ljepljivoj slatko-ljutoj glazuri s kikirikijem, **dobri i hladni**. **Manseok Dakgangjeong (만석닭강정)** u središnjoj tržnici, **10:00–20:00, ~18–22 000 ₩ kutija** (jedna velika dovoljna je za dvoje kao večera). ⚠️ Štandovi zatvaraju oko 19:30–20:00, pa **kupiti do 19:30**. Uz to pivo iz trgovine, pa na plažu Sokcho (sumrak, Sokcho Eye) ili u hotel. Najmirnija i najjeftinija varijanta, rano u krevet.\n\n**Plan C: 🥩 korejski roštilj.** Klasična korejska večera koju u Sokchu još nismo imali: **samgyeopsal** (svinjska potrbušina) ili **dwaeji galbi** (marinirana svinjska rebra) peku se na roštilju u stolu, uz zelenu salatu za zamatanje, češnjak, umake i doenjang-jjigae na k "☔", "🟡"]}], "altNotes": [], "after": "⚠️ **Subota na Hwangnidan-gilu:** redovi na popularnim mjestima, pa birati lokal bez reda ili ići malo izvan glavne ulice."}, {"timeLabel": "14:30", "key": "14:30", "title": "Daereungwon, Cheonmachong, Gyochon i kuća Choi", "meta": ["⏱ 2,5–3 h", "🌦️", "🟡 po kiši / 🟢 Cheonmachong"], "body": "**Daereungwon (대릉원)** je park usred grada s **23 kraljevska grobna humka Sille**, travnatim brežuljcima visokim do dvadesetak metara, između borova. **Besplatno**, 09:00–22:00. Ravne staze.\n\n**Cheonmachong (천마총)** je jedini humak u koji se ulazi (**3 000 ₩**): presjek groba, replika **zlatne krune** i slika „Nebeskog konja”. 20 min, **potpuno pod krovom**.\n\n☕ **Hwangnam-ppang (황남빵)**, kod Daereungwona: mala lepinja tankog tijesta punjena slatkim crvenim grahom, recept iz 1939. Kupuje se topla, kutija može i u Airbnb.\n\nPješice 10–15 min na jug, pored Cheomseongdaea, do **Gyochona (교촌마을)**: obnovljeno tradicionalno selo, hanok kuće, radionice, kafići. Besplatno.\n\n**Kuća obitelji Choi (최부자댁)**, „bogati Choijevi”, dvanaest generacija najbogatija obitelj u kraju, s pravilima „nikad ne posjeduj više od 10 000 vreća riže” i „nitko u krugu od 100 lija ne smije biti gladan”. **09:30–17:30, besplatno.** ⚠️ **Zatvorena zadnji ponedjeljak u mjesecu (26.10.), pa je danas jedina prilika.** Dvorišta i strehe, može se i po kiši.\n\n💡 **Gyodong Beopju (교동법주)**, 300 godina staro rižino vino obitelji Choi, kupuje se na kućnim vratima, ~35–40 000 ₩ za 900 ml. Nepasterizirano je, pa ide u hladnjak.\n\n☔ **Kišna verzija:** Cheonmachong i jedna staza među humcima, kuća Choi obavezno, Gyochon kraće, ostatak vremena u kafiću na Hwangnidan-gilu.", "alts": [{"title": "Hwangnidan-gil (황리단길)", "text": ": kafići, pekare, makgeolli (uz kimchijeon ili gamjajeon, ne haemul-pajeon). Najbolje mjesto za skloniti se od kiše", "meta": ["⏱ 1 h", "☔", "🟢"]}], "altNotes": ["🆕 **Grnčarska radionica u Gyochonu (토기공방)**, Gyochon-gil 31-6, 054-748-0791: oslikavanje gotove šalic heonmachong i jedna staza među humcima.", "altHint": false, "slot": 2}, {"time": "~15:30", "key": "15:30", "text": "**Gyochon** i **kuća obitelji Choi** (zatvara u 17:30): otvorena *samo danas*, u ponedjeljak je zatvorena, pa je **obavezna i po kiši**. Usput **Gyodong Beopju**.", "altHint": false, "slot": null}, {"time": "17:00", "key": "17:00", "text": "Odmor u Airbnbu, ili kafić na Hwangnidan-gilu.", "altHint": false, "slot": 3}, {"time": "18:15", "key": "18:15", "text": "**Anapji** u sumrak (3 000 ₩, karte do 21:30): ravna popločana staza oko jezera, 30–40 min, ništa natkriveno. Pa osvijetljeni **Cheomseongdae** i natkriveni most **Woljeonggyo** (svijetli do 23:00). ☔ **Plan B:** prvo **Nacionalni muzej 17:30–19:30** (subotom do 20:00, besplatno, 5 min hoda), pa Anapji oko 19:45.", "altHint": false, "slot": 4}, {"time": "20:00", "key": "20:00", "text": "🍢 **Noćna tržnica Jungang**, pladanj s četiri pregrade, pod krovom. Ako festival radi i navečer, ista tržnica. **Ili** **Dosol Maeul** (rezervacija, tada večera u 17:30).", "altHint": false, "slot": 5}, {"time": "22:00", "key": "22:00", "text": "**Bar Boon** (kokteli u hanoku, unutra). ~~Hwangnam Geobuk~~ (pivo oko vatre vani) samo ako ne kiši.", "altHint": false, "slot": 6}], "plans": [{"label": "Plan C · Gangneung", "replaces": ["06:35", "06:55", "08:00", "09:36", "12:30", "13:30", "14:30", "17:00"], "summary": "", "detail": null, "rows": null}], "leftPlans3": [], "decisions": ["d-sub-24-10-vlak", "d-sub-24-10-polazak-iz-sokcha", "d-sub-24-10-vecera", "d-sub-24-10-transfer-sa-stanice"]}, {"date": "25.10", "d3heading": "NED 25.10. — YANGDONG, MUZEJ I HWANGNYONGSA POD KROVOM", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 7 od 14 · 🌧️ povremena kiša (ujutro ~70 %, popodne ~60 %)", "intro": "⚠️ **Najgužviji vikend korejske jeseni, a po kiši se svi sklanjaju u muzeje.** Jutro u Yangdongu je bijeg od centra.\n\n**Odluka (24.10.): varijanta A.** Yangdong ostaje ujutro, **bicikli otpadaju i sele na ponedjeljak popodne**, a popodne je pod krovom.", "stay": "", "slots": [{"timeLabel": "07:45", "key": "07:45", "title": "Doručak", "meta": ["⏱ 45 min", "☔", "🟢"], "body": "**Bife-uličica tržnice Seongdong (성동시장 한식뷔페 골목)**, ~10 min pješice: tanjur i više od 30 domaćih jela, neograničena riža i juha, **8–9 000 ₩**. Tržnica radi ~07:00–20:00, ali dani zatvaranja ovise o lokalu, pa nedjeljom uzimamo onaj koji radi. ⚠️ Na pultu ima i ribe, birati.", "alts": [{"title": "Kafić, pekara ili korejski tost", "text": "(lanci tipa Isaac Toast) blizu Airbnba", "meta": ["⏱ 30 min", "☔", "🟢"]}, {"title": "Trgovina:", "text": "trokutasti kimbap (ne s tunom), sendvič, banana-mlijeko", "meta": ["⏱ 15 min", "☔", "🟢"]}], "altNotes": [], "after": ""}, {"timeLabel": "08:30", "key": "08:30", "title": "Taksi do Yangdonga", "meta": [], "body": "**Jedan taksi**, 22–28 000 ₩, 20–25 min. Rezerva je bus 203 kod Intercity terminala (svakih 70–90 min, 45–55 min vožnje).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00", "key": "09:00", "title": "Yangdong Folk Village (양동마을)", "meta": ["⏱ 2–3 h", "🌦️", "🟡 po kiši"], "body": "**4 000 ₩ · 09:00–18:00.** Selo dvaju plemićkih klanova, **Son i Yi**, koji ondje žive više od 500 godina. UNESCO (Povijesna sela Koreje, 2010.), s više obitelji koje stvarno žive ondje nego u poznatijem Hahoeu i gotovo bez grupa.\n\n⚠️ **Kuće su privatne, gleda se samo dvorište.**\n\n**Kako:** prvo ravni donji dio doline (slamnate kuće pučana, rižina polja), pa gore do plemićkih kuća po **kratkim strmim betonskim rampama**. **Seobaekdang** (glavna kuća klana Son, 15. st.), **Mucheomdang** (klan Yi), **Hyangdan** (16. st.) i paviljon **Gwangajeong** s pogledom na dolinu. Izložbeni centar na ulazu, 15 min, je i dobro sklonište od kiše.\n\n🌧️ **Po kiši:** slamnati krovovi i dolina u izmaglici imaju posebnu atmosferu, a turista je još manje. Rampe i zemlja kližu, pa tenisice s dobrim potplatom. Po jakoj kiši samo donji dio i jedna-dvije plemićke kuće, ~1,5 h, pa raniji ručak.", "alts": [{"title": "Jaka kiša cijelo jutro → nedjelja pod krovom:", "text": "🆕 **Muzej korejske pop glazbe (한국대중음악박물관)**, Bomun, Expo-ro 9: četiri kata povijesti korejske glazbe, sobe za slušanje, instrumenti, **coin noraebang**, 15 000 ₩, 10:00–18:00 (zadnji ulaz 17:00), **zatvoren ponedjeljkom i utorkom**, pa je nedjelja jedini termin. Pa 🆕 **Snoopy 75 u muzeju Ooyang** (vidi 🧱). Yangdong tada ide **u ponedjeljak popodne umjesto bicikala**", "meta": ["⏱ 3–4 h", "☔", "🟢"]}, {"title": "Oksan Seowon i Dokrakdang", "text": ", konfucijanska akademija i paviljon nad potokom, 35 min sjeverno, ako je Yangdong pregužvan", "meta": ["⏱ 2,5 h", "🌦️", "🟡"]}], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Ručak u selu", "meta": ["⏱ 1 h", "☔", "🟢"], "body": "**Yangdong Sikdang** i druge seoske kuhinje kod ulaza: **kalguksu**, **gamjajeon** (palačinka od krumpira), 🟡 sanchae bibimbap (zna biti gorak), 🟡 dotorimuk (žele od žira).\n\n**Natrag:** taksi se u selu teško nađe preko Kakao T, pa **zamoliti restoran da ga pozove** ili uhvatiti bus 203. Polazak 12:45–13:00. **Plan B:** u selu samo kava, a ručak oko 13:15 na Hwangnidan-gilu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Nacionalni muzej Gyeongju (국립경주박물관)", "meta": ["⏱ 1,5–2 h", "☔", "🟢"], "body": "**Besplatno, nedjeljom 10:00–18:00 (zadnji ulaz 17:30); u izvorima i do 19:00, pa provjeriti na ulazu.** Iljeong-ro 186. Prave **zlatne krune** iz humaka koje smo vidjeli u subotu i **zvono kralja Seongdeoka (Emille)** iz 771., 19 tona bronce, uz legendu o djetetu bačenom u talinu. Kruna i zvono su obavezni, ostalo po volji. ⚠️ Kišna nedjelja znači gužvu, pa ići ravno u glavnu zgradu (Silla History Hall), a zvono je vani pod krovom.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~15:30", "key": "15:30", "title": "🆕 Povijesna dvorana Hwangnyongsa i Bunhwangsa", "meta": ["⏱ 1–1,5 h", "☔", "🟢 dvorana / 🟡 Bunhwangsa"], "body": "Taksi ~5 min od muzeja.\n\n**Povijesna dvorana Hwangnyongsa (황룡사역사문화관)**, Imhae-ro 64-19: **3 000 ₩**, vikendom (travanj–listopad) **09:00–19:00**, radnim danom do 18:00, zadnji ulaz 30 min prije, **otvoreno i ponedjeljkom**. Unutra: **maketa drvene pagode od devet katova u mjerilu 1:10** (~8 m), **3D kino** o hramu od osnutka do paljenja 1238., izložba nalaza, AR i **kafić u predvorju s pogledom na polje Hwangnyongsa**. Temelji nekad najvećeg hrama u Koreji vide se s prozora.\n\n**Bunhwangsa (분황사)**, odmah do polja: **pagoda od kamenih blokova isklesanih kao cigle, iz 634.** Pogled od 10 min s kišobranom.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Odmor", "meta": [], "body": "", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Večera", "meta": ["⏱ 1,5 h", "☔", "🟢"], "body": "**Plan: korejski roštilj.**\n- 🔥 **BBQ buffet (무한리필)**: svinjetina (i nekad govedina) do mile volje, 15–30 000 ₩ po osobi, 90–120 min. 🔎 경주 무한리필, 경주 고기 무한리필. Lokal nije odabran, ocjena 4,3+ na Naveru.\n- 💸 **Hanwoo BBQ**: korejska govedina, 40–80 000 ₩ po osobi. Ako je ovo svečana večer, ponedjeljak ide jednostavnije. 🔎 경주 한우.", "alts": [{"title": "Noćna tržnica Jungang", "text": ", ako se u subotu jako svidjela (nedjeljom radi, ponedjeljkom ne)", "meta": ["⏱ 1,5 h", "☔", "🟢"]}, {"title": "Byeolchaeban ssambap", "text": ", 10:00–21:00, zadnja narudžba 20:15", "meta": ["⏱ 1,5 h", "☔", "🟢"]}, {"title": "Dakgalbi", "text": "ili **jjimdak**, piletina u tavi na stolu", "meta": ["⏱ 1,5 h", "☔", "🟢"]}, {"title": "Shabu-shabu", "text": ", lonac s juhom na stolu", "meta": ["⏱ 1,5 h", "☔", "🟢"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:30", "key": "20:30", "title": "Bonghwangdae", "meta": ["⏱ 20 min", "🌦️", "🟡"], "body": "**봉황대**, ~5 min od Airbnba: humak visok 22 m sa starim drvećem na vrhu, noću osvijetljen, bez ograde i ljudi.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "titl ⚠️ **Restoran neka pozove taksi** za povratak.", "altHint": false, "slot": 3}, {"time": "13:30", "key": "13:30", "text": "**Nacionalni muzej Gyeongju**, besplatno, nedjeljom 10:00–18:00 (zadnji ulaz 17:30; stari izvor kaže do 19:00): zlatne krune, zvono Emille. Gužva, ali velik je.", "altHint": false, "slot": 4}, {"time": "~15:30", "key": "15:30", "text": "Taksi 5 min do 🆕 **povijesne dvorane Hwangnyongsa** (3 000 ₩, vikendom do 19:00): maketa pagode 1:10, 3D kino, AR, kafić s pogledom na polje. Pa **Bunhwangsa** 10 min. Polje Hwangnyongsa samo s prozora ili kratko.", "altHint": false, "slot": 5}, {"time": "❌", "key": "❌", "text": "**Bicikli otpadaju** (4 h po mokrom), sele se na ponedjeljak popodne.", "altHint": false, "slot": null}, {"time": "17:30", "key": "17:30", "text": "Odmor.", "altHint": false, "slot": 6}, {"time": "19:00", "key": "19:00", "text": "**Večera:** 🔥 BBQ buffet (무한리필) ili 💸 hanwoo BBQ. **Ili** noćna tržnica Jungang opet (nedjeljom radi), **ili** Byeolchaeban ssambap.", "altHint": false, "slot": 7}, {"time": "20:30", "key": "20:30", "text": "**Bonghwangdae**, osvijetljeni humak, 5 min od Airbnba.", "altHint": false, "slot": 8}, {"time": "21:00", "key": "21:00", "text": "**Bar Boon** ili **Gyodong Beopju** u Airbnbu.", "altHint": false, "slot": 9}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "26.10", "d3heading": "PON 26.10. — BULGUKSA, SEOKGURAM I BICIKLOM PO ISTOČNOJ STRANI", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 8 od 14 · 🌦️ kiša do jutra (prognoza 25.10. navečer), popodne suše, tlo mokro nakon dva dana kiše", "intro": "Bulguksa i Seokguram vikendom su krcati, ponedjeljak je puno mirniji. ⚠️ **Ponedjeljkom mnogi obiteljski restorani ne rade**, a zatvoreni su i kuća Choi (zadnji ponedjeljak u mjesecu), noćna tržnica, muzej Ooyang (Snoopy), Muzej pop glazbe, „경주연대기” i staklenik Donggungwon. **Otvoreno je:** Nacionalni muzej, dvorana Hwangnyongsa, Bulguksa, Seokguram.", "stay": "", "slots": [{"timeLabel": "08:30", "
