key": "08:30", "title": "Buđenje", "meta": [], "body": "", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00–09:30", "key": "09:00", "title": "Doručak i kava u gradu", "meta": ["⏱ 30 min", "☔", "🟢"], "body": "Kod Bulgukse rano ujutro gotovo ništa ne radi, pa jedemo prije puta.\n- **Bife-uličica tržnice Seongdong (성동시장 한식뷔페 골목)**, ~10 min pješice: 30+ domaćih jela, 8–9 000 ₩, od ~07:00.\n- **Brže:** pekara ili korejski tost (Paris Baguette, Isaac Toast), otvaraju ~07:30–08:00. Kava za van.\n- ⚠️ Kafići na Hwangnidan-gilu otvaraju tek oko 10–11.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:30", "key": "09:30", "title": "Do Bulgukse", "meta": [], "body": "**Taksi ~20 min** (15–18 000 ₩), dolazak ~09:50. **Rezerva: bus 10 ili 11** preko puta Intercity terminala, 30–40 min.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~09:50", "key": "09:50", "title": "Bulguksa (불국사)", "meta": ["⏱ 1,5–2 h", "🌦️", "🟢 (🟡 po kiši: mokre kamene stepenice)"], "body": "**Besplatno** · ponedjeljkom **09:00–18:00**, zadnji ulaz 17:30 · UNESCO.\n\nSagrađen **528.**, današnji oblik iz 751. Kameni temelji i mostovi-stepenice (**Cheongungyo i Baegungyo**) originalni su iz 8. stoljeća. U dvorištu su pagode **Seokgatap** (jednostavna, savršenih proporcija) i **Dabotap** (kitnjasta, na kovanici od 10 wona).\n\n⚠️ **Javorova prilazna cesta dio je doživljaja**, lokalni vrhunac boja je ~22.10.–3.11. Hodamo od parkirališta, ne taksiramo do vrata. Turistički autobusi stižu oko 10:30. Lišće nakon kiše je jače obojeno, a staze sjajne.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "⏰ 10:00 KST", "key": "10:00", "title": "REZERVACIJA TAJNOG VRTA (za nedjelju 1.11.)", "meta": [], "body": "**Usred Bulgukse: stati pod krov paviljona, telefon, alarm.** Treba mobilni internet.\n\nTermini za Changdeokgung **Huwon** otvaraju se **u 10:00 KST, šest dana unaprijed**, i u jesen nestanu u minutama. **ticket.cdg.go.kr**, korejsko sučelje, engleski na podstranici, e-mail verifikacija. **Dvoje pokušava paralelno.** 5 000 ₩ vrt + 3 000 ₩ palača. Engleski termin (10:30 / 11:30 / 14:30 / 15:30) ili korejski s audio-vodičem.\n\n**Rezerva:** otprilike pola karata prodaje se na licu mjesta istog dana od 09:00, pa 1.11. na blagajni oko 08:30.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~11:15", "key": "11:15", "title": "Seokguram (석굴암)", "meta": ["⏱ 45 min", "🌦️", "🟢"], "body": "**Besplatno** · 09:00–17:30 · UNESCO. Granitni **Buda iz 8. stoljeća** u umjetnoj špilji-kupoli od granitnih blokova, okrenut prema Istočnom moru. ⚠️ Iza stakla, bez fotografiranja, posjet 10–15 min. Od parkirališta ~600 m ravne šumske staze.\n\n**Gore: taksi** s platoa Bulgukse, ~15 min, 10–12 000 ₩. **Rezerva: bus 12** u 08:40, 09:40, 10:40, **11:40**, 12:50, 13:40, 14:40, 15:40, 16:40 (15–20 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:30", "key": "12:30", "title": "Ručak: 🅰️ ispod Bulgukse ili 🅱️ u gradu", "meta": ["⏱ 1 h", "☔", "🟢"], "body": "**🅰️ Ispod Bulgukse** (taksi sa Seokgurama ~15 min), ponedjeljkom otvoreno:\n- **Neulbom (늘봄)**, cesta Bulguksa–Bomun, 09:00–21:00: dolsotbap, bulgogi od hanwooa, galbijjim.\n- **Selo restorana ispod Bulgukse (불국사 상가)**: bibimbap, bulgogi, makgeolli. ⚠️ Pajeon je često s plodovima mora, pa tražiti **kimchijeon** ili **gamjajeon**. 🔎 불국사 맛집\n- 🟡 **Busan Sikdang (부산식당)**: doenjang-jjigae i tteokgalbi, ali **u setu je pečena riba**.\n- Pa **taksi u grad ~13:45** (~20 min), bicikli od ~14:15.\n\n**🅱️ U gradu** (taksi sa Seokgurama ravno u grad, ~30 min, ručak ~13:00):\n- **Hwangnidan-gil:** ssambap (Byeolchaeban, Hwangnam Ssambap) ili tteokgalbi. ⚠️ **Ponedjeljkom dio lokala ne radi**, provjeriti na Naveru prije polaska.\n- Prednost: iznajmljivači bicikala su tu, pa bicikli kreću već oko **14:00**.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~14:00", "key": "14:00", "title": "🚲 Biciklom po istočnoj strani (premješteno s nedjelje)", "meta": ["⏱ ~3,5 h", "☀️", "🟢 po suhom"], "body": "💡 **Redoslijed je okrenut tako da završimo kod Cheomseongdaea na zalazak (~17:35)**: zlatno svjetlo na ružičastoj travi. ☔ Ako još kiši: Nacionalni muzej ili dvorana Hwangnyongsa (obje rade ponedjeljkom).\n\nIznajmljivači su na **Poseok-ro / Taejong-ro**, kod Daereungwona: **5–6 000 ₩ na sat**, e-bicikl **10–15 000 ₩ na sat**. ⚠️ **WIP:** provjeriti radi li iznajmljivač ponedjeljkom (vjerojatno da). Teren je ravan, ali poslije vikenda ima lokvi. ⚠️ **U Daereungwonu i Gyerimu se ne vozi**, bicikle zaključavamo na rubu.\n\n**Krug (~8 km, bez muzeja koji je bio u nedjelju):**\n1. **Gyerim (계림)**: drevna šuma s ogromnim starim stablima, legenda o rođenju osnivača klana Kim, zlatne i crvene krošnje. 15 min.\n2. **Woljeonggyo danju**, drukčiji od subotnje noći.\n3. **Polje Hwangnyongsa (황룡사지)**: temelji nekad najvećeg hrama u Koreji, s drvenom pagodom od devet katova (~80 m) koju su Mongoli spalili 1238. Ogromno prazno polje s kamenim bazama. Maketu i film iz dvorane gledali smo u nedjelju.\n4. **Bunhwangsa (분황사)**: pagoda od kamenih „cigli” iz 634., ovaj put na suhom. Usput **chalboribbang** (palačinke od ječma s grahom).\n5. 🌸 **Pink muhly uz Cheomseongdae na zalazak (~17:35)**: polje ružičaste trave uz zvjezdarnicu u zlatnom svjetlu. Krajem listopada je iza vrhunca, ali vjerojatno još ružičasta.\n6. Bicikli natrag kod Daereungwona, ~5 min.", "alts": [{"title": "Namsan, dolina Samneung", "text": "(umjesto bicikala): borova šuma, tri kraljevske grobnice, Buda bez glave, **šest Buda uklesanih u stijenu**. 2,4 km tamo i natrag, 60–75 min, besplatno. Taksi iz grada ~15 min do posjetiteljskog centra Seonamsan. ⚠️ Zemljana staza bit će blatnjava nakon kiše", "meta": ["⏱ 2 h", "🌦️", "🟡"]}, {"title": "Viši Namsan (Geumobong, Chilburam)", "text": ": penjanje po stijenama do isklesanih Buda i pogleda. Bio je izbačen zbog koljena, ali je sad moguć **ako je potpuno suho**. Po mokrom granitu ne", "meta": ["⏱ 3–4 h", "☀️", "🟠"]}, {"title": "Yangdong", "text": ", ako je u nedjelju otpao zbog jake kiše. Taksi s Bulgukse ~40 min", "meta": ["⏱ 3 h", "🌦️", "🟢 po suhom"]}, {"title": "Seochulji (서출지)", "text": ": jezerce s lotosima i paviljonom iz 17. st., blizu Namsana", "meta": ["⏱ 45 min", "🌦️", "🟢"]}], "altNotes": ["🆕 **AR escape igre na otvorenom**: **„물오름달 열닷새”** u centru (Dongmun-ro 38, ~35 000 ₩ po osobi, 1,5 h, misije po gradu uz AR) ili **„Sakriveni sat” (사라진 시계)** u hotelu Kolon kod Bulgukse (Bulguk-ro 289-17, ~40 000 ₩ za 1–4 osobe, 1,5 h, predvorje, vrt i izložbena dvorana, aplikacija 경주로 ON). ⚠️ **WIP:** vjerojatno samo na korejskom, provjeriti na Waugu · *⏱ 1,5 h · 🌦️ · 🟡*"], "after": ""}, {"timeLabel": "17:45", "key": "17:45", "title": "Bicikli natrag, odmor", "meta": [], "body": "", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Zadnja večera u Gyeongjuu", "meta": ["⏱ 1,5–2 h", "☔", "🟢"], "body": "⚠️ **Ponedjeljak:** noćna tržnica i dio obiteljskih lokala ne rade, pa **provjeriti da lokal radi ponedjeljkom**. Sigurniji su turistički dijelovi i lanci.\n\n- 💸 **Hanwoo BBQ**, svečana zadnja večer, ako nije bila u nedjelju. 🔎 경주 한우\n- 🔥 **BBQ buffet**, ako je nedjelja bila hit ili nije bila buffet.\n- **Galbijjim**, pirjana goveđa rebra.\n- 🟡 **Jeongsugaseong (정수가성)**, Hadong, 10:00–21:00, otvoreno ponedjeljkom: **galbijjim i riža u listu lotosa, bez gulbija** (sušena riba). 25–45 000 ₩. ⚠️ **WIP:** rezervacija i stol.\n- **Chimaek u Airbnbu** (dostava) i Gyodong Beopju, ako smo mrtvi.\n- 🔴 **Yosukgung 1779**: formalno, skupo, puno malih jela s ribom. Otpada.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Woljeonggyo noću ili Bar Boon", "meta": [], "body": "Most osvijetljen do 23:00. **Pakiramo kofere**, sutra check-out u 11:00 i Busan.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "❌ Šumska staza dolje — otpada", "md": "Nakon dva dana neprestane kiše kamene stepenice i korijenje su skliski. **Dolje taksijem** (Kakao T s parkirališta Seokgurama), **rezerva bus 12 u 13:05** (prethodni u 12:00 je prerano).", "top": false}, {"title": "🦵 Navečer — Igidae sutra", "md": "**Lucijino koljeno je dobro, pa je cijeli Igidae zadani plan** (4,7 km, 70+ stubišta). Utorak je po prognozi **vedar**, uz sjeverozapadni vjetar ~23 km/h. Plan B (sjeverni kraj) ostaje samo za kišu, jak vjetar ili kašnjenje poslije 13:45. Vjetar može zatvoriti Skywalk i otkazati jahtu, pa ujutro provjeriti.", "top": false}], "triggers": "- **Propušten alarm u 10:00 ili sve rasprodano:** 1.11. na blagajni oko 08:30, ili palača bez vrta i Changgyeonggung.\n- **Kiša ipak pada:** Seokguram busom gore i dolje. Popodne umjesto bicikala dvorana Hwangnyongsa (ako nije bila u nedjelju) ili Nacionalni muzej (ponedjeljkom otvoren).\n- **Iznajmljivač bicikala ne radi:** Namsan (Samneung) ili pješice i taksijem polje Hwangnyongsa, Bunhwangsa i pink muhly.\n- **Yangdong pomaknut s nedjelje:** ide umjesto bicikala.\n- **Dosta hramova:** Seokguram otpada, bicikli kreću ranije.\n- **Lokal za večeru zatvoren:** Neulbom ili lanci.", "heading": "Pon 26.10. — Bulguksa, Seokguram i biciklom po istočnoj strani 🌦️", "city": "gyeongju", "transfer": "", "flash": null, "rows": [{"time": "08:30", "key": "08:30", "text": "**Buđenje.**", "altHint": false, "slot": 0}, {"time": "09:00–09:30", "key": "09:00", "text": "**Doručak i kava u gradu:** bife-uličica tržnice Seongdong (od ~07:00, 10 min pješice) ili pekara / korejski tost (Paris Baguette, Isaac Toast). Kava za van. Kafići na Hwangnidan-gilu otvaraju tek oko 10–11.", "altHint": false, "slot": 1}, {"time": "09:30", "key": "09:30", "text": "**Taksi do Bulgukse**, ~20 min, 15–18 000 ₩. *Rezerva: bus 10 ili 11 preko puta Intercity terminala, 30–40 min.*", "altHint": false, "slot": 2}, {"time": "~09:50", "key": "09:50", "text": "**Bulguksa**, besplatno: javorova prilazna cesta, Dabotap i Seokgatap. Kamene stepenice su mokre. ⏰ **U 10:00 rezervacija Tajnog vrta za 1.11.**", "altHint": false, "slot": 3}, {"time": "10:00 KST", "key": "10:00", "text": "**REZERVACIJA TAJNOG VRTA (za nedjelju 1.11.)**", "altHint": false, "slot": 4, "d3only": true}, {"time": "~11:15", "key": "11:15", "text": "**Taksi gore do Seokgurama**, ~15 min, 10–12 000 ₩. *Rezerva: bus 12 u 11:40.*", "altHint": false, "slot": 5}, {"time": "11:30", "key": "11:30", "text": "**Seokguram**: 600 m ravne staze do špilje, Buda 10–15 min.", "altHint": false, "slot": null}, {"time": "~12:15", "key": "12:15", "text": "❌ **Šumska staza otpada** (mokar kamen i korijenje). Dolje **taksijem** (Kakao T s parkirališta). *Rezerva: bus 12 u 13:05.*", "altHint": false, "slot": null}, {"time": "12:30", "key": "12:30", "text": "**Ručak: 🅰️ ispod Bulgukse ili 🅱️ u gradu**", "altHint": false, "slot": 6, "d3only": true}, {"time": "~14:00", "key": "14:00", "text": "**🚲 Biciklom po istočnoj strani (premješteno s nedjelje)**", "altHint": false, "slot": 7, "d3only": true}, {"time": "17:45", "key": "17:45", "text": "Bicikli natrag, odmor.", "altHint": false, "slot": 8}, {"time": "19:00", "key": "19:00", "text": "**Zadnja večera:** 💸 hanwoo BBQ, BBQ buffet ili galbijjim (Jeongsugaseong). ⚠️ Potvrditi radi li ponedjeljkom.", "altHint": false, "slot": 9}, {"time": "21:00", "key": "21:00", "text": "Most Woljeonggyo noću ili Bar Boon. **Pakiranje.**", "altHint": false, "slot": 10}, {"time": "🦵", "key": "🦵", "text": "**Igidae sutra: cijela staza je zadana.** Plan B samo za kišu, vjetar ili kašnjenje. Utorak je vedar.", "altHint": false, "slot": null}], "plans": [], "leftPlans3": [], "decisions": ["d-pon-26-10-zadnja-vecer-u-gyeongjuu", "d-pon-26-10-u-10-00-tajni-vrt-za-1-11", "d-pon-26-10-navecer-igidae-sutra-cijela-staza-ili-plan-b"]}, {"date": "27.10", "d3heading": "UTO 27.10. — TRANSFER, SKYWALK, IGIDAE, GWANGALLI I JAHTA", "night": "Noćenje: Busan, BrownSuites Busan Station · Dan 9 od 14", "intro": "", "stay": "", "slots": [{"timeLabel": "11:45", "key": "11:45", "title": "Ručak: Hapcheon Gukbapjip", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**합천국밥집**, kod ulaza u Oryukdo i južnog kraja Igidaea. **Michelin Bib Gourmand.** Taksi s Busan Stationa 25–30 min, 12–16 000 ₩.\n\n**Dwaeji gukbap** je busanska juha od svinjskih kostiju preko riže, jelo izbjeglica iz Korejskog rata. Ovdje je **juha bistra**, lakša od mliječne. Servira se s tanjurom sirovog češnjaka, vlasca, ljute paste i škampove soli (saeujeot), svatko začinjava sam. **~13 000 ₩**, 09:30–20:00. ⚠️ Red 11:00–13:00, doći prije 12:00.\n⚠️ Jelo koje dijeli ljude: nekima je bljutavo ili im smeta miris. Tko ne voli, naručuje suyuk, kuhanu svinjetinu na tanjuru.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Oryukdo Skywalk", "meta": ["⏱ 30–45 min", "☀️ zatvara se po kiši i vjetru", "🦵 lagano"], "body": "**오륙도 스카이워크**, potkova od stakla na rubu litice, **37 m iznad mora**, s pogledom na otočiće Oryukdo (\"pet ili šest otoka\", ovisno o plimi). **Besplatno, 09:00–18:00**, **zatvara se po kiši, snijegu ili jakom vjetru**. Ravan pristup s gornjeg platoa, navlake za cipele na ulazu. Obalni Busan je vjetrovit, pratimo prognozu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Igidae: cijela staza (plan) ili Plan B / C", "meta": ["⏱ 1–3 h", "☀️", "🦵🦵🦵 cijela / 🦵 Plan B"], "body": "> ⚠️⚠️ **CIJELI IGIDAE JE NAJZAHTJEVNIJA STAZA NA PUTU POSLIJE ULSANBAWIJA.**\n> **4,7 km · 2,5–3 h · 70+ strmih drvenih stubišta** stalno gore-dolje uz liticu. Ukupni uspon nije velik, ali stepenice su točno ono što koljeno ne voli. **Na cijeloj dužini praktički nema izlaza na cestu** (⚠️ WIP: provjeriti na Naveru postoji li izlaz kod Eoulmadanga), a staza **nije osvijetljena**. Ovo je pet dana poslije Ulsanbawija i dan poslije Seokgurama.\n>\n> **Odluka je sinoć (26.10. navečer)**, prema koljenu, i još jednom ovdje kod Skywalka:\n> - **Koljeno OK → cijela staza** (plan). Polazak najkasnije u **13:45**, jer je zalazak u 17:35. Ako pada kiša ili su stepenice mokre, i tada Plan B.\n> - **Koljeno boli → Plan B: samo sjeverni kraj.**\n> - **Koljeno jako loše → Plan C: samo Skywalk**, pa ravno na Gwangalli na kavu.\n\n**Cijela staza (plan):** hodamo **od Skywalka prema sjeveru, do Dongsaengmala (동생말)**, tako da završavamo 10 min od Gwangallija. **Najstrmiji dio je odmah na početku, kod Oryukdoa**: ako nakon prvih 20–30 minuta koljeno ne valja, to je jedino mjesto gdje se još lako vraćamo do Skywalka i taksija. Usput: viseći mostovi, morske špilje, stijena Nongbawi, pogled na most Gwangan i neboderi Marine Cityja na kraju. Štapovi za Luciju, voda, nema dućana usput.\n\n**Plan B, sjeverni kraj:** sa Skywalka **taksi (~10 min) do Dongsaengmala**, pa **0,8–1,2 km drvene staze** prema Eoulmadangu: blagi nagib, mali viseći most, pogled na most Gwangan. Natrag istim putem, 1–1,5 h ukupno.", "alts": [{"title": "Haeundae Blueline Park (해운대 블루라인파크), staza:", "text": "stara pruga uz more pretvorena u **potpuno ravnu drvenu stazu**, bez stepenica. ⚠️ Sutra ionako idemo Sky Capsulom po istoj pruzi, pa samo ako Igidae otpadne zbog koljena", "meta": ["⏱ 1,5–2 h", "☀️", "🦵"]}, {"title": "Taejongdae", "text": ", litice i svjetionik na jugu Yeongdoa. Samo **vlakićem Danubi**, inače strmi asfalt", "meta": ["⏱ 2 h", "☀️", "🦵"]}, {"title": "Spa Land, Centum City", "text": ", kišni plan: 13 sauna na obučenom katu, ~17 000 ₩ radnim danom za 4 h", "meta": ["⏱ 3–4 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~16:30", "key": "16:30", "title": "Ravno na Gwangalli (bez hotela)", "meta": [], "body": "S kraja staze kod Dongsaengmala **taksi ~10 min** do Gwangallija. **Ne vraćamo se u hotel**: koferi su u ormarićima na Busan Stationu ili kod hosta, pa check-in radimo kasno navečer (kod na vratima, check-in od 16:00 bez gornje granice). Kava na plaži, odmor za noge.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:00", "key": "17:00", "title": "Gwangalli: zalazak i most", "meta": ["⏱ 1 h", "🌦️", "🦵 lagano"], "body": "**Plaža Gwangalli** je 1,4 km pijeska okrenutog prema **mostu Gwangan (Diamond Bridge)**, visećem mostu dugom 7,4 km koji se noću osvjetljava u bojama. Zalazak oko 17:35 je iza leđa, na zapadu, pa je ljepši trenutak **plavi sat i paljenje svjetala** oko 18:00. Bez karte i bez reda.\n\n⚠️ **Millak Waterside Park** (stepenice uz more, nekad poznato \"pivo na stepenicama\") od 1.7.2023. je **zona bez alkohola**, kazna 50 000 ₩. ⚠️ Drone show na Gwangalliju ide samo subotom.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:30", "key": "18:30", "title": "🛥️ Noćna vožnja jahtom ispod mosta Gwangan", "meta": ["⏱ 45 min + 15 min do pristaništa", "🌦️ ne ide po jakom vjetru", "🦵 lagano"], "body": "Jahta iz **Haeundae Suyeong Yachting Centera** (Suyeong-man, ~10 min taksijem od Gwangallija; ukrcaj kod **Mooring Gate 3**, ulazi se kroz Gate 4). Krug od **~45 min**: ispod osvijetljenog mosta Gwangan i uz plažu Gwangalli, **vatromet na brodu** i fotografija s mostom u pozadini. **~19 $ po osobi** (radnim danom navečer), termini 17:00–22:00. Rezervacija online (3ha.in), 1–2 dana ranije prema prognozi. ⚠️ **WIP:** potvrditi raspored za listopad i cijenu. Zahodi su u zgradi centra, ne na brodu. Topla jakna, na moru navečer puše.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:45", "key": "19:45", "title": "Večera i Galmegi Brewing", "meta": ["⏱ 2–3 h", "☔", "🦵 lagano"], "body": "Taksi natrag na Gwangalli (~10 min). Uz plažu je zid restorana i barova okrenutih mostu. Lokal za večeru nije odabran, biramo na Naveru s ocjenom 4,3+: **jogae-gui** (školjke pečene na roštilju na stolu, busanska klasika, sve kuhano) ili pizza u Galmegiju. ⚠️ Gwangalli je pun **hoe** restorana sa sirovom ribom, tražimo kuhano.\n\n**Galmegi Brewing (갈매기브루잉)**, Gwangnam-ro, **prva craft pivovara Busana**: IPA, stout, sezonska piva i **pizza iz krušne peći**.", "alts": [{"title": "Rooftop lounge s pogledom na most", "text": "(npr. u zgradi Hotel 1 na plaži), utorkom bez rezervacije", "meta": ["⏱ 1–2 h", "☔", "🦵"]}, {"title": "Kišni plan: uličice Nampa s pićem", "text": ", bliže hotelu (tri stanice metroom)", "meta": ["⏱ 2 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~22:30", "key": "22:30", "title": "Natrag u hotel", "meta": [], "body": "Taksi ~25 min do Busan Stationa, koferi iz ormarića (Zimcarry radi do 22:00, ormarići 24 h), check-in. ⚠️ Ako su koferi kod Zimcarryja, netko ih mora pokupiti **do 22:00**, pa je jednostavnije koristiti ormariće.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "Transfer Gyeongju → Busan, KTX", "md": "**Taksi do stanice Gyeongju (~20 min, 15–17 000 ₩ po autu, ili GJS kombi), KTX ~30 min do Busan Stationa, pa 5 min pješice do hotela.** KTX vozi svakih 20–40 min, **11 000–21 000 ₩**. Vlak oko 10:00 rezerviramo par dana ranije na Korailu.\n\nZašto ne bus: busevi iz Gyeongjua stižu na **Nopo** (sjeverni rub Busana, 45–50 min metroom s koferima) ili u Haeundae, ne u centar. KTX-om je od vrata do vrata ~1 h 15 min, busom 2–2,5 h.\n\n⚠️ **Prtljaga:** check-in je u 16:00, kod na vratima. 📧 **Pitati hosta** mogu li se koferi ostaviti ranije. Ako ne, **ormarići na Busan Stationu** (šest grupa, ima velikih) ili **Zimcarry pult, 09:00–22:00**.", "top": false}], "triggers": "- **Kiša ili vjetar:** Skywalk zatvoren, Igidae otpada, jahta vjerojatno ne vozi. Spa Land, navečer Gwangalli ili Nampo.\n- **Koljeno (odluka sinoć):** Plan B (sjeverni kraj) ili Plan C (samo Skywalk). Nikad cijela staza ako je kiša ili kasnimo poslije 13:45.\n- **Na prvoj strmini koljeno ne valja:** natrag do Skywalka, taksi do Dongsaengmala, Plan B.\n- **Host ne prima kofere ranije:** ormarići na Busan Stationu (24 h).\n- **Jahta otkazana:** dulje na plaži, rooftop s pogledom na most.\n- **Umor:** Gwangalli samo zalazak i Galmegi, rano natrag.", "heading": "Uto 27.10. — Skywalk, Igidae, Gwangalli i noćna jahta", "city": "busan", "transfer": "**🚄 Uto 27.10. · Gyeongju → Busan · KTX ~30 min · 11 000–21 000 ₩**\nTaksi do stanice Gyeongju traje ~20 min, a KTX vozi do **Busan Stationa, odakle je hotel 5 min pješice**. Bus iz Gyeongjua stiže na rub Busana (Nopo), pa je ukupno sporiji.", "flash": {"label": "Utorak, 27. 10. · Gyeongju → Busan — litice, plaža, most i jahta", "text": "Ujutro putujemo KTX-om prema **Busanu**, vožnja traje oko pola sata. Kofere ostavljamo u ormarićima na kolodvoru i odmah krećemo. Za prvi obrok biramo **dwaeji gukbap**, tradicionalnu juhu od svinjetine i riže, jedno od zaštitnih jela Busana, u lokalu preporučenom u Michelinovu vodiču. Potom odlazimo na **Oryukdo Skywalk**, staklenu platformu 37 metara iznad mora, a odande hodamo **cijelom obalnom stazom Igidae**: 4,7 kilometara uz litice, viseće mostove i morske špilje, s puno strmih stepenica. Lucijino koljeno je na Ulsanbawiju bilo odlično, pa je cijela staza zadana; kratki sjeverni dio ostaje samo za kišu, jak vjetar ili kašnjenje. Sa kraja staze idemo ravno na **Gwangalli Beach**, gdje promatramo zalazak sunca i paljenje svjetala na mostu Gwangan. Zatim nas čeka **noćna vožnja jahtom** ispod osvijetljenog mosta, uz mali vatromet na brodu. Dan završavamo večerom uz plažu i pivom u **Galmegi Brewingu**, poznatoj lokalnoj craft pivovari."}, "rows": [{"time": "09:15", "key": "09:15", "text": "Check-out, dva taksija do stanice Gyeongju, ~20 min.", "altHint": false, "slot": null}, {"time": "~10:00", "key": "10:00", "text": "**KTX do Busan Stationa**, ~30 min. Kofere u ormariće na stanici (24 h) ili kod hosta, check-in tek navečer.", "altHint": false, "slot": null}, {"time": "11:45", "key": "11:45", "text": "Jedan taksi do Oryukdoa, pa ručak u **Hapcheon Gukbapjipu:** dwaeji gukbap, Michelin Bib Gourmand, ~13 000 ₩.", "altHint": false, "slot": 0}, {"time": "13:00", "key": "13:00", "text": "**Oryukdo Skywalk**, stakleni pod 37 m nad morem, besplatno. Zatvara se po kiši i vjetru.", "altHint": false, "slot": 1}, {"time": "13:30", "key": "13:30", "text": "⚠️ **Cijeli Igidae** (4,7 km, 2,5–3 h, 70+ strmih stubišta, bez izlaza) od Skywalka prema sjeveru do Dongsaengmala. **Plan B** (odluka sinoć, prema koljenu): taksi do Dongsaengmala i samo ~1 km sjevernog kraja. **Plan C:** samo Skywalk.", "altHint": false, "slot": 2}, {"time": "~16:30", "key": "16:30", "text": "Taksi ~10 min ravno na **Gwangalli**, bez povratka u hotel. Kava na plaži.", "altHint": false, "slot": 3}, {"time": "17:00", "key": "17:00", "text": "**Gwangalli:** zalazak oko 17:35, pale se svjetla na mostu.", "altHint": false, "slot": 4}, {"time": "18:30", "key": "18:30", "text": "🛥️ **Noćna jahta** iz Suyeong Yachting Centera: 45 min ispod osvijetljenog mosta Gwangan, vatromet na brodu, ~19 $.", "altHint": false, "slot": 5}, {"time": "19:45", "key": "19:45", "text": "Večera uz plažu (kuhano: školjke na roštilju), pa **Galmegi Brewing**.", "altHint": false, "slot": 6}, {"time": "~22:30", "key": "22:30", "text": "Taksi u hotel, koferi iz ormarića, check-in.", "altHint": false, "slot": 7}], "plans": [{"label": "Plan B · Eonyang", "replaces": ["10:00"], "summary": "", "detail": {"title": "Plan B (malo vjerojatan) — tržnica Eonyang i bulgogi", "meta": [], "md": "**27. je dan tržnice u Eonyangu**, seoske tržnice koja radi svakih pet dana (datumi koji završavaju na 2 i 7). Eonyang je **usput**: KTX iz Gyeongjua staje na **stanici Ulsan KTX (~10 min)**, koja je u Eonyangu. Tržnica i restoran su ~10 min taksijem, pa dalje vlakom 20–30 min do Busana.\n- **Gongwon Bulgogi (공원불고기)**, od 1984.: **Eonyang bulgogi**, tanke kriške lokalne govedine pečene na žičanom roštilju nad ugljenom. ~21 000 ₩ za 180 g, 10:00–21:00. Tražiti **stol, ne pod**. ⚠️ Na meniju je i yukhoe (sirova govedina), ne naručujemo. Giwajip preskačemo zbog sjedenja na podu.\n- ⚠️ **Nije riješena prtljaga:** ormarići na stanici Ulsan KTX su mali, četiri velika kofera vjerojatno ne stanu. Plan bi bio dva taksija s koferima do Gongwona, koferi ostaju u restoranu, tržnica u dvije smjene po dvoje ili bez tržnice, pa taksiji natrag na stanicu. Dolazak u Busan oko 13:30, Igidae se skraćuje.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-uto-27-10-transfer-u-busan", "d-uto-27-10-nocna-jahta-gwangalli"]}, {"date": "28.10", "d3heading": "SRI 28.10. — OBALA, VLAKIĆI, HRAM NA MORU, GAMCHEON I NOĆNI BUSAN", "night": "Noćenje: Busan, BrownSuites Busan Station · Dan 10 od 14", "intro": "**Logika dana:** jutro na **istočnoj obali** (hram na moru prvi, dok je mirno, pa 🅰️ Sky Capsule ako dobijemo karte · 🅱️ plaža Songjeong · 🅲 šuma Ahopsan, i ručak u Gijangu), popodne **Gamcheon lite** i zalazak nad lukom blizu hotela, navečer **Hwangnyeongsan**. Tržnice i riba za doručak su namjerno izbačeni (želja ekipe). ⚠️ Puno taksija: istok i zapad grada su na suprotnim krajevima. **Prvo se reže: Hwangnyeongsan.** Sutra je rani KTX, kofere pakiramo večeras.\n\n⚠️ **Srijeda:** most Yeongdo diže se **samo subotom**, pa ne danas.", "stay": "", "slots": [{"timeLabel": "08:30", "key": "08:30", "title": "Doručak u kafiću ili pekari", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "Normalan doručak blizu hotela (kafić ili pekara oko Busan Stationa / Choryanga), bez ribe. ⚠️ **WIP:** odabrati na Naver mapi (브런치 / 베이커리 부산역). Rezerva: kava i pecivo na stanici. **Ako ide 🅰️ Sky Capsule, doručak je u 07:45** (vidi dolje).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00", "key": "09:00", "title": "Taksi do Haedong Yonggungse", "meta": ["⏱ 40–45 min", "~30–40 000 ₩"], "body": "**Jedan taksi** s Busan Stationa do hrama (Gijang-eup, Sirang-ri). Hram ide **prvi**, prije ~11:00, kad su uske stepenice još prazne.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:45", "key": "09:45", "title": "Haedong Yonggungsa (해동용궁사)", "meta": ["⏱ 1–1,5 h", "🌦️", "🦵🦵 kamene stepenice dolje i natrag gore"], "body": "**Besplatno, otvoreno 05:00–21:00.** Jedan od rijetkih korejskih hramova **na stijenama uz samo more**: dvorane, pagoda i zlatni Buda iznad valova, kip boga mora. Od ulaza se ide uličicom sa zodijakalnim kipovima i niz **108 stepenica** do hrama. ⚠️ Oko podneva **gužva na uskim stepenicama**, zato dolazimo rano. Lucija sa štapovima, polako.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:15", "key": "11:15", "title": "❓ Tri ravnopravne opcije (odluka na licu mjesta ili ranije)", "meta": [], "body": "*Ispravljeno 16.10.: Sky Capsule je online rasprodan. Zato su ovdje tri ravnopravne opcije, a Beach Train sam po sebi (bez kapsule) više nije u planu — po recenzijama je \"rezervna opcija\", pogled zaklanja raslinje i hodači, a obalne poglede ćemo već imati na Igidaeu, Skywalku i jahti.*\n\n**🅰️ 🚡 Sky Capsule (ako dobijemo karte)**\n*⏱ ~30 min vožnje + presjedanja · ☀️ (jak vjetar zaustavlja kapsule) · 🦵 lagano*\n\n**Sky Capsule (스카이캡슐)**: mala retro kabina za do 4 osobe na **povišenoj tračnici 7–10 m iznad stare obalne pruge**, tik uz more, **Mipo ↔ Cheongsapo, ~30 min**, vozi polako (~4 km/h). Po recenzijama \"neki od najljepših obalnih pogleda u Koreji\". Kabina za 4: ~50 000 ₩ (~8 € po osobi). ([A Love Letter to Asia](https://alovelettertoasia.com/haeundae-blue-line-park-sky-capsule-vs-beach-train/), [Travel-Stained](https://travel-stained.com/haeundae-sky-capsule-busan/))\n- ⏰ **Do ~27.10. svaki dan provjeravati otkazivanja**: službena stranica Blueline Parka, **Klook, KKday, Trip.com**. Provjeriti i **obrnuti smjer (Cheongsapo → Mipo)**, koji se lakše dobije, i **sve termine** (prvi ~09:00, popodnevni).\n- **Na dan:** blagajne u Mipou i Cheongsapou prodaju **preostala mjesta za isti dan**, ali vrlo malo. Doći na otvaranje (~08:30–09:00); srijeda je bolja od vikenda.\n- **Ako dobijemo karte, jutro ide ovim redom:** 07:45 doručak → 08:20 taksi do Mipoa (~35 min) → **~09:00 kapsula** Mipo → Cheongsapo → po želji **Daritdol Skywalk** u Cheongsapou (staklena platforma nad morem, besplatno, 10 min) → taksi ~10 min do **Haedong Yonggungse ~10:15** (još prije gužve) → kratko Songjeong → ručak u Gijangu ~12:30.\n\n**🅱️ 🏖️ Plaža Songjeong i kafić uz more**\n*⏱ 1 h · 🌦️ · 🦵 lagano*\n\nTaksi ~10 min od hrama. **Songjeong (송정해수욕장)**: mirna plaža surfera, kava s pogledom na more, šetnja po pijesku. Besplatno i bez napora; najopuštenija opcija, ali najmanje upečatljiva.\n\n**🅲 🎋 Šuma Ahopsan (아홉산숲)**\n*⏱ 1–1,5 h · 🌦️ · 🦵 lagano (ravno)*\n\nTaksi ~15–20 min od hrama. **Obiteljska šuma koju ista obitelj čuva netaknutom ~400 godina**: **golemi bambusovi gajevi** (snimalište filma \"The King\") i stari korejski crveni borovi, 116 zaštićenih stabala. **8 000 ₩ (~5 €), 09:00–18:00 (ožujak–studeni), zadnji ulaz 17:00, otvoreno svaki dan.** **Ravne staze**, ~1–2 h za cijeli krug. ⚠️ **Štapovi za hodanje nisu dopušteni** (staze su ravne, pa bi Lucija trebala biti OK). Promjena od mora: zeleno i tiho nakon tri obalna dana. ([Telltrip, 2026.](https://www.telltrip.com/domestic-travel/busan-ahopsan-forest-bamboo-trail/))\n\n*Odbačeno, za evidenciju:* crkva Jukseong \"Dream\" (filmska kulisa na stijenama, besplatno, 10–15 min od hrama) i kafić Wave On (arhitektonski kafić nad morem, ~30 min sjevernije) — dobre rezerve ako ostane vremena.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:30", "key": "12:30", "title": "Ručak u Gijangu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Gijang** je ribarsko mjestašce uz hram. Kuhano, bez sirove ribe.\n- **Po želji: gomjangeo pečen na slami (짚불곰장어)** — jegulji slična riba (hagfish) pečena cijela na vatri od rižine slame, pougljenjena koža se guli za stolom, jede se sa soli i sezamovim uljem. Lokalni specijalitet, potpuno pečeno; tekstura je žilava i \"avanturistička\", nije za svakoga. Npr. Wonjo Jipbul Gomjangeo (Sirang-ri), srijedom 10:30–21:00 (**UV**).\n- **Ili obična kuhinja:** kalguksu, sundubu, dwaeji gukbap. ⚠️ **WIP:** odabrati na Naver mapi oko Gijanga ili Songjeonga, ocjena 4,3+.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Taksi natrag prema hotelu", "meta": ["⏱ 40–50 min", "30–40 000 ₩"], "body": "Kratko u hotel (Busan Station) ~14:55–15:10: zahod, voda, jakna za večer.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "🎨 Gamcheon Culture Village „lite“ (plan)", "meta": ["⏱ 1 h 15 min", "🌦️", "🦵 glavna ulica / 🦵🦵🦵 sporedne uličice"], "body": "**Taksi od hotela ~20 min ravno do GORNJEG ulaza** (감천문화마을 정류장 / info centar). Ne idemo metroom ni busom: metroa nema blizu, a bus je krcat i zbunjujući. **Ulaz besplatan.**\n\nSelo iz Korejskog rata na terasama brda, **kućice u pastelnim bojama**, murali, mali muzeji i galerije, pogled preko krovova prema luci. Najpoznatija fotka Busana.\n- **Ruta: samo glavna gornja ulica** (relativno ravna) i **jedan vidikovac**. Sporedne uličice su jako strme, po kiši sklizave.\n- **Kip Malog princa preskačemo** zbog reda za fotku.\n- **Gužva** je najveća na ulazu, gdje su i kič-suvenirnice. Dublje u selu je mirnije.\n- Kafići i hrana su turistički i skuplji, ne jedemo ovdje.\n\n**🅱️ Fallback 1: Gamcheon do kraja** (ako smo svježi i koljeno je OK): 15:30–~18:00, 2–3 h. Glavna ulica, sporedne uličice s muralima, muzeji i galerije, vidikovci, zalazak iz sela. Stamp tour s kartom skrivenih točaka ~2 000 ₩, opcionalno. ⚠️ Puno strmih stepenica dan nakon Igidaea. Tada otpada vidikovac nad lukom, večera ide na ~19:30, a Hwangnyeongsan postaje upitan.\n\n**🅱️ Fallback 2: Huinnyeoul Culture Village (흰여울문화마을)** (ako boli koljeno ili pada kiša): **Otok Yeongdo**, taksi ~20 min. Selo iz ratnog doba na litici iznad **sidrišta brodova**: uske kućice bijele i plave, kafići s pogledom na desetke usidrenih teretnjaka. **Samo gornja staza uz rub litice, ravna**; strmim stepeništima („Piano“, „Rainbow“) dolje ne idemo. Mirnije od Gamcheona i s pravim pogledom na more.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:50", "key": "16:50", "title": "Vidikovac nad lukom: 168 stepenica, zalazak", "meta": ["⏱ 45 min", "🌦️", "🦵 dizalo"], "body": "Taksi ~20 min iz Gamcheona. **초량 168계단**, Choryang, **~10 min pješice od hotela.** Strmo stubište iz doba izbjeglica, kojim su ljudi nosili vodu s lučkog bunara. **Besplatno koso dizalo \"168계단 하늘길\"** (12 osoba, nagib ~40°) vozi gore, a u sredini je **vidikovac Kim Min-bu** s panoramom luke Busan. **Zalazak ~17:35**: lučke dizalice i most Busan u sumrak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:15", "key": "18:15", "title": "Hotel, kratki predah", "meta": [], "body": "", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Večera", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "**A) Dongnae Halmae Pajeon (동래할매파전)** (plan)\n- Taksi ~25 min ili metro L1 ~30 min do Dongnaea. Stara kuća koja radi **Dongnae pajeon**: palačinka s mladim lukom, ali **debela, mekana, gotovo kremasta**, s dagnjama, kamenicama, lignjama i govedinom, peče se pod poklopcem i **nije hrskava**. Lokalna verzija koja ne postoji drugdje. Uz makgeolli.\n- **11:30–21:30, pauza 15:00–17:00, ponedjeljkom zatvoreno.** **Doći do ~19:30.**\n\n**B) ⚠️ 🔥 Dwaeji galbi (marinirana svinjska rebra na roštilju)**, ako ekipa radije hoće roštilj. Lokal nije odabran: Naver, 돼지갈비, blizu hotela ili Seomyeona, ocjena 4,3+.\n\n**C) Naengchae jokbal**, Bupyeong, Nampo (hladne kuhane svinjske nogice s meduzom i senf-umakom, 35–60 000 ₩ po tanjuru), ako hoćemo nešto čudno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "20:30", "key": "20:30", "title": "🌃 Hwangnyeongsan, noćni pogled na cijeli Busan", "meta": ["⏱ 1 h s putom", "☀️ treba vidljivost", "🦵 10 min uzbrdo"], "body": "**황령산 봉수대**, brdo usred grada. **Taksi** (~20 min iz Dongnaea ili s Busan Stationa) do parkirališta vidikovca, pa **~10 min pješice uzbrdo** zemljanom stazom (tenisice). **Besplatno.** Sa signalnog humka (Bongsu-dae) na jednu stranu se vidi **Gwangalli i most Gwangan odozgo**, na drugu Seomyeon i luka. Jedina prava noćna panorama Busana. Taksisti često čekaju dolje; ako ne, Kakao T.\n\n⚠️ **Prvi rez dana**: ako smo umorni ili je magla, preskačemo i idemo spavati.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~21:45", "key": "21:45", "title": "Hotel, pakiranje", "meta": [], "body": "**Sutra je KTX ujutro**, kofere pakiramo večeras.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša:** Sky Capsule po kiši vozi, ali bez pogleda; Haedong podnosi kišu; šuma Ahopsan i Songjeong su po kiši slabiji, pa kafić ili ranije natrag. Gamcheon po kiši je sklizak, pa Fallback 2 (Huinnyeoul samo gornja staza) ili **Spa Land / Nacionalni pomorski muzej**. Hwangnyeongsan otpada.\n- **Jak vjetar:** Sky Capsule ne vozi, pa 🅱️ Songjeong ili 🅲 Ahopsan.\n- **Koljeno nakon Igidaea:** Haedong polako ili samo pogled s vrha; umjesto Gamcheona Huinnyeoul (gornja staza).\n- **Igidae jučer propao zbog vjetra:** danas popodne Igidae (Plan B) umjesto Gamcheona.\n- **Pajeon zatvoren ili predaleko:** opcija B ili C.\n- **Umor:** bez Hwangnyeongsana, rano u krevet.", "heading": "Sri 28.10. — Hram na moru, Blueline Park ili šuma, Gamcheon i noćni Busan", "city": "busan", "transfer": "", "flash": {"label": "Srijeda, 28. 10. · Busan — Blueline Park, hram na stijenama i šareno selo", "text": "Nakon normalnog doručka u kafiću odlazimo na istočnu obalu, na Haeundae. Ondje je **Blueline Park**, stara obalna pruga tik uz more, a odmah do njega **Haedong Yonggungsa**, jednog od rijetkih korejskih hramova smještenih na stijenama uz samo more. Nakon ručka vraćamo se prema centru i odlazimo u **Gamcheon Culture Village**, selo iz doba rata s pastelnim kućicama na terasama brda: prolazimo samo glavnu, ravniju gornju ulicu i jedan vidikovac. Zalazak gledamo s vidikovca nad lukom na vrhu **168 stepenica**, do kojeg vozi besplatno koso dizalo. Za večeru biramo **Dongnae pajeon**, debelu, mekanu palačinku s mladim lukom i plodovima mora, a dan završavamo noćnim pogledom na cijeli Busan i most Gwangan s brda **Hwangnyeongsan**."}, "rows": [{"time": "08:30", "key": "08:30", "text": "Doručak u kafiću ili pekari blizu hotela, bez ribe. *(Ako ide 🅰️ Sky Capsule: doručak u 07:45.)*", "altHint": false, "slot": 0}, {"time": "09:00", "key": "09:00", "text": "Jedan taksi (~40–45 min) do **Haedong Yonggungse**. *(🅰️: taksi u 08:20 do Mipoa, kapsula prvo, hram poslije.)*", "altHint": false, "slot": 1}, {"time": "09:45", "key": "09:45", "text": "**Haedong Yonggungsa** dok je još mirno: hram na stijenama uz more, besplatno, 108 stepenica.", "altHint": false, "slot": 2}, {"time": "11:15", "key": "11:15", "text": "❓ **Tri ravnopravne opcije:** 🅰️ 🚡 **Sky Capsule** (ako dobijemo karte; tada ide prva, ~09:00) · 🅱️ 🏖️ **plaža Songjeong i kafić uz more** · 🅲 🎋 **šuma Ahopsan** (bambus i stari borovi, ravno, ~5 €).", "altHint": false, "slot": 3}, {"time": "12:30", "key": "12:30", "text": "Ručak u **Gijangu** (ribarsko mjestašce uz hram): po želji **jegulja pečena na slami** (gomjangeo), ili obična kuhinja.", "altHint": false, "slot": 4}, {"time": "14:15", "key": "14:15", "text": "Taksi natrag (~45 min), kratko u hotel.", "altHint": false, "slot": 5}, {"time": "15:30", "key": "15:30", "text": "🎨 **Gamcheon lite**: taksi ~20 min do gornjeg ulaza, samo glavna ulica i jedan vidikovac, bez Malog princa. 🅱️ Fallback 1: Gamcheon do kraja (do ~18:00). 🅱️ Fallback 2: Huinnyeoul (koljeno, kiša).", "altHint": false, "slot": 6}, {"time": "16:50", "key": "16:50", "text": "Taksi ~20 min do **168 stepenica**: koso dizalo do vidikovca nad lukom, zalazak ~17:35. 10 min od hotela.", "altHint": false, "slot": 7}, {"time": "18:15", "key": "18:15", "text": "**Hotel, kratki predah**", "altHint": false, "slot": 8, "d3only": true}, {"time": "19:00", "key": "19:00", "text": "Večera: **Dongnae pajeon** (debela palačinka s plodovima mora, doći do 19:30). ⚠️ Ili dwaeji galbi BBQ, ili naengchae jokbal.", "altHint": false, "slot": 9}, {"time": "20:30", "key": "20:30", "text": "🌃 **Hwangnyeongsan**: noćni pogled na cijeli Busan i most Gwangan, taksi + 10 min uzbrdo. Prvi rez ako smo umorni.", "altHint": false, "slot": 10}, {"time": "~21:45", "key": "21:45", "text": "Hotel, pakiranje. Sutra ujutro KTX.", "altHint": false, "slot": 11}], "plans": [], "leftPlans3": [], "decisions": ["d-sri-28-10-jutro-na-istoku"]}, {"date": "29.10", "d3heading": "ČET 29.10. — SUNGSIMDANG, CAFE POKPO, PALAČA, SEOCHON, ESCAPE ROOM", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 11 od 14", "intro": "", "stay": "", "slots": [{"timeLabel": "07:30", "key": "07:30", "title": "Kava na Busan Stationu", "meta": ["⏱ 15 min", "☔", "🦵 lagano"], "body": "Samo kava i nešto sitno za vlak. **Pravi doručak je Sungsimdang u Daejeonu** (~09:40). Riblji kolači Samjin Eomuk su izbačeni (bez ribe za doručak).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~08:00", "key": "08:00", "title": "KTX Busan → Daejeon (opcionalna stanka)", "meta": ["⏱ ~1h40 vožnje, 40 min stanke, pa ~1 h"], "body": "⚠️ **Opcionalno.** Ako smo umorni, nismo gladni ili kasnimo, **direktni KTX Busan → Seoul** (~2h30) i stanka otpada bez žaljenja.\n\n**Sungsimdang (성심당), stanica Daejeon, 2. kat** (između izlaza 4 i 5), otprilike 07:00–22:30. Vjerojatno najpoznatija pekara u Koreji, u Daejeonu od 1956., **bez podružnice u Seoulu**, pa su redovi legendarni. Što uzeti:\n- **twigim soboro (튀김소보로):** pržena lepinja s hrskavom mrvicom i crvenim grahom, ~1 700 ₩, **ima zaseban brzi red**;\n- **buchu (부추빵):** lepinja s porilukom, i sezonski kolači ako ima reda.\n\n**Prtljaga:** ormarići u Daejeonu uglavnom su puni torbi s kruhom, pa **dvoje stoji u redu, dvoje čuva kofere** (radnim danom 10–15 min). **Dvije KTX karte** (Busan → Daejeon, Daejeon → Seoul), **najmanje 50 min između vlakova**. Ukupno otprilike ista cijena kao direktno, dolazak u Seoul samo ~10 min kasnije.\n\nKTX savjeti: rezervirati **zadnji red vagona** (iza sjedala ima mjesta za kofere); veliki koferi idu na police između vagona, tko prvi uđe.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~11:40", "key": "11:40", "title": "Seoul Station → Yeonnam-dong", "meta": [], "body": "**AREX all-stop** (일반열차) od Seoul Stationa do **Hongik Univ., ~15 min**, pa ~550 m pješice s koferima (izlaz 3). Ili **dva taksija, 20–25 min**, s četiri kofera lakše. Kofere ostavljamo kod hosta ako dopusti (📧 pitati), inače ormarići na Hongik Univ. ili Seoul Stationu. Ručak je Sungsimdang plus kafić Pokpo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:45", "key": "12:45", "title": "☕ Cafe Pokpo (카페 폭포)", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**서울 서대문구 연희로 262-24**, Hongje-dong, uz potok **Hongjecheon**. Od stana **~10–15 min jednim taksijem**, a usput je prema Gyeongbokgungu. Kafić s terasom ravno ispred **umjetnog slapa Hongje** (~25 m) na stijeni usred grada, uz šetnicu i potok, jedini takav u Seoulu. Kava, deserti i nešto za pojesti. **Svaki dan ~09/10–21.** ⚠️ **Slap ne teče cijeli dan**, nego u terminima: provjeriti na Instagramu @cafe.pokpo prije polaska. Ako tada ne teče, kafić je i dalje lijep, ali bez glavne atrakcije.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "14:00", "key": "14:00", "title": "Gyeongbokgung", "meta": ["⏱ ~1 h", "🌦️", "🦵 ravno kamenje"], "body": "**3 000 ₩ · 09:00–18:00 (zadnji ulaz 17:00) · utorkom zatvoreno.** Iz Hongje-donga **taksi ~15 min** do vrata Gwanghwamun.\n\nGlavna palača dinastije Joseon. **Smjena straže u 14:00** ispred Gwanghwamuna (besplatno, 20 min, izvan blagajne): ako stignemo točno, gledamo je na ulazu, inače preskačemo. Unutra **Geunjeongjeon** (prijestolna dvorana) i **Gyeonghoeru** (paviljon za gozbe na kamenim stupovima nad jezerom). **Ograničavamo se na ~1 h**, Tajni vrt 1.11. je ljepši i intimniji. ⚠️ **Folklorni muzej preskačemo**, 800 m na drugom kraju.\n\n**Izlaz na zapadna vrata Yeongchumun**, ravno u Seochon.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:15", "key": "15:15", "title": "Seochon, skraćeno", "meta": ["⏱ ~45 min", "🌦️", "🦵 blago uzbrdo"], "body": "Niske uličice zapadno od palače: stari Seoul s hanok kućama i kućama iz 1930-ih, nezavisni kafići i galerije. **Kratka ruta:**\n1. **Knjižara Daeoh (대오서점)**, najstarija knjižara u Seoulu (1951.), danas mala čajana u hanoku s dvorištem.\n2. Jedna uličica Ogin-donga ili Nuha-donga.\n3. *Opcija:* **gireum tteokbokki** na Tonginu (rižini kolačići prženi na ulju), ako smo gladni.\n⚠️ **Dolina Suseong-dong** početak je nedjeljne šetnje, danas ne.", "alts": [{"title": "Jogyesa i krizanteme", "text": ", ako se nije stiglo 20.10. (festival traje do sredine studenog), 10 min taksijem", "meta": ["⏱ 30 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "16:15", "key": "16:15", "title": "Natrag, check-in, odmor", "meta": [], "body": "**Jedan taksi** ~25 min. Check-in od 16:00, koferi unutra, odmor do večere.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Yukmong (육몽)", "meta": ["⏱ 1,5 h", "☔", "🦵 lagano"], "body": "**마포구 양화로16길 19**, 1. kat, između Hongdaea i Hapjeonga, ~10 min pješice. Korejski BBQ od svinjetine (samgyeopsal, moksal, hangjeongsal), **osoblje peče**, barem prvo pečenje. **Mješoviti set 550 g 69 900 ₩**, pojedinačni komadi 150 g 18 000 ₩. **Rezervacija preko Navera ili CatchTablea** (tel. 02-338-1142), četvrtkom bez rezervacije čekanje 20–40 min. Uz soju ili pivo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "🔒 ESCAPE ROOM: Deepthinker \"Ongyi's Dream\"", "meta": ["⏱ 65 min plus 15 min uputa", "☔", "🦵 lagano"], "body": "**딥띵커, 옹이의 꿈**, 4. kat, **23 Jandari-ro, Mapo** (između Hongdaea i Hapjeonga), **10–15 min pješice** od Yukmonga i od kuće. **Sve na engleskom** (tekstovi, audio, hintovi, **engleski najaviti 24 h ranije**), 2–5 igrača, **23–26 000 ₩ po osobi**, 10:00–23:30. Lagana pustolovna priča, **bez horora i jump scareova**, tridesetak zagonetki, srednja težina.\n\n#### ⚠️ Pravila rezervacije\n- **Termini se otvaraju samo 5 dana unaprijed, u ponoć po korejskom vremenu** (✅ potvrđeno 14.10.). Za 29.10. to je **ponoć s petka 23.10. na subotu 24.10.**, u Sokchu: **alarm u 23:59** (vidi Dan 5). Ako ne uspije, prva stavka 24.10. ujutro. Stranica: deepthinker.co.kr/en.\n- **Termin:** 20:00, ili ~19:30 ako želimo sigurno stići na pub crawl (tada Yukmong u 17:30).\n- **Engleski najaviti najmanje 24 h ranije.**\n- **Potvrditi SMS ili mail, inače otkazuju.**\n- **Kazna 26 000 ₩ za otkaz manje od 2 h prije.** Doći 10–15 min ranije.\n- Provjeriti ima li lift do 4. kata (Lucija).\n\n#### Ostali kandidati\n| Soba | Tvrtka | Ocjena |\n|---|---|---|\n| **Gumiho / Arbeit** | Real Escape Challenge, 와우산로27길 21, 4. kat | 🟡 rezerva: dvojezično, ali stari rekviziti; Arbeit je 5/5 strah |\n| **Bæd Time** | Oasis Museum | ❌ skučeno za četvero, živi glumac, korejski audio |\n| **Lost City of Amazon** | Seoul Escape Room Hongdae 2 | ❌ renoviranje i otkazivanja 2025., nepouzdano |", "alts": [{"title": "Absolute Seoul Pub Crawl", "text": ", **četvrtkom u Hongdaeu:** sastanak u Dokkaebi Party Houseu 20:00–21:30, četiri bara ili kluba do ~00:10, ~21 USD, treba osobna isprava. Može i **poslije** escape rooma", "meta": ["⏱ 3–4 h", "☔", "🦵"]}, {"title": "RetroGameBar:", "text": "konzole, beer pong, igre su besplatne, plaća se piće. Četvrtkom od 19:00", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Coin noraebang i Hongdae:", "text": "karaoke kabine, ~1 000 ₩ za 2–3 pjesme", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:30", "key": "21:30", "title": "Hongdae noću, pa noraebang", "meta": [], "body": "Pub crawl (pridružiti se do 21:30; ako escape room završi kasnije, možda ne stignemo), **pa coin noraebang** na putu kući, ili barovi oko Hongdaea, **5–10 min do kreveta**.\n- 🏏 **Plan (prebačeno s rođendana):** **Hongdae batting cage (홍대 야구타운)**, Seogyo-dong 360-15, iznad parkirališta u uličici, 2 000 ₩ za 20 loptica, automat. 10 min od stana. ❌ LG Twins na Jamsilu: utakmica postoji samo ako LG prođe, a sudara se s escape roomom.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Umorni smo ili nismo gladni:** direktni KTX, Daejeon otpada.\n- **KTX kasni:** palača otpada (zadnji ulaz 17:00), samo Seochon ili odmor. Escape room ostaje.\n- **Escape room nije rezerviran (ponoć 23./24.10. i jutro 24.10. propali):** Real Escape Challenge (Gumiho) ili pub crawl.\n- **Slap u Pokpou ne teče:** kava kratko, ranije u palaču (tada stignemo i smjenu straže u 14:00).\n- **Kiša:** palača podnosi kišu. Seochon kraće, kafić u knjižari Daeoh.\n- **Yukmong pun:** bilo koji samgyeopsal s redom domaćih oko Hongdaea.", "heading": "Čet 29.10. — Kultna pekara, kafić sa slapom, palača i escape room", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "**🚄 Čet 29.10. · Busan → Seoul · KTX ~2h30 (ili sa stankom u Daejeonu) · ~60 000 ₩**\n**KTX do Seoul Stationa, ne SRT do Susea.** Od Seoul Stationa AREX all-stop do Hongik Univ. traje ~15 min, ili dva taksija do Yeonnam-donga.", "flash": {"label": "Četvrtak, 29. 10. · Busan → Seoul — pekara, slap i escape room", "text": "Rano ujutro putujemo KTX-om prema Seoulu, uz stanku u **Daejeonu** radi doručka u legendarnoj pekarnici **Sungsimdang**. Po dolasku u Seoul ostavljamo kofere u smještaju u **Yeonnam-dongu** i odlazimo na kavu u **Cafe Pokpo**, kafić s terasom ispred umjetnog slapa usred grada. Poslijepodne posvećujemo jednom satu u palači **Gyeongbokgung**, a zatim kratkoj šetnji kroz **Seochon**, mirniju četvrt s tradicionalnim kućama, galerijama i malim kafićima. Navečer nas čeka korejski roštilj u restoranu **Yukmong**. Nakon večere slijedi 🔒 **escape room avantura na engleskom jeziku**, otprilike deset minuta od kuće. Dan završavamo u Hongdaeu, uz pub crawl i karaoke (*noraebang*) na putu kući."}, "rows": [{"time": "07:30", "key": "07:30", "text": "Kava na Busan Stationu. Pravi doručak je Sungsimdang.", "altHint": false, "slot": 0}, {"time": "~08:00", "key": "08:00", "text": "KTX do **Daejeona**, ~1h40. Stanka je opcionalna: ako smo umorni ili nismo gladni, direktni KTX u Seoul.", "altHint": false, "slot": 1}, {"time": "~09:40", "key": "09:40", "text": "**Sungsimdang** na stanici Daejeon, 2. kat: **twigim soboro**, pržena lepinja s mrvicama i crvenim grahom. Dvoje stoji u redu, dvoje čuva kofere.", "altHint": false, "slot": null}, {"time": "~10:40", "key": "10:40", "text": "KTX do **Seoul Stationa, dolazak ~11:40**, pa AREX ili dva taksija do Yeonnam-donga. Kofere ostavljamo, check-in je u 16:00.", "altHint": false, "slot": null}, {"time": "~11:40", "key": "11:40", "text": "**Seoul Station → Yeonnam-dong**", "altHint": false, "slot": 2, "d3only": true}, {"time": "12:45", "key": "12:45", "text": "☕ **Cafe Pokpo**: kafić s terasom ispred umjetnog slapa Hongje, 10–15 min taksijem od stana (slap teče u terminima).", "altHint": false, "slot": 3}, {"time": "14:00", "key": "14:00", "text": "Taksi (~15 min) do **Gyeongbokgunga**, ~1 h: prijestolna dvorana, paviljon na jezeru (smjena straže u 14:00 ako stignemo). 3 000 ₩.", "altHint": false, "slot": 4}, {"time": "15:15", "key": "15:15", "text": "Izlaz na zapadna vrata u **Seochon**, kratko (~45 min): knjižara Daeoh (hanok iz 1951.), jedna uličica Ogin-donga.", "altHint": false, "slot": 5}, {"time": "16:15", "key": "16:15", "text": "Taksi natrag, check-in, odmor.", "altHint": false, "slot": 6}, {"time": "18:00", "key": "18:00", "text": "**Yukmong**, korejski BBQ koji peče osoblje. Set od 550 g svinjetine 69 900 ₩, rezervacija.", "altHint": false, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "🔒 **Escape room Deepthinker \"Ongyi's Dream\"**, na engleskom, bez horora, 10–15 min pješice. Booking: ponoć 23./24.10.", "altHint": false, "slot": 8}, {"time": "21:30", "key": "21:30", "text": "**Absolute pub crawl** (četvrtkom u Hongdaeu), **pa coin noraebang**, 5 min do kreveta. 🏏 **Hongdae batting cage** (pravi kavez, Seogyo-dong 360-15) poslije escape rooma ili prije noraebanga. Rezerva: 31.10.", "altHint": false, "slot": 9}], "plans": [], "leftPlans3": [], "decisions": ["d-cet-29-10-ktx-u-seoul"]}, {"date": "30.10", "d3heading": "PET 30.10. — SUWON HWASEONG", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 12 od 14", "intro": "💡 *Hwadam (botanički vrt, prijedlog Gorana i Lucije) bio je razmatran kao zamjena za ovaj dan i izbačen je. Razlozi su u Dodatku D.*\n\nUNESCO-ova tvrđava iz **1796.** Kralj Jeongjo sagradio ju je oko novog grada kako bi premjestio grob svog oca, princa Sadoa, kojeg je djed dao zatvoriti u škrinju za rižu, gdje je i umro. **5,7 km zidina** s 48 građevina: vrata, stražarnice, kule za strijelce, paviljoni. Zidine su **besplatne i otvorene 24 h**, plaća se samo palača.\n\nPlan 1 je večer u Suwonu (galbi, osvijetljeni zidovi, balon), plan B je povratak u 15:30 i fontana Banpo. Konačno se može odlučiti i na dan, oko 15:00, prema umoru i vjetru.", "stay": "", "slots": [{"timeLabel": "08:45", "key": "08:45", "title": "Do Suwona", "meta": ["⏱ ~1 h od vrata do vrata"], "body": "**Gyeongui ili AREX all-stop** s Hongik Univ. do **Seoul Stationa (~10 min)**, pa **ITX-Saemaeul ili ITX-Maum, 31–35 min, 4 800 ₩** (ili Mugunghwa ~35 min, 2 700 ₩; KTX 7 500 ₩) do stanice Suwon, pa **taksi 10–15 min** do Haenggunga. Karte na dan, na automatu ili u Korail aplikaciji.\n\nRezerva: **linija 2 do Sindorima, pa linija 1 express** do Suwona, 55–65 min, stoji se. ❌ Bus 7770 iz Sadanga i 1007 iz Jamsila kreću s krive strane grada za Mapo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "10:15", "key": "10:15", "title": "Hwaseong Haenggung", "meta": ["⏱ 45 min", "🌦️", "🦵 lagano"], "body": "**2 000 ₩, 09:00–18:00** (od 1.11. do 17:00), zadnji ulaz 17:30. Najveća privremena kraljevska palača dinastije Joseon: kralj je ovdje boravio pri posjetima očevu grobu, a ovdje je proslavio i 60. rođendan svoje majke. Rekonstruirana, s lutkama u scenama dvorskog života. U hanboku je ulaz besplatan.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:00", "key": "11:00", "title": "Muye 24-gi, borilački nastup", "meta": ["⏱ 30 min", "☀️ otkazuje se po kiši", "🦵 lagano"], "body": "**Besplatno**, na trgu ispred palače, **radnim danom u 11:00** (vikendom i u 14:00). Vojnici u odorama Joseona izvode 24 vještine iz vojnog priručnika iz 1790.: mačevi, koplja, akrobacije, borba s konja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Ručak: uličica pržene piletine (Suwon Tongdak Geori)", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**수원 통닭거리**, kod južnih vrata Paldalmun, ~10 min pješice od palače. Cijela piletina pržena u **velikim željeznim kotlovima** na stari način, uz **besplatne pržene želuce**, **~19 000 ₩ po piletini** (jedna na dvoje). Najpoznatiji su **Jinmi Tongdak (진미통닭)** i **Yongseong Tongdak (용성통닭)**. Uz pivo.", "alts": [{"title": "Yeonpo Galbi, galbitang za ručak", "text": "(juha od goveđih rebara, ~15 000 ₩), ako je galbi navečer otpao (plan B)", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Zidovi: sjever i istok (ravno)", "meta": ["⏱ 2,5 h", "☀️", "🦵 do 🦵🦵"], "body": "⚠️ **Zapadni dio preko brda Paldalsan** (vidikovac Seojangdae, 128 m) ima **strme, neravne granitne stepenice bez ograde, a silazak prema Paldalmunu je točno ono što koljeno ne voli. ❌ Za Luciju ne.** Tko želi, napravi to kao zasebnu petlju od 45 min dok se ostali voze vlakićem.\n\n**Ravna ruta (sjever i istok):**\n1. **Hwahongmun (화홍문):** vrata izgrađena **preko potoka sa sedam lukova**, voda teče kroz njih. Najljepša točka zidina.\n2. **Banghwasuryujeong (방화수류정):** paviljon na stijeni iznad lotosova jezera **Yongyeon**, klasična fotografija Suwona.\n3. **Yeonmudae (연무대)**, vježbalište: **tradicionalno streličarstvo**, **2 000 ₩ za 10 strijela**, svakih 30 min od 09:30, zadnje u 17:30, **pauza 12–13**, ne po kiši. Kratka uputa, korejski luk, mete na ~15 m, zabavnih 15 minuta.\n4. **Vlakić Hwaseong Eocha (화성어차):** **6 000 ₩**, kružna ruta Yeonmudae, Hwahongmun, **Janganmun** (sjeverna vrata, najveća), Hwaseomun i natrag. **Utorak–nedjelja 09:40–17:00**, otprilike svakih 20–30 min, **ne po kiši**. Karte kupiti rano, u gužvi se rasprodaju.", "alts": [{"title": "Samo sjeverni dio:", "text": "Hwahongmun, jezero i palača", "meta": ["⏱ 1,5 h", "☀️", "🦵"]}, {"title": "Kiša: War Memorial of Korea", "text": "(Yongsan, besplatno, 09:30–18:00), ogroman muzej korejske vojne povijesti, avioni i tenkovi vani. Ili **DDP i Dongdaemun**", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Kiša: Seoul Museum of History", "text": "(besplatno, 09:00–18:00) ili **Seodaemun Prison**", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Kafić u Haenggung-dongu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "Uličice s niskim kućama i muralima unutar zidina (**Haenggung-gil**, \"Haenglidan-gil\"): kafići, pekare, male radionice. Odmor za noge prije večeri. **Ovdje odlučujemo plan 1 ili plan B** (umor, vjetar za balon).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "🔥 Suwon galbi (plan 1)", "meta": ["⏱ 1,5 h", "☔", "🦵 lagano"], "body": "**Suwon galbi** su **veliki komadi goveđih kratkih rebara**, marinirani u blagom umaku od soli (suwonski stil, svjetliji od seulskog sojinog), pečeni na roštilju na stolu. Grad je od 1940-ih bio najveće tržište stoke u Koreji, pa je **jelo nastalo ovdje**.\n\n- **Yeonpo Galbi (연포갈비)**, 정조로906번길 56-1, **uz Hwahongmun**, 5 min pješice od zidina. **11:20–21:00, zadnja narudžba 20:00**, bez neradnog dana. Marinirani galbi **~42 000 ₩** porcija. Plan A, ostajemo uz zidine.\n- 💸 **Gabojung (가보정)**, veliki banketni restoran galbija u Ingye-dongu, **15 min taksijem**. Radnim danom 11:30–21:30. **Marinirani galbi, američki 71 000 ₩ ili hanwoo 79 000 ₩** po porciji, set za ručak 43–47 000 ₩. **Rezervacija telefonom 1600-3883.** Bolji komadi i veći izbor priloga, ali skuplje i dalje od zidina.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:15", "key": "19:15", "title": "🎈 Flying Suwon i osvijetljeni zidovi", "meta": ["⏱ 20 min plus 30–45 min", "☀️ vjetar ga prizemljuje", "🦵 lagano"], "body": "**플라잉수원** je **jedan** balon s helijem na sajli ispred istočnih vrata (Changnyongmun), ide samo gore-dolje. **Do 100–150 m**, ukupno **15–20 min** (oko 7 min lebdi gore). **20 000 ₩**, radnim danom **13:00–22:00**, zadnji let 30 min prije zatvaranja. **Rezervacija ne treba**, petkom se kupi na blagajni (online je 5 % popusta, ali ne za isti dan). Ukrcaj po redu kupnje.\n\n⚠️ **Ne leti po jačem vjetru**, nazvati ili pogledati na licu mjesta. **Noću je ljepše nego u zalazak** (osvijetljene zidine i promet ispod). Rukavice, gore je hladno. Bonus, ne razlog da se ostane.\n\nPa pješice uz **osvijetljeni Hwahongmun i paviljon nad jezerom** (30–45 min, ravno). Ako balon ne leti, samo šetnja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~20:30", "key": "20:30", "title": "Natrag u Seoul", "meta": [], "body": "Taksi do stanice Suwon, **ITX ili Mugunghwa** do Seoul Stationa, Gyeongui ili AREX, doma oko 21:30.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša:** Suwon otpada. War Memorial, Seoul Museum of History ili DDP. Večer: Banpo također otpada, Hongdae.\n- **Koljeno ili umor:** samo sjeverni dio i vlakić, pa **plan B**.\n- **Vjetar:** balon ne leti. Plan 1 bez balona ili plan B.\n- **Ekipa hoće Banpo:** plan B ili srednji put.\n- **Netko hoće ostati u gradu:** jedini dan kad razdvajanje na pola dana ništa ne razbija.", "heading": "Pet 30.10. — Suwon Hwaseong", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Petak, 30. 10. · Suwon — tvrđava, streličarstvo i galbi", "text": "Ujutro vlakom ITX za pola sata putujemo do **Suwona** i **tvrđave Hwaseong**, UNESCO-ova kompleksa zidina, vrata i tornjeva iz 18. stoljeća. Obilazak počinjemo kod kraljevske palače **Hwaseong Haenggung** i borilačkog nastupa u 11:00, a za ručak jedemo poznatu suwonšku prženu piletinu iz velikih kotlova. Poslijepodne obilazimo ravniji, sjeverni i istočni dio zidina, uz **tradicionalno korejsko streličarstvo** i turistički vlakić. Navečer jedemo **Suwon galbi**, goveđa rebarca u gradu gdje je jelo i nastalo, a ako ne puše, dižemo se balonom **Flying Suwon** iznad osvijetljene tvrđave. **Plan B:** ako smo umorni ili je vjetar, vraćamo se u Seoul oko 15:30 i navečer idemo do rijeke Han na **ramyeon** i **dugu fontanu na mostu Banpo**. *(Hwadam, botanički vrt koji su predložili Goran i Lucija, izbačen je: stane samo umjesto Suwona, traži ~4,5 h busa za ~3 h vrta, a jesenskog lišća već imamo dosta, uključujući Tajni vrt dva dana kasnije.)*"}, "rows": [{"time": "08:45", "key": "08:45", "text": "Gyeongui ili AREX do Seoul Stationa (~10 min), pa **ITX do Suwona** (31–35 min, 4 800 ₩) i taksi do palače.", "altHint": false, "slot": 0}, {"time": "10:15", "key": "10:15", "text": "**Hwaseong Haenggung**, kraljeva privremena palača, 2 000 ₩.", "altHint": false, "slot": 1}, {"time": "11:00", "key": "11:00", "text": "**Muye 24-gi**, besplatni borilački nastup ispred palače.", "altHint": false, "slot": 2}, {"time": "12:00", "key": "12:00", "text": "Ručak u **uličici pržene piletine** kod južnih vrata: cijela piletina iz željeznih kotlova, ~19 000 ₩.", "altHint": false, "slot": 3}, {"time": "13:00", "key": "13:00", "text": "**Ravni zidovi na sjeveru i istoku:** Hwahongmun (vrata nad potokom), paviljon nad jezerom, **streličarstvo** u Yeonmudaeu (2 000 ₩ za 10 strijela) i **vlakić Hwaseong Eocha** (6 000 ₩) do Janganmuna. Paldalsan sa strmim stepenicama preskačemo zbog koljena.", "altHint": false, "slot": 4}, {"time": "15:30", "key": "15:30", "text": "Kafić u uličicama Haenggung-donga, odmor. Odluka: večer u Suwonu ili plan B.", "altHint": false, "slot": 5}, {"time": "18:00", "key": "18:00", "text": "🔥 **Suwon galbi** u **Yeonpo Galbiju** uz Hwahongmun (~42 000 ₩ porcija), ili 💸 **Gabojung** (~71–79 000 ₩, rezervacija).", "altHint": false, "slot": 6}, {"time": "19:15", "key": "19:15", "text": "🎈 **Flying Suwon**, balon na sajli 100–150 m nad osvijetljenom tvrđavom, 20 000 ₩, *samo ako ne puše*. Zatim **osvijetljeni zidovi** kod Hwahongmuna.", "altHint": false, "slot": 7}, {"time": "~20:30", "key": "20:30", "text": "ITX natrag, doma oko 21:30.", "altHint": false, "slot": 8}], "plans": [{"label": "Plan B · Banpo", "replaces": ["15:30", "18:00", "19:15", "20:30"], "summary": "**Plan B (vrlo moguć):** natrag u Seoul oko 15:30, odmor, pa **duga fontana Banpo** (jedna od zadnje dvije večeri sezone, 19:30–21:00) i **ramyeon uz rijeku Han**.", "detail": {"title": "Plan B (vrlo moguć) — natrag u 15:30 i Banpo", "meta": [], "md": "*Ako smo umorni, ako balon tog dana ne leti ili ako ekipa odluči da je Banpo obavezan.*\n\n| | |\n|---|---|\n| 15:30 | ITX natrag. Balon danju po želji prije toga. |\n| 17:30 | Doma, tuš, odmor ~1 h. |\n| 19:00 | Taksi (~30 min) do **parka Banpo Hangang**. |\n| 19:15 | **Ramyeon uz rijeku Han:** u trgovini (CU, GS25) kupe se instant rezanci, skuhaju na aparatu i jedu uz rijeku. Korejski ritual. |\n| 19:30–21:00 | **Duga fontana na mostu Banpo:** mlazovi vode s boka mosta uz glazbu i svjetla, **20 min u 19:30, 20:00, 20:30 i 21:00**. **Sezona završava 31.10.**, ovo je jedna od zadnje dvije večeri. Otkazuje se po kiši ili vjetru od 7 m/s. |\n| 21:30 | Doma ili piće u Hongdaeu. |\n\n**Dobiva se:** Banpo i ramyeon (besplatno, opušteno, vrlo seulski), odmor za koljeno prije subote i nedjelje. **Gubi se:** Suwon galbi u Suwonu, osvijetljene zidine, balon noću.\n\n*Alternativa za večer:* **Namdaemun** (naočale, štandovi s hranom; dućani s odjećom zatvaraju 17–18 h). Naočale se mogu i u Hongdaeu bilo koje večeri.", "alts": [], "after": ""}, "rows": null}, {"label": "Srednji put", "replaces": ["15:30", "18:00", "19:15", "20:30"], "summary": "", "detail": {"title": "Srednji put (moguć, ali gust)", "meta": [], "md": "Balon oko 16:30, **rani galbi u 17:00** u Yeonpou, osvijetljeni Hwahongmun oko 18:15, ITX oko 18:45, Seoul Station oko 19:30, taksi do Banpoa za **20:30 ili 21:00**. Sve stane, ali u žurbi i bez odmora.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-pet-30-10-vecer-u-suwonu"]}, {"date": "31.10", "d3heading": "SUB 31.10. — SEONGSU, BICIKLI UZ HAN, SPA, SINDANG, DRONE SHOW I NOĆ VJEŠTICA", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 13 od 14", "intro": "**Logika dana:** Seongsu, Sindang i park s dronovima na **istočnoj** su strani Seoula, a dom, spa i Hongdae na **zapadnoj**. Sve spaja **linija 2**: ujutro na istok (Seongsu i bicikli uz rijeku), popodne doma na **spa umjesto odmora** (10 min od stana), navečer opet na istok, pa kasno natrag na zapad. Raniji start, jer je ekipa tražila manje praznog hoda. ⚠️ Dan bez pravog odmora prije Noći vještica. **Prvo se reže: Zoo Sindang, pa bicikli.**", "stay": "", "slots": [{"timeLabel": "08:30", "key": "08:30", "title": "☕ Doručak: French toast u Yeonnam-dongu", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "Kafić s French toastom na adresi **260-2 Yeonnam-dong**, 5–10 min pješice od stana. ❓ **Ime kafića fali** (Goran i Lucija): bez imena ga na Naver mapi tražimo po adresi (연남동 260-2). Rezerva: bilo koji brunch kafić u Yeonnam-dongu uz Gyeongui Line Forest Park.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:30", "key": "09:30", "title": "Seongsu", "meta": ["⏱ ~2 h s ručkom", "🌦️", "🦵 lagano"], "body": "**Linija 2 s Hongik Univ. do Seongsua ili Ttukseoma, ~35 min.** Stara industrijska četvrt (tvornice cipela, tiskare, skladišta) pretvorena u kafiće, dizajnerske studije i radionice, \"seulski Brooklyn\". Ne idemo zbog shoppinga nego zbog atmosfere.\n\n1. **Seoul Forest (서울숲):** 24 h, besplatno, ravno. Ginkgo drvoredi krajem listopada žute, ograđeni dio s **jelenima** i vrt kukaca (10:00–17:00), staklenik na mjestu stare vodovodne stanice. ~45 min.\n2. **Ulica ručno rađenih cipela (성수동 수제화거리)**, kod izlaza 3 stanice Seongsu: stare postolarske radionice uz nove studije. Samo prolaz.\n3. **Daelim Changgo (대림창고)**, Seongsu-iro 78, **bivše skladište riže** pretvoreno u galeriju i pržionicu: hrđave čelične grede, zidovi od cigle, skulpture. 11:00–22:00. Jedna kava.\n4. ⚠️ ☕ *Opcija:* **kafić sa slasticama**, npr. **Nudake** (deserti koji izgledaju kao umjetnički objekti). **WIP:** provjeriti radi li 2026. i koji je trenutno najzanimljiviji u Seongsuu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:30", "key": "11:30", "title": "Ručak: Somunnan Seongsu Gamjatang", "meta": ["⏱ 1 h plus red", "☔", "🦵 lagano"], "body": "**소문난성수감자탕**, Yeonmujang-gil 45. **Gamjatang** je veliki lonac ljutog crvenog variva od **svinjske kralježnice** (meso se skida s kostiju) s krumpirom, zeljem i mljevenim sjemenkama perile, satima kuhan. Na kraju se u ostatak umaka dodaju rezanci ili riža. Sve kuhano. **Otvoreno 24 h**, ali **subotom u vrijeme ručka red je 45–75 min**, pa dolazimo **do ~11:30**. Za četvero veliki lonac. Za Luciju tražiti blaže.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:45", "key": "12:45", "title": "🚲 Bicikli i piknik uz rijeku Han", "meta": ["⏱ ~1,5 h", "☀️", "🦵 lagano, ravno"], "body": "**Ttareungi (따릉이), gradski bicikli Seoula**: stanice u Seoul Forestu. Karta se kupuje u aplikaciji **Seoul Bike** stranom karticom, **~1 000 ₩ za 1 h, ~2 000 ₩ za 2 h**. ⚠️ Aplikaciju instalirati i registrirati **dan ranije**.\n- Iz Seoul Foresta na **biciklističku stazu uz Han** (ravno, odvojeno od prometa) prema **Ttukseomu** i dalje uz vodu, pa natrag. ~8–10 km bez žurbe.\n- **Piknik:** stanka na travi uz rijeku, grickalice i piće iz trgovine (CU / GS25 u parku), ili ramyeon s aparata.\n- Bicikl vraćamo na bilo koju Ttareungi stanicu, pa linija 2 doma.", "alts": [{"title": "Kiša ili umor:", "text": "bez bicikala, ravno doma, a spa se može ranije", "meta": ["⏱ —", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Linija 2 doma (~35 min)", "meta": [], "body": "Kratko presvlačenje, pa pješice u spa.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:00", "key": "15:00", "title": "💆 Spa blok: THE SEOL:HA (Hongdae)", "meta": ["⏱ 2 h", "☔", "🦵 odmor"], "body": "**Seogyo-dong 448-31, Mapo**, samostojeća zgrada kod stanice Hongik Univ., **~10 min pješice od stana**. Korejski spa s privatnim sobama, **muškarci dobivaju muške terapeute**. Radi svaki dan 09:00–21:00 (zadnja rezervacija ~19:00–19:30). Rezervacija preko **Trazyja**, za **četvero paralelno**. ⚠️ **WIP:** cijene i dostupnost četiri termina u subotu, rezervirati **čim prije**.\n\nŠto uzeti (svatko po želji, ukupno ~2 h):\n- **Head spa** (organski, 45 / 60 / 75 / 100 min): pranje, piling i masaža vlasišta, korejska specijalnost.\n- **Masaža tijela** (aroma ili tradicionalna, 60 / 90 / 120 min).\n- **Tretman lica s masažom** (meridijanski facial + gornji dio tijela, 75 min).\n- Korejski piling tijela (scrub), ako netko želi.\n\nOkvirno **~60–150 € po osobi**, ovisno o kombinaciji.", "alts": [{"title": "AHEAD Head Spa", "text": "(Sinsa, Gangnam): samo head spa, sve na engleskom, ali **najviše 3 osobe po terminu** i daleko", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Shin Jiyoon Skin Care", "text": "(Hongdae, 156 Yanghwa-ro): samo tretman lica, **subotom do 16:00**", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "17:15", "key": "17:15", "title": "Sindang", "meta": [], "body": "**Linija 2 s Hongik Univ. do stanice Sindang, ~30 min.** Stara četvrt kod Dongdaemuna, poznata po jednom jelu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Večera: tteokbokki kod bake Mabongrim", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "**마복림할머니집**, Dasan-ro 35-gil 5, u **ulici tteokbokkija (신당동 떡볶이 골목)**. **Tteokbokki** su žilavi rižini štapići u ljuto-slatkom crvenom umaku. Ovdje je **jeukseok** verzija: **plitki lonac na plinu na stolu** u koji idu rižini kolačići, **ramen, stakleni rezanci, mandu, riblji kolači i kuhana jaja**, sve se kuha pred nama. Baka Mabongrim je ulicu \"izmislila\" 1950-ih. Jeftino, glasno, zabavno. Na kraju se u ostatak umaka može tražiti pržena riža (bokkeumbap).", "alts": [{"title": "Ulica jokbala u Jangchung-dongu (장충동 족발골목)", "text": ", 10 min dalje: **topli pirjani svinjski buti** (s češnjakom, đumbirom i rižinim vinom), narezani, uz slanu škampovu pastu i salatu za zamatanje. Npr. **Wonjo 1-ho Jangchung-dong Halmeonijip** (Jangchungdan-ro 176, 10:00–23:00). Ako ekipa hoće meso, a ne rižine kolačiće", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "19:15", "key": "19:15", "title": "🍸 Zoo Sindang (주신당), skriveni bar", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**411 Toegye-ro, Jung-gu**, uz stanicu Sindang (L2 izlaz 1 / L6 izlaz 12, kod Woori banke skrenuti desno), ~5–10 min pješice od ulice tteokbokkija. **Skriveni ulaz** iza vrata koja čuvaju kameni kipovi, unutra orijentalni interijer i **akvarij koji visi sa stropa**, s gornjeg kata se ribe vide izbliza. Kokteli su složeni **po korejskom horoskopu (12 životinja)**, neki mijenjaju boju dok ih barmen radi. **15–18 000 ₩.** Subotom od 17:00 do 02:00, **bez rezervacije**, pa ranije dolazak pomaže. ⚠️ **Ako kasnimo na dronove, preskačemo.**", "alts": [{"title": "Jean Frigo (장프리고)", "text": ", Toegye-ro 62-gil 9-8 (Gwanghui-dong): bar iza vrata hladnjaka u voćarni, ~10 min taksijem", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:30", "key": "20:30", "title": "🚁 Drone show, park Ttukseom Hangang", "meta": ["⏱ 1–1,5 h s čekanjem", "☀️ otkazuje se po kiši i vjetru", "🦵 lagano"], "body": "**뚝섬한강공원, pozornica uz rijeku.** Taksi ~15 min iz Sindanga, ili metro (L2 do Konkuk Univ. / L7 do **Jayanga**). **Besplatno.** Glazbeni program od **19:30**, **dronovi 20:30–20:45**, pa glazba do 21:15. **Otkazuje se po lošem vremenu**, provjeriti na dan na seouldroneshow.com.\n\nDoći do ~20:00 za mjesto na travi ili kamenim stepenicama. Dok se čeka, **ramyeon uz rijeku Han** iz trgovine (CU, GS25: instant rezanci, aparat ih skuha za 4 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "21:15", "key": "21:15", "title": "Natrag na zapad", "meta": [], "body": "⚠️ Stanica **Jayang** odmah uz park poslije showa **ograničava ulaz** zbog gužve, pa **pješice 10 min do Konkuk Univ.**, odakle **linija 2 vozi izravno do Hongik Univ., ~35 min.**", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "22:00 do kasno", "key": "22:00", "title": "🎃 Noć vještica u Hongdaeu", "meta": ["⏱ cijela noć", "🌦️", "🦵 lagano"], "body": "**Hongdae**, studentska i noćna četvrt, **5–10 min pješice od stana**. Na Noć vještica glavno je okupljalište u Seoulu: ulice pune kostima, ulični nastupi, prepuni barovi i **pocha** (šatorski barovi). Policija i hitna imaju koridore duž Eoulmadang-roa, sigurno je, ali gusto.\n- **Klubovi:** redovi **1–2 h**, pa radije barovi, pocha i uličica Wausan-ro.\n- **Kostim:** po želji, dućani u Hongdaeu ih tih dana prodaju.\n- ❌ **Itaewon:** od nesreće 2022. jednosmjerne rute, barijere i policija. Prigušeno, i na krivoj strani grada.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša ili vjetar:** dronovi otkazani, plan B (Hongdae). Seongsu ujutro ima kafiće pod krovom.\n- **Red za gamjatang predug:** bilo koji ručak u Seongsuu, gamjatang ima i u Hongdaeu (lokali 24 h).\n- **Umor:** plan B.\n- **Banpo nije bio u petak:** Banpo umjesto dronova.\n- **Escape room nije odrađen u četvrtak:** danas u terminu koji ne siječe spa (npr. 09:30, Seongsu kraće), ili u 21:30 u Hongdaeu umjesto dronova.\n- **Spa nema termina za četvero:** dvije smjene po dvoje (15:00 i 16:00), ili AHEAD / Shin Jiyoon.\n- **Seoul Sky nije odrađen:** sutra, nedjelja 1.11.", "heading": "Sub 31.10. — Seongsu, bicikli uz Han, spa, drone show i Noć vještica", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Subota, 31. 10. · Seoul — Seongsu, rijeka Han, spa i Halloween", "text": "Dan počinjemo doručkom s *French toastom* u našem kvartu, a zatim odlazimo u **Seongsu**, nekadašnju industrijsku četvrt poznatu po kafićima u preuređenim skladištima i kreativnim prostorima, te u veliki park **Seoul Forest**. Za ručak biramo **gamjatang**, bogato varivo od svinjskih kostiju i krumpira. Zatim uzimamo gradske bicikle i vozimo se **ravnom stazom uz rijeku Han**, uz kratki piknik na travi. Poslijepodne se vraćamo u Hongdae na **spa za sve četvero**: korejski *head spa*, masažu ili tretman lica. Navečer idemo u **Sindang**, četvrt poznatu po *tteokbokkiju* koji se kuha u loncu na stolu, i na koktel u **Zoo Sindang**, skriveni bar s akvarijem na stropu. Potom odlazimo do rijeke Han na **besplatni drone show** u parku Ttukseom (otkazuje se po kiši i vjetru). Večer završavamo na **Halloweenu u Hongdaeu**, uz kostime, glazbu i živu atmosferu na ulicama, pješice do smještaja."}, "rows": [{"time": "08:30", "key": "08:30", "text": "☕ **French toast** u Yeonnam-dongu (260-2 Yeonnam-dong, ❓ fali ime).", "altHint": false, "slot": 0}, {"time": "09:30", "key": "09:30", "text": "Linija 2 do **Seongsua**, ~35 min: **Seoul Forest** (žuti ginkgi, jeleni), ulica postolara, **Daelim Changgo**. ⚠️ Opcija: kafić sa slasticama.", "altHint": false, "slot": 1}, {"time": "11:30", "key": "11:30", "text": "Ručak u **Somunnan gamjatangu:** ljuto varivo od svinjskih kostiju i krumpira. ⚠️ Subotom red, doći do 11:30.", "altHint": false, "slot": 2}, {"time": "12:45", "key": "12:45", "text": "🚲 **Bicikli i piknik uz rijeku Han:** Ttareungi od Seoul Foresta po ravnoj stazi uz rijeku, ~1,5 h.", "altHint": false, "slot": 3}, {"time": "14:15", "key": "14:15", "text": "Linija 2 doma, ~35 min.", "altHint": false, "slot": 4}, {"time": "15:00", "key": "15:00", "text": "💆 **Spa: THE SEOL:HA** u Hongdaeu, 10 min od stana: head spa, masaža ili tretman lica, ~2 h, za sve četvero.", "altHint": false, "slot": 5}, {"time": "17:15", "key": "17:15", "text": "Linija 2 do **Sindanga**, ~30 min.", "altHint": false, "slot": 6}, {"time": "18:00", "key": "18:00", "text": "Večera: **tteokbokki kod bake Mabongrim**, lonac na stolu s rižinim kolačićima, ramenom, manduom, ribljim kolačima i jajima u ljutom umaku.", "altHint": false, "slot": 7}, {"time": "19:15", "key": "19:15", "text": "🍸 **Zoo Sindang**: skriveni bar s akvarijem na stropu, kokteli po korejskom horoskopu. Prvi rez ako kasnimo.", "altHint": false, "slot": 8}, {"time": "20:30", "key": "20:30", "text": "🚁 **Drone show u parku Ttukseom Hangang:** besplatno, 15 min, glazba od 19:30. Otkazuje se po kiši i vjetru.", "altHint": false, "slot": 9}, {"time": "21:15", "key": "21:15", "text": "Pješice do **Konkuk Univ.**, pa linija 2 direktno u Hongdae, ~35 min.", "altHint": false, "slot": 10}, {"time": "22:00", "key": "22:00", "text": "🎃 **Noć vještica u Hongdaeu:** ulice pune kostima, barovi i šatori, za klubove red od 1–2 h. Do kreveta 5–10 min.", "altHint": false, "slot": 11}], "plans": [{"label": "Plan B · Hongdae", "replaces": ["17:30", "18:00", "19:15", "20:30", "21:15", "22:00"], "summary": "**Plan B (kiša, umor, vjetar):** cijela večer u Hongdaeu. Večera blizu kuće (BBQ ili tržnica Mangwon), Noć vještica od ~20:00, **pub crawl** (subotom u Hongdaeu, 20:00–21:30).", "detail": {"title": "Plan B — cijela večer u Hongdaeu", "meta": [], "md": "*Kiša, vjetar (dronovi otkazani) ili umor.* Večera blizu kuće, **korejski BBQ** ili **tržnica Mangwon** (lokalna tržnica 10 min od stana, 09:00–21:00: pržena piletina, kroketi, rezanci), pa Noć vještica od ~20:00 i **Absolute pub crawl** (subotom u Hongdaeu, sastanak u Dokkaebi Party Houseu **20:00–21:30**, ~21 USD, osobna isprava). Bez prelaska grada, bez dronova i Sindanga.\n\n*Ako fontane Banpo nije bilo u petak:* **zadnja večer sezone**. Umjesto dronova Banpo u 20:00 ili 20:30, pa Hongdae oko 21:45. Oboje ne stane.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-sub-31-10-spa-blok-za-cetvero"]}, {"date": "1.11", "d3heading": "NED 1.11. — TAJNI VRT, CHEONGSUDANG, INWANGSAN, BAR CHAM I ZADNJI BBQ", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 14 od 14", "intro": "⚠️ **Zadnja stvarna večer putovanja.** 2.11. je samo jutro do aerodroma. Nedjeljom ne radi Eulji Myeonok, fontana Banpo završila je 31.10., a KBO bejzbola 1.11. nema (Korejska serija počinje tek 2.11. u Suwonu).", "stay": "", "slots": [{"timeLabel": "~09:30", "key": "09:30", "title": "🔒 Changdeokgung i Tajni vrt", "meta": ["⏱ 2–2,5 h", "🌦️", "🦵🦵 vrt je brdovit, staze zemljane"], "body": "💡 Najbolje je uzeti engleski termin **10:30** (palača prije toga), tako da Cheongsudang i ručak padnu oko podneva. Ako je termin 11:30, kafić ide nakon ručka.\n\n**8 000 ₩ (5 000 vrt plus 3 000 palača) · UNESCO · rezervirano 26.10. u 10:00.** ⚠️ Ako online nije uspjelo, **otprilike pola karata prodaje se na licu mjesta istog dana od 09:00**, pa biti na blagajni oko 08:30. Termini na engleskom: **10:30 / 11:30 / 14:30 / 15:30**. Obilazak vrta je **samo s vodičem, ~90 min**.\n\n**Changdeokgung** je najomiljenija palača dinastije Joseon. Kraljevi su u njoj živjeli dulje nego u Gyeongbokgungu, jer se zgrade prirodno uklapaju u brdo umjesto u strogu simetriju. **Huwon (Tajni vrt)** je kraljevski vrt iza palače: šumovito brdo s **jezercem Buyongji** i paviljonom koji jednom nogom stoji u vodi, knjižnicom **Juhamnu**, paviljonima uz potok i stablima starijima od 300 godina. **Početak studenog je vrhunac javora**, najtraženiji termin u godini.\n\nMetro Anguk (L3), izlaz 3, ~5 min. Iz Yeonnam-donga taksi ~25 min.", "alts": [{"title": "Palača bez vrta", "text": "(3 000 ₩) i **Changgyeonggung** kroz spojna vrata (1 000 ₩): jezero Chundangji i **stakleni staklenik Daeonsil iz 1909.**, bez rezervacije", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~12:05", "key": "12:05", "title": "☕ Cheongsudang (청수당), Ikseon-dong", "meta": ["⏱ 45 min plus red", "☔", "🦵 lagano"], "body": "**31-9 Donhwamun-ro 11na-gil, Ikseon-dong**, **~10 min pješice od Changdeokgunga**. Kafić u tradicionalnoj **hanok** kući: ulazi se **kamenim stazama preko jezerca**, kroz bambus i lampione, a sjedi se uz vrt (dio sjedenja na podu, tražimo stol). Piće 5 800–7 500 ₩, **deserti 13–20 000 ₩**, i to je glavna stvar, a ne kava. ⚠️ **Nedjeljom red**, pa idemo odmah nakon vrta. ⚠️ **WIP:** radno vrijeme nedjeljom.", "alts": [{"title": "Red predug:", "text": "kava u nekom od hanok kafića u Ikseon-dongu, uličice su pune njih", "meta": ["⏱ 30 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Ručak: Imun Seolnongtang", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**이문설농탕**, Gyeonji-dong (Jongno), ~10 min od palače. **Najstariji restoran u Seoulu, od 1904.** **Seolleongtang:** volovske kosti kuhane **17 sati** do mliječnobijele juhe, s mekim goveđim prsima i rezancima. **Soli se za stolom**, uz kimchi i kkakdugi (rotkvu). Jednostavno, toplo, povijesno. **Nedjeljom 08:00–20:30, pauza 15:00–16:30.** 12–15 000 ₩.\n\n*Alternativa:* **Tongin**, kafić s mjedenim novčićima **nedjeljom radi** (prva nedjelja, 11:00–17:00, novčići do 16:00), ako se 20.10. nije stiglo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Inwangsan, ravna staza (Jarak-gil)", "meta": ["⏱ 1,5–2 h", "☀️", "🦵 lagano"], "body": "⚠️ **Klasična ruta na vrh Inwangsana (338 m) preko Beombawija je ~90 % strmih kamenih i drvenih stepenica i golih granitnih ploča, ❌ za koljeno**, a silazak je najgori dio. Fit dio ekipe može gore zasebno (~1,5 h) dok ostali hodaju donjom stazom.\n\n**Ruta za sve:** taksi iz Jongnoa u **Seochon** (~10 min), pa:\n1. **Dolina Suseong-dong (수성동계곡):** mala obnovljena dolina na kraju Ogin-donga, borovi, granitne gromade, kameni most iz doba Joseona. Obnovljena 2012. rušenjem betonskih stambenih zgrada. Ravna šljunčana staza.\n2. **Inwangsan Jarak-gil (자락길):** **drvena staza i asfaltna pješačka traka podno planine**, gotovo bez stepenica.\n3. **Vidikovac Mumu-dae (무무대):** pogled na **Gyeongbokgung, Plavu kuću (Cheong Wa Dae) i planinu Bugaksan**. Lišće na vrhuncu.\n4. Kraj u **parku Sajik
