**, dalje taksijem.\n\nGradski zid iz 1396. vidi se iznad staze na grebenu.", "alts": [{"title": "Seodaemun Prison", "text": ", kišni plan: kolonijalni zatvor (1908.), ćelije od cigle, mjesto pogubljenja, podzemne sobe za ispitivanje, vrlo dobro postavljen. **3 000 ₩, nedjeljom 09:30–18:00**, metro Dongnimmun, izlaz 5", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Vrh Inwangsana", "text": ", samo za dobra koljena, zasebno", "meta": ["⏱ 1,5 h", "☀️", "🦵🦵🦵"]}, {"title": "Šamanistička tura na Inwangsanu:", "text": "~28 €, 2,5 h, s opcionalnom sesijom kod šamanke uz prevoditelja. Redovnih tura na engleskom možda nema, pa provjeriti postoji li termin i rezervirati oko 25.10.", "meta": ["⏱ 2,5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "16:00", "key": "16:00", "title": "Opcija: Guksadang i Seonbawi", "meta": ["⏱ 45 min", "🌦️", "🦵🦵 kratke stepenice"], "body": "S druge strane planine, **~15 min uzbrdo od stanice Dongnimmun (L3), izlaz 2**, ili taksijem iz parka Sajik. **Guksadang (국사당)** je **aktivno šamanističko svetište** (preseljeno s Namsana za japanske okupacije), gdje se i danas održavaju obredi **gut**: bubnjevi, plesovi, ponude hrane. Iznad su **Seonbawi (선바위)**, **izlizani granitni stupovi nalik redovnicima u halji**, gdje šamanke i žene mole za blagoslov. Gledamo s distance, obrede ne fotografiramo izbliza. Najneobičnije mjesto u Seoulu, i besplatno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Zalazak s Inwangsana", "meta": [], "body": "Zalazak je oko 17:30, s Inwangsana ili Mumu-daea pogled na grad u sumrak, pa taksi ~5 min dolje u Seochon.\n\n⚠️ **Samo ako Seoul Sky nije bio 20.10.:** taksi ili metro do Jamsila (~50 min), ulaz oko 17:00, pa s Inwangsana krenuti oko 16:00. Tada **Bar Cham i Guksadang otpadaju**, a večera je BBQ blizu kuće oko 20:30.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "🍸 Bar Cham (참), aperitiv u Seochonu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Tongin-dong**, 5 min pješice od kraja šetnje: koktel-bar u **hanoku**, na listi **Asia's 50 Best Bars**, kokteli s korejskim žestokim pićima (soju, makgeolli, omija, ginseng). **Srijeda–ponedjeljak 18:00–01:00, utorkom zatvoreno**, pa nedjeljom radi. Dolazimo **na otvaranje u 18:00**, bez rezervacije ili preko CatchTablea. Jedan ili dva koktela, pa taksi doma (~25 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:30", "key": "19:30", "title": "🔥 Zadnja večera: korejski BBQ u Yeonnam-dongu", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "Zadnji **korejski roštilj** blizu kuće: npr. **Yukmong** ako se svidio u četvrtak (rezervacija preko Navera ili CatchTablea, tel. 02-338-1142), ili bilo koji samgyeopsal s redom domaćih uz **Gyeongui Line Forest Park**. Piće u Hongdaeu ili kod kuće, **5 min do kreveta i kofera**.", "alts": [{"title": "Tosokchon Samgyetang (토속촌 삼계탕)", "text": ", Chebu-dong, kod Bar Chama: cijela mala piletina punjena rižom, ginsengom i češnjakom u mliječnoj juhi, 20–25 000 ₩, 10:30–21:30. ⚠️ Dio sjedenja je **na podu**, tražimo stol. Ako ekipa ipak želi ostati u Seochonu", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "22:00", "key": "22:00", "title": "Pakiranje", "meta": [], "body": "Kofere pakiramo večeras, ujutro nema vremena (vidi 2.11.).", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Tajni vrt nije rezerviran:** blagajna u 08:30, ili palača i Changgyeonggung.\n- **Kiša:** umjesto Inwangsana Seodaemun Prison; Bar Cham i BBQ ostaju.\n- **Seoul Sky nije odrađen:** Jamsil u 17:00, Guksadang i Bar Cham otpadaju, BBQ blizu kuće oko 20:30.\n- **Koljeno:** samo dolina Suseong-dong i Mumu-dae, bez Guksadanga.\n- **Svi umorni:** bez Guksadanga i Bar Chama, ravno na BBQ.\n- **Red u Cheongsudangu predug:** drugi hanok kafić u Ikseonu.", "heading": "Ned 1.11. — Tajni vrt, Cheongsudang, Inwangsan, Bar Cham i zadnji BBQ", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Nedjelja, 1. 11. · Seoul — javori, palača i posljednja večer", "text": "Dan počinjemo posjetom 🔒 **palači Changdeokgung i Tajnom vrtu**, jednom od najljepših mjesta za jesenske boje u Seoulu. Krajem listopada i početkom studenoga javori često su u vrhuncu jesenske ljepote, iako stvarno stanje ovisi o vremenu te godine. Termin ovisi o rezervaciji napravljenoj 26. 10.; ako online nije uspjelo, blagajna otvara u 09:00 i treba doći ranije. Odmah nakon vrta svraćamo u **Cheongsudang**, kafić u tradicionalnoj kući s jezercem, bambusom i lampionima, poznat po desertima. Za ručak biramo **juhu od volovskih kostiju**, poznatu kao *seolleongtang*, u restoranu s tradicijom koja seže do 1904. godine. Poslijepodne slijedi lagana šetnja **podno planine Inwangsan**, ravnijom stazom od doline Suseong-dong do vidikovca s pogledom na palaču i grad, uz zalazak sunca. Za kraj dana pijemo koktel u **Bar Chamu**, baru u tradicionalnoj kući, a posljednju večeru jedemo uz **korejski roštilj blizu kuće**. Nakon večere slijedi pakiranje i priprema za rano jutarnje putovanje prema aerodromu."}, "rows": [{"time": "~09:30", "key": "09:30", "text": "🔒 **Changdeokgung i Tajni vrt.** Termin ovisi o rezervaciji od 26.10. (engleski u 10:30 / 11:30 / 14:30 / 15:30). Ako online nije uspjelo, blagajna oko 08:30.", "altHint": false, "slot": 0}, {"time": "~12:05", "key": "12:05", "text": "☕ **Cheongsudang**, Ikseon-dong, 10 min od palače: hanok kafić s jezercem, bambusom i lampionima, deserti. ⚠️ Nedjeljom red.", "altHint": false, "slot": 1}, {"time": "~13:00", "key": "13:00", "text": "Ručak u **Imun Seolnongtangu:** mliječnobijela juha od volovskih kostiju s prsima, od 1904.", "altHint": false, "slot": 2}, {"time": "14:15", "key": "14:15", "text": "Taksi u Seochon, pa **dolina Suseong-dong** i **ravna staza Inwangsan Jarak-gil** do vidikovca **Mumu-dae** (pogled na palaču i Plavu kuću) i do parka Sajik. Ukupno ~1,5 h. Vrh po stepenicama preskačemo zbog koljena.", "altHint": false, "slot": 3}, {"time": "16:00", "key": "16:00", "text": "*Opcija:* **šamansko svetište Guksadang i stijene Seonbawi**, taksi oko brda i kratke stepenice.", "altHint": false, "slot": 4}, {"time": "17:30", "key": "17:30", "text": "Zalazak s Inwangsana. ⚠️ **Seoul Sky** samo ako nije bio 20.10. (tada Bar Cham otpada).", "altHint": false, "slot": 5}, {"time": "18:00", "key": "18:00", "text": "🍸 **Bar Cham**, koktel-bar u hanoku u Seochonu (Asia's 50 Best), na otvaranju, aperitiv.", "altHint": false, "slot": 6}, {"time": "19:30", "key": "19:30", "text": "🔥 **Zadnja večera: korejski BBQ** u Yeonnam-dongu (npr. Yukmong), 5 min do kreveta.", "altHint": false, "slot": 7}, {"time": "22:00", "key": "22:00", "text": "Doma, **pakiranje**. Sutra rano na aerodrom.", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "2.11", "d3heading": "PON 2.11. — ODLAZAK (KE937, T2, 11:55 → BEČ 16:55)", "night": "", "intro": "**Plan: AREX all-stop s Hongik Univ.**, 5 min od stana, ravno do T2, ~5 000 ₩. ⚠️ **AREX express ne staje na Hongik Univ.** Gradski check-in na Seoul Stationu (Korean Air ga nudi, rok za T2 je **3 h 20 min prije leta, dakle 08:35**) tražio bi raniji polazak i dva taksija, ne isplati se.\n\n**Rezerva je jumbo taksi**, ako pada kiša, ako je netko bolestan ili ako se ne da vući kofere. **Naručiti večer prije** (vidi dolje).", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "Večer prije (nedjelja 1.11.)", "meta": [], "body": "- **Kofere spakirati** i izvagati (Korean Air obično dopušta 1 × 23 kg, provjeriti na karti).\n- **Doručak za jutro** iz 7-Elevena (26 m od stana): kimbap, sendviči, kava.\n- **T-money kartice** napuniti za ~6 000 ₩ svaka (AREX all-stop ~5 000 ₩).\n- **Online check-in** kod Korean Aira, otvara se 48 h prije: sjedala, digitalna karta.\n- Ako ide rezerva, **jumbo taksi naručiti za 07:45** (Kakao T, \"Jumbo\" ili \"Venti\", ili zamoliti hosta).\n- Poruka hostu o odlasku i gdje ostaviti ključ.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "Kontrolne točke (srednje optimističan scenarij)", "md": "| Vrijeme | Točka | Napomena |\n|---|---|---|\n| **06:30** | Ustajanje | Tuš, doručak u stanu. |\n| **07:15** | Zadnja provjera | Putovnice, telefoni, punjači, tablete, računi za povrat poreza **u ručnu prtljagu**. Smeće, ključ. |\n| **07:25** | Izlazak | Pješice **~360 m do ulaza u AREX na Hongik Univ. (izlaz 3)**, ~8 min s koferima. |\n| **07:35** | Peron | AREX je duboko pod zemljom, pa **dizala** (znak 엘리베이터), ne pokretne stepenice s koferima. Ulaz T-money karticom. Smjer **인천공항 (Incheon Airport)**. Vlakovi svakih 6–12 min. |\n| **~07:45** | 🚆 Ukrcaj, AREX all-stop | Stajemo uz kraj vagona s koferima. **~56 min do T2** (od Seoul Stationa do T2 je 66 min). Prvo staje T1 (~08:35), **ne izlazimo**, Korean Air je na **T2**. |\n| **~08:41** | Stanica Incheon T2 | Prometni centar (B1), pa dizalom na **3. kat, odlasci**. ~10 min. |\n| **~08:55** | Odlazna dvorana | *Ako treba:* **kiosk za povrat poreza** (skenira putovnicu i račune) ili carina za ovjeru robe koja ide u predanu prtljagu. Inače ravno na check-in. Korean Air otvara check-in **3 h prije leta, u 08:55**. |\n| **~09:10** | Check-in i predaja kofera | Šalteri Korean Aira ili samoposlužni kiosk i bag drop. Red 15–30 min. **Zatvara sat prije leta, u 10:55.** |\n| **~09:45** | Sigurnosna kontrola | Tekućine do 100 ml u vrećici, laptopi van. 15–25 min. |\n| **~10:10** | Izlazna kontrola putovnica | Šalteri za strance ili automatska vrata ako smo registrirani. 5–15 min. |\n| **~10:20** | Iza kontrole | **Povrat poreza u gotovini** na kioscima iza kontrole. Zadnji korejski doručak (food court T2), duty-free. |\n| **~11:00** | Prema izlazu | Izlazi T2 su 230–270, sve u jednoj zgradi, do 10 min hoda. |\n| **~11:15** | Ukrcaj počinje | ~40 min prije polaska. **Vrata se zatvaraju oko 11:40.** |\n| **11:55** | ✈️ **KE937 → Beč 16:55** | |\n\n**Rezerva u vremenu:** ~1 h. **Najkasniji siguran izlazak iz stana: oko 08:15** (T2 oko 09:30, check-in do 10:55 još stane, ali bez doručka i duty-freeja).", "top": false}, {"title": "Povrat poreza (tax refund)", "md": "PDV je 10 %, stvarni povrat nakon naknada je **5–8 % cijene**. Najjednostavniji je **trenutni povrat u trgovini** (pokazati putovnicu) za račune od 15 000 ₩. Na ICN-u kiosk skenira putovnicu i račune; **roba koju carina možda želi vidjeti ide u ručnu prtljagu**, ne u kofer. Iznosi do ~75 000 ₩ obično prolaze bez pregleda.", "top": false}], "triggers": "", "heading": "Pon 2.11. — Odlazak (KE937, T2, 11:55)", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Ponedjeljak, 2. 11. · Seoul → Incheon (ICN) — povratak kući", "text": "Ustajanje u 06:30. S koferima pješice odlazimo do stanice **Hongik University**, odakle planiramo sjesti na **AREX All-Stop Train** prema zračnoj luci Incheon, terminalu 2. Vožnja traje približno 56 minuta, a vlak staje na više stanica. Nakon dolaska slijede prijava na let, predaja prtljage i sigurnosna kontrola. Ako ostane vremena, možemo pojesti posljednji korejski doručak u prostoru iza sigurnosne kontrole. **Let KE937 polijeće u 11:55.** Rezervna opcija je unaprijed naručeni veliki taksi (*jumbo taxi*), koji treba rezervirati večer prije ako procijenimo da će prtljaga ili jutarnji raspored otežati odlazak javnim prijevozom."}, "rows": [{"time": "Večer prije", "key": "večer prije", "text": "**Večer prije (nedjelja 1.11.)**", "altHint": false, "slot": 0, "d3only": true}, {"time": "06:30", "key": "06:30", "text": "Ustajanje, koferi su spakirani večer prije.", "altHint": false, "slot": null}, {"time": "07:25", "key": "07:25", "text": "Izlazak, pješice ~360 m do ulaza u AREX (Hongik Univ., izlaz 3).", "altHint": false, "slot": null}, {"time": "~07:45", "key": "07:45", "text": "🚆 **AREX all-stop do Incheona T2**, ~56 min, ~5 000 ₩. Express ovdje ne staje.", "altHint": false, "slot": null}, {"time": "~08:45", "key": "08:45", "text": "Na T2 dizalom na 3. kat (odlasci). Kiosk za povrat poreza ako treba.", "altHint": false, "slot": null}, {"time": "09:10", "key": "09:10", "text": "Check-in kod Korean Aira i predaja kofera.", "altHint": false, "slot": null}, {"time": "09:45", "key": "09:45", "text": "Sigurnosna kontrola i izlazna kontrola putovnica.", "altHint": false, "slot": null}, {"time": "10:15", "key": "10:15", "text": "Iza kontrole: zadnji korejski obrok, duty-free, povrat poreza u gotovini.", "altHint": false, "slot": null}, {"time": "11:15", "key": "11:15", "text": "Ukrcaj, vrata se zatvaraju oko 11:40. **11:55 KE937 → Beč 16:55.**", "altHint": false, "slot": null}], "plans": [{"label": "Rezerva · jumbo taksi", "replaces": ["07:25", "07:45"], "summary": "**Rezerva: jumbo taksi** (Staria ili Carnival) od vrata do T2, 07:45 → ~09:00, ~65–100 000 ₩ plus ~8 000 ₩ cestarine. **Naručiti večer prije**, preko Kakao T \"Jumbo\" ili hosta.", "detail": {"title": "Rezerva — jumbo taksi", "meta": [], "md": "**Kombi taksi (Kia Carnival ili Hyundai Staria) za četiri osobe i četiri velika kofera**, od vrata do vrata (odlasci T2, 3. kat).\n- **Naručiti večer prije za 07:45:** Kakao T aplikacija (\"Jumbo\" ili \"Venti\", traži registraciju i stranu karticu, **testirati ranije**), ili **zamoliti hosta** da naruči.\n- **60–75 min**, **65–100 000 ₩ plus ~7 900 ₩ cestarine**, dakle 20–27 000 ₩ po osobi.\n- ⚠️ **U obični taksi ne stanemo** (četiri osobe i četiri kofera). **Aerodromski bus se ne preporučuje**, u jutarnjoj gužvi vozi 70–90 min.\n- Dolazak oko 09:00, dalje isti raspored od check-ina.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": []}], "cities": {"seoul": {"id": "seoul", "name": "SEOUL", "heading": "🏙️ SEOUL", "intro": "Grad svjetske klase koji većina itinerara podcjenjuje: palače, tržnice, planine usred grada i noćni život koji ne staje. Jesenske boje sazrijevaju tijekom putovanja: na dolasku su tek početne, a vrhunac dosežu 31.10.–1.11.\n\n**Temperature:** 19.–22.10. danju 20–22 °C, noću 10–12 °C. Dana 1.11. danju 13–14 °C, noću 5–6 °C, pa za zadnju večer treba pravi kaput.\n\n⚠️ **Gyeongbokgung je zatvoren utorkom, Changdeokgung ponedjeljkom.** Obje su planirane za drugi boravak u Seoulu.", "extras": {"heading": "🧱 DODATNE OPCIJE — SEOUL I (Jongno, 19.–20.10.)", "md": "Aktivnosti koje nisu vezane za termin: ubacuju se gdje ostane rupa ili gdje nešto otpadne. Aktivnosti u Hongdaeu (bowling, sjekire, rage room, VR) su u tablici za Seoul II.\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Sewoon Sangga deck** | kompleks iz 1960-ih između Jongna i Euljira, povišena šetnica, kafići i stare elektroničke radnje · pon–sub 09:00–19:00 | 45 min | 🌦️ | lagano |\n| **Ramyeon automat uz rijeku Han** | paket se kupi u dućanu (4–5 000 ₩), skenira se zdjela i aparat sam skuha. Noćni seulski ritual (Yeouido, Banpo, Ttukseom) | 30 min | 🌦️ | lagano |\n| **Ulice hrane na Namdaemunu** | ulica pirjane ribe hairtail (galchi-jorim) i ulica kalguksua · pon–sub 06:00–20:00, **nedjeljom zatvoreno** | 1 h | 🌦️ | lagano |\n| **Tosokchon samgyetang** | piletina punjena rižom u juhi od ginsenga, 20–25 000 ₩, kod Gyeongbokgunga, 10:00–22:00 · ⚠️ **sjedi se na podu prekriženih nogu, loše za Lucijino koljeno** | 1 h | ☔ | lagano |\n| **Bar Sookhee (숙희)** | skriveni koktel bar u hanok stilu, Euljiro · 20–25 000 ₩ plus couvert 5–10 000 ₩ · 18:00–02:00 | 1,5 h | ☔ | lagano |\n| **Jean Frigo (장프리고)** | bar iza vrata hladnjaka u voćarni, Gwanghui-dong kod Dongdaemuna · 18:00–01:30, ponedjeljkom zatvoreno | 1,5 h | ☔ | lagano |\n| **Park Naksan i gradski zid** | iza apartmana, osvijetljen noću, besplatno | 1 h | ☀️ | srednje |\n| **Coin noraebang** | 500 ₩ za 1–2 pjesme, engleske pjesme preko gumba \"country\" | 30 min | ☔ | lagano |\n| **Self-photo studio** | privatna foto-soba, 25–60 000 ₩ po grupi, rođendanska uspomena | 20 min | ☔ | lagano |\n| **Noraebang** | 15–25 000 ₩ po sobi na sat | 1 h | ☔ | lagano |\n| **Namdaemun** | tržnica i naočale isti dan | 1,5 h | 🌦️ | lagano |\n| **Gyeongdong i Starbucks 1960** | tržnica ljekovitog bilja, kafić u starom kinu | 1,5 h | ☔ | lagano |\n| **Dongdaemun noću** | veleprodaja 20:00–08:00 | 1,5 h | ☔ | lagano |\n| **Duga fontana Banpo** | od 19:30 svakih 30 min, do 31.10. | 45 min | ☀️ | lagano |"}}, "sokcho-i-seoraksan": {"id": "sokcho-i-seoraksan", "name": "SOKCHO I SEORAKSAN", "heading": "⛰️ SOKCHO I SEORAKSAN", "intro": "Seoraksan (**1 708 m**) treća je najviša planina u zemlji i najpoznatije jesensko odredište Koreje. Boje su ovdje neobično žive: na visini brzo zahladi, pa lišće ostane jarko crveno i narančasto umjesto da posmeđi.\n\nSokcho nije samo spavaonica za planinu nego mali obalni grad s vlastitom hranom, potpuno drukčijom od seulske: crveni rakovi, punjena lignja i lokalna verzija pržene piletine.\n\n⚠️ **Dva upozorenja:**\n1. **Vrhunac lišća prognoziran je za 12.–25.10., najjači tjedan je 15.–22.10.** Dolazimo 22.10., na **repu vrhunca**. Više doline možda su već prošle, srednje i niže trebale bi biti u punoj boji. Jujeongol drži boju najdulje i služi kao rezerva.\n2. **Ovo je najposjećenija jesenska destinacija u zemlji, više od 2 milijuna posjetitelja godišnje.** Vikend 25.–26.10. statistički je najgori vikend korejske jeseni, a tada smo već u Gyeongjuu.\n\n**Temperature:** na stazama 12–15 °C, na visini **2–5 °C**, u zoru na ulazu u park oko nule. Slojevita odjeća je obavezna.", "extras": {"heading": "🧱 DODATNE OPCIJE — SOKCHO I SEORAKSAN (21.–23.10.)", "md": "Dani 4 i 5 međusobno su zamjenjivi, Ulsanbawi ide na vedriji dan.\n\n**Planina i priroda**\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Biseondae** | uz potok Cheonbuldong do litica, 6 km povratno, gotovo ravno | 2–2,5 h | 🌦️ | lagano |\n| **Biryong slapovi** | viseći mostovi, slapovi Yukdam i Biryong, 4,8 km, ~180 m uspona | 2–2,5 h | 🌦️ | srednje |\n| **Dolina Cheonbuldong dalje** | ~12 km slapova iza Biseondaea, dobra po mokrom | 3–5 h | 🌦️ | srednje |\n| **Dolina Jujeongol** | strana Osaek, ravne drvene staze, boja se drži najdulje · ~1 h vožnje | 2,5–3 h | 🌦️ | lagano |\n| **Žičara Gwongeumseong** | 16 000 ₩, **karte samo na dan, na šalteru**, redovi 60–90 min, vjetar je zaustavlja | 1,5–2,5 h | ☀️ | lagano |\n| **Daecheongbong** | vrh od 1 708 m, 9,5 km preko Osaeka, traži razdvajanje | 5–6 h | ☀️ | vrlo teško |\n| ❌ **Vidikovac Towangseong** | iznad Biryonga, 900+ strmih stepenica, nije za koljeno | +1 h | ☀️ | vrlo teško |\n| ❌ **Heullimgol** | 6,2 km, ~450 m spusta po grubom kamenu, treba online dozvola | 3,5–4 h | ☀️ | teško |\n\n**Grad, obala i neobično**\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Brodogradilište Chilsung** | kafić-muzej u starom brodogradilištu, 11:00–19:00/20:00 | 45 min | ☔ | lagano |\n| **Abai Village i gaetbae** | selo sjevernokorejskih izbjeglica, skela na užetu 500 ₩, 05–23 h | 1–1,5 h | 🌦️ | lagano |\n| **Jezero Cheongcho** | šetnica, besplatna izložba krizantema do početka studenog, navečer osvijetljena · Expo toranj | 1 h | 🌦️ | lagano |\n| **Plaža Sokcho i Sokcho Eye** | gradska plaža, panoramski kotač (~12 000 ₩) | 1 h | ☀️ | lagano |\n| **Staza Oeongchi (바다향기로)** | 1,7 km drvene staze uz stijene, do 2018. vojna zona | 1 h | ☀️ | lagano |\n| **Nacionalni planinarski muzej** | besplatno, soba koja simulira visinu, stijena za penjanje, ponedjeljkom zatvoreno | 1–1,5 h | ☔ | lagano |\n| **Sokcho City Museum** | 2 000 ₩, rekonstrukcija izbjegličkih kuća, ponedjeljkom zatvoreno | 1–1,5 h | ☔ | lagano |\n| **Naksansa** | obalni hram na stijeni · ⚠️ hram-budžet | 1,5 h | 🌦️ | srednje |\n| **Hwajinpo, \"vila Kim Il-sunga\"** | kamena vila iz 1938. koju je koristila obitelj Kim, uz vilu Syngmana Rheeja, 3 000 ₩, 09–18 · 40–50 min sjeverno | pola dana | 🌦️ | lagano |\n| ❌ **Promatračnica ujedinjenja Goseong i DMZ muzej** | treba auto i provjera putovnica, taksi tamo i natrag pojede pola dana | pola dana | ☀️ | lagano |\n| ❌ **Luka Daepo** | skandal s cijenama 2025., nametljivi prodavači, pola štandova prazno | — | — | — |\n\n**Bazeni i spa (treba kupaći)**\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| ✅ **Seorak Waterpia Spa Valley (plan, 22.10.)** | 18 vanjskih termalnih bazena, kupaći i kapa, ~42 000 ₩ online / 74 500 ₩ na blagajni, 10–21:30 | 2–3 h | ☔ | lagano |\n| ⚠️ 💸 **Sono Calm Delpino, krov** (samo ako Waterpia propadne) | 11. kat, pogled na Ulsanbawi, 19+, kupaći i kapa, ~40–50 000 ₩, petkom do 19:00 · vjetar zatvara | 2–3 h | ☔ | lagano |\n| **Lotte Resort infinity bazen** | pogled na more, ~35–45 000 ₩, navečer samo odrasli | 2 h | ☔ | lagano |\n| **Delpino Ocean Play** | vodeni park istog resorta, sve dobi | 2 h | ☔ | lagano |\n| ❌ **Topli izvori Cheoksan** | 53 °C, ali golo i odvojeno po spolu | 1,5 h | ☔ | lagano |\n\n**Hrana i noć (samo kuhano)**\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Sadonjib** | mulgomtang (gulaš od ribe eelpout), 08–15, **četvrtkom zatvoreno** | 1 h | ☔ | lagano |\n| **Sindasin** (Abai) | ojingeo-sundae, abai-sundae, gari-gukbap (juha od govedine i rotkve), 08:30–20:00 | 1 h | ☔ | lagano |\n| **Dancheon Sikdang** (Abai) | abai-sundae; ⚠️ kombinirani tanjuri sadrže **sirovi pollock**, naručivati pojedinačno | 1 h | ☔ | lagano |\n| **88 Saengseon-gui** | riba pečena na stolu, 08:30–20:15, pauza 15–16:30, puno dima | 1–1,5 h | ☔ | lagano |\n| **Yes Su-san** | sjedeći setovi crvenog raka ~26–36 000 ₩ po osobi, 10:30–20:00, utorkom zatvoreno | 1,5–2 h | ☔ | lagano |\n| **Gessadagu / Sokcho Bulgeun Daege Susan** | crveni rakovi za van, ~10 000 ₩ komad | 1,5 h | ☔ | lagano |\n| **Manseok Dakgangjeong** | slatko-ljuta pržena piletina u kutiji, 18–22 000 ₩, 10–20 h | 30 min | ☔ | lagano |\n| **Sulbbang** (štand 54) | kruh od makgeollija, rasproda se prije 17:00 | 15 min | ☔ | lagano |\n| **Gim Yeong-ae Halmeoni Sundubu** | tofu zgrušan morskom vodom, 07–14, utorkom zatvoreno | 1 h | ☔ | lagano |\n| **Baramkkot Haenyeo Maeul** | seopguk, lonac s abalonom, srijedom zatvoreno | 1 h | ☔ | lagano |\n| **Montbeer** | craft pivovara s pogledom na Ulsanbawi, od 13:30, pizza, kobasice, piletina | 1–1,5 h | ☔ | lagano |\n| **Craftroot** | craft taproom u zgradi od cigle | 1 h | ☔ | lagano |\n| **Šatori u Yeongrang-dongu** | Maljane, Danggeun Macha, barovi u šatorima uz more, 15/16–02 h, naručiti kuhano | 1–2 h | 🌦️ | lagano |\n| **Dalbit Yajang i Freezer Club** | noćni food court u staroj hladnjači i plesna soba, 18–24, srijeda–nedjelja | 1–2 h | ☔ | lagano |"}}, "gyeongju": {"id": "gyeongju", "name": "GYEONGJU", "heading": "🏛️ GYEONGJU", "intro": "Prijestolnica kraljevstva Silla, koje je vladalo gotovo tisuću godina. Cijeli grad je muzej na otvorenom: grobni humci veličine zgrada stoje usred ulica, pagode izranjaju iz šuma, a UNESCO-ovi lokaliteti nižu se jedan do drugoga. Stranih turista znatno je manje nego u Seoulu ili na Seoraksanu, pa je tempo sporiji, a hrana autentičnija.\n\n**Jesen:** lišće ovdje kulminira **kasnije nego na Seoraksanu, krajem listopada i početkom studenog**, pa stižemo u pravom trenutku. Prilazna cesta Bulguksi je tunel od crvenih javora.\n\n🌧️ **Prognoza (stanje 24.10. ujutro):** subota i nedjelja povremena slaba kiša (60–70 %, svega par mm), **ponedjeljak uglavnom suh** (20–30 %, ali tlo mokro), utorak vedar. Plan je zato složen tako da vanjski dio nedjelje (bicikli) seli na ponedjeljak. **Izvedivost:** 🟢 ok · 🟡 vjerojatno ok · 🟠 možda · 🔴 teško · ⚫ neizvedivo. **Lucijino koljeno** je na Ulsanbawiju bilo odlično, pa staze više nisu ograničenje, nego samo kiša i blato.", "extras": {"heading": "🧱 DODATNE OPCIJE — GYEONGJU (24.–26.10.)", "md": "Bicikli i Namsan zamjenjivi su na ponedjeljak popodne, Yangdong i nedjeljni blok pod krovom mogu zamijeniti mjesta s ponedjeljkom. Nacionalni muzej je univerzalni kišni blok, a dvorana Hwangnyongsa drugi. ⚠️ **Ponedjeljak 26.10.:** kuća Choi, noćna tržnica, Ooyang, Muzej pop glazbe, „경주연대기”, staklenik i mnogi obiteljski restorani su zatvoreni.\n\n**Znamenitosti**\n\n| Opcija ni vjetar ~23 km/h. Na dan provjeriti satnu prognozu (KMA / Naver 날씨).\n\n**Glavna promjena:** bicikli sele s nedjelje na **ponedjeljak popodne** (umjesto Namsana). Nedjelja popodne ide **pod krov** (muzej i dvorana Hwangnyongsa). **Lucijino koljeno** je na Ulsanbawiju bilo odlično, pa šumska staza od Seokgurama i cijeli Igidae ponovno ulaze u plan.\n\n**Izvedivost:** 🟢 ok · 🟡 vjerojatno ok · 🟠 možda · 🔴 teško · ⚫ neizvedivo\n\n| Stavka | Po kiši | Po suhom | Napomena |\n|---|---|---|---|\n| Daereungwon, Gyochon | 🟡 | 🟢 | ravne staze |\n| Cheonmachong | 🟢 | 🟢 | unutra u humku |\n| Kuća Choi | 🟡 | 🟢 | dvorišta i strehe · **samo 24.10.** |\n| Anapji, Cheomseongdae | 🟡 | 🟢 | po slaboj kiši mokri odrazi su lijepi |\n| Woljeonggyo | 🟢 | 🟢 | natkriven |\n| Noćna tržnica Jungang | 🟢 | 🟢 | pod krovom · ne radi ponedjeljkom |\n| Hwangnam Geobuk (vatra vani) | ⚫ | 🟠 | |\n| Yangdong | 🟡 | 🟢 | sve vani, rampe kližu |\n| Krug biciklima | ⚫ | 🟢 | |\n| Polje Hwangnyongsa, Bunhwangsa (pješice, taksijem) | 🟠 | 🟢 | blato |\n| Pink muhly | 🟠 | 🟡 | iza vrhunca, po kiši tužno |\n| Nacionalni muzej | 🟢 | 🟢 | gužva vikendom po kiši |\n| Dvorana Hwangnyongsa | 🟢 | 🟢 | |\n| Bulguksa | 🟡 | 🟢 | mokre kamene stepenice |\n| Seokguram, bus | 🟢 | 🟢 | |\n| Šumska staza Seokguram → Bulguksa | 🔴 | 🟡 | po mokrom kamenu polako |\n| Namsan, Samneung | 🟠 | 🟡 | blato nakon kiše |\n| Viši Namsan (Geumobong, Chilburam) | ⚫ | 🟠 | stijene, više nije izbačeno zbog koljena |\n| Seochulji | 🟡 | 🟢 | |"}]}, "busan": {"id": "busan", "name": "BUSAN", "heading": "🌊 BUSAN", "intro": "Radni lučki grad: prava obala, vlakići i hram uz more, šarena sela na brdima, šetnja po litici nad morem i hrana koja postoji samo ovdje: dwaeji gukbap, milmyeon, ssiat hotteok, Dongnae pajeon. Više je noćni nego dnevni grad, a vrhunac je Gwangalli s osvijetljenim mostom.\n\n**Temperature:** 19–21 °C danju, 11–13 °C noću, najblaže na cijelom putovanju.", "extras": {"heading": "🧱 DODATNE OPCIJE — BUSAN (27.–28.10.)", "md": "Busan je obalni i noćni grad, kiša mu pogađa gotovo sve vanjsko. Hotel je kod Busan Stationa: Nampo i Jagalchi tri stanice metroom, Gwangalli ~25 min taksijem, Haeundae ~35 min. ⚠️ Riblje tržnice i riba za doručak izbačeni su iz plana (želja ekipe), ali ostaju u tablici kao opcija.\n\n**Znamenitosti i obala**\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Oryukdo Skywalk** | stakleni pod 37 m nad morem, besplatno, 09–18, zatvara se po kiši i vjetru | 45 min | ☀️ | lagano |\n| **Igidae, sjeverni kraj** | Dongsaengmal do Eoulmadanga, ~1 km drvene staze | 1 h | ☀️ | lagano |\n| ✅ **Igidae, cijela staza** (plan 27.10., uz Plan B) | 4,7 km, 70+ strmih stepeništa, bez izlaza; odluka večer prije prema koljenu | 2,5–3 h | ☀️ | teško |\n| **Staza Blueline Park** | stara pruga uz more, potpuno ravna, Mipo do Songjeonga | 1,5–2 h | ☀️ | lagano |\n| **Huinnyeoul** | selo na litici, samo gornja staza · 🅱️ fallback 2 za Gamcheon (28.10.) | 1,5 h | ☀️ | lagano |\n| ✅ **Gamcheon lite** (plan 28.10.) | gornji ulaz taksijem, samo glavna ulica i jedan vidikovac, bez Malog princa | 1 h 15 min | 🌦️ | lagano / strme uličice |\n| **Gamcheon do kraja** | 🅱️ fallback 1: uličice s muralima, muzeji, zalazak iz sela | 2–3 h | 🌦️ | teško |\n| 🅰️ **Sky Capsule** (opcija 28.10.) | kabina za 4 po tračnici uz more Mipo ↔ Cheongsapo, ~50 000 ₩ po kabini · online rasprodano, pratiti otkazivanja | 30 min + put | ☀️ | lagano |\n| **Beach Train** | vlakić uz more Mipo → Songjeong, 7–16 000 ₩ · po recenzijama samo rezervna opcija | 30 min | 🌦️ | lagano |\n| 🅲 **Šuma Ahopsan** (opcija 28.10.) | 400 godina stara obiteljska šuma bambusa i borova, 8 000 ₩, 09–18, ravno, štapovi zabranjeni | 1–1,5 h | 🌦️ | lagano |\n| **Crkva Jukseong \"Dream\"** | filmska kulisa crkve na stijenama uz more, Gijang, besplatno | 45 min | 🌦️ | lagano |\n| **Wave On Coffee** | arhitektonski kafić nad morem, Jangan-eup, skupo | 1 h | ☔ | lagano |\n| ✅ **Haedong Yonggungsa** (plan 28.10.) | hram na stijenama uz more, besplatno  4 h s putom | ☔ | lagano |\n| ❌ **Siloam i Dragon Hill Spa** | zatvoreni | — | — | — |\n| ❌ **Zid na Naksanu prema Ihwi** | strmi silazak po stepenicama | — | — | — |\n| ❌ **Vrh Inwangsana** | 90 % strmih stepenica, samo za dobra koljena | 1,5 h | ☀️ | teško |"}}}, "info": [{"id": "dio-4", "title": "DIO 4 — TKO SMO", "md": "Četvero ljudi, rane tridesete. Manuel, Goran i Lucija bili su u Japanu u travnju 2025.; Matej nikad nije bio u Aziji.\n\n### Što traže\n\n> *\"Ludi izlazak tipa escape room\"* — **Manuel**\n> *\"Doživjeti nešto što ne možemo naći u Europi\"* — **Goran**\n> *\"Novi doživljaji\"* — **Lucija**\n> *\"Puno pamtljivih doživljaja\"* — **Matej**\n\n### Pouke iz Japana\n\n1. **Rezati, ne gomilati** — kad je sve \"7–8\", na kraju se ne stigne ništa.\n2. **Slavno zna razočarati, a malo iznenaditi** — tržnice i arkade bile su bolje od očekivanog.\n3. **Rezervirati na vrijeme** — sve što je tražilo rezervaciju je propušteno.\n4. **Falilo je malo, neotkriveno selo.**\n\nOstale želje: bez golih kupki (Delpino, kupaći), tradicionalna kuća (hanok u Gyeongjuu), shopping se ne planira (Namdaemun usput).\n\n### Tvrda ograničenja\n\n| # | Pravilo | Izvor |\n|---|---|---|\n| 1 | 14 noći, 19.10. → 1.11. | letovi |\n| 2 | 5–6 noći u Seoulu | jednoglasno |\n| 3 | Maksimalno 4 selidbe | Q24 |\n| 4 | Minimalno 2 noći po bazi | odluka nakon Runde 1 |\n| 5 | Maksimalno ~3 h putovanja u jednom smjeru | Q21 |\n| 6 | Nula dana odmora | jednoglasno |\n| 7 | Hikerski strop ~4–5 h grupno | Lucijino koljeno |\n| 8 | Bez sirove ribe | 3–1 protiv |\n| 9 | Max 2–3 hrama ukupno | hram-burnout iz Japana |\n| 10 | Cijele dane se ne razdvajamo | odluka Manuel |\n\n### Što svima odgovara\n\n✅ **Visine** — sva četvorica \"nikakav problem\". Stakleni podovi, žičare, skywalkovi, sve prolazi.\n✅ **Rana jutra** — sva četvorica \"rado\". Polasci u 7:00 su u redu.\n✅ **Alergije** — nema ih.\n\n### Novac\n\nSrednje, uz 3–4 splurgea. **Odabrani: gozba od crvenih rakova u Sokchu · spa (head spa, masaža, tretman lica) u Seoulu 31.10.** Yosukgung 1779 je zamijenjen Jeongsugaseongom i ostaje samo kao ⚠️ malo vjerojatna rezerva; Waterpia je glavni bazen, a Delpino samo rezerva. Seoul Sky je obavezan i ne računa se kao splurge."}, {"id": "dodatak-b", "title": "DODATAK B — PRIJEVOZ", "md": "| Datum | Dionica | Način | Trajanje | Cijena pp |\n|---|---|---|---|---|\n| 19.10. | ICN → Seoul Station | AREX express | 43 min | ~11 000 ₩ |\n| 21.10. | Seoul → Sokcho | Express bus | 2h10–2h20 | 16 400–34 600 ₩ |\n| 24.10. | Sokcho → Gangneung | Bus 06:55 (ili taksi ~08:15) | 1h00–1h37 | 10 800 ₩ |\n| 24.10. | Gangneung → Gyeongju | **KTX-Eum 752, direktno** 09:36 → 12:30 | 2h54 | 34 300 ₩ |\n| 24.10. | Stanica Gyeongju → Airbnb | GJS van ili 2 taksija (koferi) | 18–22 min | 35–45 000 ₩ van / 15–17 000 ₩ auto |\n| 27.10. | Gyeongju → Busan Station | Taksi do stanice + KTX | ~20 min + ~30 min | 11 000–21 000 ₩ (+ taksi) |\n| 28.10. | Busan Station → Haeundae (Mipo) | taksi | 30–40 min | 18–25 000 ₩ po autu |\n| 29.10. | Busan → Seoul | KTX | ~2h30 | od 60 000 ₩ |\n| 30.10. | Seoul → Suwon | ITX | ~35 min (+ metro i taksi, ~1 h) | 4 800 ₩ |\n| 2.11. | Hongik Univ. → ICN T2 | AREX all-stop (express ovdje ne staje) · rezerva jumbo taksi | ~56 min | ~5 000 ₩ · taksi 65–100 000 ₩ + cestarina |\n\n**Korail Pass se ne isplati.** 3-dnevni 186 000 ₩, 5-dnevni 275 000 ₩; ne pokriva SRT, metro ni AREX. Prag isplativosti je 3+ dugih vožnji unutar prozora, a vaše su razvučene kroz dva tjedna s autobusnim dionicama između.\n\n**Aplikacije:** **Naver Map** primarno (engleski UI, točan javni prijevoz, opcija \"izbjegni stepenice\") · **Kakao Map** za praćenje autobusa i taksi · Papago za prijevod · Google Translate kamera za jelovnike. ⚠️ **Google Maps javni prijevoz i dalje nije pouzdan u Koreji.**"}, {"id": "dodatak-c", "title": "DODATAK C — USPUTNE STANICE PRI SELIDBAMA", "md": "Pet kandidata na četiri selidbe, poredani po tome koliko stvarno koštaju. **Prvi je gotovo besplatan, zadnji je upitan.**\n\n---\n\n## 🥇 GANGNEUNG · sub 24.10., na putu Sokcho → Gyeongju\n### **Ovo je jedini stop koji ne košta ništa u rutiranju — vi ondje ionako presjedate.**\n\nRuta 24.10. ide Sokcho → Gangneung busom (1h10), pa KTX-om dalje. **Dva do tri sata u Gangneungu su čista dobit**, jer je alternativa sjediti na kolodvoru.\n\n**Što ima:**\n- **Anmok Coffee Street** — Gangneung je neslužbena kavena prijestolnica Koreje, dom Terarose i drugih ozbiljnih pržionica. Kafići uz samu obalu, pogled na Istočno more. Ugodno i opušteno, ~2 h.\n- **Seongyojang** — velika plemićka hanok kuća u kojoj potomci i danas žive, s vrtom i ribnjakom. Nije selo nego jedna impresivna naseljena kuća. 45–60 min.\n- **Ojukheon** — rodna kuća učenjaka Yi I-ja i njegove majke Shin Saimdang, koja je **na novčanici od 50 000 wona**. Skromno ali autentično, 45–60 min.\n- **Arte Museum** — ⚠️ **Nije teamLab** — spektakl s jednim motivom (slap, val), bez interakcije i hodanja kroz vodu. **Kalibrirati očekivanja ili preskočiti.**\n\n**Preporuka:** Anmok kava + Seongyojang, ~2,5 h. Gangneung je 24.10. subota, pa će obala biti živa.\n\n⚠️ **Status 9.10.:** s direktnim KTX-Eumom 752 Gangneung se samo prolazi (bus → stanica). Pauza ovdje znači kasniji vlak **754 (14:56 → Gyeongju 17:44)** i gubitak popodneva u Gyeongjuu — **malo vjerojatan plan C**, vidi Dan 6.\n\n---\n\n## 🥈 CHUNCHEON · sri 21.10., na putu Seoul → Sokcho\n\nGrad u kojem je **izmišljen dakgalbi** — pikantna pržena piletina s kupusom, rižinim kolačićima i slatkim krumpirom, na velikoj tavi nasred stola. U Myeongdong-gilu ima cijela ulica restorana koji to rade desetljećima.\n\n**Kako:** ITX-Cheongchun iz Yongsana ili Cheongnyangnija do Chuncheona, **~1 h, 6 000–8 500 ₩** → ručak → intercity bus Chuncheon → Sokcho, **~2 h**.\n\n**Cijena:** ~4,5–5 h ukupno umjesto 2h20 direktno. **Dva dodatna sata za regionalno jelo na njegovom izvoru.**\n\n⚠️ **Nami Island je odavde 20 minuta i eksplicitno je izrezan** — privatni tematski park s lažnom putovnicom i maskotama. **Ne dati se uvući.**\n\n**Preporuka:** vrijedi samo ako ekipa hoće jesti kroz zemlju, a ne samo u gradovima. 21.10. je ionako lagan dan bez planinarenja — podnosi to.\n\n---\n\n## 🥉 TONGDOSA · uto 27.10., na putu Gyeongju → Busan\n\n**Jedan od Tri dragulja korejskog budizma** i vjerojatno najvažniji hram u zemlji koji nije na vašem popisu. Nalazi se u Yangsanu, **točno na koridoru Gyeongju–Busan.**\n\n**Posebnost:** Tongdosa predstavlja samog Bude jer čuva njegove relikvije — pa **u glavnoj dvorani nema kipa Bude.** Gledaš prema prozoru iza oltara, a iza njega je stupa s relikvijama. To je arhitektonski i konceptualno neobično i nije ista stvar kao još jedan hram.\n\n**Prilazna staza kroz borovu šumu duga je otprilike kilometar** i kraj listopada joj je najbolji trenutak.\n\n⚠️ **Kvaka:** pravilo je maksimalno 2–3 hrama, a Jogyesa, Bulguksa i Seokguram su već u planu — **Tongdosa bi bio četvrti.**\n\n**Preporuka:** samo ako Bulguksa i Seokguram prođu **bolje** nego što očekujete. Ako 26.10. navečer netko kaže \"dosta hramova\" — otpada bez rasprave.\n\n---\n\n## ULSAN — DAEWANGAM ILI GANJEOLGOT · uto 27.10., alternativa Tongdosi\n\nAko je hram otpao a obala nije, isti transfer nudi dvije priobalne točke:\n\n- **Daewangam Park** — borov park na stijenama iznad mora, s kamenim lukom i mostom preko vode. Besplatno, ~1,5 h. Vezano uz legendu o podmorskoj grobnici kraljice, supruge kralja Munmua — što se lijepo naslanja na Silla kontekst iz Gyeongjua.\n- **Ganjeolgot** — **najistočnija točka kopnene Koreje**, svjetionik i mjesto gdje sunce izlazi prvo u zemlji. Besplatno, ~1 h.\n\n**Cijena:** oboje traži pravi detour s glavne ceste i taksi. **Realno dodaje 2–3 h transferu od jednog sata.**\n\n**Preporuka:** slabije od Tongdose po jedinstvenosti, ali bez hram-problema. I ⚠️ **imate Igidae isti dan popodne** — dvije obale u jednom danu je previše iste stvari.\n\n---\n\n## ⚪ DAEGU · čet 29.10., na putu Busan → Seoul — **vjerojatno ne**\n\nKTX iz Busana ionako prolazi kroz Daegu za ~40 min, pa je izlazak tehnički trivijalan.\n\n**Što ima:** **Seomun tržnica** — jedna od najvećih tradicionalnih tržnica u zemlji, s jakom večernjom scenom hrane. Vrijedi 1–2 h ako se ionako prolazi kroz Daegu.\n\n⚠️ **Zašto ipak ne:** **poanta Seomuna je noćna tržnica, a vaš vlak je u 9 ujutro.** Došli biste u 10, kad tržnica radi ali bez onoga zbog čega vrijedi. A pomicanje vlaka na popodne znači dolazak u Seoul u mraku i **gubitak Gyeongbokgunga i escape rooma** — dvije stvari koje su tog dana fiksne.\n\n**Preporuka:** ne.\n\n---\n\n## SAŽETAK\n\n| Stanica | Dan | Dodatno vrijeme | Verdikt |\n|---|---|---|---|\n| **Gangneung** | 24.10. | +2,5 h na dan koji je ionako putovanje | ✅ **Napraviti** |\n| **Chuncheon** | 21.10. | +2,5 h na lagan dan | ✅ Ako se hoće jesti kroz zemlju |\n| **Tongdosa** | 27.10. | +2–3 h | 🟡 Samo ako hramova nije dosta |\n| **Ulsan obala** | 27.10. | +2–3 h | 🟡 Slabije, i duplira Igidae |\n| **Daegu** | 29.10. | razbija fiksni dan | ❌ Ne |"}, {"id": "dodatak-d", "title": "DODATAK D — ŠTO JE IZREZANO I ZAŠTO", "md": "| Što | Slava | Zašto van |\n|---|---|---|\n| **Nami Island** | 9/10 | Privatni tematski park s lažnom putovnicom i maskotama. Cijeli dan za drvorede |\n| **Everland** | 8/10 | Odbijeno |\n| **DMZ standardna tura** | 9/10 | Odbijeno — JSA više nije što je bio: u plavu baraku se ne ulazi, gleda se s krova Freedom Housea |\n| **Golgulsa templestay** | 3/10 | Izbačeno |\n| **Hanbok rental** | 8/10 | Ne zanima ekipu |\n| **Busan X the Sky** | — | Seoul Sky je bolji, drugi vidikovac ne treba |\n| **Haeundae plaža** | — | Izvan sezone |\n| **Lotte World** | 8/10 | Zadržano samo kao kišna rezerva |\n| **63 Building / 63 Sky** | 5/10 | Zastarjelo. Isti grad kao Seoul Sky, a upola niže. Jedan vidikovac je dosta i neka bude visoki |\n| **Yongsan elektronika** | — | Tržnica je propala i postala anime/gaming hub |\n| **Jeju** | — | 4 dana minimum, međunarodna vozačka, duplira planinski budžet |\n| **Boseong, Damyang, Naganeupseong, Jirisan** | — | Svi padaju na pravilu od 3 h putovanja |\n| **Haeinsa** | 6/10 | **Ploče se zapravo ne vide** — gledaš skladište izvana. Traži detour preko Daegua |\n| **Aquafield** | — | Vodeni park za sve uzraste |\n| **Hwadam (botanički vrt)** | — | Prijedlog Gorana i Lucije, izbačen 16.10. Stane samo umjesto cijelog Suwona (sezona počinje 23.10., a 29.10. je selidba s koferima). Traži ~4,5 h busa za ~3 h vrta, shuttle je bio rasprodan, a jesenskog lišća već imamo dosta: Seoraksan, Bulguksa, Namsan i Tajni vrt dva dana kasnije. Suwon nudi više: tvrđavu, streličarstvo, galbi i balon |\n| **Hunky show (Sexy Man Standing)** | — | Samo za žene, a ne razdvajamo se |\n| **Drag show** | — | Ne zanima ekipu |\n| **Starfield Library** | — | Gangnam, nije nam usput |\n| **Cheonan, kafić Pins** | — | 2–3 h puta za jedan kafić |\n| **Yoonseul (Seoul Station)** | — | Nespretno s koferima na dan selidbe, a dan je pun |\n| **Jagalchi doručak, Gukje, BIFF, Kkangtong** | — | Ekipa ne želi ribu za doručak ni toliko tržnica, Busan je dobio obalu |\n| **Yosukgung 1779 kao plan** | — | 80+ € po glavi i formalno; ostaje samo ⚠️ rezerva uz stolice |\n\n💡 **Vraćeno u plan nakon komentara Gorana i Lucije (15.10.):** Gamcheon (lite), Sky Capsule, Haedong Yonggungsa, cijeli Igidae (uz Plan B)."}, {"id": "dodatak-e", "title": "DODATAK E — OTVORENA PITANJA I WIP", "md": "Potpuni popis neprovjerenih podataka, po danima, je u [KorejaWIP.md](KorejaWIP.md). Ovdje je samo ono što mijenja plan.\n\n### Provjeriti prije puta\n1. **K-ETA izuzeće** vrijedi do 31.12.2026., ali je formalno \"privremeno\". Provjeriti tjedan prije puta.\n2. **KOBUS i strane kartice:** prihvaćanje uvedeno tek u kolovozu 2026. Testirati kupnju odmah.\n3. **Subotnja satnica 24.10.:** bus Sokcho → Gangneung i vlakovi KTX-Eum 754/756.\n4. **Tajni vrt:** engleski termini za jesen 2026. Rezervacija 26.10. u 10:00.\n5. **Jeongsugaseong:** rezervacija i stol. ⚠️ Yosukgung samo ako uspije sa stolicama.\n5a. **Kavez u Hyehwi:** adresa i radno vrijeme (Naver).\n5b. **SEOL:HA:** cijene i četiri termina u subotu.\n5d. **Cafe Pokpo:** termini slapa; **Cheongsudang:** radno vrijeme nedjeljom.\n5e. **Jahta Gwangalli:** raspored u listopadu.\n6. **Drone show 31.10.:** potvrditi na seouldroneshow.com na dan.\n7. **Korean Air:** prtljaga na karti; Kakao T jumbo sa stranom karticom.\n8. **KBO doigravanje:** datumi utakmica nisu potvrđeni, provjeriti oko 30.10. Vidi [KorejaSeulDogadanja.md](KorejaSeulDogadanja.md).\n\n### Odluke koje čekaju\n9. **Šamanistička tura na Inwangsanu**, da ili ne, do ~25.10.\n10a. **Ime French toast kafića** (260-2 Yeonnam-dong), 31.10. ujutro.\n11. **Vodič za jedan grad**, u planu ga trenutno nema.\n12. **Tko je vlasnik svakog retka iz Dodatka A.**\n\n### Strukturne slabosti koje ostaju\n- **Seoul II je gradski, ne izletnički.** Jedan dnevni izlet (Suwon), tri seulska dana. Veliki doživljaji su rođendanska večer, Seoraksan i escape room.\n- **Nema \"dubokog\" sadržaja bez templestaya.** Gyeongju je razgledavanje. Šamanistička tura jedina je preostala stavka te vrste.\n- **Bejzbola možda neće biti.** Ako se ne igra, finale 1.11. je krovni bar."}, {"id": "wip", "title": "KOREJA 2026 — WIP I NEPROVJERENI PODACI", "md": "Sve što u `KorejaMain.md` nije potvrđeno, izdvojeno 10.10.2026., ažurirano 15.10.2026. (komentari Gorana i Lucije). Ključne stavke (one koje mijenjaju plan) ponovljene su u Dodatku E glavnog dokumenta. Kad se nešto provjeri, ispraviti brojku u glavnom dokumentu i obrisati redak ovdje.\n\n## Ključno (mijenja plan)\n- K-ETA izuzeće za Hrvatsku vrijedi do 31.12.2026., ali je formalno \"privremeno\". Ponovno provjeriti tjedan prije puta.\n- KOBUS prima strane kartice tek od kolovoza 2026. Testirati kupnju karte za 21.10. odmah.\n- Sub 24.10.: subotnja satnica busa Sokcho → Gangneung (06:55 je radni dan) i vlakova KTX-Eum 754/756.\n- Pon 26.10.: engleski termini Tajnog vrta (10:30 / 11:30 / 14:30 / 15:30) za jesen 2026.\n- Pon 26.10.: Jeongsugaseong (plan), treba li rezervacija i stol. ⚠️ Yosukgung 1779 samo ako uspije rezervacija sa stolicama.\n- Pet 23.10. u 23:59: booking escape rooma za 29.10. (✅ pravilo potvrđeno 14.10.: 5 dana unaprijed, ponoć KST).\n- Sri 28.10.: Sky Capsule je već u prodaji, rezervirati odmah.\n- Sub 31.10.: drone show na Ttukseomu, održava li se 31.10. (tema i broj dronova neprovjereni).\n- Ned 1.11.: šamanistička tura na Inwangsanu, postoji li termin na engleskom; rezervirati do ~25.10.\n- Pon 2.11.: dopuštena prtljaga na karti Korean Aira i radi li Kakao T jumbo sa stranom karticom.\n- Zadnji KTX Busan → Seoul navodno ~22:40, neprovjereno za 2026.\n- Jesensko vrijeme zatvaranja ulaza u staze Seoraksana.\n\n## Seoul I (19.–20.10.)\n- Pon 19.10., slijetanje: poslijepodnevni redovi na imigraciji navodno 60–90 min, neprovjereno.\n- Pon 19.10., AREX express: točna cijena karte (11 500–13 000 ₩).\n- Pon 19.10., batting cage u Hyehwi: postoji li još, adresa i radno vrijeme (Naver: 혜화 야구장). Ako ne, screen baseball (Strikezon Jongno, točna adresa).\n- Pon 19.10., Golfzon Park Euljiro Signature: rezervacija za 20:00, cijena 9 rupa.\n- Uto 20.10., KBBQ na Euljiru: konkretan lokal nije odabran.\n- Uto 20.10., Jean Frigo: radno vrijeme (18:00–01:30 ili 17:00–01:00) i dan zatvaranja.\n\n## Sokcho (21.–23.10.)\n- Sri 21.10., bus: KOBUS prima strane kartice tek od kolovoza 2026., testirati kupnju rano.\n- Sri 21.10., Chuncheon varijanta: vozni red ITX-Cheongchun za 2026. (09:11 → 10:06 neprovjereno).\n- Sri 21.10., hotel: potvrditi mailom s Blue Terrom čuvanje kofera u ~11:15.\n- Sri 21.10., Yeonggeumjeong: radno vrijeme i broj stepenica.\n- Sri 21.10., šatori Yeongrang-dong: imena (Maljane, Danggeun Macha) i radno vrijeme neprovjereni.\n- Čet 22.10., žičara: dobiva li se na karti fiksni termin ukrcaja.\n- Čet 22.10., Freezer Club: radi li četvrtkom krajem listopada.\n- Pet 23.10., Biryong: točna stanica busa 7/7-1 za polazište (Seorak-dong).\n- Pet 23.10., Seoraksan: jesensko vrijeme zatvaranja ulaza u dublje staze (podne ili 14:00).\n- Pet 23.10., planinarski muzej: radi li soba koja simulira visinu i kako se ulazi.\n- Pet 23.10., Expo toranj: sati i cijena.\n- Pet 23.10., plaža Sokcho i Sokcho Eye: sati i cijena (~12 000 ₩).\n- Pet 23.10., Craftroot: adresa i sati.\n- Pet 23.10., Delpino: temperatura vode (34–38 °C), karte za negoste na blagajni Ocean Playa, sati (10:00 ili 09:00 do 19:00). Nazvati +82-33-639-3426.\n- Pet 23.10., Lotte Resort infinity bazen: \"navečer samo odrasli\" neprovjereno.\n- Sri 21.10. / pet 23.10., korejski roštilj (🅱️ BBQ slot): lokal u Sokchu nije odabran.\n\n## Gyeongju (24.–26.10.)\n- Sub 24.10., bus Sokcho → Gangneung: subotnja satnica (06:55 je radni dan). Provjeriti na terminalu u srijedu.\n- Sub 24.10., taksi Sokcho → stanica Gangneung: cijena 60–80 000 ₩ po taksiju je procjena.\n- Sub 24.10., KTX-Eum 754 i 756: subotnja satnica.\n- Sub 24.10., GJS call van: cijena 35–45 000 ₩ neprovjerena.\n- Sub 24.10., Sukyoung Sikdang: radno vrijeme.\n- Sub 24.10., noćna tržnica Jungang: sati za listopad 2026.\n- Sub 24.10., Dosol Maeul: zadnja narudžba 19:30 ili 20:00, potvrditi pri rezervaciji.\n- Sub 24.10., Korail: doplata ili storno pri prebacivanju s 752 na 754.\n- Ned 25.10., Seongdong bife-uličica: rade li zalogajnice nedjeljom.\n- Ned 25.10., bus 203 za Yangdong: nedjeljna satnica.\n- Ned 25.10., povijesna dvorana Hwangnyongsa: sati i cijena.\n- Ned 25.10., Bunhwangsa: besplatan ulaz od 2023. neprovjeren.\n- Pon 26.10., taksi do Bulgukse: cijena 15–18 000 ₩ po autu.\n- Pon 26.10., restorani u planu: provjeriti da su otvoreni ponedjeljkom.\n- Pon 26.10., Tajni vrt: engleski termini 10:30 / 11:30 / 14:30 / 15:30 neprovjereni za jesen 2026.\n- Pon 26.10., bus 12 Bulguksa ↔ Seokguram: satnica 2026.\n- Pon 26.10., Jeongsugaseong: lokacija (Hadong), rezervacija, stol. ⚠️ Yosukgung samo uz stolice.\n- Pon 26.10. navečer: odluka o cijelom Igidaeu prema koljenu.\n\n## Busan (27.–28.10.)\n- Uto 27.10., KTX Gyeongju → Busan: točan vl lan je promijenjen na licu mjesta: umjesto Gwangjanga i Euljira prvu smo večer proveli u **Hongdaeu**. Prvo **korejski roštilj**, zatim šetnja studentskom četvrti punom glazbe i neona, **fluffy pancakes** za desert, **streličarstvo i pucanje** umjesto batting cagea, i na kraju **kokteli** za Lucijin rođendan. Gwangjang, Nogari Alley i Ace Four Club prebačeni su na utorak, a pravi batting cage na Hongdae u drugom boravku.\n**Subota, 24. 10. · Sokcho → Gyeongju — dolazak u kraljevstvo Silla** 🌧️ *povremena slaba kiša* — U 06:55 krećemo autobusom prema **Gangneungu**, gdje se ukrcavamo na novi izravni vlak uz obalu do Gyeongjua (dolazak 12:30). Danas je **zadnji dan Festivala tteoka i domaće govedine hanwoo** na tržnici Jungang, 10 minuta od smještaja, pa ručak može biti hanwoo s roštilja na festivalu. Popodne obilazimo **Daereungwon**, kompleks kraljevskih grobnica iz razdoblja Silla, ulazimo u humak **Cheonmachong** i kupujemo toplu lepinju **Hwangnam-ppang** s crvenim grahom. Nastavljamo prema **selu Gyochon** i **kući obitelji Choi**, koja je otvorena samo danas, jer je u ponedjeljak zatvorena. U sumrak odlazimo do **Donggung Palacea i ribnjaka Wolji** (Anapji): po slaboj kiši mokri odrazi osvijetljenih paviljona su još ljepši. Zatim prelazimo natkriveni drveni most **Woljeonggyo**. ☔ Ako kiša pojača, prvo idemo u **Nacionalni muzej** (subotom otvoren do 20:00, 5 minuta od Anapjija), a Anapji gledamo osvijetljen poslije. Večer završavamo na **noćnoj tržnici** pod krovom i uz koktel u **Bar Boonu**.\n**Nedjelja, 25. 10. · Gyeongju — selo u izmaglici i blaga Silla** 🌧️ *povremena kiša* — Dan počinjemo doručkom u **uličici s bifeima na tržnici Seongdong** ili u kafiću. Ujutro odlazimo u **Yangdong**, UNESCO-ovo selo u kojem se i danas živi. Po slaboj kiši slamnati krovovi u izmaglici imaju posebnu atmosferu, a po jačoj obilazak skraćujemo. Ručamo u selu. **Bicikle zbog kiše selimo na ponedjeljak.** Poslijepodne provodimo pod krovom: u **Nacionalnom muzeju Gyeongjua**, sa zlatnim krunama i zvonom Emille, a zatim u **povijesnoj dvorani Hwangnyongsa**, s maketom pagode od devet katova i 3D kinom, te kratko kod kamene pagode **Bunhwangsa**. Navečer jedemo korejski roštilj (buffet ili hanwoo), a nakon večere slijedi pogled na osvijetljeni humak **Bonghwangdae** i kušanje rižina vina obitelji Choi.\n**Ponedjeljak, 26. 10. · Gyeongju — Bulguksa, Seokguram i biciklom po istočnoj strani** 🌦️ *kiša do jutra, popodne suše, tlo mokro* — Budimo se u 08:30 i doručkujemo u gradu do 09:30, pa taksijem odlazimo u **hram Bulguksa** i šećemo javorovom prilaznom cestom. ⏰ **Točno u 10:00 otvaraju se online rezervacije za Tajni vrt (Changdeokgung, Seoul) za nedjelju 1. 11.** Alarm na mobitelu, dvoje pokušava paralelno na ticket.cdg.go.kr, iz Bulgukse. *(Rezerva: blagajna 1. 11. od 09:00.)* Taksijem se penjemo do **Seokgurama**, špiljskog svetišta s granitnim Budom iz 8. stoljeća. **Šumsku stazu dolje preskačemo**, jer je nakon dva dana kiše kamen sklizak. Ručamo 🅰️ ispod Bulgukse ili 🅱️ u gradu. Popodne **biciklima obilazimo istočnu stranu**: šumu **Gyerim**, most **Woljeonggyo**, polje **Hwangnyongsa** i pagodu **Bunhwangsa**, a završavamo kod **Cheomseongdaea** i polja ružičaste trave na zalazak. Za posljednju večer u Gyeongjuu biramo svečanu večeru (hanwoo ili galbijjim), pa slijedi most **Woljeonggyo** noću i pakiranje. Navečer potvrđujemo **cijeli Igidae** za sutra.\n**Važne napomene prije putovanja**\n- **Rezervacije:** Sky Capsule u Busanu (online rasprodan, pratiti otkazivanja do ~27.10.), spa THE SEOL:HA za 31.10., Tajni vrt u Changdeokgungu (otvara se 26. 10. u 10:00), escape room (otvara se u ponoć 23./24.10., alarm u Sokchu), a aktivnosti poput balona Flying Suwon, jahte u Busanu ili žičare u Seoraksanu ovise o vremenskim uvjetima. *(Detalji u Dodatku A.)*\n- **Seoraksan:** uspon na Ulsanbawi zahtjevan je i uključuje velik broj stepenica. Žičara i planinarske staze imaju različite režime rada, a vrijeme u planinama može se brzo promijeni k prska, a odjeća miriše na prženo.", "naver": ["경주 닭갈비"]}, {"tag": "g", "name": "Hanwoo BBQ", "ko": "한우", "price": true, "plan": false, "short": "korejska govedina, mramorirana kao wagyu", "body": "Meso stigne poslagano kao cvijet, prošarano bijelim žilicama. Na rešetki mu treba pola minute po strani, topi se u ustima, jede se samo sa solju. Okvirno 40 000–80 000 ₩ po osobi.", "warn": "Cijene su po 100–150 g, račun brzo raste. Ako je ovo večeras, ponedjeljak ide jednostavnije.", "naver": ["경주 한우"]}, {"tag": "g", "name": "Jjimdak", "ko": "찜닭", "price": false, "plan": false, "short": "pirjana piletina sa staklenim rezancima u umaku od soje", "body": "Veliki pladanj koji se puši: piletina, krumpir, mrkva i prozirni klizavi rezanci u sjajnom smeđem umaku, slatkom kao teriyaki s malo čilija. Mekano i utješno nakon bicikla.", "warn": "Postoji i ljuta verzija.", "naver": ["찜닭"]}, {"tag": "g", "name": "Shabu-shabu", "ko": "샤브샤브", "price": false, "plan": false, "short": "lonac s juhom na stolu, tanke kriške govedine i povrće", "body": "Najbliže udonu s goveđom juhom koji vam se svidio. Meso tanko kao papir za sekundu promijeni boju, umače se u sezamov umak, a na kraju se u bogatoj juhi kuhaju rezanci pa kaša s jajem.", "warn": "Tražiti blagu juhu, u buffetima ima i plodova mora.", "naver": ["경주 샤브샤브"]}, {"tag": "g", "name": "Noćna tržnica Jungang, opet", "ko": "", "price": false, "plan": false, "short": "ako vam se u subotu svidjela", "body": "Zadnja prilika, ponedjeljkom ne radi.", "warn": "", "naver": []}, {"tag": "g", "name": "Ssambap s bulgogijem", "ko": "", "price": false, "plan": false, "short": "ako nije bio subotnji ručak", "body": "", "warn": "", "naver": []}], "region": "gyeongju"}, {"kind": "KASNO", "type": "late", "emoji": "🍶", "time": "~21:00", "where": "", "note": "", "options": [{"tag": "g", "name": "Gyodong Beopju u Airbnbu", "ko": "", "price": false, "plan": false, "short": "300 godina staro rižino vino obitelji Choi", "body": "Bistro, zlatno, blago slatko   document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-t="${k}" aria-selected="${tab === k}">${l}${k === 'odluke' ? `<span class="n">${decOpen}</span>` : k === 'rezervacije' ? `<span class="n">${resOpen}</span>` : ''}</button>`).join('');
  const strip = document.getElementById('strip');
  strip.hidden = tab !== 'dani';
  strip.innerHTML = days.map((d, i) => { const dp = dayParts(d);
    return `<button class="dpill${isMove(d) ? ' move' : ''}" data-icon="${moveIcon(d)}" style="--cc:${cityOf(d).c}" data-act="go" data-i="${i}" aria-current="${i === cur}" data-today="${i === TODAY}" aria-label="${esc(dp.wd + ' ' + dp.dt + ' ' + dp.title)}"><span class="w">${esc(dp.wd)}</span><span class="d">${dp.dt.split('.')[0]}</span><span class="m">${dp.dt.split('.')[1]}.</span></button>`; }).join('');
  let lastCity = null;
  document.getElementById('rail').innerHTML = days.map((d, i) => { const dp = dayParts(d); const c = cityOf(d);
    const head = d.city !== lastCity ? `<div class="city" style="--cc:${c.c}">${c.short}</div>` : ''; lastCity = d.city;
    return head + `<button style="--cc:${c.c}" data-act="go" data-i="${i}" aria-current="${i === cur}" data-today="${i === TODAY}"><span class="rtx"><span class="rd">${esc(dp.wd)} ${esc(dp.dt)}</span><span class="rt">${inline(dp.title)}</span></span></button>`; }).join('');
  document.getElementById('layout').className = 'layout' + (tab === 'dani' ? ' days' : '');
  const main = document.getElementById('main');
  main.classList.toggle('anim', animNext); animNext = false;
  // keep each option carousel where it was scrolled to across re-renders (picking, switching tabs)
  const car = Object.fromEntries([...main.querySelectorAll('.fcar')].map(x => [x.dataset.c, x.scrollLeft]));
  main.innerHTML = tab === 'dani' ? dayView() : tab === 'pregled' ? pregled() : tab === 'odluke' ? odluke() : tab === 'rezervacije' ? rezervacije() : info();
  const nd = [...main.querySelectorAll('details')];
  if (nd.length === openDetails.length) nd.forEach((x, i) => x.open = openDetails[i]);
  main.querySelectorAll('.fcar').forEach(x => { if (car[x.dataset.c]) x.scrollLeft = car[x.dataset.c]; });
  placeNow();
}
/* Mark today's current slot: the last row whose start time has passed (until the next row, or its end time if it is the last). */
function placeNow() {
  const tl = tab === 'dani' && cur === LIVE && document.querySelector('#main .tl');
  if (!tl) return;
  // rows in display order with a usable clock time; past-midnight rows wrap, out-of-order asides are skipped
  const pts = []; let last = -1;
  tl.querySelectorAll(':scope > li[data-t]').forEach(li => {
    let t = +li.dataset.t;
    if (last >= 0 && t < last - 720) t += 1440;
    if (t < last) return;
    let e = li.dataset.e != null ? +li.dataset.e : null;
    if (e != null && e < t) e += 1440;
    pts.push({ li, t, e }); last = t;
  });
  const now = kst().min;
  const ci = pts.reduce((a, p, i) => p.t <= now ? i : a, -1);
  const p = pts[ci], q = pts[ci + 1];
  const on = p && (q || now <= (p.e != null ? p.e : p.t + 90)) ? p.li : null;
  tl.querySelectorAll(':scope > li.cur').forEach(li => li !== on && li.classList.remove('cur'));
  if (on) on.classList.add('cur');
  if (Date.now() < followUntil) scrollToNow(false);
}
// after load the layout keeps settling (fonts), so keep the current slot in view for a moment
let followUntil = 0;
function scrollToNow(smooth = true) {
  const tl = document.querySelector('#main .tl');
  const el = tl && (tl.querySelector(':scope > li.cur') || tl.querySelector(':scope > li[data-t]'));
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 3, behavior: smooth ? 'smooth' : 'auto' });
}
function followNow() { followUntil = Date.now() + 1500; scrollToNow(false); }
function tick() {
  const was = LIVE;
  TODAY = todayIdx(); LIVE = liveIdx(); showNow();
  // day rolled over while the previous day was on screen → follow it
  if (LIVE !== was && LIVE >= 0 && tab === 'dani' && cur === was) go(LIVE);
  else if (LIVE !== was) render();
  else placeNow();
}
setInterval(tick, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > IDLE && liveIdx() >= 0) { TODAY = todayIdx(); LIVE = liveIdx(); showNow(); go(LIVE); requestAnimationFrame(followNow); }
  else tick();
});
// row heights shift with web fonts, open details and window width
if (window.ResizeObserver) new ResizeObserver(() => placeNow()).observe(document.body);
else window.addEventListener('resize', placeNow);
function scrollPillIntoView() {
  const p = document.querySelector('.dpill[aria-current="true"]');
  if (p) p.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function go(i) {
  store.set('seen', Date.now());
  animNext = true; cur = i; tab = 'dani'; openSlots.clear(); qOpen = null; store.set('day', i); store.set('tab', tab);
  history.replaceState(null, '', '#dan-' + days[i].date.replace('.', '-'));
  render(); scrollPillIntoView(); window.scrollTo({ top: 0 });
}
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; const d = days[cur];
  if (a === 'tab') { store.set('seen', Date.now()); animNext = true; tab = b.dataset.t; store.set('tab', tab); history.replaceState(null, '', '#' + (tab === 'dani' ? 'dan-' + days[cur].date.replace('.', '-') : tab)); render(); if (tab === 'dani') scrollPillIntoView(); window.scrollTo({ top: 0 }); }
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'now') scrollToNow();
  else if (a === 'flash') { const i = +b.dataset.i; const was = flashOpen.has(i); flashOpen.clear(); if (!was) flashOpen.add(i); render(); }
  else if (a === 'q') { qOpen = qOpen === b.dataset.k ? null : b.dataset.k; render(); }
  else if (a === 'slot') { if (e.target.closest('.pickbtn')) return; const k = d.date + '|' + b.dataset.key; const was = openSlots.has(k); openSlots.clear(); if (!was) openSlots.add(k); render(); }
  else if (a === 'plan') { planView[d.date] = +b.dataset.i; store.set('planView', planView); openSlots.clear(); render(); }
  else if (a === 'mtab') { mealTab[d.date + '|' + b.dataset.m] = b.dataset.k; render(); }
  else if (a === 'meal') { const pd = { ...pickDoc(d), meals: { ...(pickDoc(d).meals || {}) } }; const m = b.dataset.m, n = b.dataset.n; pd.meals[m] = pd.meals[m] && pd.meals[m].n === n ? null : { n, k: b.dataset.k }; write('picks', pickId(d), pd); }
  else if (a === 'pickalt') { e.stopPropagation(); const pd = { ...pickDoc(d), slots: { ...(pickDoc(d).slots || {}) } }; const k = b.dataset.slot, i = +b.dataset.alt; pd.slots[k] = pd.slots[k] === i ? null : i; write('picks', pickId(d), pd); }
  else if (a === 'dec') { const s = S.dec[b.dataset.id] || {}; write('dec', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'res') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'who') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, who: s.who === b.dataset.p ? null : b.dataset.p }); }
  else if (a === 'decf') { decFilter = b.dataset.f; render(); }
  else if (a === 'resf') { resFilter = b.dataset.f; render(); }
});
document.addEventListener('keydown', e => {
  if (tab !== 'dani' || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' && cur < days.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1); const m = h.match(/^dan-(\d+)-(\d+)$/);
  if (m) { const i = dayIdx(`${+m[1]}.${+m[2]}`); if (i >= 0 && (i !== cur || tab !== 'dani')) go(i); }
  else if (['dani', 'pregled', 'odluke', 'rezervacije', 'info'].includes(h) && h !== tab) { tab = h; store.set('tab', tab); render(); window.scrollTo({ top: 0 }); }
});
render(); setSync(); requestAnimationFrame(scrollPillIntoView); store.set('seen', Date.now());
if (tab === 'dani' && cur === LIVE) requestAnimationFrame(followNow);
connect();
</script>
