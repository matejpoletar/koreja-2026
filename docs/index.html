–10 min pješice od stana**. Na Noć vještica glavno je okupljalište u Seoulu: ulice pune kostima, ulični nastupi, prepuni barovi i **pocha** (šatorski barovi). Policija i hitna imaju koridore duž Eoulmadang-roa, sigurno je, ali gusto.\n- **Klubovi:** redovi **1–2 h**, pa radije barovi, pocha i uličica Wausan-ro.\n- **Kostim:** po želji, dućani u Hongdaeu ih tih dana prodaju.\n- ❌ **Itaewon:** od nesreće 2022. jednosmjerne rute, barijere i policija. Prigušeno, i na krivoj strani grada.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša ili vjetar:** dronovi otkazani, plan B (Hongdae). Seongsu ujutro ima kafiće pod krovom.\n- **Red za gamjatang predug:** bilo koji ručak u Seongsuu, gamjatang ima i u Hongdaeu (lokali 24 h).\n- **Umor:** plan B.\n- **Banpo nije bio u petak:** Banpo umjesto dronova.\n- **Escape room nije odrađen u četvrtak:** danas u terminu koji ne siječe spa (npr. 09:30, Seongsu kraće), ili u 21:30 u Hongdaeu umjesto dronova.\n- **Spa nema termina za četvero:** dvije smjene po dvoje (15:00 i 16:00), ili AHEAD / Shin Jiyoon.\n- **Seoul Sky nije odrađen:** sutra, nedjelja 1.11.", "heading": "Sub 31.10. — Seongsu, bicikli uz Han, spa, drone show i Noć vještica", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Subota, 31. 10. · Seoul — Seongsu, rijeka Han, spa i Halloween", "text": "Dan počinjemo doručkom s *French toastom* u našem kvartu, a zatim odlazimo u **Seongsu**, nekadašnju industrijsku četvrt poznatu po kafićima u preuređenim skladištima i kreativnim prostorima, te u veliki park **Seoul Forest**. Za ručak biramo **gamjatang**, bogato varivo od svinjskih kostiju i krumpira. Zatim uzimamo gradske bicikle i vozimo se **ravnom stazom uz rijeku Han**, uz kratki piknik na travi. Poslijepodne se vraćamo u Hongdae na **spa za sve četvero**: korejski *head spa*, masažu ili tretman lica. Navečer idemo u **Sindang**, četvrt poznatu po *tteokbokkiju* koji se kuha u loncu na stolu, i na koktel u **Zoo Sindang**, skriveni bar s akvarijem na stropu. Potom odlazimo do rijeke Han na **besplatni drone show** u parku Ttukseom (otkazuje se po kiši i vjetru). Večer završavamo na **Halloweenu u Hongdaeu**, uz kostime, glazbu i živu atmosferu na ulicama, pješice do smještaja."}, "rows": [{"time": "08:30", "key": "08:30", "text": "☕ **French toast** u Yeonnam-dongu (260-2 Yeonnam-dong, ❓ fali ime).", "altHint": false, "slot": 0}, {"time": "09:30", "key": "09:30", "text": "Linija 2 do **Seongsua**, ~35 min: **Seoul Forest** (žuti ginkgi, jeleni), ulica postolara, **Daelim Changgo**. ⚠️ Opcija: kafić sa slasticama.", "altHint": false, "slot": 1}, {"time": "11:30", "key": "11:30", "text": "Ručak u **Somunnan gamjatangu:** ljuto varivo od svinjskih kostiju i krumpira. ⚠️ Subotom red, doći do 11:30.", "altHint": false, "slot": 2}, {"time": "12:45", "key": "12:45", "text": "🚲 **Bicikli i piknik uz rijeku Han:** Ttareungi od Seoul Foresta po ravnoj stazi uz rijeku, ~1,5 h.", "altHint": false, "slot": 3}, {"time": "14:15", "key": "14:15", "text": "Linija 2 doma, ~35 min.", "altHint": false, "slot": 4}, {"time": "15:00", "key": "15:00", "text": "💆 **Spa: THE SEOL:HA** u Hongdaeu, 10 min od stana: head spa, masaža ili tretman lica, ~2 h, za sve četvero.", "altHint": false, "slot": 5}, {"time": "17:15", "key": "17:15", "text": "Linija 2 do **Sindanga**, ~30 min.", "altHint": false, "slot": 6}, {"time": "18:00", "key": "18:00", "text": "Večera: **tteokbokki kod bake Mabongrim**, lonac na stolu s rižinim kolačićima, ramenom, manduom, ribljim kolačima i jajima u ljutom umaku.", "altHint": false, "slot": 7}, {"time": "19:15", "key": "19:15", "text": "🍸 **Zoo Sindang**: skriveni bar s akvarijem na stropu, kokteli po korejskom horoskopu. Prvi rez ako kasnimo.", "altHint": false, "slot": 8}, {"time": "20:30", "key": "20:30", "text": "🚁 **Drone show u parku Ttukseom Hangang:** besplatno, 15 min, glazba od 19:30. Otkazuje se po kiši i vjetru.", "altHint": false, "slot": 9}, {"time": "21:15", "key": "21:15", "text": "Pješice do **Konkuk Univ.**, pa linija 2 direktno u Hongdae, ~35 min.", "altHint": false, "slot": 10}, {"time": "22:00", "key": "22:00", "text": "🎃 **Noć vještica u Hongdaeu:** ulice pune kostima, barovi i šatori, za klubove red od 1–2 h. Do kreveta 5–10 min.", "altHint": false, "slot": 11}], "plans": [{"label": "Plan B · Hongdae", "replaces": ["17:30", "18:00", "19:15", "20:30", "21:15", "22:00"], "summary": "**Plan B (kiša, umor, vjetar):** cijela večer u Hongdaeu. Večera blizu kuće (BBQ ili tržnica Mangwon), Noć vještica od ~20:00, **pub crawl** (subotom u Hongdaeu, 20:00–21:30).", "detail": {"title": "Plan B — cijela večer u Hongdaeu", "meta": [], "md": "*Kiša, vjetar (dronovi otkazani) ili umor.* Večera blizu kuće, **korejski BBQ** ili **tržnica Mangwon** (lokalna tržnica 10 min od stana, 09:00–21:00: pržena piletina, kroketi, rezanci), pa Noć vještica od ~20:00 i **Absolute pub crawl** (subotom u Hongdaeu, sastanak u Dokkaebi Party Houseu **20:00–21:30**, ~21 USD, osobna isprava). Bez prelaska grada, bez dronova i Sindanga.\n\n*Ako fontane Banpo nije bilo u petak:* **zadnja večer sezone**. Umjesto dronova Banpo u 20:00 ili 20:30, pa Hongdae oko 21:45. Oboje ne stane.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-sub-31-10-spa-blok-za-cetvero"]}, {"date": "1.11", "d3heading": "NED 1.11. — TAJNI VRT, CHEONGSUDANG, INWANGSAN, BAR CHAM I ZADNJI BBQ", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 14 od 14", "intro": "⚠️ **Zadnja stvarna večer putovanja.** 2.11. je samo jutro do aerodroma. Nedjeljom ne radi Eulji Myeonok, fontana Banpo završila je 31.10., a KBO bejzbola 1.11. nema (Korejska serija počinje tek 2.11. u Suwonu).", "stay": "", "slots": [{"timeLabel": "~09:30", "key": "09:30", "title": "🔒 Changdeokgung i Tajni vrt", "meta": ["⏱ 2–2,5 h", "🌦️", "🦵🦵 vrt je brdovit, staze zemljane"], "body": "💡 Najbolje je uzeti engleski termin **10:30** (palača prije toga), tako da Cheongsudang i ručak padnu oko podneva. Ako je termin 11:30, kafić ide nakon ručka.\n\n**8 000 ₩ (5 000 vrt plus 3 000 palača) · UNESCO · rezervirano 26.10. u 10:00.** ⚠️ Ako online nije uspjelo, **otprilike pola karata prodaje se na licu mjesta istog dana od 09:00**, pa biti na blagajni oko 08:30. Termini na engleskom: **10:30 / 11:30 / 14:30 / 15:30**. Obilazak vrta je **samo s vodičem, ~90 min**.\n\n**Changdeokgung** je najomiljenija palača dinastije Joseon. Kraljevi su u njoj živjeli dulje nego u Gyeongbokgungu, jer se zgrade prirodno uklapaju u brdo umjesto u strogu simetriju. **Huwon (Tajni vrt)** je kraljevski vrt iza palače: šumovito brdo s **jezercem Buyongji** i paviljonom koji jednom nogom stoji u vodi, knjižnicom **Juhamnu**, paviljonima uz potok i stablima starijima od 300 godina. **Početak studenog je vrhunac javora**, najtraženiji termin u godini.\n\nMetro Anguk (L3), izlaz 3, ~5 min. Iz Yeonnam-donga taksi ~25 min.", "alts": [{"title": "Palača bez vrta", "text": "(3 000 ₩) i **Changgyeonggung** kroz spojna vrata (1 000 ₩): jezero Chundangji i **stakleni staklenik Daeonsil iz 1909.**, bez rezervacije", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~12:05", "key": "12:05", "title": "☕ Cheongsudang (청수당), Ikseon-dong", "meta": ["⏱ 45 min plus red", "☔", "🦵 lagano"], "body": "**31-9 Donhwamun-ro 11na-gil, Ikseon-dong**, **~10 min pješice od Changdeokgunga**. Kafić u tradicionalnoj **hanok** kući: ulazi se **kamenim stazama preko jezerca**, kroz bambus i lampione, a sjedi se uz vrt (dio sjedenja na podu, tražimo stol). Piće 5 800–7 500 ₩, **deserti 13–20 000 ₩**, i to je glavna stvar, a ne kava. ⚠️ **Nedjeljom red**, pa idemo odmah nakon vrta. ⚠️ **WIP:** radno vrijeme nedjeljom.", "alts": [{"title": "Red predug:", "text": "kava u nekom od hanok kafića u Ikseon-dongu, uličice su pune njih", "meta": ["⏱ 30 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Ručak: Imun Seolnongtang", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**이문설농탕**, Gyeonji-dong (Jongno), ~10 min od palače. **Najstariji restoran u Seoulu, od 1904.** **Seolleongtang:** volovske kosti kuhane **17 sati** do mliječnobijele juhe, s mekim goveđim prsima i rezancima. **Soli se za stolom**, uz kimchi i kkakdugi (rotkvu). Jednostavno, toplo, povijesno. **Nedjeljom 08:00–20:30, pauza 15:00–16:30.** 12–15 000 ₩.\n\n*Alternativa:* **Tongin**, kafić s mjedenim novčićima **nedjeljom radi** (prva nedjelja, 11:00–17:00, novčići do 16:00), ako se 20.10. nije stiglo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Inwangsan, ravna staza (Jarak-gil)", "meta": ["⏱ 1,5–2 h", "☀️", "🦵 lagano"], "body": "⚠️ **Klasična ruta na vrh Inwangsana (338 m) preko Beombawija je ~90 % strmih kamenih i drvenih stepenica i golih granitnih ploča, ❌ za koljeno**, a silazak je najgori dio. Fit dio ekipe može gore zasebno (~1,5 h) dok ostali hodaju donjom stazom.\n\n**Ruta za sve:** taksi iz Jongnoa u **Seochon** (~10 min), pa:\n1. **Dolina Suseong-dong (수성동계곡):** mala obnovljena dolina na kraju Ogin-donga, borovi, granitne gromade, kameni most iz doba Joseona. Obnovljena 2012. rušenjem betonskih stambenih zgrada. Ravna šljunčana staza.\n2. **Inwangsan Jarak-gil (자락길):** **drvena staza i asfaltna pješačka traka podno planine**, gotovo bez stepenica.\n3. **Vidikovac Mumu-dae (무무대):** pogled na **Gyeongbokgung, Plavu kuću (Cheong Wa Dae) i planinu Bugaksan**. Lišće na vrhuncu.\n4. Kraj u **parku Sajik**, dalje taksijem.\n\nGradski zid iz 1396. vidi se iznad staze na grebenu.", "alts": [{"title": "Seodaemun Prison", "text": ", kišni plan: kolonijalni zatvor (1908.), ćelije od cigle, mjesto pogubljenja, podzemne sobe za ispitivanje, vrlo dobro postavljen. **3 000 ₩, nedjeljom 09:30–18:00**, metro Dongnimmun, izlaz 5", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Vrh Inwangsana", "text": ", samo za dobra koljena, zasebno", "meta": ["⏱ 1,5 h", "☀️", "🦵🦵🦵"]}, {"title": "Šamanistička tura na Inwangsanu:", "text": "~28 €, 2,5 h, s opcionalnom sesijom kod šamanke uz prevoditelja. Redovnih tura na engleskom možda nema, pa provjeriti postoji li termin i rezervirati oko 25.10.", "meta": ["⏱ 2,5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "16:00", "key": "16:00", "title": "Opcija: Guksadang i Seonbawi", "meta": ["⏱ 45 min", "🌦️", "🦵🦵 kratke stepenice"], "body": "S druge strane planine, **~15 min uzbrdo od stanice Dongnimmun (L3), izlaz 2**, ili taksijem iz parka Sajik. **Guksadang (국사당)** je **aktivno šamanističko svetište** (preseljeno s Namsana za japanske okupacije), gdje se i danas održavaju obredi **gut**: bubnjevi, plesovi, ponude hrane. Iznad su **Seonbawi (선바위)**, **izlizani granitni stupovi nalik redovnicima u halji**, gdje šamanke i žene mole za blagoslov. Gledamo s distance, obrede ne fotografiramo izbliza. Najneobičnije mjesto u Seoulu, i besplatno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Zalazak s Inwangsana", "meta": [], "body": "Zalazak je oko 17:30, s Inwangsana ili Mumu-daea pogled na grad u sumrak, pa taksi ~5 min dolje u Seochon.\n\n⚠️ **Samo ako Seoul Sky nije bio 20.10.:** taksi ili metro do Jamsila (~50 min), ulaz oko 17:00, pa s Inwangsana krenuti oko 16:00. Tada **Bar Cham i Guksadang otpadaju**, a večera je BBQ blizu kuće oko 20:30.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "🍸 Bar Cham (참), aperitiv u Seochonu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Tongin-dong**, 5 min pješice od kraja šetnje: koktel-bar u **hanoku**, na listi **Asia's 50 Best Bars**, kokteli s korejskim žestokim pićima (soju, makgeolli, omija, ginseng). **Srijeda–ponedjeljak 18:00–01:00, utorkom zatvoreno**, pa nedjeljom radi. Dolazimo **na otvaranje u 18:00**, bez rezervacije ili preko CatchTablea. Jedan ili dva koktela, pa taksi doma (~25 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:30", "key": "19:30", "title": "🔥 Zadnja večera: korejski BBQ u Yeonnam-dongu", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "Zadnji **korejski roštilj** blizu kuće: npr. **Yukmong** ako se svidio u četvrtak (rezervacija preko Navera ili CatchTablea, tel. 02-338-1142), ili bilo koji samgyeopsal s redom domaćih uz **Gyeongui Line Forest Park**. Piće u Hongdaeu ili kod kuće, **5 min do kreveta i kofera**.", "alts": [{"title": "Tosokchon Samgyetang (토속촌 삼계탕)", "text": ", Chebu-dong, kod Bar Chama: cijela mala piletina punjena rižom, ginsengom i češnjakom u mliječnoj juhi, 20–25 000 ₩, 10:30–21:30. ⚠️ Dio sjedenja je **na podu**, tražimo stol. Ako ekipa ipak želi ostati u Seochonu", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "22:00", "key": "22:00", "title": "Pakiranje", "meta": [], "body": "Kofere pakiramo večeras, ujutro nema vremena (vidi 2.11.).", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Tajni vrt nije rezerviran:** blagajna u 08:30, ili palača i Changgyeonggung.\n- **Kiša:** umjesto Inwangsana Seodaemun Prison; Bar Cham i BBQ ostaju.\n- **Seoul Sky nije odrađen:** Jamsil u 17:00, Guksadang i Bar Cham otpadaju, BBQ blizu kuće oko 20:30.\n- **Koljeno:** samo dolina Suseong-dong i Mumu-dae, bez Guksadanga.\n- **Svi umorni:** bez Guksadanga i Bar Chama, ravno na BBQ.\n- **Red u Cheongsudangu predug:** drugi hanok kafić u Ikseonu.", "heading": "Ned 1.11. — Tajni vrt, Cheongsudang, Inwangsan, Bar Cham i zadnji BBQ", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Nedjelja, 1. 11. · Seoul — javori, palača i posljednja večer", "text": "Dan počinjemo posjetom 🔒 **palači Changdeokgung i Tajnom vrtu**, jednom od najljepših mjesta za jesenske boje u Seoulu. Krajem listopada i početkom studenoga javori često su u vrhuncu jesenske ljepote, iako stvarno stanje ovisi o vremenu te godine. Termin ovisi o rezervaciji napravljenoj 26. 10.; ako online nije uspjelo, blagajna otvara u 09:00 i treba doći ranije. Odmah nakon vrta svraćamo u **Cheongsudang**, kafić u tradicionalnoj kući s jezercem, bambusom i lampionima, poznat po desertima. Za ručak biramo **juhu od volovskih kostiju**, poznatu kao *seolleongtang*, u restoranu s tradicijom koja seže do 1904. godine. Poslijepodne slijedi lagana šetnja **podno planine Inwangsan**, ravnijom stazom od doline Suseong-dong do vidikovca s pogledom na palaču i grad, uz zalazak sunca. Za kraj dana pijemo koktel u **Bar Chamu**, baru u tradicionalnoj kući, a posljednju večeru jedemo uz **korejski roštilj blizu kuće**. Nakon večere slijedi pakiranje i priprema za rano jutarnje putovanje prema aerodromu."}, "rows": [{"time": "~09:30", "key": "09:30", "text": "🔒 **Changdeokgung i Tajni vrt.** Termin ovisi o rezervaciji od 26.10. (engleski u 10:30 / 11:30 / 14:30 / 15:30). Ako online nije uspjelo, blagajna oko 08:30.", "altHint": false, "slot": 0}, {"time": "~12:05", "key": "12:05", "text": "☕ **Cheongsudang**, Ikseon-dong, 10 min od palače: hanok kafić s jezercem, bambusom i lampionima, deserti. ⚠️ Nedjeljom red.", "altHint": false, "slot": 1}, {"time": "~13:00", "key": "13:00", "text": "Ručak u **Imun Seolnongtangu:** mliječnobijela juha od volovskih kostiju s prsima, od 1904.", "altHint": false, "slot": 2}, {"time": "14:15", "key": "14:15", "text": "Taksi u Seochon, pa **dolina Suseong-dong** i **ravna staza Inwangsan Jarak-gil** do vidikovca **Mumu-dae** (pogled na palaču i Plavu kuću) i do parka Sajik. Ukupno ~1,5 h. Vrh po stepenicama preskačemo zbog koljena.", "altHint": false, "slot": 3}, {"time": "16:00", "key": "16:00", "text": "*Opcija:* **šamansko svetište Guksadang i stijene Seonbawi**, taksi oko brda i kratke stepenice.", "altHint": false, "slot": 4}, {"time": "17:30", "key": "17:30", "text": "Zalazak s Inwangsana. ⚠️ **Seoul Sky** samo ako nije bio 20.10. (tada Bar Cham otpada).", "altHint": false, "slot": 5}, {"time": "18:00", "key": "18:00", "text": "🍸 **Bar Cham**, koktel-bar u hanoku u Seochonu (Asia's 50 Best), na otvaranju, aperitiv.", "altHint": false, "slot": 6}, {"time": "19:30", "key": "19:30", "text": "🔥 **Zadnja večera: korejski BBQ** u Yeonnam-dongu (npr. Yukmong), 5 min do kreveta.", "altHint": false, "slot": 7}, {"time": "22:00", "key": "22:00", "text": "Doma, **pakiranje**. Sutra rano na aerodrom.", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "2.11", "d3heading": "PON 2.11. — ODLAZAK (KE937, T2, 11:55 → BEČ 16:55)", "night": "", "intro": "**Plan: AREX all-stop s Hongik Univ.**, 5 min od stana, ravno do T2, ~5 000 ₩. ⚠️ **AREX express ne staje na Hongik Univ.** Gradski check-in na Seoul Stationu (Korean Air ga nudi, rok za T2 je **3 h 20 min prije leta, dakle 08:35**) tražio bi raniji polazak i dva taksija, ne isplati se.\n\n**Rezerva je jumbo taksi**, ako pada kiša, ako je netko bolestan ili ako se ne da vući kofere. **Naručiti večer prije** (vidi dolje).", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "Večer prije (nedjelja 1.11.)", "meta": [], "body": "- **Kofere spakirati** i izvagati (Korean Air obično dopušta 1 × 23 kg, provjeriti na karti).\n- **Doručak za jutro** iz 7-Elevena (26 m od stana): kimbap, sendviči, kava.\n- **T-money kartice** napuniti za ~6 000 ₩ svaka (AREX all-stop ~5 000 ₩).\n- **Online check-in** kod Korean Aira, otvara se 48 h prije: sjedala, digitalna karta.\n- Ako ide rezerva, **jumbo taksi naručiti za 07:45** (Kakao T, \"Jumbo\" ili \"Venti\", ili zamoliti hosta).\n- Poruka hostu o odlasku i gdje ostaviti ključ.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "Kontrolne točke (srednje optimističan scenarij)", "md": "| Vrijeme | Točka | Napomena |\n|---|---|---|\n| **06:30** | Ustajanje | Tuš, doručak u stanu. |\n| **07:15** | Zadnja provjera | Putovnice, telefoni, punjači, tablete, računi za povrat poreza **u ručnu prtljagu**. Smeće, ključ. |\n| **07:25** | Izlazak | Pješice **~360 m do ulaza u AREX na Hongik Univ. (izlaz 3)**, ~8 min s koferima. |\n| **07:35** | Peron | AREX je duboko pod zemljom, pa **dizala** (znak 엘리베이터), ne pokretne stepenice s koferima. Ulaz T-money karticom. Smjer **인천공항 (Incheon Airport)**. Vlakovi svakih 6–12 min. |\n| **~07:45** | 🚆 Ukrcaj, AREX all-stop | Stajemo uz kraj vagona s koferima. **~56 min do T2** (od Seoul Stationa do T2 je 66 min). Prvo staje T1 (~08:35), **ne izlazimo**, Korean Air je na **T2**. |\n| **~08:41** | Stanica Incheon T2 | Prometni centar (B1), pa dizalom na **3. kat, odlasci**. ~10 min. |\n| **~08:55** | Odlazna dvorana | *Ako treba:* **kiosk za povrat poreza** (skenira putovnicu i račune) ili carina za ovjeru robe koja ide u predanu prtljagu. Inače ravno na check-in. Korean Air otvara check-in **3 h prije leta, u 08:55**. |\n| **~09:10** | Check-in i predaja kofera | Šalteri Korean Aira ili samoposlužni kiosk i bag drop. Red 15–30 min. **Zatvara sat prije leta, u 10:55.** |\n| **~09:45** | Sigurnosna kontrola | Tekućine do 100 ml u vrećici, laptopi van. 15–25 min. |\n| **~10:10** | Izlazna kontrola putovnica | Šalteri za strance ili automatska vrata ako smo registrirani. 5–15 min. |\n| **~10:20** | Iza kontrole | **Povrat poreza u gotovini** na kioscima iza kontrole. Zadnji korejski doručak (food court T2), duty-free. |\n| **~11:00** | Prema izlazu | Izlazi T2 su 230–270, sve u jednoj zgradi, do 10 min hoda. |\n| **~11:15** | Ukrcaj počinje | ~40 min prije polaska. **Vrata se zatvaraju oko 11:40.** |\n| **11:55** | ✈️ **KE937 → Beč 16:55** | |\n\n**Rezerva u vremenu:** ~1 h. **Najkasniji siguran izlazak iz stana: oko 08:15** (T2 oko 09:30, check-in do 10:55 još stane, ali bez doručka i duty-freeja).", "top": false}, {"title": "Povrat poreza (tax refund)", "md": "PDV je 10 %, stvarni povrat nakon naknada je **5–8 % cijene**. Najjednostavniji je **trenutni povrat u trgovini** (pokazati putovnicu) za račune od 15 000 ₩. Na ICN-u kiosk skenira putovnicu i račune; **roba koju carina možda želi vidjeti ide u ručnu prtljagu**, ne u kofer. Iznosi do ~75 000 ₩ obično prolaze bez pregleda.", "top": false}], "triggers": "", "heading": "Pon 2.11. — Odlazak (KE937, T2, 11:55)", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": {"label": "Ponedjeljak, 2. 11. · Seoul → Incheon (ICN) — povratak kući", "text": "Ustajanje u 06:30. S koferima pješice odlazimo do stanice **Hongik University**, odakle planiramo sjesti na **AREX All-Stop Train** prema zračnoj luci Incheon, terminalu 2. Vožnja traje približno 56 minuta, a vlak staje na više stanica. Nakon dolaska slijede prijava na let, predaja prtljage i sigurnosna kontrola. Ako ostane vremena, možemo pojesti posljednji korejski doručak u prostoru iza sigurnosne kontrole. **Let KE937 polijeće u 11:55.** Rezervna opcija je unaprijed naručeni veliki taksi (*jumbo taxi*), koji treba rezervirati večer prije ako procijenimo da će prtljaga ili jutarnji raspored otežati odlazak javnim prijevozom."}, "rows": [{"time": "Večer prije", "key": "večer prije", "text": "**Večer prije (nedjelja 1.11.)**", "altHint": false, "slot": 0, "d3only": true}, {"time": "06:30", "key": "06:30", "text": "Ustajanje, koferi su spakirani večer prije.", "altHint": false, "slot": null}, {"time": "07:25", "key": "07:25", "text": "Izlazak, pješice ~360 m do ulaza u AREX (Hongik Univ., izlaz 3).", "altHint": false, "slot": null}, {"time": "~07:45", "key": "07:45", "text": "🚆 **AREX all-stop do Incheona T2**, ~56 min, ~5 000 ₩. Express ovdje ne staje.", "altHint": false, "slot": null}, {"time": "~08:45", "key": "08:45", "text": "Na T2 dizalom na 3. kat (odlasci). Kiosk za povrat poreza ako treba.", "altHint": false, "slot": null}, {"time": "09:10", "key": "09:10", "text": "Check-in kod Korean Aira i predaja kofera.", "altHint": false, "slot": null}, {"time": "09:45", "key": "09:45", "text": "Sigurnosna kontrola i izlazna kontrola putovnica.", "altHint": false, "slot": null}, {"time": "10:15", "key": "10:15", "text": "Iza kontrole: zadnji korejski obrok, duty-free, povrat poreza u gotovini.", "altHint": false, "slot": null}, {"time": "11:15", "key": "11:15", "text": "Ukrcaj, vrata se zatvaraju oko 11:40. **11:55 KE937 → Beč 16:55.**", "altHint": false, "slot": null}], "plans": [{"label": "Rezerva · jumbo taksi", "replaces": ["07:25", "07:45"], "summary": "**Rezerva: jumbo taksi** (Staria ili Carnival) od vrata do T2, 07:45 → ~09:00, ~65–100 000 ₩ plus ~8 000 ₩ cestarine. **Naručiti večer prije**, preko Kakao T \"Jumbo\" ili hosta.", "detail": {"title": "Rezerva — jumbo taksi", "meta": [], "md": "**Kombi taksi (Kia Carnival ili Hyundai Staria) za četiri osobe i četiri velika kofera**, od vrata do vrata (odlasci T2, 3. kat).\n- **Naručiti večer prije za 07:45:** Kakao T aplikacija (\"Jumbo\" ili \"Venti\", traži registraciju i stranu karticu, **testirati ranije**), ili **zamoliti hosta** da naruči.\n- **60–75 min**, **65–100 000 ₩ plus ~7 900 ₩ cestarine**, dakle 20–27 000 ₩ po osobi.\n- ⚠️ **U obični taksi ne stanemo** (četiri osobe i četiri kofera). **Aerodromski bus se ne preporučuje**, u jutarnjoj gužvi vozi 70–90 min.\n- Dolazak oko 09:00, dalje isti raspored od check-ina.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": []}], "cities": {"seoul": {"id": "seoul", "name": "SEOUL", "heading": "🏙️ SEOUL", "intro": "Grad svjetske klase koji većina itinerara podcjenjuje: palače, tržnice, planine usred grada i noćni život koji ne staje. Jesenske boje sazrijevaju tijekom putovanja: na dolasku su tek početne, a vrhunac dosežu 31.10.–1.11.\n\n**Temperature:** 19.–22.10. danju 20–22 °C, noću 10–12 °C. Dana 1.11. danju 13–14 °C, noću 5–6 °C, pa za zadnju večer treba pravi kaput.\n\n⚠️ **Gyeongbokgung je zatvoren utorkom, Changdeokgung ponedjeljkom.** Obje su planirane za drugi boravak u Seoulu.", "extras": {"heading": "🧱 DODATNE OPCIJE — SEOUL I (Jongno, 19.–20.10.)", "md": "Aktivnosti koje nisu vezane za termin: ubacuju se gdje ostane rupa ili gdje nešto otpadne. Aktivnosti u Hongdaeu (bowling, sjekire, rage room, VR) su u tablici za Seoul II.\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Sewoon Sangga deck** | kompleks iz 1960-ih između Jongna i Euljira, povišena šetnica, kafići i stare elektroničke radnje · pon–sub 09:00–19:00 | 45 min | 🌦️ | lagano |\n| **Ramyeon automat uz rijeku Han** | paket se kupi u dućanu (4–5 000 ₩), skenira se zdjela i aparat sam skuha. Noćni seulski ritual (Yeouido, Banpo, Ttukseom) | 30 min | 🌦️ | lagano |\n| **Ulice hrane na Namdaemunu** | ulica pirjane ribe hairtail (galchi-jorim) i ulica kalguksua · pon–sub 06:00–20:00, **nedjeljom zatvoreno** | 1 h | 🌦️ | lagano |\n| **Tosokchon samgyetang** | piletina punjena rižom u juhi od ginsenga, 20–25 000 ₩, kod Gyeongbokgunga, 10:00–22:00 · ⚠️ **sjedi se na podu prekriženih nogu, loše za Lucijino koljeno** | 1 h | ☔ | lagano |\n| **Bar Sookhee (숙희)** | skriveni koktel bar u hanok stilu, Euljiro · 20–25 000 ₩ plus couvert 5–10 000 ₩ · 18:00–02:00 | 1,5 h | ☔ | lagano |\n| **Jean Frigo (장프리고)** | bar iza vrata hladnjaka u voćarni, Gwanghui-dong kod Dongdaemuna · 18:00–01:30, ponedjeljkom zatvoreno | 1,5 h | ☔ | lagano |\n| **Park Naksan i gradski zid** | iza apartmana, osvijetljen noću, besplatno | 1 h | ☀️ | srednje |\n| **Coin noraebang** | 500 ₩ za 1–2 pjesme, engleske pjesme preko gumba \"country\" | 30 min | ☔ | lagano |\n| **Self-photo studio** | privatna foto-soba, 25–60 000 ₩ po grupi, rođendanska uspomena | 20 min | ☔ | lagano |\n| **Noraebang** | 15–25 000 ₩ po sobi na sat | 1 h | ☔ | lagano |\n| **Namdaemun** | tržnica i naočale isti dan | 1,5 h | 🌦️ | lagano |\n| **Gyeongdong i Starbucks 1960** | tržnica ljekovitog bilja, kafić u starom kinu | 1,5 h | ☔ | lagano |\n| **Dongdaemun noću** | veleprodaja 20:00–08:00 | 1,5 h | ☔ | lagano |\n| **Duga fontana Banpo** | od 19:30 svakih 30 min, do 31.10. | 45 min | ☀️ | lagano |"}}, "sokcho-i-seoraksan": {"id": "sokcho-i-seoraksan", "name": "SOKCHO I SEORAKSAN", "heading": "⛰️ SOKCHO I SEORAKSAN", "intro": "Seoraksan (**1 708 m**) treća je najviša planina u zemlji i na  su u Japanu u travnju 2025.; Matej nikad nije bio u Aziji.\n\n### Što traže\n\n> *\"Ludi izlazak tipa escape room\"* — **Manuel**\n> *\"Doživjeti nešto što ne možemo naći u Europi\"* — **Goran**\n> *\"Novi doživljaji\"* — **Lucija**\n> *\"Puno pamtljivih doživljaja\"* — **Matej**\n\n### Pouke iz Japana\n\n1. **Rezati, ne gomilati** — kad je sve \"7–8\", na kraju se ne stigne ništa.\n2. **Slavno zna razočarati, a malo iznenaditi** — tržnice i arkade bile su bolje od očekivanog.\n3. **Rezervirati na vrijeme** — sve što je tražilo rezervaciju je propušteno.\n4. **Falilo je malo, neotkriveno selo.**\n\nOstale želje: bez golih kupki (Delpino, kupaći), tradicionalna kuća (hanok u Gyeongjuu), shopping se ne planira (Namdaemun usput).\n\n### Tvrda ograničenja\n\n| # | Pravilo | Izvor |\n|---|---|---|\n| 1 | 14 noći, 19.10. → 1.11. | letovi |\n| 2 | 5–6 noći u Seoulu | jednoglasno |\n| 3 | Maksimalno 4 selidbe | Q24 |\n| 4 | Minimalno 2 noći po bazi | odluka nakon Runde 1 |\n| 5 | Maksimalno ~3 h putovanja u jednom smjeru | Q21 |\n| 6 | Nula dana odmora | jednoglasno |\n| 7 | Hikerski strop ~4–5 h grupno | Lucijino koljeno |\n| 8 | Bez sirove ribe | 3–1 protiv |\n| 9 | Max 2–3 hrama ukupno | hram-burnout iz Japana |\n| 10 | Cijele dane se ne razdvajamo | odluka Manuel |\n\n### Što svima odgovara\n\n✅ **Visine** — sva četvorica \"nikakav problem\". Stakleni podovi, žičare, skywalkovi, sve prolazi.\n✅ **Rana jutra** — sva četvorica \"rado\". Polasci u 7:00 su u redu.\n✅ **Alergije** — nema ih.\n\n### Novac\n\nSrednje, uz 3–4 splurgea. **Odabrani: gozba od crvenih rakova u Sokchu · spa (head spa, masaža, tretman lica) u Seoulu 31.10.** Yosukgung 1779 je zamijenjen Jeongsugaseongom i ostaje samo kao ⚠️ malo vjerojatna rezerva; Waterpia je glavni bazen, a Delpino samo rezerva. Seoul Sky je obavezan i ne računa se kao splurge."}, {"id": "dodatak-b", "title": "DODATAK B — PRIJEVOZ", "md": "| Datum | Dionica | Način | Trajanje | Cijena pp |\n|---|---|---|---|---|\n| 19.10. | ICN → Seoul Station | AREX express | 43 min | ~11 000 ₩ |\n| 21.10. | Seoul → Sokcho | Express bus | 2h10–2h20 | 16 400–34 600 ₩ |\n| 24.10. | Sokcho → Gangneung | Bus 06:55 (ili taksi ~08:15) | 1h00–1h37 | 10 800 ₩ |\n| 24.10. | Gangneung → Gyeongju | **KTX-Eum 752, direktno** 09:36 → 12:30 | 2h54 | 34 300 ₩ |\n| 24.10. | Stanica Gyeongju → Airbnb | GJS van ili 2 taksija (koferi) | 18–22 min | 35–45 000 ₩ van / 15–17 000 ₩ auto |\n| 27.10. | Gyeongju → Busan Station | Taksi do stanice + KTX | ~20 min + ~30 min | 11 000–21 000 ₩ (+ taksi) |\n| 28.10. | Busan Station → Haeundae (Mipo) | taksi | 30–40 min | 18–25 000 ₩ po autu |\n| 29.10. | Busan → Seoul | KTX | ~2h30 | od 60 000 ₩ |\n| 30.10. | Seoul → Suwon | ITX | ~35 min (+ metro i taksi, ~1 h) | 4 800 ₩ |\n| 2.11. | Hongik Univ. → ICN T2 | AREX all-stop (express ovdje ne staje) · rezerva jumbo taksi | ~56 min | ~5 000 ₩ · taksi 65–100 000 ₩ + cestarina |\n\n**Korail Pass se ne isplati.** 3-dnevni 186 000 ₩, 5-dnevni 275 000 ₩; ne pokriva SRT, metro ni AREX. Prag isplativosti je 3+ dugih vožnji unutar prozora, a vaše su razvučene kroz dva tjedna s autobusnim dionicama između.\n\n**Aplikacije:** **Naver Map** primarno (engleski UI, točan javni prijevoz, opcija \"izbjegni stepenice\") · **Kakao Map** za praćenje autobusa i taksi · Papago za prijevod · Google Translate kamera za jelovnike. ⚠️ **Google Maps javni prijevoz i dalje nije pouzdan u Koreji.**"}, {"id": "dodatak-c", "title": "DODATAK C — USPUTNE STANICE PRI SELIDBAMA", "md": "Pet kandidata na četiri selidbe, poredani po tome koliko stvarno koštaju. **Prvi je gotovo besplatan, zadnji je upitan.**\n\n---\n\n## 🥇 GANGNEUNG · sub 24.10., na putu Sokcho → Gyeongju\n### **Ovo je jedini stop koji ne košta ništa u rutiranju — vi ondje ionako presjedate.**\n\nRuta 24.10. ide Sokcho → Gangneung busom (1h10), pa KTX-om dalje. **Dva do tri sata u Gangneungu su čista dobit**, jer je alternativa sjediti na kolodvoru.\n\n**Što ima:**\n- **Anmok Coffee Street** — Gangneung je neslužbena kavena prijestolnica Koreje, dom Terarose i drugih ozbiljnih pržionica. Kafići uz samu obalu, pogled na Istočno more. Ugodno i opušteno, ~2 h.\n- **Seongyojang** — velika plemićka hanok kuća u kojoj potomci i danas žive, s vrtom i ribnjakom. Nije selo nego jedna impresivna naseljena kuća. 45–60 min.\n- **Ojukheon** — rodna kuća učenjaka Yi I-ja i njegove majke Shin Saimdang, koja je **na novčanici od 50 000 wona**. Skromno ali autentično, 45–60 min.\n- **Arte Museum** — ⚠️ **Nije teamLab** — spektakl s jednim motivom (slap, val), bez interakcije i hodanja kroz vodu. **Kalibrirati očekivanja ili preskočiti.**\n\n**Preporuka:** Anmok kava + Seongyojang, ~2,5 h. Gangneung je 24.10. subota, pa će obala biti živa.\n\n⚠️ **Status 9.10.:** s direktnim KTX-Eumom 752 Gangneung se samo prolazi (bus → stanica). Pauza ovdje znači kasniji vlak **754 (14:56 → Gyeongju 17:44)** i gubitak popodneva u Gyeongjuu — **malo vjerojatan plan C**, vidi Dan 6.\n\n---\n\n## 🥈 CHUNCHEON · sri 21.10., na putu Seoul → Sokcho\n\nGrad u kojem je **izmišljen dakgalbi** — pikantna pržena piletina s kupusom, rižinim kolačićima i slatkim krumpirom, na velikoj tavi nasred stola. U Myeongdong-gilu ima cijela ulica restorana koji to rade desetljećima.\n\n**Kako:** ITX-Cheongchun iz Yongsana ili Cheongnyangnija do Chuncheona, **~1 h, 6 000–8 500 ₩** → ručak → intercity bus Chuncheon → Sokcho, **~2 h**.\n\n**Cijena:** ~4,5–5 h ukupno umjesto 2h20 direktno. **Dva dodatna sata za regionalno jelo na njegovom izvoru.**\n\n⚠️ **Nami Island je odavde 20 minuta i eksplicitno je izrezan** — privatni tematski park s lažnom putovnicom i maskotama. **Ne dati se uvući.**\n\n**Preporuka:** vrijedi samo ako ekipa hoće jesti kroz zemlju, a ne samo u gradovima. 21.10. je ionako lagan dan bez planinarenja — podnosi to.\n\n---\n\n## 🥉 TONGDOSA · uto 27.10., na putu Gyeongju → Busan\n\n**Jedan od Tri dragulja korejskog budizma** i vjerojatno najvažniji hram u zemlji koji nije na vašem popisu. Nalazi se u Yangsanu, **točno na koridoru Gyeongju–Busan.**\n\n**Posebnost:** Tongdosa predstavlja samog Bude jer čuva njegove relikvije — pa **u glavnoj dvorani nema kipa Bude.** Gledaš prema prozoru iza oltara, a iza njega je stupa s relikvijama. To je arhitektonski i konceptualno neobično i nije ista stvar kao još jedan hram.\n\n**Prilazna staza kroz borovu šumu duga je otprilike kilometar** i kraj listopada joj je najbolji trenutak.\n\n⚠️ **Kvaka:** pravilo je maksimalno 2–3 hrama, a Jogyesa, Bulguksa i Seokguram su već u planu — **Tongdosa bi bio četvrti.**\n\n**Preporuka:** samo ako Bulguksa i Seokguram prođu **bolje** nego što očekujete. Ako 26.10. navečer netko kaže \"dosta hramova\" — otpada bez rasprave.\n\n---\n\n## ULSAN — DAEWANGAM ILI GANJEOLGOT · uto 27.10., alternativa Tongdosi\n\nAko je hram otpao a obala nije, isti transfer nudi dvije priobalne točke:\n\n- **Daewangam Park** — borov park na stijenama iznad mora, s kamenim lukom i mostom preko vode. Besplatno, ~1,5 h. Vezano uz legendu o podmorskoj grobnici kraljice, supruge kralja Munmua — što se lijepo naslanja na Silla kontekst iz Gyeongjua.\n- **Ganjeolgot** — **najistočnija točka kopnene Koreje**, svjetionik i mjesto gdje sunce izlazi prvo u zemlji. Besplatno, ~1 h.\n\n**Cijena:** oboje traži pravi detour s glavne ceste i taksi. **Realno dodaje 2–3 h transferu od jednog sata.**\n\n**Preporuka:** slabije od Tongdose po jedinstvenosti, ali bez hram-problema. I ⚠️ **imate Igidae isti dan popodne** — dvije obale u jednom danu je previše iste stvari.\n\n---\n\n## ⚪ DAEGU · čet 29.10., na putu Busan → Seoul — **vjerojatno ne**\n\nKTX iz Busana ionako prolazi kroz Daegu za ~40 min, pa je izlazak tehnički trivijalan.\n\n**Što ima:** **Seomun tržnica** — jedna od najvećih tradicionalnih tržnica u zemlji, s jakom večernjom scenom hrane. Vrijedi 1–2 h ako se ionako prolazi kroz Daegu.\n\n⚠️ **Zašto ipak ne:** **poanta Seomuna je noćna tržnica, a vaš vlak je u 9 ujutro.** Došli biste u 10, kad tržnica radi ali bez onoga zbog čega vrijedi. A pomicanje vlaka na popodne znači dolazak u Seoul u mraku i **gubitak Gyeongbokgunga i escape rooma** — dvije stvari koje su tog dana fiksne.\n\n**Preporuka:** ne.\n\n---\n\n## SAŽETAK\n\n| Stanica | Dan | Dodatno vrijeme | Verdikt |\n|---|---|---|---|\n| **Gangneung** | 24.10. | +2,5 h na dan koji je ionako putovanje | ✅ **Napraviti** |\n| **Chuncheon** | 21.10. | +2,5 h na lagan dan | ✅ Ako se hoće jesti kroz zemlju |\n| **Tongdosa** | 27.10. | +2–3 h | 🟡 Samo ako hramova nije dosta |\n| **Ulsan obala** | 27.10. | +2–3 h | 🟡 Slabije, i duplira Igidae |\n| **Daegu** | 29.10. | razbija fiksni dan | ❌ Ne |"}, {"id": "dodatak-d", "title": "DODATAK D — ŠTO JE IZREZANO I ZAŠTO", "md": "| Što | Slava | Zašto van |\n|---|---|---|\n| **Nami Island** | 9/10 | Privatni tematski park s lažnom putovnicom i maskotama. Cijeli dan za drvorede |\n| **Everland** | 8/10 | Odbijeno |\n| **DMZ standardna tura** | 9/10 | Odbijeno — JSA više nije što je bio: u plavu baraku se ne ulazi, gleda se s krova Freedom Housea |\n| **Golgulsa templestay** | 3/10 | Izbačeno |\n| **Hanbok rental** | 8/10 | Ne zanima ekipu |\n| **Busan X the Sky** | — | Seoul Sky je bolji, drugi vidikovac ne treba |\n| **Haeundae plaža** | — | Izvan sezone |\n| **Lotte World** | 8/10 | Zadržano samo kao kišna rezerva |\n| **63 Building / 63 Sky** | 5/10 | Zastarjelo. Isti grad kao Seoul Sky, a upola niže. Jedan vidikovac je dosta i neka bude visoki |\n| **Yongsan elektronika** | — | Tržnica je propala i postala anime/gaming hub |\n| **Jeju** | — | 4 dana minimum, međunarodna vozačka, duplira planinski budžet |\n| **Boseong, Damyang, Naganeupseong, Jirisan** | — | Svi padaju na pravilu od 3 h putovanja |\n| **Haeinsa** | 6/10 | **Ploče se zapravo ne vide** — gledaš skladište izvana. Traži detour preko Daegua |\n| **Aquafield** | — | Vodeni park za sve uzraste |\n| **Hwadam (botanički vrt)** | — | Prijedlog Gorana i Lucije, izbačen 16.10. Stane samo umjesto cijelog Suwona (sezona počinje 23.10., a 29.10. je selidba s koferima). Traži ~4,5 h busa za ~3 h vrta, shuttle je bio rasprodan, a jesenskog lišća već imamo dosta: Seoraksan, Bulguksa, Namsan i Tajni vrt dva dana kasnije. Suwon nudi više: tvrđavu, streličarstvo, galbi i balon |\n| **Hunky show (Sexy Man Standing)** | — | Samo za žene, a ne razdvajamo se |\n| **Drag show** | — | Ne zanima ekipu |\n| **Starfield Library** | — | Gangnam, nije nam usput |\n| **Cheonan, kafić Pins** | — | 2–3 h puta za jedan kafić |\n| **Yoonseul (Seoul Station)** | — | Nespretno s koferima na dan selidbe, a dan je pun |\n| **Jagalchi doručak, Gukje, BIFF, Kkangtong** | — | Ekipa ne želi ribu za doručak ni toliko tržnica, Busan je dobio obalu |\n| **Yosukgung 1779 kao plan** | — | 80+ € po glavi i formalno; ostaje samo ⚠️ rezerva uz stolice |\n\n💡 **Vraćeno u plan nakon komentara Gorana i Lucije (15.10.):** Gamcheon (lite), Sky Capsule, Haedong Yonggungsa, cijeli Igidae (uz Plan B)."}, {"id": "dodatak-e", "title": "DODATAK E — OTVORENA PITANJA I WIP", "md": "Potpuni popis neprovjerenih podataka, po danima, je u [KorejaWIP.md](KorejaWIP.md). Ovdje je samo ono što mijenja plan.\n\n### Provjeriti prije puta\n1. **K-ETA izuzeće** vrijedi do 31.12.2026., ali je formalno \"privremeno\". Provjeriti tjedan prije puta.\n2. **KOBUS i strane kartice:** prihvaćanje uvedeno tek u kolovozu 2026. Testirati kupnju odmah.\n3. **Subotnja satnica 24.10.:** bus Sokcho → Gangneung i vlakovi KTX-Eum 754/756.\n4. **Tajni vrt:** engleski termini za jesen 2026. Rezervacija 26.10. u 10:00.\n5. **Jeongsugaseong:** rezervacija i stol. ⚠️ Yosukgung samo ako uspije sa stolicama.\n5a. **Kavez u Hyehwi:** adresa i radno vrijeme (Naver).\n5b. **SEOL:HA:** cijene i četiri termina u subotu.\n5d. **Cafe Pokpo:** termini slapa; **Cheongsudang:** radno vrijeme nedjeljom.\n5e. **Jahta Gwangalli:** raspored u listopadu.\n6. **Drone show 31.10.:** potvrditi na seouldroneshow.com na dan.\n7. **Korean Air:** prtljaga na karti; Kakao T jumbo sa stranom karticom.\n8. **KBO doigravanje:** datumi utakmica nisu potvrđeni, provjeriti oko 30.10. Vidi [KorejaSeulDogadanja.md](KorejaSeulDogadanja.md).\n\n### Odluke koje čekaju\n9. **Šamanistička tura na Inwangsanu**, da ili ne, do ~25.10.\n10a. **Ime French toast kafića** (260-2 Yeonnam-dong), 31.10. ujutro.\n11. **Vodič za jedan grad**, u planu ga trenutno nema.\n12. **Tko je vlasnik svakog retka iz Dodatka A.**\n\n### Strukturne slabosti koje ostaju\n- **Seoul II je gradski, ne izletnički.** Jedan dnevni izlet (Suwon), tri seulska dana. Veliki doživljaji su rođendanska večer, Seoraksan i escape room.\n- **Nema \"dubokog\" sadržaja bez templestaya.** Gyeongju je razgledavanje. Šamanistička tura jedina je preostala stavka te vrste.\n- **Bejzbola možda neće biti.** Ako se ne igra, finale 1.11. je krovni bar."}, {"id": "wip", "title": "KOREJA 2026 — WIP I NEPROVJERENI PODACI", "md": "Sve što u `KorejaMain.md` nije potvrđeno, izdvojeno 10.10.2026., ažurirano 15.10.2026. (komentari Gorana i Lucije). Ključne stavke (one koje mijenjaju plan) ponovljene su u Dodatku E glavnog dokumenta. Kad se nešto provjeri, ispraviti brojku u glavnom dokumentu i obrisati redak ovdje.\n\n## Ključno (mijenja plan)\n- K-ETA izuzeće za Hrvatsku vrijedi do 31.12.2026., ali je formalno \"privremeno\". Ponovno provjeriti tjedan prije puta.\n- KOBUS prima strane kartice tek od kolovoza 2026. Testirati kupnju karte za 21.10. odmah.\n- Sub 24.10.: subotnja satnica busa Sokcho → Gangneung (06:55 je radni dan) i vlakova KTX-Eum 754/756.\n- Pon 26.10.: engleski termini Tajnog vrta (10:30 / 11:30 / 14:30 / 15:30) za jesen 2026.\n- Pon 26.10.: Jeongsugaseong (plan), treba li rezervacija i stol. ⚠️ Yosukgung 1779 samo ako uspije rezervacija sa stolicama.\n- Pet 23.10. u 23:59: booking escape rooma za 29.10. (✅ pravilo potvrđeno 14.10.: 5 dana unaprijed, ponoć KST).\n- Sri 28.10.: Sky Capsule je već u prodaji, rezervirati odmah.\n- Sub 31.10.: drone show na Ttukseomu, održava li se 31.10. (tema i broj dronova neprovjereni).\n- Ned 1.11.: šamanistička tura na Inwangsanu, postoji li termin na engleskom; rezervirati do ~25.10.\n- Pon 2.11.: dopuštena prtljaga na karti Korean Aira i radi li Kakao T jumbo sa stranom karticom.\n- Zadnji KTX Busan → Seoul navodno ~22:40, neprovjereno za 2026.\n- Jesensko vrijeme zatvaranja ulaza u staze Seoraksana.\n\n## Seoul I (19.–20.10.)\n- Pon 19.10., slijetanje: poslijepodnevni redovi na imigraciji navodno 60–90 min, neprovjereno.\n- Pon 19.10., AREX express: točna cijena karte (11 500–13 000 ₩).\n- Pon 19.10., batting cage u Hyehwi: postoji li još, adresa i radno vrijeme (Naver: 혜화 야구장). Ako ne, screen baseball (Strikezon Jongno, točna adresa).\n- Pon 19.10., Golfzon Park Euljiro Signature: rezervacija za 20:00, cijena 9 rupa.\n- Uto 20.10., KBBQ na Euljiru: konkretan lokal nije odabran.\n- Uto 20.10., Jean Frigo: radno vrijeme (18:00–01:30 ili 17:00–01:00) i dan zatvaranja.\n\n## Sokcho (21.–23.10.)\n- Sri 21.10., bus: KOBUS prima strane kartice tek od kolovoza 2026., testirati kupnju rano.\n- Sri 21.10., Chuncheon varijanta: vozni red ITX-Cheongchun za 2026. (09:11 → 10:06 neprovjereno).\n- Sri 21.10., hotel: potvrditi mailom s Blue Terrom čuvanje kofera u ~11:15.\n- Sri 21.10., Yeonggeumjeong: radno vrijeme i broj stepenica.\n- Sri 21.10., šatori Yeongrang-dong: imena (Maljane, Danggeun Macha) i radno vrijeme neprovjereni.\n- Čet 22.10., žičara: dobiva li se na karti fiksni termin ukrcaja.\n- Čet 22.10., Freezer Club: radi li četvrtkom krajem listopada.\n- Pet 23.10., Biryong: točna stanica busa 7/7-1 za polazište (Seorak-dong).\n- Pet 23.10., Seoraksan: jesensko vrijeme zatvaranja ulaza u dublje staze (podne ili 14:00).\n- Pet 23.10., planinarski muzej: radi li soba koja simulira visinu i kako se ulazi.\n- Pet 23.10., Expo toranj: sati i cijena.\n- Pet 23.10., plaža Sokcho i Sokcho Eye: sati i cijena (~12 000 ₩).\n- Pet 23.10., Craftroot: adresa i sati.\n- Pet 23.10., Delpino: temperatura vode (34–38 °C), karte za negoste na blagajni Ocean Playa, sati (10:0 /* ---------- tiny markdown ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    u = u.replace(/&amp;/g, '&');
    if (/^https?:/.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;
    if (/^nmap:/.test(u)) return `<a class="map" href="${esc(u)}">📍 ${t}</a>`;
    return `<span>${t}</span>`;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\b(WIP|UV)\b/g, '<span class="wip">$1</span>');
  return s;
}
function calloutClass(t) {
  if (/^⚠️/.test(t)) return 'c-warn';
  if (/^(⏰|🔴)/.test(t)) return 'c-decide';
  if (/^✅/.test(t)) return 'c-ok';
  if (/^💡/.test(t)) return 'c-tip';
  return '';
}
const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
function table(lines) {
  const head = splitRow(lines[0]);
  const body = lines.slice(2).map(splitRow);
  if (head.includes('⏱') && head.includes('🦵')) {
    const ci = { t: head.indexOf('⏱'), w: head.indexOf('Vrijeme'), k: head.indexOf('🦵') };
    return `<div class="xlist">${body.map(r => `<div class="xitem"><div class="xt">${inline(r[0])}</div><div class="xd">${inline(r[1])}</div><div class="chips">${
      [r[ci.t] && '⏱ ' + r[ci.t], r[ci.w], r[ci.k]].filter(Boolean).map(c => `<span class="chip">${inline(c)}</span>`).join('')}</div></div>`).join('')}</div>`;
  }
  if (head.every(h => !h)) {
    if (head.length === 2) return `<div class="kv">${body.map(r => `<div class="k">${inline(r[0])}</div><div>${inline(r.slice(1).join(' | '))}</div>`).join('')}</div>`;
  }
  const stack = head.length > 2 ? ' stackable' : '';
  return `<div class="tbl${stack}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${
    body.map(r => `<tr>${r.map((c, i) => `<td data-l="${esc(head[i] || '')}">${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function list(lines) {
  // nested by indentation; each item may carry continuation lines
  const root = { kids: [], ordered: false }; const stack = [{ ind: -1, node: root }];
  for (const l of lines) {
    const m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) { const top = stack[stack.length - 1].node; const last = top.kids[top.kids.length - 1]; if (last) last.text += '<br>' + inline(l.trim()); continue; }
    const ind = m[1].length;
    while (stack.length > 1 && ind <= stack[stack.length - 1].ind) stack.pop();
    const parent = stack[stack.length - 1].node;
    const item = { text: inline(m[3]), kids: [], ordered: /\d/.test(m[2]) };
    parent.kids.push(item); parent.ordered = parent.ordered || item.ordered;
    stack.push({ ind, node: item });
  }
  const r = n => n.kids.length ? `<${n.ordered ? 'ol' : 'ul'}>${n.kids.map(k => `<li>${k.text}${r(k)}</li>`).join('')}</${n.ordered ? 'ol' : 'ul'}>` : '';
  return r(root);
}
function md(src) {
  if (!src) return '';
  const L = src.split('\n'); let out = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^-{3,}$/.test(l.trim())) { out += '<hr>'; i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const lvl = h[1].length <= 2 ? 3 : 4; out += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }
    if (/^\|/.test(l)) { const t = []; while (i < L.length && /^\|/.test(L[i])) t.push(L[i++]); out += table(t); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const t = [];
      while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s+\S/.test(L[i]) && t.length))) t.push(L[i++]);
      out += list(t); continue;
    }
    if (/^>/.test(l)) { const t = []; while (i < L.length && /^>/.test(L[i])) t.push(L[i++].replace(/^>\s?/, '')); out += `<blockquote>${t.map(inline).join('<br>')}</blockquote>`; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !/^(\||#{1,4}\s|>|\s*([-*]|\d+\.)\s+|-{3,}$)/.test(L[i])) p.push(L[i++]);
    const cls = calloutClass(p[0].trim());
    out += `<p${cls ? ` class="${cls}"` : ''}>${p.map(inline).join('<br>')}</p>`;
  }
  return out;
}

}
function shortMeta(m) {
  m = m.replace(/\s*\([^)]*\)/g, '').trim();
  if (/^⏱/.test(m)) {
    let t = m.replace(/^⏱\s*/, '').split(/\s+(?:s|\+|od|gore|vožnje|do)\b/)[0].trim();
    return t && t !== '—' ? '⏱ ' + t : '';
  }
  if (/^(☀️|☔|🌦️)/.test(m)) return m.match(/^(☀️|☔|🌦️)/)[1];
  if (/^🦵/.test(m)) return m.match(/^(🦵+)/)[1];
  return m;
}
function rowHTML(d, r, key, opts = {}) {
  const slot = r.slot != null ? d.slots[r.slot] : null;
  const pd = pickDoc(d); const chosenIdx = slot ? (pd.slots || {})[key] : undefined;
  const chosen = slot && chosenIdx != null ? slot.alts[chosenIdx] : null;
  const hasDetail = slot && (slot.body || slot.alts.length || slot.altNotes.length || slot.after);
  const open = hasDetail && openSlots.has(d.date + '|' + key);
  const chips = [];
  if (slot) slot.meta.forEach(m => { const t = shortMeta(m); if (t) chips.push(`<span class="chip" title="${esc(m)}">${inline(t)}</span>`); });
  if (slot && slot.alts.length) chips.push(`<span class="chip alt">↔ ${slot.alts.length}</span>`);
  if (chosen) chips.push(`<span class="chip pick">✓ ${inline(chosen.title)}</span>`);
  const loc = (LOC[d.date] || {})[r.key];
  if (loc && loc.main) chips.push(`<a class="chip nvchip" href="${esc(nvHref(loc.main))}">📍 Naver</a>`);
  const timeSoft = !/\d/.test(r.time);
  const inner = `<span class="time${timeSoft ? ' soft' : ''}">${inline(r.time.replace(/^~/, ''))}</span>
    <span class="txt"><p>${inline(r.text)}</p>${chips.length ? `<span class="chips">${chips.join('')}</span>` : ''}</span>
    <span class="chev" aria-hidden="true">${hasDetail ? '›' : ''}</span>`;
  const row = hasDetail
    ? `<button class="row" data-act="slot" data-key="${esc(key)}" aria-expanded="${open}">${inner}</button>`
    : `<div class="row">${inner}</div>`;
  const det = open ? `<div class="detail" data-act="slot" data-key="${esc(key)}">
      <h3 class="dtitle">${inline(slot.title)}</h3>
      ${loc && loc.main ? nvPill(loc.main) : ''}
      ${slot.meta.length ? `<div class="chips wrap">${slot.meta.map(m => `<span class="chip">${inline(m)}</span>`).join('')}</div>` : ''}
      ${slot.body ? `<div class="md">${md(slot.body)}</div>` : ''}
      ${slotAlts(d, slot, key)}
      ${slot.after ? `<div class="md">${md(slot.after)}</div>` : ''}
    </div>` : '';
  const detL = loc ? nvInline(det, loc.subs) : det;
  return `<li class="${open ? 'open' : ''}${opts.gone ? ' gone' : ''}">${row}${detL}</li>`;
}
function planCard(d, p) {
  const det = p.detail;
  return `<li class="plancard"><div class="pcard">
    <div class="ph"><b>${inline(p.label)}</b>${det && det.meta.length ? `<span class="chips">${det.meta.map(m => `<span class="chip">${inline(m)}</span>`).join('')}</span>` : ''}</div>
    ${det ? `<div class="md"><p><strong>${inline(det.title)}</strong></p></div>` : ''}
    ${p.summary ? `<div class="md"><p>${inline(p.summary)}</p></div>` : ''}
    ${det ? `<div class="md">${md(det.md)}</div>` : ''}
    ${det && det.alts.length ? slotAlts(d, { alts: det.alts, altNotes: [] }, 'plan-' + p.label) : ''}
    ${det && det.after ? `<div class="md">${md(det.after)}</div>` : ''}
  </div></li>`;
}
function partOf(key) {
  const m = key.match(/^(\d\d):/); if (!m) return null;
  const h = +m[1]; return h < 12 ? 'Jutro' : h < 17 ? 'Popodne' : 'Večer';
}
function timeline(d) {
  const pv = planView[d.date] || 0;
  const p = pv > 0 ? d.plans[pv - 1] : null;
  if (p && p.rows) return `<ol class="tl">${p.rows.map((r, i) => rowHTML(d, r, 'alt' + i)).join('')}</ol>`;
  const rep = p ? new Set(p.replaces) : null;
  let html = '', cardDone = false, part = null;
  d.rows.forEach((r, i) => {
    const key = 'r' + i + '-' + r.key;
    const gone = rep && rep.has(r.key);
    const pt = partOf(r.key);
    if (pt && pt !== part) { html += `<li class="part">${pt}</li>`; part = pt; }
    if (p && gone && !cardDone) { html += planCard(d, p); cardDone = true; }
    html += rowHTML(d, r, key, { gone });
  });
  if (p && !cardDone) html = planCard(d, p) + html;
  return `<ol class="tl">${html}</ol>`;
}
function triggers(src) {
  const items = src.split('\n').filter(l => /^- /.test(l)).map(l => l.slice(2));
  const rest = src.split('\n').filter(l => l.trim() && !/^- /.test(l)).join('\n');
  return `<ul class="trig">${items.map(t => {
    const m = t.match(/^\*\*(.+?)\s*→\*\*\s*(.*)$/);
    return m ? `<li><span class="if">${inline(m[1])} →</span><span>${inline(m[2])}</span></li>` : `<li><span></span><span>${inline(t)}</span></li>`;
  }).join('')}</ul>${rest ? `<div class="md">${md(rest)}</div>` : ''}`;
}
function decItem(x, link = '') {
  const done = !!(S.dec[x.id] || {}).done;
  return `<div class="item${done ? ' done' : ''}">
    <div class="top"><button class="check${done ? ' on' : ''}" data-act="dec" data-id="${x.id}" aria-pressed="${done}" aria-label="Riješeno" ${db && canWrite ? '' : 'disabled'}>✓</button>
      <div class="iw">${inline(x.what)}<div class="meta">${inline(x.day)}</div></div></div>
    <div class="md"><p><strong>Opcije:</strong> ${inline(x.options)}</p><p><strong>Što/kada:</strong> ${inline(x.todo)}</p></div>${link}
  </div>`;
}
function dayView() {
  const d = days[cur]; const dp = dayParts(d); const city = cityOf(d);
  const pv = planView[d.date] || 0; const pd = pickDoc(d);
  const topInfo = d.info.filter(x => x.top), restInfo = d.info.filter(x => !x.top);
  const cityData = D.cities[d.city] || {};
  const decs = D.decisions.filter(x => d.decisions.includes(x.id));
  const paras = d.intro ? d.intro.split(/\n\n+/) : [];
  const hot = paras.filter(x => /^(⏰|🔴)/.test(x.trim())), rest = paras.filter(x => !/^(⏰|🔴)/.test(x.trim()));
  const panels = {
    info: (d.transfer || d.stay) ? (d.transfer ? `<div class="callout transfer md">${md(d.transfer)}</div>` : '') + (d.stay ? `<div class="md">${md(d.stay)}</div>` : '') : '',
    upoz: hot.length ? hot.map(x => `<div class="callout decide md">${md(x)}</div>`).join('') : '',
    nap: (rest.length || topInfo.length) ? (rest.length ? `<div class="md">${md(rest.join('\n\n'))}</div>` : '') + topInfo.map(x => `<div class="md"><h4>${inline(x.title)}</h4>${md(x.md)}</div>`).join('') : '',
    odl: decs.length ? `<div class="list">${decs.map(decItem).join('')}</div>` : '',
  };
  const qdone = decs.filter(x => (S.dec[x.id] || {}).done).length;
  const plain = t => (t || '').replace(/^[^\p{L}\p{N}]+/u, '').replace(/[*_`#>|]/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim();
  const qlabels = [
    ['info', 'ℹ️', plain((d.transfer || d.stay).split('\n')[0])],
    ['upoz', '⚠️', plain(hot[0]).replace(/^ODLUK[^:]*:\s*/i, '')],
    ['nap', '📌', plain(rest[0] || (topInfo[0] || {}).title)],
    ['odl', '✅', decs.length ? `TODO ${decs.length - qdone}/${decs.length} · ${decs.map(x => plain(x.what)).join(' · ')}` : ''],
  ].filter(([k]) => panels[k]);
  if (qOpen && !panels[qOpen]) qOpen = null;
  let h = `<article style="--cc:${city.c}">
  <h2 class="dayline"><span class="dot"></span><span class="dn">Dan ${dayNo(cur)}</span><span class="dtt">${inline(dp.title)}</span>${cur === TODAY ? '<span class="today" title="danas">⭐</span>' : ''}</h2>
  <div class="qlist">${qlabels.map(([k, e, t]) => `<button class="qbtn" data-act="q" data-k="${k}" aria-expanded="${qOpen === k}"><span class="qe">${e}</span><span class="qs">${esc(t)}</span><span class="chev">›</span></button>${qOpen === k ? `<div class="qpanel stack">${panels[k]}</div>` : ''}`).join('')}</div>
  <div class="stack">`;
  if (d.plans.length) {
    const labels = ['Plan A · osnovni', ...d.plans.map(p => p.label)];
    h += `<div class="plans"><div class="seg" role="group">${labels.map((l, i) =>
      `<button data-act="plan" data-i="${i}" class="${i ? 'b' : ''}" aria-pressed="${pv === i}">${esc(l)}</button>`).join('')}</div></div>`;
  }
  h += `</div><div class="sect">Raspored</div>${timeline(d)}`;
  if (d.leftPlans3 && d.leftPlans3.length) d.leftPlans3.forEach(p => h += `<details class="fold"><summary>🅱️ ${inline(p.title)}</summary><div class="md">${md(p.md)}</div></details>`);
  if (restInfo.length) { h += `<div class="sect">Detalji dana</div><div class="stack">`; restInfo.forEach(x => h += `<details class="fold"${/Kontrolne/.test(x.title) ? ' open' : ''}><summary>${inline(x.title)}</summary><div class="md">${md(x.md)}</div></details>`); h += `</div>`; }
  if (d.triggers) h += `<div class="sect">🅱️ Ako se dogodi…</div>${triggers(d.triggers)}`;
  h += `<div class="sect">Grad</div><div class="stack">`;
  if (cityData.intro) h += `<details class="fold"><summary>O gradu · ${esc(city.short)}</summary><div class="md">${md(cityData.intro)}</div></details>`;
  if (cityData.extras) h += `<details class="fold"><summary>🧱 Dodatne opcije · ${esc(city.short)}</summary><div class="md">${md(cityData.extras.md)}</div></details>`;
  h += `</div>`;
  const prev = days[cur - 1], next = days[cur + 1];
  h += `<div class="pager">${prev ? `<button data-act="go" data-i="${cur - 1}"><small>← ${esc(dayParts(prev).wd)} ${esc(dayParts(prev).dt)}</small><span>${inline(dayParts(prev).title)}</span></button>` : '<span></span>'}
    ${next ? `<button data-act="go" data-i="${cur + 1}"><small>${esc(dayParts(next).wd)} ${esc(dayParts(next).dt)} →</small><span>${inline(dayParts(next).title)}</span></button>` : '<span></span>'}</div>`;
  return h + `</article>`;
}

/* ---------- other pages ---------- */
function bullets(text) {
  const sent = text.split(/(?<=[.!?])\s+(?=[A-ZŠĐČĆŽ🔒💸⚠️*])/).map(x => x.trim()).filter(Boolean);
  const k = Math.min(5, Math.max(2, Math.ceil(sent.length / 2)));
  const per = Math.ceil(sent.length / k), groups = [];
  for (let i = 0; i < sent.length; i += per) groups.push(sent.slice(i, i + per).join(' '));
  return `<ul>${groups.map(g => `<li>${inline(g)}</li>`).join('')}</ul>`;
}
function pregled() {
  return `<section class="page pregled"><div class="hero"><img src="map.webp" alt="Karta Južne Koreje s bazama Seoul, Sokcho, Gyeongju i Busan te rutama između njih" width="872" height="1199"></div>
    <h2>Itinerar</h2>
    <ul class="flash">${days.map((d, i) => { const dp = dayParts(d); const c = cityOf(d);
      const lab = d.flash ? d.flash.label : ''; const m = lab.match(/·\s*(.+?)\s+—\s+(.+)$/);
      const short = m ? m[2].charAt(0).toUpperCase() + m[2].slice(1) : dp.title;
      const open = flashOpen.has(i);
      return `<li style="--cc:${c.c}" class="${open ? 'open' : ''}${i === TODAY ? ' today' : ''}"><button data-act="flash" data-i="${i}" aria-expanded="${open}"><span class="fd">${dp.wd} ${dp.dt}<small>${m ? esc(m[1]) : c.short}</small></span><span class="ft">${inline(short)}${i === TODAY ? ' <span class="today" title="danas">⭐</span>' : ''}</span><span class="chev">›</span></button>
        ${open ? `<div class="fx" data-act="flash" data-i="${i}">${d.flash ? bullets(d.flash.text) : ''}<a class="golink" href="#dan-${d.date.replace('.', '-')}">Raspored dana →</a></div>` : ''}</li>`; }).join('')}</ul>
    <div class="sect">Smještaj</div><div class="md">${md(D.smjestaj.split('\n').filter(l => /^\|/.test(l)).join('\n'))}</div></section>`;
}
function roNote() { return `<div class="ro">Kvačice i imena pamte se samo u ovom pregledniku, ne dijele se s ekipom.</div>`; }
let decFilter = 'sve';
function odluke() {
  const all = D.decisions; const done = all.filter(x => (S.dec[x.id] || {}).done).length;
  const shown = all.filter(x => decFilter === 'sve' || (decFilter === 'otvoreno') !== !!(S.dec[x.id] || {}).done);
  return `<section class="page"><h2>TODO</h2><div class="md intro">${md(D.decisionsIntro)}</div>${roNote()}
    <div class="progress"><span>${done}/${all.length} riješeno</span><span class="bar2"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></span></div>
    <div class="filters">${['sve', 'otvoreno', 'riješeno'].map(f => `<button data-act="decf" data-f="${f}" aria-pressed="${decFilter === f}">${f}</button>`).join('')}</div>
    <div class="list">${shown.map(x => { const i = x.date ? dayIdx(x.date) : -1;
      return decItem(x, i >= 0 ? `<button class="linkday" data-act="go" data-i="${i}">otvori dan →</button>` : ''); }).join('')}</div></section>`;
}
let resFilter = 'sve';
function rezervacije() {
  const all = D.reservations; const st = id => S.res[id] || {};
  const done = all.filter(x => st(x.id).done).length;
  const shown = all.filter(x => resFilter === 'sve' || (resFilter === 'otvoreno' ? !st(x.id).done : resFilter === 'bez imena' ? !st(x.id).who && !x.who : st(x.id).done));
  const badge = w => /🔴/.test(w) ? 'red' : /✅/.test(w) ? 'ok' : '';
  return `<section class="page"><h2>Rezervacije</h2><div class="md intro">${md(D.reservationsIntro)}</div>${roNote()}
    <div class="progress"><span>${done}/${all.length} gotovo</span><span class="bar2"><i style="width:${done / all.length * 100}%"></i></span></div>
    <div class="filters">${['sve', 'otvoreno', 'bez imena', 'gotovo'].map(f => `<button data-act="resf" data-f="${f}" aria-pressed="${resFilter === f}">${f}</button>`).join('')}</div>
    <div class="list">${shown.map(x => { const s = st(x.id); const dis = db && canWrite ? '' : 'disabled';
      return `<div class="item${s.done ? ' done' : ''}">
        <div class="top"><button class="check${s.done ? ' on' : ''}" data-act="res" data-id="${x.id}" aria-pressed="${!!s.done}" aria-label="Gotovo" ${dis}>✓</button>
          <div class="iw">${inline(x.what)}</div><span class="badge ${badge(x.when)}">${inline(x.when.replace(/\*\*/g, ''))}</span></div>
        <div class="md"><p>${inline(x.detail)}</p></div>
        <div class="who"><span class="lab">Tko:</span>${x.who && x.who !== '✅' ? `<span class="badge">${inline(x.who)}</span>` : ''}${PEOPLE.map(p => `<button class="${s.who === p ? 'on' : ''}" data-act="who" data-id="${x.id}" data-p="${p}" ${dis}>${p}</button>`).join('')}</div>
      </div>`; }).join('')}</div></section>`;
}
function legend() {
  const line = D.header.split('\n').find(l => /^\*\*Oznake:\*\*/.test(l)) || '';
  const items = line.replace(/^\*\*Oznake:\*\*\s*/, '').split(' · ').map(x => x.trim()).filter(Boolean);
  const meta = D.header.split('\n').filter(l => l.trim() && !/^#|^\*\*Oznake|^-{2,}$/.test(l)).join('\n');
  return `<details class="fold" open><summary>Oznake</summary><div class="md">${meta ? md(meta) : ''}<ul>${items.map(x => `<li>${inline(x)}</li>`).join('')}</ul><p>${inline(D.bases)}</p></div></details>`;
}
function info() {
  return `<section class="page"><h2>Info</h2><p class="intro">Oznake, tko smo, prijevoz, usputne stanice, što je izrezano i otvorena pitanja.</p><div class="stack">${legend()}${
    D.info.map((x, i) => `<details class="fold"><summary>${inline(x.title)}</summary><div class="md">${md(x.md)}</div></details>`).join('')}</div></section>`;
}

/* ---------- shell ---------- */
const TABS = [['pregled', 'Itinerar'], ['dani', 'Raspored'], ['odluke', 'TODO'], ['rezervacije', 'Rezervacije'], ['info', 'Info']];
function render() {
  const openDetails = [...document.querySelectorAll('#main details')].map(x => x.open);
  const decOpen = D.decisions.filter(x => !(S.dec[x.id] || {}).done).length;
  const resOpen = D.reservations.filter(x => !(S.res[x.id] || {}).done).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-t="${k}" aria-selected="${tab === k}">${l}${k === 'odluke' ? `<span class="n">${decOpen}</span>` : k === 'rezervacije' ? `<span class="n">${resOpen}</span>` : ''}</button>`).join('');
  const strip = document.getElementById('strip');
  strip.hidden = tab !== 'dani';
  strip.innerHTML = days.map((d, i) => { const dp = dayParts(d);
    return `<button class="dpill${isMove(d) ? ' move' : ''}" data-icon="${moveIcon(d)}" style="--cc:${cityOf(d).c}" data-act="go" data-i="${i}" aria-current="${i === cur}" data-today="${i === TODAY}" aria-label="${esc(dp.wd + ' ' + dp.dt + ' ' + dp.title)}"><span class="w">${esc(dp.wd)}</span><span class="d">${dp.dt.split('.')[0]}</span><span class="m">${dp.dt.split('.')[1]}.</span></button>`; }).join('');
  let lastCity = null;
  document.getElementById('rail').innerHTML = days.map((d, i) => { const dp = dayParts(d); const c = cityOf(d);
    const head = d.city !== lastCity ? `<div class="city" style="--cc:${c.c}">${c.short}</div>` : ''; lastCity = d.city;
    return head + `<button style="--cc:${c.c}" data-act="go" data-i="${i}" aria-current="${i === cur}" data-today="${i === TODAY}"><span class="rtx"><span class="rd">${esc(dp.wd)} ${esc(dp.dt)}</span><span class="rt">${inline(dp.title)}</span></span></button>`; }).join('');
  document.getElementById('layout').className = 'layout' + (tab === 'dani' ? ' days' : '');
  const main = document.getElementById('main');
  main.classList.toggle('anim', animNext); animNext = false;
  main.innerHTML = tab === 'dani' ? dayView() : tab === 'pregled' ? pregled() : tab === 'odluke' ? odluke() : tab === 'rezervacije' ? rezervacije() : info();
  const nd = [...main.querySelectorAll('details')];
  if (nd.length === openDetails.length) nd.forEach((x, i) => x.open = openDetails[i]);
}
function scrollPillIntoView() {
  const p = document.querySelector('.dpill[aria-current="true"]');
  if (p) p.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function go(i) {
  animNext = true; cur = i; tab = 'dani'; openSlots.clear(); qOpen = null; store.set('day', i); store.set('tab', tab);
  history.replaceState(null, '', '#dan-' + days[i].date.replace('.', '-'));
  render(); scrollPillIntoView(); window.scrollTo({ top: 0 });
}
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; const d = days[cur];
  if (a === 'tab') { animNext = true; tab = b.dataset.t; store.set('tab', tab); history.replaceState(null, '', '#' + (tab === 'dani' ? 'dan-' + days[cur].date.replace('.', '-') : tab)); render(); if (tab === 'dani') scrollPillIntoView(); window.scrollTo({ top: 0 }); }
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'flash') { const i = +b.dataset.i; const was = flashOpen.has(i); flashOpen.clear(); if (!was) flashOpen.add(i); render(); }
  else if (a === 'q') { qOpen = qOpen === b.dataset.k ? null : b.dataset.k; render(); }
  else if (a === 'slot') { if (e.target.closest('.pickbtn')) return; const k = d.date + '|' + b.dataset.key; const was = openSlots.has(k); openSlots.clear(); if (!was) openSlots.add(k); render(); }
  else if (a === 'plan') { planView[d.date] = +b.dataset.i; store.set('planView', planView); openSlots.clear(); render(); }
  else if (a === 'pickalt') { e.stopPropagation(); const pd = { ...pickDoc(d), slots: { ...(pickDoc(d).slots || {}) } }; const k = b.dataset.slot, i = +b.dataset.alt; pd.slots[k] = pd.slots[k] === i ? null : i; write('picks', pickId(d), pd); }
  else if (a === 'dec') { const s = S.dec[b.dataset.id] || {}; write('dec', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'res') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'who') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, who: s.who === b.dataset.p ? null : b.dataset.p }); }
  else if (a === 'decf') { decFilter = b.dataset.f; render(); }
  else if (a === 'resf') { resFilter = b.dataset.f; render(); }
});
document.addEventListener('keydown', e => {
  if (tab !== 'dani' || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' && cur < days.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1); const m = h.match(/^dan-(\d+)-(\d+)$/);
  if (m) { const i = dayIdx(`${+m[1]}.${+m[2]}`); if (i >= 0 && (i !== cur || tab !== 'dani')) go(i); }
  else if (['dani', 'pregled', 'odluke', 'rezervacije', 'info'].includes(h) && h !== tab) { tab = h; store.set('tab', tab); render(); window.scrollTo({ top: 0 }); }
});
render(); setSync(); requestAnimationFrame(scrollPillIntoView);
connect();
</script>
