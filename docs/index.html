<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: poster-map palette (pale sea, pale land, navy ink). Phone: day strip under a sticky bar, timeline with pins. ≥900px: navy day rail left, day card right. */
:root {
  --sea: #cfe2f1;
  --sea-deep: #b9d4ea;
  --land: #eaf2e3;
  --bg: #e9f1f7;
  --surface: #ffffff;
  --sunk: #eef4f9;
  --ink: #16284f;
  --muted: #5b6b8a;
  --line: #d4e0ec;
  --navy: #1f3f8f;
  --navy-ink: #ffffff;
  --accent: #1f3f8f;
  --accent-soft: #dde7f7;
  --plan: #7a2d8e;
  --plan-soft: #f0e2f4;
  --warn: #a35a0a;
  --warn-soft: #fbeedb;
  --hot: #c23b2b;
  --hot-soft: #fae2de;
  --ok: #17805c;
  --ok-soft: #dcf2e8;
  --hand: #3b5bb8;
  --c-seoul: #2a5bc4;
  --c-sokcho: #8a2a8f;
  --c-gyeongju: #178a66;
  --c-busan: #ea7a1f;
  --c-seoul2: #2a5bc4;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-hand: "Caveat", "Bradley Hand", cursive;
  --f-body: "Nunito Sans", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgb(22 40 79 / .06), 0 6px 18px rgb(22 40 79 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
    --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
    --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
    --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
  --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
  --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
  --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
strong { font-weight: 700; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 10px; }


/* ---------- sticky bar ---------- */
.bar .wrap { position: relative; }
.now { position: absolute; right: 10px; top: 9px; font: 600 .7rem/1.6 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--bg); padding-left: 10px; box-shadow: -8px 0 8px var(--bg); pointer-events: none; }
.tabs { padding-right: 84px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 4px; }
.tabs::-webkit-scrollbar, .strip::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 6px 12px; border-radius: 999px; font: 700 .95rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--navy); color: var(--navy-ink); }
.tab .n { font-size: .72rem; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); vertical-align: 2px; }
.tab[aria-selected="true"] .n { background: rgb(255 255 255 / .22); color: var(--navy-ink); }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 10px; scroll-snap-type: x proximity; }
.dpill { flex: none; scroll-snap-align: center; width: 56px; border: 0; background: var(--surface); border-radius: 10px; padding: 6px 0 5px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 1px 0 var(--line); }
.dpill .w { display: block; font: 600 .66rem var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.dpill .d { display: block; font: 800 1.35rem/1.05 var(--f-display); color: var(--cc); }
.dpill .m { display: block; font: 600 .62rem var(--f-display); color: var(--muted); letter-spacing: .05em; }
.dpill[aria-current="true"] { background: var(--cc); }
.dpill[aria-current="true"] .w, .dpill[aria-current="true"] .d, .dpill[aria-current="true"] .m { color: #fff; }
.dpill.move::before { content: attr(data-icon); position: absolute; top: 2px; right: 3px; font-size: .62rem; line-height: 1; }

/* ---------- layout ---------- */
.layout { display: block; padding-block: 16px 60px; }
.rail { display: none; }
main { min-width: 0; }
@media (min-width: 900px) {
  .strip { display: none; }
  .layout.days { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start; }
  .layout.days .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 72px); overflow-y: auto; background: var(--navy); color: #fff; border-radius: var(--r); padding: 10px 8px 14px; box-shadow: var(--shadow); }
  .rail .city { font: 700 .7rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: rgb(255 255 255 / .6); padding: 12px 12px 4px; }
  .rail button { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 9px; cursor: pointer; color: #fff; width: 100%; position: relative; }
  .rail button::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--cc); border: 2px solid #fff; margin-top: 5px; box-shadow: 0 0 0 2px var(--navy); }
  .rail button::after { content: ""; position: absolute; left: 16px; top: 22px; bottom: -8px; width: 2px; background: rgb(255 255 255 / .18); }
  .rail button:last-child::after { display: none; }
  .rail button:hover { background: rgb(255 255 255 / .08); }
  .rail button[aria-current="true"] { background: #fff; color: var(--ink); }
  .rail button[aria-current="true"]::before { box-shadow: 0 0 0 2px #fff; }
  .rail .rd { font: 700 .78rem var(--f-display); letter-spacing: .06em; opacity: .75; display: block; }
  .rail .rt { font-size: .86rem; line-height: 1.25; display: block; }
}

/* ---------- day head ---------- */
.dayline { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font: 800 1.3rem/1.1 var(--f-display); text-transform: uppercase; color: var(--navy); min-width: 0; }
.dayline .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); }
.dayline .dn { flex: none; color: var(--cc); }
.dayline .dtt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qlist { display: grid; gap: 4px; margin-bottom: 10px; }
.qbtn { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer; box-shadow: 0 1px 0 var(--line); }
.qbtn .qe { font-size: 1rem; text-align: center; }
.qbtn .qs { font-size: .86rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.qbtn[aria-expanded="true"] { background: var(--navy); }
.qbtn[aria-expanded="true"] .qs, .qbtn[aria-expanded="true"] .chev { color: #fff; }
.qbtn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.qpanel { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.qpanel .md h4 { margin-top: .6em; }

/* ---------- blocks ---------- */
.stack { display: grid; gap: 10px; }
.callout { border-radius: 12px; padding: 10px 14px; background: var(--sunk); font-size: .92rem; }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
.callout.decide { background: var(--hot-soft); }
.callout.transfer { background: var(--sea); }
.md p { margin: .45em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.2em; }
.md li { margin: .2em 0; }
.md li::marker { color: var(--muted); }
.md h3, .md h4 { font: 700 1.15rem/1.2 var(--f-display); margin: 1em 0 .3em; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
.md blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--sea-deep); color: var(--muted); font: 500 1.15rem/1.3 var(--f-hand); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.md em { color: var(--muted); }
.md p.c-warn, .md p.c-decide, .md p.c-ok, .md p.c-tip { padding: 8px 12px; border-radius: 10px; }
.md p.c-warn { background: var(--warn-soft); }
.md p.c-decide { background: var(--hot-soft); }
.md p.c-ok { background: var(--ok-soft); }
.md p.c-tip { background: var(--accent-soft); }
.wip { font: 700 .66rem var(--f-display); letter-spacing: .08em; padding: 1px 5px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.map { white-space: nowrap; }

.xlist { display: grid; gap: 6px; margin: .6em 0; }
.xitem { padding: 8px 0; border-bottom: 1px solid var(--line); }
.xitem .xt { font-weight: 700; }
.xitem .xd { font-size: .86rem; color: var(--muted); }
.xitem .chips { margin-top: 3px; }
.tbl { overflow-x: auto; margin: .6em 0; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr); gap: 0 14px; margin: .6em 0; font-size: .88rem; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv .k { font: 700 .74rem/1.7 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 640px) {
  .tbl.stackable table, .tbl.stackable tbody, .tbl.stackable tr, .tbl.stackable td { display: block; }
  .tbl.stackable thead { display: none; }
  .tbl.stackable tr { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; background: var(--surface); }
  .tbl.stackable td { border: 0; padding: 3px 0; }
  .tbl.stackable td:first-child { font-weight: 700; }
  .tbl.stackable td:not(:first-child)[data-l]::before { content: attr(data-l) "  "; font: 700 .66rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
}

details.fold { border-radius: 12px; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
details.fold > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; align-items: center; gap: 10px; font: 700 1.02rem var(--f-display); letter-spacing: .03em; text-transform: uppercase; color: var(--navy); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; font: 600 1.2rem var(--f-display); color: var(--muted); }
details.fold[open] > summary::after { content: "−"; }
details.fold > summary .hint { font: 600 .72rem var(--f-display); letter-spacing: .08em; color: var(--muted); }
details.fold > .md, details.fold > .inner { padding: 0 14px 12px; }

/* ---------- plan switch ---------- */
.plans { display: grid; gap: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px; font: 700 .9rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.seg button[aria-pressed="true"].b { background: var(--plan); }

/* ---------- timeline ---------- */
.tl { list-style: none; margin: 0 -10px; padding: 0; display: grid; position: relative; background: var(--surface); box-shadow: var(--shadow); padding-block: 4px; }
@media (min-width: 900px) { .tl { margin: 0; border-radius: var(--r); } }
.tl::before { content: ""; position: absolute; left: 59px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tl > li { position: relative; }
.tl > li.part { padding: 10px 8px 2px 70px; font: 700 .68rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tl > li.part::before { content: ""; position: absolute; left: 54px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 4px 6px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 8px; cursor: default; align-items: start; position: relative; }
.row::before { content: ""; position: absolute; left: 56px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cc); }
button.row { cursor: pointer; border-radius: 10px; }
.time { font: 700 .88rem/1.5 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-align: right; overflow-wrap: anywhere; }
.time.soft { color: var(--muted); font-size: .62rem; line-height: 1.2; padding-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
.txt { min-width: 0; font-size: .93rem; color: var(--ink); padding-left: 14px; }
.txt p { margin: 0; }
.chev { font: 600 1rem var(--f-display); color: var(--muted); transition: transform .15s; padding-top: 1px; }
li.open .chev { transform: rotate(90deg); }
.chips { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 4px; overflow: hidden; }
.chips.wrap { flex-wrap: wrap; }
.chip { font: 600 .68rem/1.5 var(--f-display); letter-spacing: .05em; padding: 0 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.alt { background: var(--accent-soft); color: var(--accent); }
.chip.pick { background: var(--ok-soft); color: var(--ok); text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.detail { cursor: pointer; margin: 0 8px 10px; padding: 12px 12px 14px 62px; display: grid; gap: 12px; background: var(--sunk); border-radius: 10px; }
@media (max-width: 560px) { .detail { padding-left: 10px; } }
.detail .md { font-size: .9rem; max-width: 72ch; }
.dtitle { font: 700 1.2rem/1.2 var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); }
li.gone .row { opacity: .45; }
li.gone .txt { text-decoration: line-through; text-decoration-color: var(--muted); }

li.plancard { padding: 10px 8px; }
.pcard { border-radius: 12px; background: var(--plan-soft); padding: 12px 14px; display: grid; gap: 8px; border-left: 4px solid var(--plan); }
.pcard .ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pcard .ph b { font: 800 1.2rem var(--f-display); color: var(--plan); text-transform: uppercase; letter-spacing: .03em; }
.pcard .md { font-size: .9rem; }
.pcard .tbl td, .pcard .kv > div { border-color: color-mix(in srgb, var(--plan) 25%, transparent); }

/* alternatives */
.alts { display: grid; gap: 8px; }
.alts .ah { font: 700 .72rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: min(82%, 300px); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 900px) { .cards { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); overflow: visible; } }
.acard { scroll-snap-align: start; border-radius: 12px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.acard.sel { box-shadow: inset 0 0 0 2px var(--ok); }
.acard .at { font: 700 1.05rem/1.2 var(--f-display); letter-spacing: .02em; }
.acard .md { font-size: .84rem; color: var(--muted); flex: 1; }
.acard .md strong { color: var(--ink); }
.acard .chips { margin-top: 0; }
.pickbtn { align-self: flex-start; margin-top: 4px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.pickbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.pickbtn:disabled { opacity: .5; cursor: not-allowed; }
.nvpill { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: #03c75a; color: #fff; text-decoration: none; border-radius: 999px; padding: 6px 14px; font: 700 .82rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.chip.nvchip { background: #03c75a; color: #fff; text-decoration: none; }
a.nv { color: var(--accent); font: 800 .7rem var(--f-display); letter-spacing: .08em; text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }
.anote { font-size: .82rem; color: var(--muted); margin: 0; }

/* triggers */
.trig { list-style: none; margin: 0; padding: 4px 14px; display: grid; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.trig li { display: grid; grid-template-columns: minmax(0, 12em) minmax(0, 1fr); gap: 2px 12px; font-size: .88rem; padding: 9px 0; border-bottom: 1px solid var(--line); }
.trig li:last-child { border-bottom: 0; }
.trig .if { font: 700 .95rem var(--f-display); letter-spacing: .03em; color: var(--hot); }
@media (max-width: 520px) { .trig li { grid-template-columns: 1fr; } }

.sect { font: 800 1.05rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--navy); margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
.sect::after { content: ""; flex: 1; height: 2px; background: var(--sea-deep); border-radius: 2px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
.pager button { border: 0; background: var(--surface); border-radius: var(--r); padding: 10px 14px; cursor: pointer; text-align: left; min-width: 0; flex: 1; box-shadow: var(--shadow); }
.pager button:last-child { text-align: right; }
.pager small { display: block; font: 700 .7rem var(--f-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.pager span { font-size: .86rem; font-weight: 600; }

/* ---------- other tabs ---------- */
.page h2 { font: 800 2rem/1 var(--f-display); margin: 0 0 6px; text-transform: uppercase; color: var(--navy); }

a Jogye, odmah uz Insadong: lampioni iznad dvorišta, zlatni Buda unutra.\n\n🌼 **Festival krizantema** traje otprilike od početka listopada do sredine studenog. Dvorište je puno cvjetnih skulptura, a noću je osvijetljeno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "10:15", "key": "10:15", "title": "Bukchon Hanok Village", "meta": ["⏱ 30–45 min", "☀️", "🦵🦵 strme uličice, kaldrma"], "body": "Metro Anguk (L3), izlaz 2, ili od Jogyese ~15 min pješice. Besplatno.\n\n⚠️ **Od 1.3.2025. glavni stambeni dio (\"crvena zona\", Bukchon-ro 11-gil) zatvoren je za turiste od 17:00 do 10:00**, uz čuvare i kazne od 100 000 ₩. Zato dolazimo tek poslije 10:00, kad je već gušće.\n\nStambena četvrt hanok kuća čiji su stanovnici umorni od turista. Prošetamo tiho, pogledamo i ne zadržavamo se.", "alts": [{"title": "Preskočiti", "text": ": s Jogyese ravno na ručak, dobije se 45 min.", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "11:15", "key": "11:15", "title": "Tongin tržnica", "meta": ["⏱ 1–1,5 h", "☔ natkriveno", "🦵 lagano"], "body": "Iz Bukchona ~20 min pješice preko područja palače, ili taksi 5–10 min. Metro Gyeongbokgung (L3), izlaz 2, pa ~10 min.\n\nMala stara susjedska tržnica zapadno od palače Gyeongbokgung. **Kako radi:** na info-pultu se kupi niz **mjedenih novčića (yeopjeon), 10 000 ₩ za 20 komada**, i prazan pladanj, pa se ide od štanda do štanda i novčići mijenjaju za male porcije (omlet, palačinke, pirjana svinjetina, japchae). Jede se u blagovaonici tržnice.\n\n⚠️ **Utorkom 11:00–16:00, novčići se prodaju do 15:00.** Zatvoreno ponedjeljkom i treće nedjelje u mjesecu.\n\n**Ne propustiti gireum tteokbokki:** rižini kolačići prženi u tavi s čilijem i soja-umakom. Ti štandovi rade neovisno o blagovaonici i otvoreni su svaki dan.", "alts": [{"title": "Plan B: Hwangsaengga Kalguksu (황생가칼국수)", "text": ", 78 Bukchon-ro 5-gil, nasuprot MMCA, na rubu Bukchona (Anguk izlaz 1, ~8 min). Debeli ručno rezani rezanci u mliječnoj juhi od goveđih kostiju **11 000 ₩**, veliki domaći mandu 11 000 ₩, slažu ih iza stakla na ulazu. Svaki dan 11:00–21:30 bez pauze. **Red 20–40 min u vrijeme ručka.** Za slučaj da smo pregladni ili umorni za šetnju do Tongina", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Namdaemun tržnica", "text": ": kaos, ulična hrana i jeftine naočale", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "13:15", "key": "13:15", "title": "Nacionalni muzej Koreje", "meta": ["⏱ 2–2,5 h", "☔", "🦵 lagano"], "body": "Metro Ichon (L4), izlaz 2, natkriveni prilaz. **Besplatno.** Otvoren svaki dan (utorkom 10:00–18:00, srijedom i subotom do 21:00), zatvoren samo za Novu godinu, Seollal i Chuseok.\n\n- **Zlatne krune kraljevstva Silla.** Vidjeti ih prije Gyeongjua daje tamošnjim humcima kontekst.\n- **\"Soba tihe kontemplacije\" (사유의 방)** na 2. katu: dva Bude u razmišljanju, nacionalno blago, u zamračenoj sobi. Besplatno, bez rezervacije.\n\nPrema Jamsilu krećemo najkasnije u **15:45** (35–40 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Seoul Sky", "meta": ["⏱ 1,5–2 h", "☀️ treba vidljivost", "🦵 lagano"], "body": "Metro Jamsil (L2, L8), izlaz 1–2, izravno u toranj. **31 000 ₩** odrasli (Fast Pass 62 000 ₩), nedjelja–četvrtak 10:30–22:00. Sa sigurnosnom kontrolom i dizalom treba računati 1,5–2 h, utorkom je red 15–25 min.\n\nZgrada od 555 m, vidikovac na katovima 117–123 (~500 m) i stakleni pod na Sky Decku, jedan od najviših vidikovaca na svijetu. ⚠️ **Zalazak 20.10. je oko 17:45–17:50**, zato **rezerviramo ulaz za 16:30–17:00**: dnevno svjetlo, zalazak i osvijetljeni grad u jednom posjetu.\n\n⚠️ Navečer staklo stvara odsjaje, a sumaglica može ubiti daleki pogled. Ako je prognoza loša, prebacujemo na nedjelju 1.11.", "alts": [{"title": "Prebaciti na nedjelju 1.11.", "text": ", rezervni termin postoji upravo za ovo.", "meta": []}, {"title": "Naksan ili Inwangsan u sumrak", "text": ": besplatni vidikovci na gradskom zidu, bez redova", "meta": ["⏱ 1–2 h", "☀️", "🦵🦵"]}, {"title": "Duga fontana Banpo", "text": ": besplatno, u 19:30, 20:00, 20:30 i 21:00 (20 min), sezona do 31.10. Ne radi po kiši i vjetru", "meta": ["⏱ 45 min", "☀️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Nogari Alley, pa barovi na Euljiru (Ace Four Club)", "meta": ["⏱ 2 h", "☔", "🦵 lagano"], "body": "Pješice od roštilja. Koktel 15–25 000 ₩. Barovi iza neoznačenih vrata u starim radioničkim zgradama. **Bez rezervacije.** Naver Map ih nalazi bolje od Googlea.\n\n- **Bar Sookhee (숙희)**: 2. kat, 14-1 Eulji-ro 12-gil (izlaz 10). Hanok stil, kokteli od sezonskog voća 20–25 000 ₩, **couvert 5–10 000 ₩ po osobi**. 18:00–02:00. Mirniji i skuplji.\n- **Jean Frigo (장프리고)**: Toegye-ro 62-gil 9-8, 1. kat (Gwanghui-dong, kod Dongdaemuna). Ulaz kroz vrata hladnjaka u voćarni, narudžba preko starih telefona. Kokteli 16–20 000 ₩, 18:00–01:30, ponedjeljkom zatvoreno.\n- **Ace Four Club**, ako nije bio u ponedjeljak.", "alts": [{"title": "Zid na Naksanu noću", "text": ", ako nije bio ujutro. Osvijetljen, 5 min od apartmana", "meta": ["⏱ 45 min", "☀️", "🦵🦵"]}, {"title": "Nogari Alley", "text": ", ako jučer nije uspio zbog kiše", "meta": ["⏱ 1–2 h", "☀️", "🦵"]}, {"title": "Noraebang", "text": "", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}], "info": [{"title": "⚡ PLAN NA DAN: A/B verzije (odluka na licu mjesta)", "md": "Zbog promjene 19.10. večer je danas **Gwangjang → Nogari → Ace Four** (opisi u Danu 1). Fiksno: **Seoul Sky u 16:30** i **Gwangjang do 20:00**.\n\n| Kad | 🅰️ | 🅱️ |\n|---|---|---|\n| **Jutro** 09:30–11:45 | 10:15 **Jogyesa** → 10:50 **Bukchon**. Bonus: Naksan u 08:30 | Duže spavanje, doručak, ~11:00 samo **Jogyesa** |\n| **Ručak** ~11:45–13:00 | **Tongin tržnica** (taksi ~7 min iz Bukchona) | **Hwangsaengga kalguksu** kod Bukchona |\n| **Popodne** 13:00–15:45 | **Nacionalni muzej Koreje** (taksi ~25 min) | Odmor i **pakiranje**, pa **Namdaemun** ili **DDP** |\n| 15:45 | ⚠️ Prema Jamsilu, taksi ~35 min ili L4 → L2 ~40 min | isto |\n| **Zalazak** 16:30–18:15 | 🏙️ **Seoul Sky** (fiksno) | Magla: Seoul Sky na 1.11., umjesto njega Naksan u sumrak |\n| 18:15 | L2 Jamsil → Euljiro 4-ga (~30 min) ili taksi ~30 min | |\n| **Večera** ~19:00–20:45 | 🏮 **Gwangjang**: **mayak kimbap prvo (do 20:00)**, Sunhee-ne bindaetteok (do 21:00), Gohyang kalguksu (štand 70). Gotovina | **Jin Ok-hwa dakhanmari** kod Dongdaemuna (ako kasnimo) |\n| 20:45 | Pješice ~15 min do Euljira 3-ga | |\n| **Noć** 21:00–~00:30 | 🍺 **Nogari Alley** (OB Bear do 23:00, Manseon Hof do 24:00), pa 23:00 **Ace Four Club** (do 01:00) | **Pojangmacha šatori na Jongnu 3-ga** (do 03:00) + **noraebang** |\n\n⚠️ **Kofere spakirati prije večernjeg izlaska** (ili u 🅱️ popodnevu). **U krevet do ~01:00**: sutra u 08:00 taksiji za bus u Sokcho.\n❌ **Otpada danas:** Deoksugung (ne stane uz Gwangjang) i roštilj na Euljiru (bio je 19.10. u Hongdaeu). Opisi ispod ostaju kao zamjene.\n**Prvo se reže:** Bukchon → skraćeni muzej. Seoul Sky ostaje.\n\n---\n\n⚠️ **Gyeongbokgung i Jongmyo utorkom su zatvoreni.** Fiksna točka dana je **Seoul Sky u 16:30.** Muzej (jug, Ichon) i toranj (istok, Jamsil) udaljeni su 35–40 min, pa muzej mora završiti do ~15:45.", "top": false}, {"title": "❌ 19:15 — Deoksugung i Doldam-gil (danas otpada zbog Gwangjanga)", "md": "*⏱ 45 min · 🌦️ · 🦵 lagano*\n\nIz Jamsila linija 2 izravno do City Halla (~35 min), izlaz 2. **1 000 ₩**, otvoreno do **21:00, zadnji ulaz u 20:00**. Jedina palača otvorena navečer i osvijetljena. Smjena straže ispred vrata Daehanmun je u 11:00 i 14:00, u ovom terminu je nema.\n\nNajmanja seulska palača: tradicionalne drvene dvorane uz nekoliko kamenih zgrada u zapadnom stilu s početka 20. stoljeća. Uz zid ide **Doldam-gil, \"cesta kamenog zida\"**, drvored koji je krajem listopada jedna od najljepših jesenskih šetnji u gradu. ⚠️ Zatvoreno ponedjeljkom.\n\n💡 **Ovaj večernji termin je zamjenjiv:** ako ekipa umjesto palače poželi pravi seulski izlazak, ovdje ide nešto iz te kategorije. Još nije odlučeno što.\n\n**↔ Zamjene (2):**\n\n- **Seulski izlazak**, još treba odabrati što.\n- **Dongdaemun noću**: veleprodaja mode 20:00–05:00 (od nedjelje navečer do petka ujutro), kolica i vreće na ulici poslije 23:00. Zanimljivo i bez kupovine · *⏱ 1,5 h · ☔ · 🦵*", "top": false}, {"title": "❌ 20:15 — Korejski BBQ na Euljiru 3-ga (otpada: roštilj je bio 19.10., večera je Gwangjang)", "md": "*⏱ 1–1,5 h · ☔ · 🦵 lagano*\n\nIz Deoksugunga linija 2 jedna stanica do Euljiro 1-ga pa pješice, ili taksi ~5 min do **Euljira 3-ga**. **Prvi korejski roštilj na putu**, a odatle se pješice ide u barove.\n\nOko Euljira 3-ga i Jongna 3-ga gusto je **samgyeopsal roštiljnica** sa stolovima na pločniku i plastičnim stolcima. Svinjska potrbušina (i vrat, moksal) peče se na ploči nasred stola, uz kimchi, češnjak, listove salate i ssamjang. **~15–22 000 ₩ mesa po osobi + soju ~5 000 ₩.** Rezervacija ne treba.\n\n**Kako birati:** lokal s redom domaćih i bez velikog engleskog menija u izlogu. Osoblje često samo reže i okreće meso. ⚠️ **WIP:** odabrati konkretan lokal na Naver mapi (삼겹살, 을지로3가) tjedan prije.\n\n**🅱️ BBQ slot:** ako večeras ne uspije (umor, kašnjenje, gužva), prvi roštilj se seli u **Sokcho, sri 21.10.**, umjesto ribe na žaru.\n\n**↔ Zamjene (3):**\n\n- **Myeongdong Kyoja (명동교자)**, glavni lokal, 29 Myeongdong 10-gil (Myeongdong, izlaz 8), ~10 min pješice od Deoksugunga. Kalguksu u pilećoj juhi s mljevenim mesom **11 000 ₩** (rezanci i juha dolijevaju se besplatno), 10 svinjskih mandua 12 000 ₩. Svaki dan 10:30–21:00 bez pauze, redovi 10–20 min. ⚠️ Zadnja narudžba prije 21:00 · *⏱ 45 min · ☔ · 🦵*\n- **Dongwonjip (동원집)**, gamjatang: crveni ljuti gulaš od svinjskih kralježaka i krumpira. 22 Toegye-ro 27-gil (Euljiro 3-ga izlaz 9). **10–11 000 ₩** zdjela, lonac 28–38 000 ₩. 10:00–22:00, **zadnja narudžba 21:00**, nedjeljom zatvoreno. Odmah uz barove · *⏱ 1 h · ☔ · 🦵*\n- **Ostale opcije u blizini** (bolje za ručak, rano zatvaraju):\n  - **Wooraeok (우래옥)**: od 1946., pjongjanški hladni rezanci 16 000 ₩, bulgogi 37–42 000 ₩. Utorkom 11:30–21:00, **zadnja narudžba 20:40**. Euljiro 4-ga, izlaz 4.\n  - **Eulji Myeonok (을지면옥)**: hladni rezanci 15 000 ₩, **zadnja narudžba 20:20**, nedjeljom zatvoreno.\n  - **Imun Seolnongtang (이문설농탕)**: najstariji restoran u Koreji (1904.), juha od goveđih kostiju, 08:00–21:00. ⚠️ Već je u planu 1.11.", "top": false}], "triggers": "- **Prespavali smo:** Naksan se seli na večer, dan počinje Jogyesom.\n- **Kiša:** izbaciti Bukchon i Deoksugung, produžiti muzej, dodati Gyeongdong i Starbucks 1960.\n- **Loša vidljivost:** Seoul Sky na 1.11. Navečer Gwangjang ili Dongdaemun noću.\n- **Koljeno tišti:** izbaciti Bukchon i Naksan.\n- **Gladni prije Tongina:** Hwangsaengga kalguksu odmah uz Bukchon.\n- **Kasnimo na Deoksugung (zadnji ulaz 20:00):** ravno na roštilj na Euljiru i u barove.\n- **Roštilj ne uspije:** Dongwonjip ili Myeongdong Kyoja (do 21:00), a BBQ se seli na 21.10. u Sokcho.", "heading": "Uto 20.10. — Puni dan (A/B, odluka na licu mjesta)", "city": "seoul", "transfer": "", "flash": {"label": "Utorak, 20. 10. · Seoul — hramovi, muzej, Seoul Sky i Euljiro noću (A/B dan)", "text": "Dan ima dvije verzije za svaki dio, a biramo na licu mjesta prema umoru. Ujutro **🅰️ hram Jogyesa** s krizantemama i **Bukchon Hanok Village**, ili **🅱️ duže spavanje** i samo Jogyesa. Za ručak **🅰️ Tongin tržnica** s mjedenim novčićima ili **🅱️ rezanci kalguksu** kod Bukchona. Popodne **🅰️ Nacionalni muzej Koreje** sa zlatom kraljevstva Silla, ili **🅱️ odmor i pakiranje** pa Namdaemun ili DDP. Fiksna točka dana je **Seoul Sky** u 16:30, vidikovac na vrhu Lotte World Towera, za zalazak sunca i paljenje gradskih svjetala. Za večeru odlazimo na **Gwangjang tržnicu** (bindaetteok, kalguksu, mayak kimbap), a zatim pješice na **Nogari Alley**, gdje se pivo pije na plastičnim stolcima nasred ulice. Večer završavamo u **Ace Four Clubu**, retro baru u staroj čajani, ili u šatorima na Jongnu i noraebangu. Kofere paki ocjena 4,3+", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Dakgangjeong iz kutije i pivo u hotelu", "text": ", ako smo mrtvi od puta", "meta": ["⏱ —", "☔", "🦵"]}, {"title": "Sindasin", "text": ", gari-gukbap ako je ručak bio negdje drugdje", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "Šatori uz more u Yeongrang-dongu", "meta": ["⏱ 1–1,5 h", "🌦️", "🦵 lagano"], "body": "Niz šatorskih barova (pojangmacha) uz samu obalu, Yeongranghaean-gil. Domaći i lučki radnici, otvoreno do ~02:00. Poznati su **Maljane** i **Danggeun Macha**. Ima kuhanog: kuhani crveni rak, ljuta svinjetina, lignja na žaru, juha od školjki. ⚠️ **Kuhana jela naručujemo izričito i odbijamo sirove priloge.** **Kratko, jedno ili dva pića, u hotelu do 22:30**, sutra polazak u 06:30.", "alts": [{"title": "Rano spavanje", "text": ", pivo u hotelu na plaži", "meta": ["⏱ —", "☔", "🦵"]}], "altNotes": [], "after": "💡 **Freezer Club / Dalbit Yajang** (noćni food court u starom hladnjaku za ribu, ples iza vrata industrijskog zamrzivača) namjerno **nije večeras**: ide u **četvrtak navečer** poslije rakova, jer u petak nema ranog ustajanja."}], "info": [], "triggers": "- **Bus kasni ili nema karata:** Dong Seoul terminal (L2 Gangbyeon), izbjegavati spore linije preko Injea. Ili varijanta s Chuncheonom.\n- **Rano stižemo i svi su gladni:** Sadonjib odmah, Yeonggeumjeong poslije.\n- **Kiša:** Abai i skela rade, Sokcho City Museum, tržnica je natkrivena.\n- **Sutra je prognoza lošija od prekosutra:** zamijeniti dan 4 i dan 5, jer Ulsanbawi treba suho vrijeme.", "heading": "Sri 21.10. — Dolazak i obala", "city": "sokcho-i-seoraksan", "transfer": "**🚌 Sri 21.10. · Seoul → Sokcho**\n**express bus 2h10–2h20 · 17 200–28 900 ₩**\n\nŽeljeznice do Sokcha nema do 2029. **Plan je direktni express bus** sa Seoul Express Bus Terminala (Gangnam, KOBUS) do Sokcho **Express** terminala, 670 m od hotela. **Alternativa je stanka u Chuncheonu na dakgalbi** (ITX iz Cheongnyangnija pa bus, ukupno 2,5 h dulje), vidi Dio 3.", "flash": {"label": "Srijeda, 21. 10. · Seoul → Sokcho — iz grada prema moru", "text": "Ujutro hvatamo izravni autobus za **Sokcho**, vožnja traje približno 2 sata i 20 minuta, ovisno o prometu. Po dolasku ostavljamo kofere u hotelu uz plažu i krećemo istraživati grad. Prvo posjećujemo paviljon smješten na stijenama uz more, a zatim ručamo **mulgomtang**, blagi gulaš od ribe eelpout, lokalni specijalitet ove obale. Popodne je rezervirano za kafić uređen u prostoru starog brodogradilišta, a zatim odlazimo u **Abai Village**, četvrt poznatu po zajednici doseljenika iz Sjeverne Koreje i njihovoj gastronomskoj tradiciji. Ondje ćemo isprobati i neobičnu ručno pokretanu skelu *gaetbae*, koju putnici povlače užetom preko vode. Slijedi obilazak tržnice, gdje ćemo zastati na nekoliko zalogaja umjesto na velikom obroku. Navečer sjedamo u restoran s ribom koja se peče na stolu, a nakon večere možemo popiti nekoliko pića u jednostavnim šatorima uz more."}, "rows": [{"time": "~08:00", "key": "08:00", "text": "Dva taksija do Seoul Express Bus Terminala (Gangnam). Bus oko 08:30–09:00, vožnja 2h10–2h20, karte rezervirati na KOBUS-u.", "altHint": false, "slot": 0}, {"time": "~11:15", "key": "11:15", "text": "Od Sokcho Express terminala 10 min pješice do hotela. **Ostavljamo kofere**, check-in je tek u 15:00.", "altHint": false, "slot": 1}, {"time": "12:00", "key": "12:00", "text": "**Yeonggeumjeong i svjetionik**, paviljon na stijenama i vidikovac nad lukom.", "altHint": false, "slot": 2}, {"time": "12:45", "key": "12:45", "text": "Ručak u **Sadonjibu**: mulgomtang, blagi gulaš od ribe eelpout. Radi samo do 15:00, četvrtkom zatvoreno.", "altHint": false, "slot": 3}, {"time": "14:15", "key": "14:15", "text": "**Brodogradilište Chilsung**, kafić u brodogradilištu iz 1952.", "altHint": false, "slot": 4}, {"time": "15:00", "key": "15:00", "text": "**Abai Village**, ručno vučena skela i ojingeo-sundae kao užina.", "altHint": false, "slot": 5}, {"time": "16:30", "key": "16:30", "text": "**Središnja tržnica**, kratko (30–45 min): sulbbang i dakgangjeong u kutiji.", "altHint": false, "slot": 6}, {"time": "18:30", "key": "18:30", "text": "**88 Saengseon-gui**, miješana riba na žaru za stolom. (🅱️ BBQ slot više ne treba: roštilj je bio 19.10. u Hongdaeu.)", "altHint": false, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "**Šatori uz more u Yeongrang-dongu**, jedno ili dva pića. U hotel do 22:30, sutra ustajemo u 06:30.", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": ["d-sri-21-10-put-u-sokcho", "d-sri-21-10-prtljaga-prije-check-ina"]}, {"date": "22.10", "d3heading": "ČET 22.10. — ULSANBAWI", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 4 od 14 · Najteži dan putovanja", "intro": "", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "hrana", "meta": [], "body": "U **7-Elevenu u zgradi hotela** kupujemo doručak **i hranu za planinu**: trokutasti kimbap, sendviče, banane, vodu, tople napitke. U 06:30 ništa nije otvoreno, a jest će se na stazi. Tako poslije planine možemo ravno u bazen.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "06:30", "key": "06:30", "title": "Rani polazak", "meta": [], "body": "Bus **7 ili 7-1** s **postaje preko ceste od hotela**, vozi od ~05:36 svakih 20–35 min, zadnja stanica je **Sogongwon** (ulaz u park). Taksi iz centra 13–16 000 ₩. Poslije 08:30 cesta u park se zakrči.\n\n⚠️ **U zoru je na ulazu u park oko nule.** Slojevi: termo majica, flis ili lagana pernata jakna, vjetrovka.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:15", "key": "07:15", "title": "Karte za žičaru (prvo!)", "meta": [], "body": "⚠️ **Problem žičare Gwongeumseong:** karte se prodaju **samo na dan i samo na šalteru**, online rezervacije nema. Krajem listopada radnim danom red je **60–90 min**, vikendom više od 2 h, a karte se **često rasprodaju do ranog popodneva**. Po jakom vjetru staje, neiskorištene karte se vraćaju. Radi ~08:30–17:00/17:30, raspored se objavljuje dan ranije.\n\n**Pravilo:** **karte kupujemo odmah po dolasku**, idemo na Ulsanbawi i vozimo se u terminu s karte. **Ako je rasprodano ili puše, preskačemo**, vrh Ulsanbawija ionako daje veliki pogled.\n\n**16 000 ₩ povratno.** Gore su ruševine tvrđave iz 13. stoljeća i panorama granitnih grebena, Ulsanbawija, Sokcha i mora. Pet minuta vožnje zamjenjuje otprilike sat strmog penjanja, što je korisno i ako netko ne može hodati, jer ekipa ostaje zajedno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:30", "key": "07:30", "title": "Sinheungsa", "meta": ["⏱ 30 min", "🌦️", "🦵 lagano"], "body": "Radni budistički hram na ulazu u park, u blizini je ogroman brončani Buda (Tongil Daebul). **Ulaznica je ukinuta, besplatno.** Rano ujutro, u magli i bez ljudi, ima posebnu atmosferu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "08:00", "key": "08:00", "title": "Ulsanbawi", "meta": ["⏱ 3,5–5 h", "☀️", "🦵🦵🦵 čelične stepenice, spust"], "body": "Sogongwon, Sinheungsa, Gyejoam, pa zadnji kilometar po čeličnim stepenicama pričvršćenim za stijenu. **7,6–8,8 km povratno, ~620 m uspona, 3,5–5 h.** Stepenica ima 808 ili 888, ovisno o izvoru.\n\nPrve dvije trećine su blage zemljane i kamene staze dolinom, zadnji dio je strm. Bez penjanja rukama, izvedivo za rekreativca koji vježba tjedno. Ide cijela ekipa, polako.\n\n⚠️ **Štapovi za Luciju nisu opcija nego oprema.** Koljeno strada na silasku niz stepenice, ne na usponu, pa duge pauze.\n⚠️ **Ulaz u park zabranjen je od zalaska sunca do dva sata prije izlaska.** Po kiši je granit sklizak i Ulsanbawi tada ide u petak.\n\nRučak iz ruksaka na vrhu ili pri silasku.", "alts": [{"title": "Zamijeniti s petkom", "text": ", ako je petak vedriji.", "meta": []}, {"title": "Biseondae", "text": ", dolinom potoka Cheonbuldong: **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak i kamen), pogled na litice", "meta": ["⏱ 2,5 h", "🌦️", "🦵"]}, {"title": "Dolina Jujeongol", "text": "(strana Osaek): **ravne drvene staze**, 6,4 km, 2,5–3 h, **boja se drži najdulje**. Sat vožnje, s druge strane parka", "meta": ["⏱ 3 h", "🌦️", "🦵"]}, {"title": "Daecheongbong preko Osaeka", "text": ": 9,5 km, 1 320 m · *⏱ 5–6 h · ☀️ · 🦵🦵🦵🦵* · samo uz razdvajanje na pola dana", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Žičara (ako ima karata)", "meta": [], "body": "U terminu s karte. Ako je rasprodano ili puše, preskačemo bez žaljenja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~13:30", "key": "13:30", "title": "Montbeer: ručak ili pivo", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "**몽트비어 (MontBeer)**, Nohak-dong, Haksapyeong-gil 7-1. Lokalna craft pivovara na cesti iz parka, **veliki prozori gledaju ravno u Ulsanbawi**. Otvara u **13:30**. Uz pivo ima i pravu hranu: **pizza, kobasice, pržena piletina**, 10–40 000 ₩. Ovisno o tome kad završimo, **ručak** ili **samo jedno pivo** prije bazena.", "alts": [{"title": "Haksapyeong, selo mekog tofua:", "text": "niz restorana sundubua uz cestu iz parka prema gradu i Waterpiji, obrok od tofua ili morskih plodova **10–19 000 ₩**. Npr. **Gim Yeong-ae Halmeoni Sundubu** (07:00–14:00, utorkom zatvoreno)", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Sokcho Haenyeo Maeul (속초해녀마을 / 바람꽃해녀마을)", "text": ", Nohak-dong, na cesti iz parka: **lonac od plodova mora s abalonom**, sundubu s abalonom, **seopguk** (ljuti gulaš od divljih dagnji). Od 08:00, 10–30 000 ₩, **srijedom zatvoreno**. Najbolji pravi sjedeći obrok uz planinu", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Food court u Waterpiji:", "text": "burgeri, udon. Praktično, ništa posebno", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~14:30", "key": "14:30", "title": "Seorak Waterpia Spa Valley", "meta": ["⏱ 2–3 h", "☔", "🦵 odmor za noge"], "body": "**설악워터피아**, Hanwha Resort, Nohak-dong, ~10 min taksijem od ulaza u park, na istoj strani grada. **Spa Valley: 18 vanjskih termalnih bazena** s alkalnom mineralnom vodom. **Kupaći i kapa su obavezni**, sve dobi zajedno, bez golotinje. **~42 000 ₩ online, 74 500 ₩ na blagajni**, pa kupujemo online. 10:00–21:30. Najbolji tretman za noge poslije Ulsanbawija.\n\n⚠️ Riječ je o obiteljskom vodenom parku, Spa Valley je mirniji vanjski dio. **Waterpia je glavni izbor ekipe.** ⚠️ Samo ako danas propadne (zatvoreno, kasnimo, svi su gotovi), sutra je rezerva Delpino (vidi Dan 5).\n\n💆 Masaža, head spa i tretman lica nisu ovdje: Waterpia ima samo hidro-mlaznice u bazenu. Tretmani su u Seoulu, sub 31.10. (THE SEOL:HA).", "alts": [{"title": "Odmor u hotelu", "text": ", tuš i spavanje prije večere, ako su svi gotovi", "meta": ["⏱ 2–3 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "💸 Gozba od crvenih rakova", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "⚠️ **Korejski snow crab (daege) u listopadu je pod zabranom izlova (1.6.–30.11.).** Ono što se prodaje kao \"snow crab\" uvoz je iz Rusije po turističkim cijenama, a restorani u lukama Daepo i Dongmyeong (200–320 000 ₩ za četvero) uz to nude hrpu **sirovih priloga**. Zato **crveni rak (hongge)**: lokalan, u sezoni, kuhan na pari pred nama, plus pržena riža od rakova u oklopu.\n\nHongge je **manji od snow craba, tanjih nogu, slađeg i mekšeg mesa**, uz više posla s otvaranjem. To je \"svakodnevni\" rak ove obale.\n\n**Yes Su-san**, unutar središnje tržnice: sjedeći **setovi od crvenog raka ~26–36 000 ₩ po osobi**, kuhani snow crab ~76 000 ₩. **10:30–20:00, utorkom zatvoreno**, pa **dolazimo najkasnije oko 19:00.** Toplo, za stolom, 5 min hoda do Freezer Cluba. Ne treba zvati dan ranije.", "alts": [{"title": "Rakovi za van: Gessadagu (게싸다구) / Sokcho Bulgeun Daege Susan (속초붉은대게수산)", "text": ", susjedni štandovi na tržnici. Biraju se živi rakovi iz bazena, kuhaju se na pari 10–45 min i režu oklop. **Hongge ~10 000 ₩ po komadu**, ruski daege 44–60 000 ₩ po kilogramu, pržena riža u oklopu 2 000 ₩. Za četvero 4–6 rakova, ukupno **60–100 000 ₩**. Gessadagu 10:00–21:00. Uglavnom za van, jede se stojeći ili se nosi; neuredno je, dobro je imati umivaonik", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Freezer Club / Dalbit Yajang", "meta": ["⏱ 1–2 h", "☔", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke. Bivše skladište hladnjače za ribu pretvoreno u noćni food court: topli zalogaji, krumpir-palačinke, pivo pod limenim krovom. U sredini je **Freezer Club (냉동클럽)**: ulazi se kroz teška industrijska vrata zamrzivača, a unutra je nezagrijana plesna soba s retro svjetlima i glazbom. Besplatan ulaz, 18:00–24:00, **pretežno srijeda–nedjelja**. Radi li četvrtkom krajem listopada, provjeriti na licu mjesta ili na Naveru. Ovdje je jer **u petak nema ranog ustajanja**.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Žičara rasprodana ili vjetar:** preskačemo, vrh Ulsanbawija je dovoljan.\n- **Lucija stane na pola:** odmorište prije zadnjeg stepeništa, ostali gore i natrag. Sat razdvajanja, ne dan.\n- **Kiša ili magla:** Ulsanbawi u petak, danas Biseondae ili Cheonbuldong.\n- **Boja je na visini prošla:** Jujeongol.\n- **Brzo smo gotovi:** Montbeer za ručak, pa Waterpia. **Sporo:** samo pivo u Montbeeru ili ravno u bazen.\n- **Svi su mrtvi:** hotel, rakovi, spavanje. Freezer Club se seli na petak.", "heading": "Čet 22.10. — Planinski dan", "city": "sokcho-i-seoraksan", "transfer": "", "flash": {"label": "Četvrtak, 22. 10. · Sokcho — Seoraksan i planinski vrhovi", "text": "U 06:30 krećemo prema **Nacionalnom parku Seoraksan**, jednom od najljepših planinskih područja u Južnoj Koreji. Po dolasku prvo provjeravamo i kupujemo karte za žičaru, kako bismo osigurali tu opciju prije nego što se stvore gužve. Zatim posjećujemo hram **Sinheungsa**, smješten među planinama, koji u jutarnjoj magli ima posebno mirnu atmosferu. Glavni izazov dana je **Ulsanbawi** — impresivna granitna stijena do čijeg se vrha dolazi dugim nizom metalnih stepenica. Uspon je fizički zahtjevan, pa idemo polako, uz stanke i prema mogućnostima svakog člana ekipe. Nije nužno da svi dođu do samog vrha. Nakon planinarenja slijedi zasluženi odmor u **Montbeeru**, uz ručak ili barem pivo i pogled na planinske stijene. Poslijepodne odlazimo u **Waterpie**, kompleks termalnih bazena i vodenih atrakcija u kojem možemo opustiti umorne mišiće. Navečer se pripremamo za pravi gastronomski vrhunac Sokcha: 💸 **gozbu od crvenih rakova**. Dan završavamo plesom u neobičnom prostoru starog hladnjaka za ribu."}, "rows": [{"time": "večer prije", "key": "večer prije", "text": "U 7-Elevenu u hotelu kupujemo doručak **i hranu za planinu**: kimbap, sendviče, voće i piće.", "altHint": false, "slot": 0}, {"time": "06:30", "key": "06:30", "text": "Bus **7 / 7-1** s postaje preko ceste do Sogongwona, ili taksi za 13–16 000 ₩.", "altHint": false, "slot": 1}, {"time": "07:15", "key": "07:15", "text": "⚠️ **Prvo karte za žičaru.** Prodaju se samo na dan, na šalteru, i rasprodaju se.", "altHint": false, "slot": 2}, {"time": "07:30", "key": "07:30", "text": "**Sinheungsa**, hram na ulazu u park, besplatno.", "altHint": false, "slot": 3}, {"time": "08:00", "key": "08:00", "text": "**Ulsanbawi:** 7,6–8,8 km, **3,5–5 h**, čelične stepenice na vrhu. Štapovi za Luciju.", "altHint": false, "slot": 4}, {"time": "~13:00", "key": "13:00", "text": "**Žičara na Gwongeumseong** u terminu s karte. Ako je rasprodano ili puše, preskačemo.", "altHint": false, "slot": 5}, {"time": "~13:30", "key": "13:30", "text": "**Montbeer:** ručak (pizza, kobasice, piletina) ili samo pivo s pogledom na Ulsanbawi, ovisno o vremenu.", "altHint": false, "slot": 6}, {"time": "~14:30", "key": "14:30", "text": "♨️ **Seorak Waterpia, Spa Valley** (glavni izbor), 18 vanjskih termalnih bazena, treba kupaći.", "altHint": false, "slot": 7}, {"time": "19:00", "key": "19:00", "text": "💸 **Gozba od crvenih rakova** u Yes Su-sanu na središnjoj tržnici, sjedeći. (Originalna ideja bila je snow crab, ali u listopadu je pod zabranom izlova.)", "altHint": false, "slot": 8}, {"time": "21:00", "key": "21:00", "text": "**Freezer Club / Dalbit Yajang**, noćni food court u starom hladnjaku za ribu.", "altHint": false, "slot": 9}], "plans": [], "leftPlans3": [], "decisions": ["d-cet-22-10-popodne-poslije-planine"]}, {"date": "23.10", "d3heading": "PET 23.10. — BLAŽI DAN, GRAD I OBALA", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 5 od 14 · Dan oporavka nakon Ulsanbawija", "intro": "Logika dana: **jutro u parku na ravnom, popodne grad i obala na ravnom.** Bazen je bio u četvrtak (Waterpia). ⚠️ **Samo ako Waterpia u četvrtak propadne**, Delpino ulazi umjesto muzeja i jezera.", "stay": "", "slots": [{"timeLabel": "08:00", "key": "08:00", "title": "Jutro u parku: Biseondae (i Biryong)", "meta": ["⏱ 2,5–5 h", "🌦️", "🦵 Biseondae / 🦵🦵 Biryong"], "body": "Do parka isto kao u četvrtak: **bus 7 / 7-1** preko ceste od hotela ili taksi 13–16 000 ₩. Nema žurbe ni karata za žičaru. Odlučujemo ujutro, prema nogama.\n\n**Opcija 1: obje šetnje (~11 km, 4–5 h)**\n- **Biseondae (비선대):** Sogongwon, Sinheungsa, pa uz potok Cheonbuldong do Biseondaea. **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak, kamene ploče, nekoliko mostova). Na kraju su granitne ploče u potoku i okomite litice Jangguneoka. Najljepša lagana šetnja u parku, krajem listopada puna boje. ⚠️ Dalje od Biseondaea (prema Geumganggulu, 600+ stepenica) ne idemo.\n- **Biryong slapovi (비룡폭포):** polazište uz cestu **malo prije Sogongwona** (stanica busa 7/7-1 Seorak-dong). **4,8 km povratno, 2–2,5 h, ~180 m uspona**: drvene staze, **viseći mostovi**, slapovi Yukdam i na kraju Biryong (\"slap letećeg zmaja\") u kamenom amfiteatru. Umjereno, sa štapovima u redu.\n- ❌ **Vidikovac Towangseong** iznad Biryonga: još 0,8 km i **900+ strmih stepenica**. Nije za Lucijino koljeno, a dan poslije Ulsanbawija nije ni za koga.\n\n**Opcija 2: polagani doručak, pa samo Biseondae (~3,5 h ukupno)**\n- **08:00–09:00 doručak u hotelu ili kafiću.** Za ljubitelje tofua: **Gim Yeong-ae Halmeoni Sundubu (김영애할머니순두부)**, Haksapyeong, selo tofua na cesti prema parku. Tofu se zgrušava **morskom vodom**: mekan, topao sundubu u kamenoj zdjeli, uz kongbiji (gulaš od mljevene soje) i banchan. **07:00–14:00, utorkom zatvoreno.** 10–15 000 ₩ po osobi.\n- Taksijem 5 min do Sogongwona, pa **samo Biseondae**. Biryong je dodatak ako noge kažu da.\n\n**Opcija 3 (rezerva): dulje spavanje, samo Biryong.** Fotogeničniji od Biseondaea (slap, mostovi), kraći i bez gužve na glavnom ulazu, ali ima nešto silaska, pa je lošiji za koljeno.", "alts": [{"title": "Zamjena s četvrtkom:", "text": "ako je četvrtak bio kišan, danas je Ulsanbawi (vidi Dan 4), a muzej i jezero sele u četvrtak", "meta": ["⏱ 3,5–5 h", "☀️", "🦵🦵🦵"]}, {"title": "Dolina Jujeongol", "text": "(strana Osaek): **ravne drvene staze**, 6,4 km, 2,5–3 h, **boja se drži najdulje**. Sat taksijem s druge strane parka, pa pada dio popodneva", "meta": ["⏱ 3 h + 2 h vožnje", "🌦️", "🦵"]}, {"title": "Žičara Gwongeumseong", "text": ", ako je propala u četvrtak. Isti problem: **karte samo na dan, na šalteru**, redovi 60–90 min, pa doći na otvaranje (~08:30)", "meta": ["⏱ 1,5–2,5 h", "☀️", "🦵"]}, {"title": "Dalje uz Cheonbuldong:", "text": "nastavak iza Biseondaea dolinom do slapova, ~12 km. Po mokrom lijepo, ali puno kamena i stepenica", "meta": ["⏱ 3–5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Ručak na strani parka", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Baramkkot Haenyeo Maeul (바람꽃해녀마을 / 속초해녀마을)**, Nohak-dong, na cesti iz parka prema gradu. \"Selo ronilica\" je kuhinja u stilu haenyeo, žena koje rone po plodove mora. Naručujemo kuhano:\n- **seopguk (섭국):** ljuti, gusti gulaš od **divljih dagnji** s povrćem i jajem, specijalitet ove obale;\n- **lonac od plodova mora s abalonom** (za dijeljenje) ili **sundubu s abalonom**.\n\n08:00/08:30–20:00, **srijedom zatvoreno**, 10–30 000 ₩. Broj se uzima na kiosku. ⚠️ Sirovo (hoe) preskačemo.", "alts": [{"title": "Selo tofua Haksapyeong", "text": ", ako je doručak bio negdje drugdje: niz restorana sundubua na istoj cesti, 10–19 000 ₩", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Montbeer (몽트비어)", "text": ", Haksapyeong-gil 7-1, ako se u četvrtak nije stiglo: pizza, kobasice, piletina, craft pivo s pogledom na Ulsanbawi, od 13:30", "meta": ["⏱ 1–1,5 h", "☔", "🦵"]}, {"title": "Sadonjib (사돈집)", "text": ", Yeongrang-dong, u gradu: **mulgomtang**, ako se nije stiglo u srijedu. **08:00–15:00, četvrtkom zatvoreno**, zatvara ranije kad nestane, pa doći do 13:30", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:00", "key": "14:00", "title": "Nacionalni planinarski muzej (국립산악박물관)", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "Misiryeong-ro, Nohak-dong, na istoj strani grada kao park i ručak, 5–10 min taksijem. **Besplatno**, 09:00–18:00, ponedjeljkom zatvoreno.\n\nKorejska i himalajska planinarska povijest: oprema s osvajanja Everesta, šatori, kisik. Najzanimljivija je **soba koja simulira veliku visinu**: smanjena razina kisika, osjeti se kako bi bilo na 3–4 000 m. Ima i **stijena za penjanje** te 4D/VR planinarenje. Lagano i zabavno dan poslije Ulsanbawija.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Jezero Cheongcho i krizanteme", "meta": ["⏱ 45 min–1 h", "🌦️", "🦵 lagano"], "body": "**청초호** je laguna usred grada, između centra i Abaija; jučerašnja skela gaetbae je na njezinu ulazu. Ravna šetnica oko vode, pogled na ribarske brodove i Seoraksan iza grada.\n- **Izložba krizantema** u parku Expo uz jezero: besplatna, do početka studenog, **navečer osvijetljena**, pa može i kao večernja šetnja.\n- **Expo toranj (엑스포타워):** vidikovac nad jezerom i morem.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Plaža Sokcho i staza Oeongchi uz more", "meta": ["⏱ 1–1,5 h", "☀️", "🦵 lagano"], "body": "- **Plaža Sokcho (속초해수욕장):** duga gradska plaža, 10 min taksijem od jezera. Na njoj je **Sokcho Eye**, panoramski kotač uz more (~12 000 ₩), lijep u sumrak.\n- **Oeongchi Bada Hyanggi-ro (외옹치 바다향기로):** **drvena staza od ~1,7 km** od južnog kraja plaže uz stijene do malog ribarskog sela Oeongchi. Ravno, uz valove, s nekoliko kratkih stepenica. Do 2018. taj dio obale bio je zatvorena vojna zona.\n\n💡 **Na istočnoj obali sunce zalazi iza Seoraksana**, ne u more. Oko 17:45 more i stijene dobivaju zlatno svjetlo, a planine iza grada postaju silueta.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Craftroot (ili Montbeer)", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Craftroot (크래프트루트)**, craft taproom u staroj zgradi od cigle, lokalno pivo, opušteno. Ako Montbeer nije bio u četvrtak, idemo tamo, ali on je na strani parka pa ga je lakše uklopiti uz ručak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:30", "key": "19:30", "title": "Večer: Dalbit Yajang i Freezer Club", "meta": ["⏱ 1,5–2 h", "☔", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke, 5 min od središnje tržnice. Bivša hladnjača za ribu pretvorena u **noćni food court**: štandovi s ražnjićima, prženim zalogajima, palačinkama i pivom pod limenim krovom. Iza teških vrata zamrzivača je **Freezer Club (냉동클럽)**, nezagrijana plesna soba s retro svjetlima. Besplatan ulaz, **18:00–24:00, srijeda–nedjelja**, pa je **petak siguran dan**.\n\n**Ako je Freezer Club bio u četvrtak**, biramo između donjih opcija.\n\n⏰ **U hotel do ~22:00**, u subotu rani polazak (vidi Dan 6).\n\n**Plan B: 🍗 piknik s dakgangjeongom.** Sokcho **dakgangjeong (닭강정)** su komadi pržene piletine u ljepljivoj slatko-ljutoj glazuri s kikirikijem, **dobri i hladni**. **Manseok Dakgangjeong (만석닭강정)** u središnjoj tržnici, **10:00–20:00, ~18–22 000 ₩ kutija** (jedna velika dovoljna je za dvoje kao večera). ⚠️ Štandovi zatvaraju oko 19:30–20:00, pa **kupiti do 19:30**. Uz to pivo iz trgovine, pa na plažu Sokcho (sumrak, Sokcho Eye) ili u hotel. Najmirnija i najjeftinija varijanta, rano u krevet.\n\n**Plan C: 🥩 korejski roštilj.** Klasična korejska večera koju u Sokchu još nismo imali: **samgyeopsal** (svinjska potrbušina) ili **dwaeji galbi** (marinirana svinjska rebra) peku se na roštilju u stolu, uz zelenu salatu za zamatanje, češnjak, umake i doenjang-jjigae na kraju. 15–20 000 ₩ po porciji, obično najmanje dvije porcije. Lokal nije odabran: na Naveru tražiti 삼겹살 ili 돼지갈비 blizu hotela, s ocjenom 4,3+ i puno recenzija.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "23:59", "key": "23:59", "title": "⏰ 🔐 Booking escape rooma za čet 29.10.", "meta": ["⏱ 5 min", "u hotelu"], "body": "Deepthinker otvara termine **5 dana unaprijed, u ponoć po korejskom vremenu** (✅ potvrđeno 14.10.). U ponoć s petka na subotu otvara se **29.10.**\n- **Alarm u 23:59**, booking stranica otvorena: **deepthinker.co.kr/en**.\n- U 00:00 refresh → **\"Ongyi's Dream\", 29.10. u 20:00** (ili ~19:30, ako hoćemo stići na pub crawl) → 4 igrača.\n- **Odmah poslati zahtjev za engleski** (traže najavu 24 h ranije).\n- Ako ne uspije (internet, zaspali smo): **prva stavka sutra ujutro**, u autobusu za Gangneung (vidi Dan 6).", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "⚠️ Rezerva za popodne, samo ako Waterpia u četvrtak propadne — 💸 Sono Calm Delpino", "md": "*⏱ 2–3 h · ☔ ali vjetar ga zatvara · 🦵 lagano*\n\nIde **samo ako Waterpije u četvrtak nije bilo**, umjesto muzeja i jezera, otprilike 14:00–17:00, pa obala i pivo kako je planirano. Goseong, ~15–20 min taksijem od ulaza u Seoraksan ili iz grada.\n\nPrirodna termalna voda (~34–38 °C) u vanjskom **bazenu na 11. katu zgrade C, s pogledom ravno u Ulsanbawi**. Samo za odrasle (19+), treba **kupaći i kapa za plivanje**. Dnevne karte za negoste na blagajni Ocean Playa u podrumu, **~40–50 000 ₩**, petkom do 19:00. Telefon **+82-33-639-3426**. ⚠️ **Jak vjetar zatvara krov bez najave**, pa nazvati prije polaska. Ponijeti ogrtač ili veliki ručnik, izlazak na krov na 10–15 °C je hladan. Za razliku od Waterpije, ovo je jedan miran bazen samo za odrasle s pogledom.\n\n**↔ Zamjene (1):**\n\n- **Lotte Resort Sokcho, infinity bazen**, Daepo-dong, južno od grada. Grijani infinity bazen **s pogledom na more**, dnevna karta na blagajni vodenog parka **~35–45 000 ₩**, 10:00–19:00/20:00; danju obitelji, navečer samo odrasli. Rezerva kad vjetar zatvori Delpino · *⏱ 2 h · ☔ · 🦵*", "top": false}], "triggers": "- **Waterpije nije bilo u četvrtak:** popodne ⚠️ Delpino, muzej i jezero otpadaju, obala i pivo ostaju.\n- **Delpino zatvoren zbog vjetra:** Lotte Resort infinity bazen ili natrag na plan A (grad i obala).\n- **Kiša:** Biseondae podnosi laganu kišu. Popodne muzej i **Sokcho City Museum** (2 000 ₩, rekonstrukcija kuća sjevernokorejskih izbjeglica iz Abaija, ponedjeljkom zatvoreno). Staza Oeongchi otpada.\n- **Četvrtak je bio kišan:** danas Ulsanbawi (vidi Dan 4), a ovaj dan seli u četvrtak.\n- **Koljeno:** opcija 2 (polagani doručak i samo Biseondae), ili samo doručak i muzej.\n- **Freezer Club je bio u četvrtak:** piknik s dakgangjeongom ili roštilj.", "heading": "Pet 23.10. — Blaži dan, grad i obala", "city": "sokcho-i-seoraksan", "transfer": "", "flash": {"label": "Petak, 23. 10. · Sokcho — slapovi, obala i lokalni život", "text": "Danas nas čekaju dvije umjerenije šetnje u Nacionalnom parku Seoraksan. Prva je staza do **Biseondaea**, slikovitog mjesta uz potok, okruženog golemim granitnim gromadama. Druga vodi prema **Biryong slapovima**, kroz šumu i preko visećih mostova. Ove dvije rute nude odličan doživljaj prirode bez ponavljanja zahtjevnog uspona prethodnog dana. Popodne se vraćamo u grad i posjećujemo **planinarski muzej**, uključujući sobu koja simulira uvjete velike nadmorske visine. Zatim slijedi šetnja uz jezero **Cheongcho**, gdje ćemo potražiti jesenske krizanteme, i drvenom obalnom stazom do područja **Oeongchi**, poznatog po pogledima na more i stjenovitu obalu. Navečer istražujemo lokalni noćni život: prvo **Dalbit Yajang**, a zatim **Freezer Club**. Budući da nas sutra čeka rano putovanje, ne ostajemo predugo. ⏰ **U ponoć rezerviramo escape room** za četvrtak, jer se termini otvaraju samo pet dana unaprijed."}, "rows": [{"time": "08:00", "key": "08:00", "text": "**Biseondae i Biryong slapovi**, dvije lagane šetnje u parku, ukupno ~11 km, 4–5 h. **Ili** polagani doručak (u hotelu ili kafiću, tofu u Haksapyeongu za one koji žele), pa **samo Biseondae**: 6 km gotovo ravno, 2–2,5 h.", "altHint": false, "slot": 0}, {"time": "~13:00", "key": "13:00", "text": "Ručak u **Baramkkot Haenyeo Maeulu:** seopguk (ljuti gulaš od divljih dagnji) ili lonac s abalonom.", "altHint": false, "slot": 1}, {"time": "14:00", "key": "14:00", "text": "**Nacionalni planinarski muzej**, besplatan. Soba koja simulira veliku visinu i stijena za penjanje.", "altHint": false, "slot": 2}, {"time": "15:30", "key": "15:30", "text": "**Jezero Cheongcho:** besplatna izložba krizantema i Expo toranj.", "altHint": false, "slot": 3}, {"time": "16:30", "key": "16:30", "text": "**Plaža Sokcho i staza Oeongchi**, drvena staza uz stijene i more, 1,7 km. Na plaži je panoramski kotač Sokcho Eye.", "altHint": false, "slot": 4}, {"time": "18:00", "key": "18:00", "text": "**Craftroot**, craft pivo. Ili Montbeer, ako u četvrtak nije uspio.", "altHint": false, "slot": 5}, {"time": "⚠️", "key": "⚠️", "text": "**Samo ako Waterpia u četvrtak propadne: Sono Calm Delpino**, termalni bazen na 11. katu s pogledom na Ulsanbawi, 19+, ~40–50 000 ₩, petkom do 19:00.", "altHint": false, "slot": null}, {"time": "19:30", "key": "19:30", "text": "**Dalbit Yajang i Freezer Club**, noćni food court u staroj ribljoj hladnjači. **Ili** 🍗 piknik s dakgangjeongom na plaži ili u hotelu. **Ili** 🥩 korejski roštilj (samgyeopsal, dwaeji galbi).", "altHint": false, "slot": 6}, {"time": "22:00", "key": "22:00", "text": "U hotel. **U subotu rano ustajemo.**", "altHint": false, "slot": null}, {"time": "23:59", "key": "23:59", "text": "⏰ 🔐 **Alarm: booking escape rooma za čet 29.10.** Otvara se u ponoć (5 dana unaprijed). Rezervirati 20:00 i poslati zahtjev za engleski.", "altHint": false, "slot": 7}], "plans": [{"label": "Plan B · Delpino", "replaces": ["14:00", "15:30"], "summary": "", "detail": null, "rows": null}], "leftPlans3": [], "decisions": ["d-pet-23-10-bazen-samo-ako-waterpia-u-cetvrtak-propadne", "d-pet-23-10-u-23-59-escape-room-za-29-10"]}, {"date": "24.10", "d3heading": "SUB 24.10. — VLAKOM UZ OBALU U GYEONGJU", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 6 od 14", "intro": "", "stay": "", "slots": [{"timeLabel": "06:35", "key": "06:35", "title": "Pješice do terminala", "meta": ["⏱ 10 min", "☔", "🦵 lagano"], "body": "Isti **Sokcho Express Bus terminal** na koji smo stigli u srijedu, **670 m** od hotela, s koferima ~10 min po ravnom. Doručka u hotelu u to vrijeme nema, pa kava i nešto sitno iz 7-Elevena u zgradi.\n\n**Busevi Sokcho → Gangneung** (10 800 ₩, 1h00–1h37): **06:55**, 07:47, 08:00, 09:31. Karte na šalteru ili automatu. ⚠️ **Samo onaj u 06:55 siguran je za vlak u 09:36.** Bus u 07:47 može stići tek oko 09:24, bez rezerve za taksi do stanice. Satnica je za radni dan, subotnju provjeriti na terminalu u srijedu po dolasku.\n\n**Rezerva ako je 06:35 prerano: taksi ravno do stanice Gangneung.** Polazak iz hotela **oko 08:15**, ~65 km autocestom, ~1 h, od vrata do perona s koferima, isti vlak u 09:36. Dobiva se ~1,5 h sna. Cijena **60–80 000 ₩ po taksiju, za dva 120–160 000 ₩**, naspram ~43 000 ₩ za četiri karte busa. Recepcija može naručiti taksi ili kombi za četvero s koferima, pitati u petak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~08:00", "key": "08:00", "title": "Gangneung: taksi do stanice, doručak", "meta": ["⏱ 1,5 h", "☔", "🦵 lagano"], "body": "Bus stiže na Gangneung Express/Intercity terminal, odakle **dva taksija, ~10 min** do **KTX stanice Gangneung**. Na stanici su kafići i trgovina: kimbap, sendviči, kava, voće za vlak. Ormarići postoje (tri grupe, S–XL, kod izlaza 2), ali nisu potrebni, koferi idu s nama u vlak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:36", "key": "09:36", "title": "🚄 KTX-Eum 752 → Gyeongju 12:30", "meta": ["⏱ 2 h 54 min", "☔", "🦵"], "body": "**Novi direktni vlak istočnom obalom**, vozi od 30.12.2025., bez presjedanja u Seoulu. **34 300 ₩ po osobi.** Dio pruge ide uz more, pa **sjedimo s lijeve strane u smjeru vožnje** (vlak ide na jug, more je istočno).\n\nDrugi vlakovi istog dana: **754: 14:56 → 17:44** i 756: 18:35 → 21:22 (satnica radnog dana).\n\nPrtljaga: veliki koferi idu na police na kraju vagona ili iza zadnjih sjedala, pa ulazimo među prvima.\n\n⚠️ **Rezervacija Tajnog vrta NIJE danas.** Termini za 1.11. otvaraju se **u ponedjeljak 26.10. u 10:00**, šest dana prije posjeta (vidi Dan 8).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:30", "key": "12:30", "title": "Stanica Gyeongju → Airbnb", "meta": ["⏱ 20–30 min", "☔", "🦵"], "body": "⚠️ **Stanica Gyeongju je ~12 km izvan grada** (Geoncheon-eup; do prosinca 2023. zvala se Singyeongju, stariji izvori koriste stari naziv). Bus 700 vozi ~4 puta dnevno, linije 60/61 svakih ~70 min, pa **s četvero ljudi i koferima idemo kombijem ili taksijem.**\n\n- **GJS Limousine call van (경주콜밴 GJS)**: **010-2657-2846 / 010-2879-2846**, fiksno **~35–45 000 ₩** za transfer sa stanice, stanu sva četiri kofera. Dogovoriti unaprijed (KakaoTalk ili SMS).\n- **Dva taksija** iz reda ispred stanice: ~15–17 000 ₩ po autu, 18–22 min, jedan veliki kofer u prtljažnik i jedan na prednje sjedalo ili u krilo.\n- Lokalni dispečer: 054-744-4569 (보문단지&신경주역 콜).\n\nAirbnb ima **besplatan parking, pa taksi vozi do vrata**, i **besplatno spremanje prtljage**. Kofere ostavljamo odmah, check-in je od 16:00.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Ručak: Sukyoung Sikdang", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**숙영식당**, kod Daereungwona, 5–10 min pješice. **Bibimbap s ječmom (boribap)**: kuhani ječam i riža s nekoliko vrsta sezonskog povrća, miješa se s ljutom pastom, uz pečenu ribu i doenjang-jjigae. Domaće, jednostavno, jeftino. Zna zatvoriti ranije.", "alts": [{"title": "Tteokgalbi", "text": ", pečene pljeskavice od mljevenih rebara, slatko marinirane. Više restorana oko Hwangnidan-gila", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Byeolchaeban Gyodong Ssambap (별채반 교동쌈밥)", "text": ", 77 Cheomseong-ro, ako je prva opcija zatvorena: bulgogi od hanwoo govedine s listovima za zamatanje (~18–20 000 ₩) i dvadesetak priloga. 10:00–21:00 svaki dan. Inače je planiran za nedjelju", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:30", "key": "14:30", "title": "Daereungwon, Cheonmachong, Gyochon i kuća Choi", "meta": ["⏱ 2,5 h", "🌦️", "🦵 sve ravno"], "body": "**Daereungwon (대릉원)** je park usred grada s **23 kraljevska grobna humka Sille**, travnatim brežuljcima visokim do dvadesetak metara, između borova. **Besplatno** od 2023., 09:00–22:00. Ravne staze, najlakši dio Gyeongjua za koljeno.\n\n**Cheonmachong (천마총)** je jedini humak u koji se ulazi (**3 000 ₩**): blagom rampom unutra, presjek groba, replika **zlatne krune** i slika \"Nebeskog konja\" na sedlu po kojoj je dobio ime. 20 min.\n\nPješice 10–15 min na jug, pored zvjezdarnice Cheomseongdae, do **Gyochona (교촌마을)**: obnovljeno tradicionalno selo, hanok kuće, obrtničke radionice, kafići. Pomalo uređeno za turiste, ali ugodno. Besplatno.\n\n**Kuća obitelji Choi (최부자댁)** je kuća \"bogatih Choijeva\", klana koji je dvanaest generacija (~300 godina) bio najbogatiji u kraju, a poznat je po pravilima \"nikad ne posjeduj više od 10 000 vreća riže\" i \"nitko u krugu od 100 lija ne smije biti gladan\". **09:30–17:30, besplatno.** ⚠️ **Zatvorena zadnji ponedjeljak u mjesecu, dakle 26.10.** Danas ili nikad.\n\n💡 Na izlazu iz Gyochona je **Gyodong Beopju (교동법주)**, 300 godina staro rižino vino obitelji Choi (nematerijalna baština). Kupuje se na kućnim vratima, ~35–40 000 ₩ za 900 ml. **Nepasterizirano je, pa u hladnjak**, za večer u Airbnbu.\n\n☕ **Usput: Hwangnam-ppang (황남빵)**, kod Daereungwona (Hwangnam-dong). Najpoznatija gyeongjuska slastica: mala lepinja tankog tijesta punjena slatkim crvenim grahom, po receptu iz 1939. Kupuje se topla, 10 min stanke, kutija može i u Airbnb.", "alts": [{"title": "Hwangnidan-gil (황리단길)", "text": ", hipsterska ulica uz humke: kafići, pekare, makgeolli i pajeon. Kao šetnja između humaka i Gyochona ili umjesto odmora u 17:00", "meta": ["⏱ 1 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "17:00", "key": "17:00", "title": "Odmor", "meta": [], "body": "Check-in od 16:00, tuš, pauza. Dan je počeo u 06:35.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:15", "key": "18:15", "title": "Anapji, Cheomseongdae, Woljeonggyo", "meta": ["⏱ 2 h", "🌦️", "🦵 lagano"], "body": "**Anapji, odnosno Donggung i Wolji (동궁과 월지)**: ostaci vrta i palače kraljevstva Silla iz **674. godine**, rekonstruirani paviljoni oko mirnog jezera, osvijetljeni nakon mraka. **3 000 ₩**, 09:00–22:00, karte do 21:30. Zalazak je oko 17:45, pa dolazimo u sumrak (18:15–19:00), kad se svjetla pale, a nebo je još plavo. **Subotom je gužva na blagajni, pa kiosk ili Naver Smart Order QR na ulazu.** Danju ne vrijedi.\n\nPješice ~10 min pored **Cheomseongdaea** (zvjezdarnica iz 7. stoljeća, najstarija sačuvana u istočnoj Aziji, noću osvijetljena, besplatno) do **mosta Woljeonggyo (월정교)**: rekonstruirani natkriveni drveni most kraljevstva Silla preko potoka, **besplatno, osvijetljen do 23:00**, bez ograda i redova. Fotografija s kamenih stepenica (징검다리) nizvodno.\n\n🌸 Ružičasta trava (pink muhly) uz Cheomseongdae krajem listopada je iza vrhunca, ali vjerojatno još ružičasta. **Noću se boja ne vidi**, pa je gledamo u nedjelju danju, na biciklima (vidi Dan 7).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "Večera: noćna tržnica Jungang (vjerojatnije)", "meta": ["⏱ 1,5 h", "☔ pod krovom", "🦵 lagano"], "body": "**Jungang Sijang Yasijang (중앙시장 야시장)**, Seonggeon-dong, ~10 min pješice od Airbnba. **Srijeda–nedjelja, ~18:00/19:00–23:00.** Kupi se **pladanj s četiri pregrade** (bon 10–12 000 ₩) i puni na štandovima: pečena svinjska potrbušina, smotani omlet, tteokgalbi, prženi rezanci, tteokbokki. Jede se za stolovima pod krovom tržnice. Subota je najživlja večer.\n\n**Plan B: Dosol Maeul (도솔마을).** Tradicionalni restoran u starim kućama blizu Daereungwona: **set od ~15 kuhanih jela oko riže** (jeongsik), 13–15 000 ₩ po osobi. 11:00–21:00, pauza 15:00–17:00, **utorkom i srijedom zatvoreno**. ⚠️ **Zadnja narudžba 19:30 ili 20:00, rezervirati i potvrditi.** Ako idemo ovamo, **večera je u 17:30**, Anapji i most poslije (do 21:30), a tržnica eventualno samo za desert.", "alts": [{"title": "Byeolchaeban ssambap", "text": ", ako je sve puno. Inače je planiran za nedjelju", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Ulica haejangguka Palujeong", "text": ": juhe 24 h (haejangguk sa želeom od žira), jeftino, lokalno", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "22:00", "key": "22:00", "title": "Bar Boon ili Hwangnam Geobuk", "meta": ["⏱ 1–2 h", "☔", "🦵 lagano"], "body": "- **Bar Boon (바 분)**, Poseok-ro (Hwangnidan-gil): kokteli s korejskim žestokim pićima (soju, makgeolli, omija) u obnovljenom hanoku.\n- **Hwangnam Geobuk (황남거북)**: korejsko craft pivo u dvorištu oko **vatre na otvorenom**.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "⏰ Prvo: escape room, ako booking u ponoć nije uspio", "md": "Ako sinoć u 00:00 nije rezerviran escape room za čet 29.10. (Deepthinker, deepthinker.co.kr/en), **rezervirati odmah**, na terminalu ili u autobusu, i poslati zahtjev za engleski. Vidi Dan 5, 23:59.", "top": false}], "triggers": "- **Prerano za 06:35:** taksi oko 08:15 ravno do stanice Gangneung (120–160 000 ₩ za dva).\n- **Propušten bus u 06:55:** odmah taksi s terminala do Gangneunga. Ako ni to ne ide, plan C (754).\n- **Propušten vlak 752:** Korail šalter, prebaciti na 754. Gangneung po planu C.\n- **Kiša:** Daereungwon i Gyochon podnose kišu. Cheonmachong i Nacionalni muzej Gyeongju (subotom do 21:00, besplatno) su pod krovom.\n- **Dosol Maeul nema mjesta:** noćna tržnica ili Byeolchaeban.\n- **Ekipa je mrtva:** večera, Anapji, spavanje. Barovi idu u nedjelju.", "heading": "Sub 24.10. — Vlakom uz obalu, stari grad i noćna tržnica", "city": "gyeongju", "transfer": "**🚌🚄 Sub 24.10. · Sokcho → Gyeongju · bus ~1 h + direktni KTX-Eum 2h54 · ~45 000 ₩ po osobi**\n**⏰ Vlak KTX-Eum 752 (Gangneung 09:36 → Gyeongju 12:30) rezervirati ODMAH.** Ima ~380 mjesta, a vozi subotom.", "flash": {"label": "Subota, 24. 10. · Sokcho → Gyeongju — dolazak u kraljevstvo Silla", "text": "U 06:55 krećemo autobusom prema **Gangneungu**, gdje se ukrcavamo na novi izravni vlak uz obalu do Gyeongjua. Ako escape room sinoć nije rezerviran, to je prva stvar ujutro. Nakon dolaska i odlaska do smještaja počinje istraživanje starog grada, okvirno od 12:30. Prvo ručamo, a zatim obilazimo **Daereungwon**, kompleks kraljevskih grobnica iz razdoblja Silla, uz toplu lepinju **Hwangnam-ppang** s crvenim grahom. Njegovi veliki travnati humci izgledaju poput brežuljaka usred grada, a zapravo skrivaju drevna grobna mjesta. Nastavljamo prema **selu Gyochon**, povijesnoj četvrti s tradicionalnim kućama, i posjećujemo kuću obitelji **Choi**, jedne od najpoznatijih imućnih obitelji Gyeongjua, povezane s dugom tradicijom lokalnog ugleda, učenja i filantropije. U sumrak odlazimo do **Donggung Palacea i ribnjaka Wolji**, poznatog i pod starim nazivom Anapji. Osvijetljeni paviljoni i njihovi odrazi u vodi jedan su od najljepših prizora u gradu. Nakon toga prelazimo drveni most **Woljeonggyo**, čija se tradicionalna arhitektura posebno ističe noću. Večer završavamo na **noćnoj tržnici**, uz pladanj različitih lokalnih zalogaja i pivo pokraj vatre."}, "rows": [{"time": "⏰", "key": "⏰", "text": "**Prvo:** ako sinoć u ponoć nije rezerviran escape room za 29.10., rezervirati odmah.", "altHint": false, "slot": null}, {"time": "06:35", "key": "06:35", "text": "Pješice s koferima 670 m do Sokcho Express terminala. Rezerva je taksi ravno do stanice Gangneung oko 08:15, vidi Dio 3.", "altHint": false, "slot": 0}, {"time": "06:55", "key": "06:55", "text": "Bus Sokcho → Gangneung, ~1 h, 10 800 ₩.", "altHint": false, "slot": null}, {"time": "~08:00", "key": "08:00", "text": "Dva taksija do KTX stanice Gangneung. Doručak na stanici, u kafiću ili trgovini.", "altHint": false, "slot": 1}, {"time": "09:36", "key": "09:36", "text": "🚄 **KTX-Eum 752 → Gyeongju 12:30**, 34 300 ₩.", "altHint": false, "slot": 2}, {"time": "12:30", "key": "12:30", "text": "**GJS kombi** ili dva taksija do Airbnba, ~20 min. Kofere ostavljamo, check-in je od 16:00.", "altHint": false, "slot": 3}, {"time": "13:30", "key": "13:30", "text": "Ručak u **Sukyoung Sikdangu:** bibimbap s ječmom, riba, doenjang-jjigae.", "altHint": false, "slot": 4}, {"time": "14:30", "key": "14:30", "text": "**Daereungwon** (besplatno) i ulaz u humak **Cheonmachong** (3 000 ₩), ☕ usput **Hwangnam-ppang** (topla lepinja s crvenim grahom), zatim **Gyochon** i **kuća obitelji Choi**. Kuća je otvorena *samo danas*, u ponedjeljak je zatvorena.", "altHint": false, "slot": 5}, {"time": "17:00", "key": "17:00", "text": "Odmor u Airbnbu.", "altHint": false, "slot": 6}, {"time": "18:15", "key": "18:15", "text": "**Anapji** u sumrak (3 000 ₩, QR karta), pa osvijetljeni **Cheomseongdae** i **most Woljeonggyo**, koji svijetli do 23:00.", "altHint": false, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "🍢 **Noćna tržnica Jungang:** pladanj s četiri pregrade, štandovi i stolovi pod krovom. **Ili** **Dosol Maeul**, set od ~15 kuhanih jela uz rezervaciju; u tom slučaju večera je u 17:30, a Anapji poslije.", "altHint": false, "slot": 8}, {"time": "22:00", "key": "22:00", "text": "**Bar Boon**, kokteli s korejskim žestokim pićima u hanoku, **ili** **Hwangnam Geobuk**, craft pivo oko vatre.", "altHint": false, "slot": 9}], "plans": [{"label": "Plan C · Gangneung", "replaces": ["06:35", "06:55", "08:00", "09:36", "12:30", "13:30", "14:30", "17:00"], "summary": "", "detail": {"title": "Plan C (malo vjerojatan) — pola dana u Gangneungu, vlak 754", "meta": [], "md": "Ako ekipa ne želi ustajati rano ni plaćati taksi: bus u 09:31, pola dana u Gangneungu i **vlak 754 (14:56 → 17:44)**, pa Anapji i noćna tržnica. Gubi se cijelo popodne u Gyeongjuu, a kuća Choi tada otpada jer je u ponedjeljak zatvorena. Detalji u Dodatku C.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-sub-24-10-vlak", "d-sub-24-10-polazak-iz-sokcha", "d-sub-24-10-vecera", "d-sub-24-10-transfer-sa-stanice"]}, {"date": "25.10", "d3heading": "NED 25.10. — SELO, BICIKLI I ZLATNE KRUNE", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 7 od 14", "intro": "⚠️ **Najgužviji vikend korejske jeseni.** Jutro u Yangdongu je bijeg od centra, a popodne ide na istočnu stranu grada, gdje je prazno.\n\n⚠️ **Ako subota nije uspjela** (propušten bus u 06:55 ili vlak 752, pa dolazak tek navečer), nedjelja preuzima dio ili cijelu subotu. **Prioritet je kuća obitelji Choi** (u ponedjeljak zatvorena), pa Daereungwon s Cheonmachongom i Gyochon (2,5 h, sve pješice od Airbnba). Najlakše je skratiti **popodnevni krug biciklom** (muzej i Hwangnyongsa mogu i u ponedjeljak navečer ili otpasti), Yangdong ostaje ujutro. Ponedjeljak ostaje kako je planiran.", "stay": "", "slots": [{"timeLabel": "07:45", "key": "07:45", "title": "Doručak: bife-uličica tržnice Seongdong", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**성동시장 한식뷔페 골목**, tržnica Seongdong, ~10 min pješice od Airbnba, preko puta stare željezničke stanice. Niz malih zalogajnica: uzme se tanjur i bira među **više od 30 kuhanih domaćih jela** (variva, pržena svinjetina, palačinke, tofu, kimchi, povrće), uz **neograničenu rižu i juhu**. **8–9 000 ₩.** Radi otprilike 07:30–20:00, **ujutro je najbolje** jer je sve svježe. Tako Korejci zapravo doručkuju, turista nema. ⚠️ Nedjeljom dio zalogajnica možda ne radi, uzimamo onu koja radi.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "08:30", "key": "08:30", "title": "Taksi do Yangdonga", "meta": ["⏱ 20–25 min"], "body": "**Jedan taksi** (četvero bez prtljage stane u jedan), **22–28 000 ₩**, 16 km sjeverno. **Rezerva je bus 203**, staje kod Intercity terminala (250 m od Airbnba), ali vozi samo svakih 70–90 min, a vožnja traje 45–55 min.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00", "key": "09:00", "title": "Yangdong Folk Village (양동마을)", "meta": ["⏱ 3 h", "🌦️", "🦵🦵 strme rampe gore"], "body": "**4 000 ₩ · 09:00–18:00.** Selo dvaju plemićkih klanova, **Son i Yi (Yeogang)**, koji ondje žive više od 500 godina. Isti UNESCO upis kao poznatiji Hahoe (Povijesna sela Koreje, 2010.), ali s više obitelji koje stvarno žive ondje, manje turističke infrastrukture i gotovo bez grupa. Na 150 hektara ljudi se raspu i jesenskim vikendom.\n\n⚠️ **Kuće su privatne, gleda se samo dvorište, u kuće se ne ulazi.** Poštujemo znakove i zatvorena vrata.\n\n**Kako:** prvo **ravni donji dio doline** (slamnate kuće pučana, rižina polja), pa gore do plemićkih kuća na brežuljcima po **kratkim strmim betonskim rampama**. **Štapovi za Luciju**, posebno pri silasku. Vrijedi vidjeti **Seobaekdang** (glavna kuća klana Son, 15. st.), **Mucheomdang** (glavna kuća klana Yi), **Hyangdan** (neobična plemićka kuća iz 16. st.) i paviljon **Gwangajeong** s pogledom na dolinu. Mali izložbeni centar na ulazu daje kontekst, 15 min.", "alts": [{"title": "Oksan Seowon i Dokrakdang (옥산서원 / 독락당)", "text": ": konfucijanska akademija i paviljon nad potokom u seoskoj dolini, 35 min sjeverno, bez trgovina i ljudi. Ako je Yangdong pregužvan", "meta": ["⏱ 2,5 h", "🌦️", "🦵"]}, {"title": "Nacionalni muzej Gyeongju", "text": "ujutro, ako kiši. Yangdong se tada seli na ponedjeljak
